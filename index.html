  function sleepOf(days, derived, k) {
    let s = derived && derived[k] && derived[k].sleep;
    if (!s && typeof E.sleepStats === "function") s = E.sleepStats(days[k]);
    if (!s || !isNum(s.asleep) || s.asleep <= 0) return null;
    const start = new Date(s.start);
    const end = new Date(s.end);
    if (isNaN(start) || isNaN(end) || end <= start) return null;
    const latency = isNum(s.latency) ? s.latency : 0;
    const bedMin = isNum(s.bedMin) ? s.bedMin : toBedMin(start.getHours() * 60 + start.getMinutes());
    const wakeMin = isNum(s.wakeMin) ? s.wakeMin : end.getHours() * 60 + end.getMinutes();
    const windowMin = (end - start) / 60000;
    return { asleep: s.asleep, bedMin, wakeMin, latency, windowMin, onsetMin: bedMin + latency };
  }
  const tagsOf = (day) => {
    const t = day && day.entry && day.entry.journal && day.entry.journal.tags;
    return Array.isArray(t) ? t.map((x) => String(x).toLowerCase()) : [];
  };
  const hasTag = (day, re) => tagsOf(day).some((t) => re.test(t));
  const idxOfDate = (days, date) => {
    for (let k = days.length - 1; k >= 0; k--) if (days[k] && days[k].date === date) return k;
    return -1;
  };
  const validInput = (days, derived) => Array.isArray(days) && Array.isArray(derived) && days.length > 0 && derived.length === days.length;

  /* ============================================================
   * 1. Training load: CTL / ATL / TSB / ACWR
   *
   * Banister impulse-response model (Banister 1975; Coggan's PMC form): fitness and fatigue are
   * exponentially weighted moving averages of daily load,
   *     X_t = X_{t−1} + k·(L_t − X_{t−1}),   k = 1 − exp(−1/τ)
   * (the exact discrete decay of a continuous exponential with time constant τ days),
   * τ = 42 d for chronic load (CTL, "fitness") and τ = 7 d for acute load (ATL, "fatigue").
   * TSB ("form") for day t = CTL_{t−1} − ATL_{t−1}: the balance you start the day with.
   * Daily load is derived[i].load (zone-weighted HR minutes); strain equivalents use the engine curve.
   * Missing calendar days count as zero load (you may have trained without the band), and are flagged.
   * Seed: CTL_0 = ATL_0 = mean load of the first 7 recorded days, to shorten the start-up bias.
   *
   * ACWR (Gabbett 2016; Hulin 2016) = acute 7-d mean load / chronic mean load, using rolling averages
   * and the UNCOUPLED form (Windt & Gabbett 2018; Lolli 2019): the chronic window is the 28 days before
   * the acute week, so the acute week is not inside its own denominator (the coupled form is biased
   * toward 1). Known limitations: ratio of two noisy averages, mathematical coupling and spurious
   * correlation critiques (Impellizzeri 2020), risk zones derived from team-sport injury data rather
   * than individuals. We use it only as a load-change guide, never as an injury predictor.
   * ============================================================ */
  const TAU_CTL = 42;
  const TAU_ATL = 7;
  const K_CTL = 1 - Math.exp(-1 / TAU_CTL);
  const K_ATL = 1 - Math.exp(-1 / TAU_ATL);
  const ACUTE_N = 7;
  const CHRONIC_N = 28;
  const CHRONIC_MIN = 14; // ≥ 21 days of history (7 acute + 14 chronic) before a status is given
  /* zones: < 0.8 detraining, 0.8–1.3 sweet spot (inclusive), > 1.3–1.5 caution, > 1.5 high risk */
  const acwrStatus = (a) =>
    !isNum(a) ? "building baseline" : a < 0.8 ? "detraining" : a <= 1.3 ? "sweet spot" : a <= 1.5 ? "caution" : "high risk";

  /* contiguous calendar series from the first to the last recorded day */
  function loadSeries(days, derived) {
    const first = dayNum(days[0].date);
    const last = dayNum(days[days.length - 1].date);
    const N = Math.max(1, last - first + 1);
    const L = new Array(N).fill(0);
    const has = new Array(N).fill(false); // a record with load > 0 exists for that date
    const rec = new Array(N).fill(false); // any record exists
    const idx = new Array(N).fill(-1);
    for (let k = 0; k < days.length; k++) {
      if (!days[k] || !isYmd(days[k].date)) continue;
      const c = dayNum(days[k].date) - first;
      if (c < 0 || c >= N) continue;
      const v = derived[k] && derived[k].load;
      rec[c] = true;
      idx[c] = k;
      if (isNum(v) && v > 0) {
        L[c] = v;
        has[c] = true;
      }
    }
    // seed: mean of the first 7 recorded (non-zero) days
    const seedVals = [];
    for (let c = 0; c < N && seedVals.length < 7; c++) if (has[c]) seedVals.push(L[c]);
    const seed = seedVals.length ? mean(seedVals) : 0;
    const ctl = new Array(N), atl = new Array(N);
    let C = seed, A = seed;
    for (let c = 0; c < N; c++) {
      C += K_CTL * (L[c] - C);
      A += K_ATL * (L[c] - A);
      ctl[c] = C;
      atl[c] = A;
    }
    return { first, N, L, has, rec, idx, ctl, atl, seed };
  }
  const prefixSum = (L) => {
    const P = [0];
    for (let c = 0; c < L.length; c++) P.push(P[c] + L[c]);
    return P;
  };
  /* chronic (uncoupled) mean for calendar index t: days t−34 … t−7 that exist; count returned */
  function chronicAt(S, P, t) {
    const b = t - ACUTE_N; // last chronic index
    const a = Math.max(0, t - ACUTE_N - CHRONIC_N + 1);
    if (b < 0) return { mean: null, n: 0 };
    const n = b - a + 1;
    return { mean: (P[b + 1] - P[a]) / n, n };
  }
  function acwrAt(S, P, t) {
    if (t < ACUTE_N - 1) return null;
    const ch = chronicAt(S, P, t);
    if (ch.n < CHRONIC_MIN || !(ch.mean > 0)) return null;
    const acute = (P[t + 1] - P[t + 1 - ACUTE_N]) / ACUTE_N;
    return acute / ch.mean;
  }

  function load(days, derived) {
    if (!validInput(days, derived)) return [];
    const S = loadSeries(days, derived);
    const P = prefixSum(S.L);
    const out = [];
    for (let k = 0; k < days.length; k++) {
      const d = days[k];
      if (!d || !isYmd(d.date)) continue;
      const t = dayNum(d.date) - S.first;
      const ctl = S.ctl[t], atl = S.atl[t];
      const ctlY = t > 0 ? S.ctl[t - 1] : S.seed;
      const atlY = t > 0 ? S.atl[t - 1] : S.seed;
      const acwr = t >= ACUTE_N + CHRONIC_MIN - 1 ? acwrAt(S, P, t) : null;
      let gapDays = 0;
      for (let c = Math.max(0, t - 27); c <= t; c++) if (!S.has[c]) gapDays++;
      const ramp = t >= 7 ? S.ctl[t] - S.ctl[t - 7] : null;
      out.push({
        date: d.date,
        load: r1(S.L[t]),
        ctl: r1(ctl),
        atl: r1(atl),
        tsb: r1(ctlY - atlY),
        acwr: r2(acwr),
        ramp: r1(ramp), // CTL change over the last 7 days (load units per week)
        ctlStrain: r1(strainFromLoad(ctl)),
        atlStrain: r1(strainFromLoad(atl)),
        status: t + 1 < ACUTE_N + CHRONIC_MIN || acwr == null ? "building baseline" : acwrStatus(acwr),
        noData: !S.has[t], // no load recorded for this day (counted as 0)
        gapBefore: t > 0 && !S.rec[t - 1], // previous calendar day missing entirely
        gapDays, // days without load in the last 28 (each counted as 0)
      });
    }
    return clean(out);
  }

  /* ---------- weekPlan ----------
   * For each of the next 7 days (day 0 = startDate, default the last recorded day = "today"):
   * 1. Chronic mean C for that day is fixed: in the uncoupled ACWR the chronic window ends 7 days
   *    before the day, so for the coming week it is made of days already recorded.
   * 2. Day type by rules: two hard days in a row → easy; after an easy day → hard; after a hard day →
   *    moderate; hard then moderate → easy; otherwise hard. The H-M-E cycle averages ≈ 1.07·C. Day 0 also follows today's recovery band
   *    (green → hard allowed, yellow → at most moderate, red → easy and capped).
   * 3. Type range in load units: hard 1.3–2.0·C, moderate 0.8–1.3·C, easy 0.3–0.7·C.
   * 4. Inverse of the ACWR model: the planned load x keeps (S + x)/7/C inside 0.8–1.3, where S is the
   *    sum of the previous 6 days (recorded or planned midpoints) → x ∈ [5.6·C − S, 9.1·C − S].
   *    The type range is intersected with this; if they don't overlap, the ACWR bound wins on the
   *    high side (protect against spikes), while on the low side the plan builds back gradually
   *    (at most 25 % above the type range instead of one huge day).
   * 5. Caps: red band → strain ≤ engine red target; easy day → strain ≤ 10; yellow → engine target.
   * 6. Load range → strain range with the engine's curve strain = 21·L/(L+K).
   */
  const HARD_STRAIN = 14;
  const TYPE_RANGE = { hard: [1.3, 2.0], moderate: [0.8, 1.3], easy: [0.3, 0.7] };
  const EASY_CAP = 10;

  function weekPlan(days, derived, opts) {
    opts = opts || {};
    if (!validInput(days, derived)) return clean(notEnough(7, 0, "No data yet."));
    const lastDate = days[days.length - 1].date;
    const start = isYmd(opts.startDate) ? opts.startDate : lastDate;
    const S = loadSeries(days, derived);
    const s = dayNum(start) - S.first; // calendar index of day 0
    const histN = Math.min(s, S.N); // days before day 0
    let recorded = 0;
    for (let c = 0; c < histN; c++) if (S.has[c]) recorded++;
    if (recorded < 7) return clean(notEnough(7, recorded, "A weekly plan needs at least 7 days of recorded load."));

    // working arrays: history before day 0, then 7 planned days
    const L = S.L.slice(0, histN);
    const hard = L.map((v, c) => S.has[c] && strainFromLoad(v) >= HARD_STRAIN);
    const k0 = idxOfDate(days, start);
    const today = k0 >= 0 ? derived[k0] : null;
    const band = opts.band || (today && today.band) || null;
    const recToday = today && isNum(today.recovery) ? today.recovery : null;
    const restFloor = quantile(L.slice(-28).filter((v, i, a) => v > 0), 0.1) || 0;
    let ctl = histN > 0 ? S.ctl[histN - 1] : S.seed;
    let atl = histN > 0 ? S.atl[histN - 1] : S.seed;
    const ctl0 = ctl, atl0 = atl;
    const P0 = prefixSum(L);
    const chronicOK = chronicAt(null, P0, histN).n >= CHRONIC_MIN;
    const outDays = [];
    let prevType = null;
    for (let j = 0; j < 7; j++) {
      const t = histN + j;
      const date = addDays(start, j);
      const P = prefixSum(L);
      const ch = chronicAt(null, P, t);
      const C = ch.n >= CHRONIC_MIN && ch.mean > 0 ? ch.mean : mean(L.slice(-28).filter((v) => v > 0)) || 1;
      const Ssum = P[t] - P[Math.max(0, t - (ACUTE_N - 1))]; // previous 6 days
      const prev1 = t - 1 >= 0 ? hard[t - 1] : false;
      const prev2 = t - 2 >= 0 ? hard[t - 2] : false;
      const prevLoad = t - 1 >= 0 ? L[t - 1] : C;
      const reasons = [];
      let type;
      if (prev1 && prev2) {
        type = "easy";
        reasons.push("Two hard days in a row: keep this one easy.");
      } else if (prevType === "easy" || (prevType == null && prevLoad < 0.7 * C)) {
        type = "hard";
        reasons.push("Easy day yesterday: a harder day fits.");
      } else if (prevType === "hard" || (prevType == null && prev1)) {
        type = "moderate";
        reasons.push("Hard day yesterday: aim for moderate.");
      } else if (prev2) {
        type = "easy";
        reasons.push("Hard, then moderate: an easy day keeps the week balanced.");
      } else {
        type = "hard";
        reasons.push("Moderate day yesterday: a harder day fits.");
      }
      const dayBand = j === 0 ? band : null;
      if (dayBand === "red") {
        type = "easy";
        reasons.push(`Recovery is red${isNum(recToday) ? ` (${recToday} %)` : ""}: keep it light.`);
      } else if (dayBand === "yellow" && type === "hard") {
        type = "moderate";
        reasons.push(`Recovery is yellow${isNum(recToday) ? ` (${recToday} %)` : ""}: moderate at most.`);
      } else if (dayBand === "green" && type !== "easy") {
        reasons.push(`Recovery is green${isNum(recToday) ? ` (${recToday} %)` : ""}: your body can take load.`);
      }
      if (j > 0) reasons.push("Recovery not known yet: check the morning score and adjust.");

      const [ta, tb] = TYPE_RANGE[type];
      let lo = ta * C, hi = tb * C;
      const feasLo = Math.max(0, 7 * 0.8 * C - Ssum);
      const feasHi = Math.max(0, 7 * 1.3 * C - Ssum);
      if (chronicOK) {
        if (hi > feasHi) {
          hi = Math.max(feasHi, restFloor);
          lo = Math.min(lo, hi);
          reasons.push("This week's load is already high: capped to keep the load ratio ≤ 1.3.");
        }
        if (lo < feasLo) {
          if (feasLo <= hi) lo = feasLo;
          else {
            lo = Math.min(hi, tb * C);
            hi = Math.min(hi * 1.25, Math.max(hi, feasLo));
            reasons.push("Load has dropped: build back gradually, not in one big day.");
          }
        }
      } else {
        reasons.push("Less than 3 weeks of data: range based on recent average and recovery only.");
      }
      // recovery / type caps (strain scale)
      const capStrain = (sMax, why) => {
        const Lmax = loadForStrain(sMax);
        if (hi > Lmax) {
          hi = Lmax;
          if (why) reasons.push(why);
        }
      };
      if (type === "easy") capStrain(EASY_CAP);
      if (dayBand === "red") {
        const tg = strainTargetFor(recToday == null ? 20 : recToday) || [4, 10];
        capStrain(tg[1], `Red-band cap: strain ≤ ${r1(tg[1])}.`);
      } else if (dayBand === "yellow") {
        const tg = strainTargetFor(recToday == null ? 50 : recToday);
        if (tg) capStrain(tg[1]);
      }
      hi = Math.max(hi, restFloor);
      lo = clamp(Math.max(lo, restFloor * 0.9), 0, hi);
      if (hi - lo < 1) lo = Math.max(0, hi - 1);
      const mid = (lo + hi) / 2;
      const acwrMid = chronicOK && C > 0 ? (Ssum + mid) / 7 / C : null;
      ctl += K_CTL * (mid - ctl);
      atl += K_ATL * (mid - atl);
      L.push(mid);
      hard.push(strainFromLoad(mid) >= HARD_STRAIN || type === "hard");
      prevType = type;
      outDays.push({
        date,
        weekday: WD3[weekdayOf(date)],
        type,
        lo: r1(strainFromLoad(lo)),
        hi: r1(strainFromLoad(hi)),
        loadLo: r0(lo),
        loadHi: r0(hi),
        acwr: r2(acwrMid), // projected ACWR if you train at the middle of the range
        ctl: r1(ctl),
        atl: r1(atl),
        reasons,
      });
    }
    return clean({
      status: chronicOK ? "ok" : "building baseline",
      start,
      band,
      ctl: r1(ctl0),
      atl: r1(atl0),
      tsb: r1(ctl0 - atl0),
      acwr: r2(histN - 1 >= 0 ? acwrAt(null, P0, histN - 1) : null),
      chronicLoad: r1(chronicAt(null, prefixSum(S.L.slice(0, histN)), histN).mean),
      target: [0.8, 1.3],
      days: outDays,
      note: "Ranges assume you train near the middle of each day's range; re-plan after each morning's recovery.",
    });
  }

  /* ============================================================
   * Ridge regression (used by forecast)
   *
   * Columns are standardised (z = (x − mean)/sd, sample sd); y is centred, so the intercept (ȳ) is not
   * penalised. β(λ) = (ZᵀZ + λI)⁻¹ Zᵀ(y − ȳ)  (Hoerl & Kennard 1970).
   * λ is chosen on a log grid by exact closed-form leave-one-out CV: for a linear smoother ŷ = Hy,
   *     e_(i) = (y_i − ŷ_i) / (1 − h_ii),   H = Z(ZᵀZ + λI)⁻¹Zᵀ + 11ᵀ/n
   * (Allen 1974 PRESS; Hastie, Tibshirani & Friedman ESL §7.10). Standardisation uses the full sample,
   * a negligible leak for n ≥ 28. Q² ("r2cv") = 1 − PRESS / Σ(y − ȳ)²; it can be ≤ 0 (no skill).
   * 80 % prediction interval: ŷ + [10th, 90th percentile] of the LOO residuals (empirical, no
   * normality assumption; Lei et al. 2018 jackknife-style interval).
   * ============================================================ */
  function invert(M) {
    const n = M.length;
    const a = M.map((row, i) => row.concat(Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))));
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(a[r][c]) > Math.abs(a[p][c])) p = r;
      if (Math.abs(a[p][c]) < 1e-12) return null;
      [a[c], a[p]] = [a[p], a[c]];
      const piv = a[c][c];
      for (let j = 0; j < 2 * n; j++) a[c][j] /= piv;
      for (let r = 0; r < n; r++) {
        if (r === c) continue;
        const f = a[r][c];
        if (f) for (let j = 0; j < 2 * n; j++) a[r][j] -= f * a[c][j];
      }
    }
    return a.map((row) => row.slice(n));
  }
  /* one λ on already-standardised Z (n×p) and centred yc */
  function ridgeFixed(Z, yc, lambda) {
    const n = Z.length, p = Z[0] ? Z[0].length : 0;
    const G = Array.from({ length: p }, (_, a) => Array.from({ length: p }, (_, b) => {
      let s = 0;
      for (let i = 0; i < n; i++) s += Z[i][a] * Z[i][b];
      return s + (a === b ? lambda : 0);
    }));
    const Gi = p ? invert(G) : [];
    if (!Gi) return null;
    const Zy = Array.from({ length: p }, (_, a) => Z.reduce((s, z, i) => s + z[a] * yc[i], 0));
    const beta = Gi.map((row) => row.reduce((s, g, b) => s + g * Zy[b], 0));
    const fit = [], h = [], loo = [];
    for (let i = 0; i < n; i++) {
      const z = Z[i];
      let f = 0, hi = 1 / n;
      for (let a = 0; a < p; a++) {
        f += z[a] * beta[a];
        let s = 0;
        for (let b = 0; b < p; b++) s += Gi[a][b] * z[b];
        hi += z[a] * s;
      }
      fit.push(f);
      h.push(hi);
      loo.push((yc[i] - f) / Math.max(1e-9, 1 - hi));
    }
    const press = loo.reduce((s, e) => s + e * e, 0);
    return { beta, fit, h, loo, press };
  }
  const LAMBDAS = Array.from({ length: 31 }, (_, k) => Math.pow(10, -3 + k * 0.2)); // 0.001 … 1000
  function ridge(X, y, opts) {
    opts = opts || {};
    const n = X.length;
    const p = n ? X[0].length : 0;
    const mu = [], sd = [], keep = [];
    for (let a = 0; a < p; a++) {
      const col = X.map((r) => r[a]);
      const m = mean(col), s = sdOf(col);
      mu.push(m);
      sd.push(s);
      if (isNum(s) && s > 1e-9) keep.push(a);
    }
    const Z = X.map((r) => keep.map((a) => (r[a] - mu[a]) / sd[a]));
    const ybar = mean(y);
    const yc = y.map((v) => v - ybar);
    const sst = yc.reduce((s, v) => s + v * v, 0);
    const grid = isNum(opts.lambda) ? [opts.lambda] : LAMBDAS;
    let best = null;
    for (const lam of grid) {
      const f = ridgeFixed(Z, yc, lam);
      if (f && (!best || f.press < best.press - 1e-12)) best = { ...f, lambda: lam };
    }
    if (!best) return null;
    const betaFull = new Array(p).fill(0);
    keep.forEach((a, q) => (betaFull[a] = best.beta[q]));
    return {
      n, p, mu, sd, keep, ybar, lambda: best.lambda,
      beta: betaFull, // per standardised feature (outcome units per 1 sd)
      fitted: best.fit.map((f) => f + ybar),
      h: best.h,
      looResid: best.loo, // y_i − ŷ_(−i)
      press: best.press,
      q2: sst > 0 ? 1 - best.press / sst : null,
      predict(x) {
        let v = ybar;
        for (const a of keep) v += best.beta[keep.indexOf(a)] * ((x[a] - mu[a]) / sd[a]);
        return v;
      },
    };
  }

  /* ============================================================
   * 4 (part). Sleep debt: rolling 7 nights, Σ max(0, need − asleep), hours.
   * Need is the engine's per-night sleep need (baseline + strain + carried debt − naps).
   * Needs ≥ 4 recorded nights in the 7-day window; missing nights are skipped (not counted as debt).
   * ============================================================ */
  function debtAt(days, derived, i) {
    let debt = 0, surplus = 0, nights = 0;
    const per = [];
    for (let k = i; k >= 0; k--) {
      const back = dayDiff(days[k].date, days[i].date);
      if (back > 6) break;
      if (back < 0) continue;
      const sl = sleepOf(days, derived, k);
      const need = derived[k] && derived[k].sleepNeed && derived[k].sleepNeed.total;
      if (!sl || !isNum(need)) continue;
      nights++;
      const diff = need - sl.asleep;
      debt += Math.max(0, diff);
      surplus += Math.max(0, -diff);
      per.push({ date: days[k].date, needMin: r0(need), asleepMin: r0(sl.asleep), shortMin: r0(Math.max(0, diff)) });
    }
    return { debtMin: debt, surplusMin: surplus, nights, per: per.reverse() };
  }
  function sleepDebt(days, derived, i) {
    if (!validInput(days, derived)) return clean(notEnough(4, 0, "No sleep recorded yet."));
    if (!isNum(i)) i = days.length - 1;
    i = clamp(Math.round(i), 0, days.length - 1);
    const d = debtAt(days, derived, i);
    if (d.nights < 4) return clean(notEnough(4, d.nights, "Sleep debt needs at least 4 of the last 7 nights."));
    const hours = d.debtMin / 60;
    return clean({
      status: "ok",
      date: days[i].date,
      hours: r1(hours),
      minutes: Math.round(d.debtMin),
      netHours: r1((d.debtMin - d.surplusMin) / 60), // shortfall minus extra sleep
      nights: d.nights,
      perNight: d.per,
      level: hours < 1.5 ? "low" : hours <= 3 ? "moderate" : "high",
    });
  }

  /* ============================================================
   * 3. Forecast of next-morning recovery
   * Training pairs: day t → morning t+1 (consecutive calendar days) with recovery on both days.
   * Features (raw units): recovery today, strain today, 7-night sleep debt (h), time in bed tonight (h)
   * (= usual wake − planned bedtime when forecasting; actual sleep window when training), bedtime minus
   * usual bedtime (h, median of 14 prior nights), ACWR today, alcohol tag, late-meal tag (only when each
   * tag is logged on ≥ 3 and missing on ≥ 3 training days). Of any feature pair with |r| > 0.9 only the
 * first is kept (time in bed and bedtime deviation usually collide). Missing feature values → training mean
   * (z = 0, i.e. no contribution). Needs ≥ 28 pairs.
   * ============================================================ */
  const FEATS = [
    ["rec", "Today's recovery"],
    ["strain", "Strain today"],
    ["debt", "Sleep debt (7 nights)"],
    ["tib", "Time in bed tonight"],
    ["bedDev", "Bedtime vs usual"],
    ["acwr", "Load ratio (ACWR)"],
    ["alcohol", "Alcohol"],
    ["lateMeal", "Late meal"],
  ];
  const FORECAST_MIN = 28;
  const RE_ALC = /alcohol|drink|beer|wine/;
  const RE_LATE = /late meal|late dinner|late eating/;

  function usualBed(days, derived, i, back) {
    const v = [];
    for (let k = i; k >= 0; k--) {
      const dd = dayDiff(days[k].date, days[i].date);
      if (dd > (back || 14)) break;
      const s = sleepOf(days, derived, k);
      if (s) v.push(s.bedMin);
    }
    return v.length >= 3 ? median(v) : null;
  }
  function usualWake(days, derived, i) {
    const v = [];
    for (let k = i; k >= 0; k--) {
      if (dayDiff(days[k].date, days[i].date) > 14) break;
      const s = sleepOf(days, derived, k);
      if (s) v.push(s.wakeMin);
    }
    return v.length >= 3 ? median(v) : null;
  }

  function buildModel(days, derived, iEnd) {
    const S = loadSeries(days, derived);
    const P = prefixSum(S.L);
    const acwrOf = (k) => {
      const t = dayNum(days[k].date) - S.first;
      return t >= ACUTE_N + CHRONIC_MIN - 1 ? acwrAt(S, P, t) : null;
    };
    const featRow = (k, night) => {
      // k: day index of "today"; night: {tib, bed} for the night after day k
      const ub = usualBed(days, derived, k);
      const debt = debtAt(days, derived, k);
      return {
        rec: derived[k].recovery,
        strain: derived[k].strain,
        debt: debt.nights >= 4 ? debt.debtMin / 60 : null,
        tib: night && isNum(night.tib) ? night.tib : null,
        bedDev: night && isNum(night.bed) && isNum(ub) ? (night.bed - ub) / 60 : null,
        acwr: acwrOf(k),
        alcohol: hasTag(days[k], RE_ALC) ? 1 : 0,
        lateMeal: hasTag(days[k], RE_LATE) ? 1 : 0,
      };
    };
    const rows = [], ys = [], dates = [];
    for (let t = 0; t + 1 <= iEnd; t++) {
      if (dayDiff(days[t].date, days[t + 1].date) !== 1) continue;
      const y = derived[t + 1] && derived[t + 1].recovery;
      if (!isNum(y) || !isNum(derived[t].recovery)) continue;
      // Same information as at forecast time: planned bedtime (here the actual one) and the USUAL wake
      // time (median of the 14 nights up to day t), not the actual wake, which is unknown in advance.
      const sl = sleepOf(days, derived, t + 1);
      const uw = usualWake(days, derived, t);
      rows.push(featRow(t, sl ? { tib: isNum(uw) ? (uw - sl.bedMin) / 60 : null, bed: sl.bedMin } : null));
      ys.push(y);
      dates.push(days[t + 1].date);
    }
    if (rows.length < FORECAST_MIN) return { status: "not_enough_data", have: rows.length };
    let used = FEATS.filter(([key]) => {
      const col = rows.map((r) => r[key]);
      if (key === "alcohol" || key === "lateMeal") {
        const c = col.reduce((s, v) => s + v, 0);
        return c >= 3 && rows.length - c >= 3;
      }
      return nums(col).length >= Math.max(10, rows.length * 0.5);
    });
    // Collinearity guard: planned time in bed (usual wake − bedtime) and bedtime deviation are nearly the
    // same quantity with opposite sign; with both in, ridge splits them into large opposite effects and the
    // bedtime scenario can flip direction. Drop the later feature of any pair with |Pearson r| > 0.9.
    const corr = (a, b) => {
      const pa = [], pb = [];
      rows.forEach((r) => { if (isNum(r[a]) && isNum(r[b])) { pa.push(r[a]); pb.push(r[b]); } });
      if (pa.length < 10) return 0;
      const ma = mean(pa), mb = mean(pb);
      let sab = 0, saa = 0, sbb = 0;
      pa.forEach((x, q) => { sab += (x - ma) * (pb[q] - mb); saa += (x - ma) ** 2; sbb += (pb[q] - mb) ** 2; });
      return saa > 0 && sbb > 0 ? sab / Math.sqrt(saa * sbb) : 0;
    };
    for (let a = 0; a < used.length; a++)
      for (let b = used.length - 1; b > a; b--)
        if (Math.abs(corr(used[a][0], used[b][0])) > 0.9) used.splice(b, 1);
    const colMean = {};
    for (const [key] of used) colMean[key] = mean(rows.map((r) => r[key]));
    const toX = (r) => used.map(([key]) => (isNum(r[key]) ? r[key] : colMean[key]));
    const X = rows.map(toX);
    const model = ridge(X, ys);
    if (!model) return { status: "not_enough_data", have: rows.length };
    const q10 = quantile(model.looResid, 0.1);
    const q90 = quantile(model.looResid, 0.9);
    return { status: "ok", model, used, toX, featRow, q10, q90, n: rows.length, ys, dates, usualWake: (i) => usualWake(days, derived, i) };
  }

  function predictWith(M, days, derived, i, opts) {
    opts = opts || {};
    const strain = isNum(opts.strain) ? clamp(opts.strain, 0, 21) : derived[i].strain;
    let bed = opts.bedtime != null ? parseClock(opts.bedtime) : null;
    if (bed == null && derived[i].bedtimeTonight) bed = parseClock(new Date(derived[i].bedtimeTonight));
    if (bed == null) bed = usualBed(days, derived, i);
    const wake = M.usualWake(i);
    const tib = isNum(bed) && isNum(wake) ? (wake - bed) / 60 : null;
    const row = M.featRow(i, { tib, bed });
    row.strain = strain;
    const x = M.toX(row);
    const yhat = M.model.predict(x);
    const drivers = M.used.map(([key, name], q) => {
      const a = q; // column in x
      const z = (x[a] - M.model.mu[a]) / (M.model.sd[a] || 1);
      return { name, key, value: key === "alcohol" || key === "lateMeal" ? (x[a] >= 0.5 ? "yes" : "no") : r2(row[key]), effect: r1(M.model.beta[a] * (isNum(z) ? z : 0)) };
    }).filter((d) => d.effect !== 0).sort((a, b) => Math.abs(b.effect) - Math.abs(a.effect));
    return {
      recovery: r0(clamp(yhat, 1, 99)),
      lo: r0(clamp(yhat + M.q10, 1, 99)),
      hi: r0(clamp(yhat + M.q90, 1, 99)),
      strain: r1(strain),
      bedtime: clockStr(bed),
      timeInBedH: r1(tib),
      drivers,
    };
  }

  function forecast(days, derived, i, opts) {
    if (!validInput(days, derived)) return clean(notEnough(FORECAST_MIN, 0, "No data yet."));
    if (!isNum(i)) i = days.length - 1;
    i = clamp(Math.round(i), 0, days.length - 1);
    const M = buildModel(days, derived, i);
    if (M.status !== "ok") return clean(notEnough(FORECAST_MIN, M.have, `The forecast needs ${FORECAST_MIN} pairs of consecutive days with recovery.`));
    const p = predictWith(M, days, derived, i, opts);
    return clean({
      status: "ok",
      date: addDays(days[i].date, 1),
      ...p,
      n: M.n,
      r2cv: r2(M.model.q2),
      lambda: r3(M.model.lambda),
      intervalPct: 80,
      features: M.used.map(([, name]) => name),
      note: "Effects are associations in your own history, not proof of cause.",
    });
  }

  /* recovery grid: bedtimes 21:30–00:30 (30 min) × strain low / medium / high (your 20th / 50th / 85th
     percentile of the last 56 days) */
  const SCEN_BEDS = ["21:30", "22:00", "22:30", "23:00", "23:30", "00:00", "00:30"];
  function scenario(days, derived, i, opts) {
    opts = opts || {};
    if (!validInput(days, derived)) return clean(notEnough(FORECAST_MIN, 0, "No data yet."));
    if (!isNum(i)) i = days.length - 1;
    i = clamp(Math.round(i), 0, days.length - 1);
    const M = buildModel(days, derived, i);
    if (M.status !== "ok") return clean(notEnough(FORECAST_MIN, M.have, `Scenarios need ${FORECAST_MIN} pairs of consecutive days with recovery.`));
    const recent = [];
    for (let k = i; k >= 0 && dayDiff(days[k].date, days[i].date) < 56; k--) if (isNum(derived[k].strain) && derived[k].strain > 0) recent.push(derived[k].strain);
    const levels = Array.isArray(opts.strains) && opts.strains.length
      ? opts.strains.map((s, q) => ({ label: ["low", "medium", "high"][q] || `s${q}`, strain: r1(s) }))
      : [["low", 0.2], ["medium", 0.5], ["high", 0.85]].map(([label, q]) => ({ label, strain: r1(quantile(recent, q) || [6, 11, 15][label === "low" ? 0 : label === "medium" ? 1 : 2]) }));
    const beds = Array.isArray(opts.bedtimes) && opts.bedtimes.length ? opts.bedtimes : SCEN_BEDS;
    const grid = beds.map((b) =>
      levels.map((lv) => {
        const p = predictWith(M, days, derived, i, { strain: lv.strain, bedtime: b });
        return { recovery: p.recovery, lo: p.lo, hi: p.hi, timeInBedH: p.timeInBedH };
      })
    );
    let best = null;
    grid.forEach((row, a) => row.forEach((c, b) => {
      if (!best || c.recovery > best.recovery) best = { bedtime: beds[a], strain: levels[b].label, recovery: c.recovery };
    }));
    return clean({ status: "ok", date: addDays(days[i].date, 1), bedtimes: beds.map((b) => clockStr(parseClock(b))), strains: levels, grid, best, n: M.n, r2cv: r2(M.model.q2), usualWake: clockStr(M.usualWake(i)) });
  }

  /* ============================================================
   * 4. Sleep timing
   * sleepWindow: bin each night's bedtime into 30-min bins; per bin the mean next-morning recovery and
   * sleep performance with a t-based 95 % CI. Recommend the bin (n ≥ 4) with the highest LOWER bound,
   * which favours bins that are both good and consistently so. Same for sleep duration (30-min bins).
   * If recovery is unavailable (no HRV), sleep performance is used instead.
   * Observational: late nights cluster with weekends, alcohol, etc., so a bin's score is not purely the
   * effect of the bedtime.
   * ============================================================ */
  const BIN = 30;
  const MIN_BIN_N = 4;
  function binRecommend(entries, keyOf, labelOf) {
    const bins = new Map();
    for (const e of entries) {
      const b = keyOf(e);
      if (!isNum(b)) continue;
      if (!bins.has(b)) bins.set(b, []);
      bins.get(b).push(e);
    }
    const list = [...bins.entries()].sort((a, b) => a[0] - b[0]).map(([b, es]) => ({
      key: b,
      ...labelOf(b),
      n: es.length,
      recovery: tCI(es.map((e) => e.rec), [0, 100]),
      sleepPerformance: tCI(es.map((e) => e.perf), [0, 100]),
    }));
    const useRec = list.some((x) => x.recovery.n >= MIN_BIN_N);
    const metric = useRec ? "recovery" : "sleepPerformance";
    let best = null;
    for (const x of list) {
      const c = x[metric];
      if (c.n < MIN_BIN_N || !isNum(c.lo)) continue;
      if (!best || c.lo > best[metric].lo) best = x;
    }
    return { list, best, metric };
  }
  function sleepWindow(days, derived, opts) {
    opts = opts || {};
    if (!validInput(days, derived)) return clean(notEnough(MIN_BIN_N * 2, 0, "No sleep recorded yet."));
    const end = isNum(opts.endIdx) ? clamp(Math.round(opts.endIdx), 0, days.length - 1) : days.length - 1;
    const look = isNum(opts.lookbackDays) ? opts.lookbackDays : 120;
    const nights = [];
    for (let k = end; k >= 0; k--) {
      if (dayDiff(days[k].date, days[end].date) >= look) break;
      const s = sleepOf(days, derived, k);
      if (!s) continue;
      const dv = derived[k];
      nights.push({ bed: s.bedMin, dur: s.asleep, rec: dv && isNum(dv.recovery) ? dv.recovery : null, perf: dv && isNum(dv.sleepPerformance) ? dv.sleepPerformance : null });
    }
    if (nights.length < MIN_BIN_N * 2) return clean(notEnough(MIN_BIN_N * 2, nights.length, "The sleep window needs at least 8 recorded nights."));
    const bedR = binRecommend(nights, (e) => Math.floor(e.bed / BIN) * BIN, (b) => ({ from: clockStr(b), to: clockStr(b + BIN) }));
    const durR = binRecommend(nights, (e) => Math.floor(e.dur / BIN) * BIN, (b) => ({ fromH: r1(b / 60), toH: r1((b + BIN) / 60), label: `${r1(b / 60)}–${r1((b + BIN) / 60)} h` }));
    const strip = (x) => {
      const { key, ...rest } = x;
      return rest;
    };
    const ub = median(nights.map((e) => e.bed));
    return clean({
      status: bedR.best ? "ok" : "not_enough_data",
      needed: MIN_BIN_N,
      nights: nights.length,
      metric: bedR.metric,
      usualBedtime: clockStr(ub),
      bins: bedR.list.map(strip),
      best: bedR.best ? { from: bedR.best.from, to: bedR.best.to, n: bedR.best.n, recovery: bedR.best.recovery, sleepPerformance: bedR.best.sleepPerformance } : null,
      durationBins: durR.list.map(strip),
      bestDuration: durR.best ? { fromH: durR.best.fromH, toH: durR.best.toH, n: durR.best.n, recovery: durR.best.recovery, sleepPerformance: durR.best.sleepPerformance } : null,
      note: "Based on your own nights. Other habits that go with late nights also affect these numbers.",
    });
  }

  /* mid-sleep on work vs free days.
   * Free-day nights = nights ending Saturday or Sunday morning (nights before a day off);
   * work nights = nights ending Monday–Friday. Mid-sleep = sleep onset (bed + latency) + SD/2,
   * SD = wake − onset (MCTQ definitions, Roenneberg 2003). Clock minutes relative to the midnight
   * before waking, so 00:30 = 30 and 23:30 = −30. Window: last 28 days (default). */
  function midSleeps(days, derived, end, look) {
    const work = [], free = [];
    for (let k = end; k >= 0; k--) {
      if (dayDiff(days[k].date, days[end].date) >= look) break;
      const s = sleepOf(days, derived, k);
      if (!s) continue;
      const onset = s.onsetMin;
      let wake = s.wakeMin;
      if (wake < onset) wake += 1440; // safety (should not happen with the bed convention)
      const sd = wake - onset;
      if (!(sd > 120 && sd < 960)) continue;
      const rec = { date: days[k].date, mid: onset + sd / 2, sd };
      const wd = weekdayOf(days[k].date);
      (wd === 0 || wd === 6 ? free : work).push(rec);
    }
    return { work, free };
  }
  function socialJetlag(days, derived, opts) {
    opts = opts || {};
    if (!validInput(days, derived)) return clean(notEnough(6, 0, "No sleep recorded yet."));
    const end = isNum(opts.endIdx) ? clamp(Math.round(opts.endIdx), 0, days.length - 1) : days.length - 1;
    const { work, free } = midSleeps(days, derived, end, opts.lookbackDays || 28);
    if (work.length < 4 || free.length < 2) return clean(notEnough(6, work.length + free.length, "Social jetlag needs at least 4 work-day and 2 free-day nights."));
    const msw = mean(work.map((x) => x.mid));
    const msf = mean(free.map((x) => x.mid));
    const h = Math.abs(msf - msw) / 60;
    return clean({
      status: "ok",
      hours: r1(h),
      midSleepWork: clockStr(msw),
      midSleepFree: clockStr(msf),
      direction: msf >= msw ? "later on free days" : "earlier on free days",
      nWork: work.length,
      nFree: free.length,
      level: h < 1 ? "low" : h < 2 ? "moderate" : "high",
    });
  }
  /* MSFsc (Roenneberg et al. 2012): if SDf > SDw, MSFsc = MSF − (SDf − SDweek)/2, SDweek = (5·SDw + 2·SDf)/7;
     else MSFsc = MSF. Category bands (1-h bins around the population mode ≈ 4:00–4:30 for adults). */
  function chronotype(days, derived, opts) {
    opts = opts || {};
    if (!validInput(days, derived)) return clean(notEnough(6, 0, "No sleep recorded yet."));
    const end = isNum(opts.endIdx) ? clamp(Math.round(opts.endIdx), 0, days.length - 1) : days.length - 1;
    const { work, free } = midSleeps(days, derived, end, opts.lookbackDays || 56);
    if (work.length < 4 || free.length < 4) return clean(notEnough(8, work.length + free.length, "Chronotype needs at least 4 free-day and 4 work-day nights (about 2–4 weeks)."));
    const msf = mean(free.map((x) => x.mid));
    const sdf = mean(free.map((x) => x.sd));
    const sdw = mean(work.map((x) => x.sd));
    const sdWeek = (5 * sdw + 2 * sdf) / 7;
    const msfsc = sdf > sdw ? msf - (sdf - sdWeek) / 2 : msf;
    const hh = msfsc / 60; // hours after midnight (can be negative)
    const type = hh < 3 ? "early" : hh < 4 ? "moderately early" : hh < 5 ? "intermediate" : hh < 6 ? "moderately late" : "late";
    return clean({
      status: "ok",
      msfsc: clockStr(msfsc),
      msfscHours: r2(hh),
      msf: clockStr(msf),
      sleepFreeH: r1(sdf / 60),
      sleepWorkH: r1(sdw / 60),
      type,
      nFree: free.length,
      nWork: work.length,
      note: "From tracked sleep, not a questionnaire. Alarms on free days make you look earlier than you are.",
    });
  }

  /* ============================================================
   * 8. Weekly report (rule-based)
   * ============================================================ */
  const METRIC_DEFS = [
    // name, unit, getter, better ("up" | "down" | null), noise threshold for "about the same", decimals
    ["Recovery", "%", (d, dv) => dv.recovery, "up", 3, 0],
    ["HRV", "ms", (d) => d.hrv, "up", 2, 0],
    ["Resting HR", "bpm", (d) => d.restingHr, "down", 1, 1],
    ["Sleep", "h", (d, dv) => (dv.sleep && isNum(dv.sleep.asleep) ? dv.sleep.asleep / 60 : null), "up", 0.2, 1],
    ["Sleep performance", "%", (d, dv) => dv.sleepPerformance, "up", 3, 0],
    ["Sleep consistency", "%", (d, dv) => dv.sleepConsistency, "up", 3, 0],
    ["Strain", "", (d, dv) => dv.strain, null, 0.5, 1],
    ["Steps", "", (d) => d.steps, "up", 500, 0],
  ];
  const fmtN = (v, dp) => (dp === 0 ? Math.round(v).toLocaleString("en-US") : String(r1(v)));

  function weeklyReport(days, derived, endDate, profile) {
    if (!validInput(days, derived)) return clean(notEnough(4, 0, "No data yet."));
    const end = isYmd(endDate) ? endDate : days[days.length - 1].date;
    const startThis = addDays(end, -6);
    const startPrev = addDays(end, -13);
    const inRange = (date, a, b) => dayNum(date) >= dayNum(a) && dayNum(date) <= dayNum(b);
    const thisIdx = [], prevIdx = [];
    days.forEach((d, k) => {
      if (!d || !isYmd(d.date)) return;
      if (inRange(d.date, startThis, end)) thisIdx.push(k);
      else if (inRange(d.date, startPrev, addDays(end, -7))) prevIdx.push(k);
    });
    if (thisIdx.length < 4) return clean(notEnough(4, thisIdx.length, "A weekly report needs at least 4 days in the week."));
    const endIdx = thisIdx[thisIdx.length - 1];

    const metrics = METRIC_DEFS.map(([name, unit, get, better, noise, dp]) => {
      const a = mean(thisIdx.map((k) => get(days[k], derived[k] || {})));
      const b = mean(prevIdx.map((k) => get(days[k], derived[k] || {})));
      const round = dp === 0 ? r0 : r1;
      const change = isNum(a) && isNum(b) ? a - b : null;
      let good = null;
      if (isNum(change) && better && Math.abs(change) >= noise) good = better === "up" ? change > 0 : change < 0;
      return { name, unit, thisWeek: round(a), lastWeek: round(b), change: round(change), good };
    });
    const mByName = (n) => metrics.find((m) => m.name === n);

    // best / toughest day by recovery (fallback: sleep performance)
    const scored = thisIdx.map((k) => ({ k, s: isNum(derived[k].recovery) ? derived[k].recovery : derived[k].sleepPerformance })).filter((x) => isNum(x.s));
    const dayCard = (k, why) => ({
      date: days[k].date,
      weekday: WD[weekdayOf(days[k].date)],
      recovery: derived[k].recovery,
      strain: derived[k].strain,
      sleepH: derived[k].sleep && isNum(derived[k].sleep.asleep) ? r1(derived[k].sleep.asleep / 60) : null,
      note: why,
    });
    let bestDay = null, toughestDay = null;
    if (scored.length) {
      const hi = scored.reduce((a, b) => (b.s > a.s ? b : a));
      const lo = scored.reduce((a, b) => (b.s < a.s ? b : a));
      const why = (k, good) => {
        const prev = k > 0 && dayDiff(days[k - 1].date, days[k].date) === 1 ? k - 1 : -1;
        const sl = derived[k].sleep && derived[k].sleep.asleep;
        const bits = [];
        if (isNum(sl)) bits.push(`${r1(sl / 60)} h sleep`);
        if (prev >= 0 && isNum(derived[prev].strain)) bits.push(`strain ${derived[prev].strain} the day before`);
        if (prev >= 0 && hasTag(days[prev], RE_ALC)) bits.push("alcohol the night before");
        return bits.length ? `${good ? "Best" : "Lowest"} recovery after ${bits.join(", ")}.` : "";
      };
      bestDay = dayCard(hi.k, why(hi.k, true));
      toughestDay = lo.k !== hi.k ? dayCard(lo.k, why(lo.k, false)) : null;
    }

    // load
    const ld = load(days, derived);
    const ldEnd = ld.find((x) => x.date === days[endIdx].date) || null;
    const plan = weekPlan(days, derived, { startDate: addDays(end, 1) });
    const loadOut = ldEnd
      ? { ctl: ldEnd.ctl, atl: ldEnd.atl, tsb: ldEnd.tsb, acwr: ldEnd.acwr, status: ldEnd.status, ramp: ldEnd.ramp, totalStrain: r1(thisIdx.reduce((s, k) => s + (derived[k].strain || 0), 0)) }
      : null;

    // warnings (analytics2), guarded
    const warnings = [];
    if (typeof A.warning === "function") {
      for (const k of thisIdx) {
        try {
          const w = A.warning(days, derived, k);
          if (w && w.level && w.level !== "none") warnings.push({ date: days[k].date, level: w.level, signals: (w.signals || []).map((s) => s.metric) });
        } catch (e) { /* analytics2 failure must not break the report */ }
      }
    }
    // drivers (analytics2), guarded
    let drivers = [];
    if (typeof A.drivers === "function") {
      try {
        const dr = A.drivers(days, derived);
        const list = Array.isArray(dr) ? dr : dr && Array.isArray(dr.items) ? dr.items : dr && Array.isArray(dr.drivers) ? dr.drivers : [];
        drivers = list
          .filter((x) => x && (x.label === "likely" || x.label === "possible"))
          .slice(0, 3)
          .map((x) => ({ name: x.name || x.tag || x.key || "", outcome: x.outcomeShort || x.outcome || null, unit: x.unit || null, effect: isNum(x.effect) ? r1(x.effect) : isNum(x.diff) ? r1(x.diff) : null, label: x.label }));
      } catch (e) { drivers = []; }
    }

    // sleep
    const debt = sleepDebt(days, derived, endIdx);
    const sj = socialJetlag(days, derived, { endIdx });
    const sw = sleepWindow(days, derived, { endIdx });
    const cons = mByName("Sleep consistency");
    const sleep = {
      avgHours: mByName("Sleep").thisWeek,
      debtHours: debt.status === "ok" ? debt.hours : null,
      consistency: cons.thisWeek,
      socialJetlagH: sj.status === "ok" ? sj.hours : null,
      bestWindow: sw.status === "ok" && sw.best ? `${sw.best.from}–${sw.best.to}` : null,
    };

    // cardio (analytics2), optional line
    let cardio = null;
    if (typeof A.cardio === "function") {
      try {
        const c = A.cardio(days, derived, profile || {});
