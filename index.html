<title>Cadence Health</title>
<meta name="description" content="Cadence is a private health dashboard: recovery, strain and sleep scores, heart rate, journal and trends from your own data. Runs in your browser.">
<meta name="theme-color" content="#0A0E13">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com; connect-src 'self' https: https://health.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://api.anthropic.com; frame-src https://accounts.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com">

<style>/* Cadence v2 design system. Dark, athletic, high-contrast performance panel. Single deliberate dark look. */
:root {
  color-scheme: dark;
  --bg: #0A0E13;
  --surface: #11171E;
  --surface-2: #182029;
  --surface-3: #1F2933;
  --ink: #F2F5F7;
  --fg: var(--ink);
  --muted: #8A97A6;
  --faint: #5D6977;
  --line: #222C37;
  --line-2: #1A222B;

  /* semantic */
  --green: #16EC8D;
  --yellow: #FFD23F;
  --red: #FF4D5E;
  --strain: #2E8BFF;
  --sleep: #7C8CFF;
  --accent: #16EC8D;
  --accent-ink: #04140C;
  --accent-soft: rgba(22, 236, 141, 0.12);

  /* v1 aliases (keep) */
  --rec-high: var(--green);
  --rec-mid: var(--yellow);
  --rec-low: var(--red);
  --good: var(--green);
  --warn: var(--yellow);
  --bad: var(--red);

  /* sleep stages */
  --st-awake: #E8A07F;
  --st-rem: #A8B3FF;
  --st-light: #5F73F2;
  --st-deep: #3436B8;

  /* heart-rate zones: cool grey-blue → hot red */
  --z0: #3A4654;
  --z1: #6F8499;
  --z2: #2E8BFF;
  --z3: #16EC8D;
  --z4: #FF9F2E;
  --z5: #FF4D5E;

  --shadow: none;
  --shadow-pop: 0 18px 48px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.5);
  --radius: 14px;
  --r-sm: 10px;
  --r-xs: 7px;
  --side-w: 232px;
  --tab-h: 64px;

  --f-display: "Archivo", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cond: 72%;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: #0A0E13; background: var(--bg); }
body {
  margin: 0;
  background: #0A0E13;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.5;
  font-stretch: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
}
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 800; font-stretch: 85%; letter-spacing: -0.005em; margin: 0; line-height: 1.15; }
p { margin: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { max-width: 100%; }
svg { display: block; }
::selection { background: color-mix(in srgb, var(--strain) 45%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--strain); outline-offset: 2px; border-radius: 6px; }
.num, .stat-value, .card-meta, .ch-t { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 0.9em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow, .label-caps {
  font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
}
.big-num {
  font-family: var(--f-display); font-weight: 800; font-stretch: var(--cond); font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em; line-height: 0.95;
}
.c-green { color: var(--green); } .c-yellow { color: var(--yellow); } .c-red { color: var(--red); }
.c-strain { color: var(--strain); } .c-sleep { color: var(--sleep); }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
[hidden] { display: none !important; }

/* ---------- app shell ---------- */
.app { min-height: 100vh; min-height: 100dvh; background: var(--bg); }
.col { min-width: 0; }
.side { display: none; }

.top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in {
  max-width: 1180px;
  margin-inline: auto;
  min-height: 56px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.top-title { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 auto; }
.top-title .brand-mark { flex: none; display: none; }
@media (min-width: 420px) { .top-title .brand-mark { display: block; } }
.top-title h1 {
  font-size: 15px;
  font-weight: 800;
  font-stretch: 90%;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pill-sample {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--yellow) 45%, transparent);
  color: var(--yellow);
  background: color-mix(in srgb, var(--yellow) 8%, transparent);
  font-family: var(--f-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
}
.pill-sample::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.pill-sample .long { display: none; }
@media (min-width: 520px) { .pill-sample .long { display: inline; } .pill-sample .short { display: none; } }

/* date switcher: centered pill with chevrons */
.dsw {
  flex: none;
  display: flex;
  align-items: center;
  gap: 0;
  height: 38px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
}
.dsw-btn {
  width: 34px; height: 32px;
  display: grid; place-items: center;
  border: 0;
  background: transparent;
  border-radius: 999px;
  color: var(--ink);
}
.dsw-btn:hover:not(:disabled) { background: var(--surface-2); }
.dsw-btn:disabled { opacity: 0.3; cursor: default; }
.dsw-btn svg { width: 16px; height: 16px; stroke-width: 2.2; }
.dsw-date {
  position: relative;
  min-width: 92px;
  height: 32px;
  padding: 0 8px;
  display: grid;
  place-items: center;
  font-family: var(--f-display);
  font-weight: 800;
  font-stretch: 85%;
  font-size: 13.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  border-radius: 999px;
  cursor: pointer;
}
.dsw-date:hover { background: var(--surface-2); }
.dsw-date input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer; border: 0; padding: 0;
}
.dsw-date:focus-within { outline: 2px solid var(--strain); outline-offset: 1px; }
@media (min-width: 560px) { .dsw-date { min-width: 128px; padding: 0 12px; } }
@media (min-width: 700px) {
  .top-in.has-dsw { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
  .top-in.has-dsw .dsw { grid-column: 2; }
}

.main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom, 0px));
  min-width: 0;
}
#view {
  max-width: 1180px;
  margin-inline: auto;
  container-type: inline-size;
  container-name: view;
  min-width: 0;
}

/* bottom tab bar (phone) */
.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.tabs-in { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--tab-h); max-width: 560px; margin-inline: auto; }
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--muted);
  text-decoration: none;
  font-family: var(--f-mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: none;
  border: 0;
  padding: 0 2px;
  min-width: 0;
  position: relative;
}
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab svg { width: 22px; height: 22px; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); }
.tab.on svg { color: var(--accent); }
.tab.on::before {
  content: ""; position: absolute; top: -1px; left: 30%; right: 30%; height: 2px;
  background: var(--accent); border-radius: 0 0 2px 2px;
}
.more-sheet {
  position: fixed;
  right: max(10px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--tab-h) + 10px + env(safe-area-inset-bottom, 0px));
  z-index: 31;
  width: min(260px, calc(100vw - 20px));
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-pop);
  padding: 6px;
}
.more-h { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 8px 12px 6px; }
.more-sheet a {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px;
  border-radius: var(--r-sm);
  color: var(--ink);
  text-decoration: none;
  font-weight: 600;
}
.more-sheet a svg { width: 20px; height: 20px; color: var(--muted); }
.more-sheet a:hover, .more-sheet a.on { background: var(--surface-3); }
.more-sheet a.on svg { color: var(--accent); }

/* sidebar (desktop) */
@media (min-width: 900px) {
  .side {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: calc(var(--side-w) + env(safe-area-inset-left, 0px));
    padding: 20px 14px 16px calc(14px + env(safe-area-inset-left, 0px));
    border-right: 1px solid var(--line);
    background: var(--bg);
    z-index: 25;
    overflow-y: auto;
  }
  .col { margin-left: calc(var(--side-w) + env(safe-area-inset-left, 0px)); }
  .tabs, .more-sheet { display: none !important; }
  .top-title .brand-mark { display: none; }
  .top-in { min-height: 64px; }
  .top-title h1 { font-size: 16px; }
  .main { padding-block: 28px 56px; }
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px 22px;
  color: var(--ink); text-decoration: none;
}
.brand-name { font-family: var(--f-display); font-weight: 900; font-stretch: 75%; font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; }
.brand-mark { width: 26px; height: 26px; color: var(--accent); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 12px;
  height: 42px;
  padding: 0 12px;
  border-radius: var(--r-sm);
  color: var(--muted);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.01em;
  position: relative;
}
.nav a svg { width: 20px; height: 20px; flex: none; }
.nav a:hover { background: var(--surface); color: var(--ink); }
.nav a.on { background: var(--surface-2); color: var(--ink); }
.nav a.on::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav a.on svg { color: var(--accent); }
.nav-sep { height: 1px; background: var(--line); margin: 10px 12px; }
.side-foot { margin-top: auto; display: grid; gap: 10px; padding: 12px 8px 0; }
.side-status { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 7px; line-height: 1.4; }
.side-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); flex: none; }
.side-status .dot.ok { background: var(--green); }

/* toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 8px);
  z-index: 50;
  max-width: calc(100vw - 32px);
  padding: 11px 16px;
  border-radius: var(--r-sm);
  background: var(--ink);
  color: var(--bg);
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-pop);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 900px) {
  .toast { bottom: 24px; left: calc(50% + var(--side-w) / 2); }
}

/* ---------- page layout ---------- */
.page { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.page-head { display: flex; flex-direction: column; gap: 6px; padding: 2px 0 6px; }
.page-head h1 { font-size: 30px; font-weight: 900; font-stretch: 75%; letter-spacing: 0.01em; text-transform: uppercase; line-height: 1; }
.page-head .sub { color: var(--muted); font-size: 14.5px; max-width: 62ch; }
.section-h, .page h2.section {
  font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  margin: 8px 0 -6px;
}
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  gap: 14px;
}
.grid-2, .grid-3 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.grid > *, .grid-2 > *, .grid-3 > * { min-width: 0; }
@container view (min-width: 620px) {
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span-2 { grid-column: span 2; }
}
@container view (min-width: 900px) {
  .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* ---------- cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  min-width: 0;
  box-shadow: none;
}
.card > * + * { margin-top: 14px; }
.card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  min-width: 0;
}
.card-head h2 {
  font-family: var(--f-mono);
  font-size: 11.5px;
  font-weight: 500;
  font-stretch: 100%;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink);
  min-width: 0;
}
.card-head h2 .muted { font-weight: 400; }
.card-meta { font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; flex: none; letter-spacing: 0.04em; }
.card.hero {
  padding: 20px;
  background: var(--surface);
  border-color: var(--line);
}
.card.hero > * + * { margin-top: 18px; }
.card.flat { background: var(--surface-2); border-color: var(--line-2); }
.card h3 { font-size: 15px; font-weight: 700; font-stretch: 90%; }
a.card { color: inherit; text-decoration: none; display: block; }
a.card:hover { border-color: color-mix(in srgb, var(--ink) 22%, var(--line)); }

/* ---------- stats ---------- */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 112px), 1fr));
  gap: 16px 18px;
}
.stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat-label {
  font-family: var(--f-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-value {
  font-family: var(--f-display);
  font-size: 30px;
  font-weight: 800;
  font-stretch: var(--cond);
  line-height: 1.02;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.stat-unit { font-family: var(--f-body); font-stretch: 100%; font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
.stat-sub { font-size: 12.5px; color: var(--muted); }
.stat.big .stat-value { font-size: 44px; }

/* ---------- rings & dials ---------- */
.ring { position: relative; display: inline-grid; place-items: center; flex: none; max-width: 100%; }
.ring svg { display: block; }
.ring-track { stroke: var(--surface-3); }
.ring-arc { transition: stroke-dashoffset 0.6s cubic-bezier(.2, .7, .2, 1); }
.ring-c {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  pointer-events: none;
}
.ring-v { font-family: var(--f-display); font-weight: 800; font-stretch: var(--cond); letter-spacing: -0.01em; line-height: 1; font-variant-numeric: tabular-nums; }
.ring-l { font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
.ring-wrap { display: inline-flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.ring-sub { font-size: 12.5px; color: var(--muted); text-align: center; }
.rings { display: flex; flex-wrap: wrap; justify-content: space-around; gap: 16px; }
.ring.dial { container-type: inline-size; }
.dial .dial-track { stroke: var(--surface-3); }
.dial .dial-zone { stroke: var(--ink); stroke-opacity: 0.55; }
.dial-v { font-weight: 900; color: var(--ink); }
.dial-u { font-size: 0.42em; font-weight: 700; font-stretch: 100%; margin-left: 1px; color: var(--muted); vertical-align: 0.9em; }
.dial-l { margin-top: 6px; color: var(--c, var(--muted)); font-size: min(10px, 7cqi); }
.dials { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; justify-items: stretch; }
.dials .ring-wrap { width: 100%; }
.dials .ring { width: 100% !important; height: auto !important; aspect-ratio: 1; max-width: 180px; margin-inline: auto; }
.dials .ring svg { width: 100%; height: 100%; }

/* ---------- chips, buttons, controls ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  white-space: nowrap;
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--line);
  vertical-align: middle;
}
.chip.good { color: var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.chip.warn { color: var(--yellow); background: color-mix(in srgb, var(--yellow) 10%, transparent); border-color: color-mix(in srgb, var(--yellow) 35%, transparent); }

<script>/* Cadence engine v2: data model, scores and sample data. Pure functions, no DOM.
 *
 * Day record (format "cadence.v2", a superset of "cadence.v1"; same shape the Android sync app exports):
 * {
 *   date: "YYYY-MM-DD",
 *   steps, distanceM, activeKcal, totalKcal, floors,
 *   restingHr, hrv (RMSSD ms), spo2 (%), respRate (br/min), skinTempDev (°C vs baseline),
 *   weightKg, bodyFatPct,
 *   hr: [[minuteOfDay, bpm], ...]                 // downsampled curve (5-min medians allowed)
 *   hrHist: { start: 30, bin: 5, counts: [...] }  // v2: minutes in each bpm bucket over the whole day
 *   sleep: { start: ISO, end: ISO, stages: [[stage, startMin, endMin], ...] }
 *          // stage: "awake" | "light" | "deep" | "rem"; minutes from sleep.start
 *   naps: [{ start: ISO, end: ISO, asleepMin }]   // v2: sleep sessions < 3 h that are not the main sleep
 *   workouts: [{ id?, type, start: ISO, durationMin, avgHr, maxHr, kcal, distanceM, source, hrHist? }]
 * }
 * User-entered data (kept separately so imports never overwrite it):
 * { meals: [...], waterMl, caffeineMg, journal: { tags: [], stress, mood, note }, workouts: [...] }
 *
 * The maths below is our own implementation of well-known public sports-science methods
 * (heart-rate reserve zones, zone-weighted training load, personal-baseline z-scores).
 */
(function (root) {
  "use strict";

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN);
  const sd = (a) => {
    if (a.length < 2) return NaN;
    const m = mean(a);
    return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1));
  };
  const median = (a) => {
    if (!a.length) return NaN;
    const s = [...a].sort((x, y) => x - y);
    const h = s.length >> 1;
    return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
  };
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;
  const logistic = (x) => 1 / (1 + Math.exp(-x));

  /* ---------- dates (local calendar days) ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = (s) => {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  };
  const addDays = (s, n) => {
    const d = parseYmd(s);
    d.setDate(d.getDate() + n);
    return ymd(d);
  };
  const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
  const clockMin = (d) => d.getHours() * 60 + d.getMinutes();

  /* ---------- profile ---------- */
  const DEFAULT_PROFILE = { age: 30, sex: "unspecified", heightCm: 165, weightKg: 62, maxHr: null };
  const maxHrOf = (p) => (isNum(p.maxHr) && p.maxHr > 120 ? p.maxHr : Math.round(208 - 0.7 * p.age));
  const hrvNormOf = (age) => Math.max(18, 62 - 0.75 * (age - 20)); // population RMSSD reference (ms)

  /* ============================================================
   * Constants (documented in METHODS)
   * ============================================================ */
  const ZONE_W = [0, 1, 2, 3, 4, 5]; // Edwards-style weights per minute in zones 1–5
  const Z0_W = 0.5; // max weight for zone-0 minutes, reached at 50 % HRR
  const Z0_FROM = 0.15; // zone-0 minutes below 15 % HRR carry no load
  const STRAIN_K = 90; // strain = 21 · L / (L + K): half of 21 at L = K
  const WALK_W = 0.45; // fallback: load per minute of walking from steps
  const AWAKE_BG = 14; // fallback: load of ordinary awake movement not captured by steps
  const NEED_BASE = 450; // default sleep baseline (7.5 h)
  const NEED_STRAIN_PER_PT = 5; // + min of need per strain point above 10
  const DEBT_W = [0.33, 0.22, 0.13, 0.08]; // share of each previous night's shortfall carried
  const REC_W = { hrv: 0.5, rhr: 0.25, resp: 0.08, sleep: 0.22 };
  const REC_A = 0.05; // logistic offset
  const REC_B = 1.25; // logistic slope
  const SLEEP_REF = { mean: 85, sd: 12 }; // sleep performance reference for the recovery z-score

  /* ---------- sleep ---------- */
  function sleepStats(day) {
    const s = day && day.sleep;
    if (!s || !Array.isArray(s.stages) || !s.stages.length) return null;
    const mins = { awake: 0, light: 0, deep: 0, rem: 0 };
    for (const [stage, a, b] of s.stages) {
      if (mins[stage] !== undefined && b > a) mins[stage] += b - a;
    }
    const asleep = mins.light + mins.deep + mins.rem;
    const inBed = asleep + mins.awake;
    if (asleep <= 0) return null;
    const start = new Date(s.start);
    const end = new Date(s.end);
    if (isNaN(start) || isNaN(end)) return null;
    let bedMin = clockMin(start);
    if (bedMin > 12 * 60) bedMin -= 24 * 60;
    const wakeMin = clockMin(end);
    const first = s.stages[0];
    const latency = first && first[0] === "awake" && first[1] === 0 ? first[2] - first[1] : 0;
    return {
      ...mins,
      asleep,
      inBed,
      efficiency: inBed ? asleep / inBed : 0,
      restorative: asleep ? (mins.deep + mins.rem) / asleep : 0,
      start,
      end,
      bedMin,
      wakeMin,
      latency,
      awakenings: s.stages.filter((x) => x[0] === "awake" && x[1] > 0 && x[2] - x[1] >= 2).length,
    };
  }

  /* ---------- heart-rate zones & load ---------- */
  function trimpFactor(hrr, sex) {
    const b = sex === "male" ? [0.64, 1.92] : sex === "female" ? [0.86, 1.67] : [0.75, 1.795];
    return hrr * b[0] * Math.exp(b[1] * hrr);
  }

  function zoneOf(bpm, rhr, maxHr) {
    const hrr = (bpm - rhr) / (maxHr - rhr);
    if (hrr < 0.5) return 0;
    if (hrr < 0.6) return 1;
    if (hrr < 0.7) return 2;
    if (hrr < 0.8) return 3;
    if (hrr < 0.9) return 4;
    return 5;
  }

  /* load weight of one minute at a given bpm */
  function minuteWeight(bpm, rhr, maxHr) {
    const hrr = (bpm - rhr) / (maxHr - rhr);
    const z = zoneOf(bpm, rhr, maxHr);
    if (z > 0) return ZONE_W[z];
    return Z0_W * clamp((hrr - Z0_FROM) / (0.5 - Z0_FROM), 0, 1);
  }

  /* zones + load from a histogram; each bucket is split at zone edges in proportion */
  function histLoad(h, rhr, maxHr) {
    const zones = [0, 0, 0, 0, 0, 0];
    let load = 0;
    if (!h || !Array.isArray(h.counts)) return { zones, load, minutes: 0 };
    let minutes = 0;
    for (let k = 0; k < h.counts.length; k++) {
      const c = h.counts[k];
      if (!(c > 0)) continue;
      minutes += c;
      // integrate over 5 sub-points of the bucket so zone edges inside a bucket are respected
      const lo = h.start + k * h.bin;
      for (let q = 0; q < 5; q++) {
        const bpm = lo + ((q + 0.5) / 5) * h.bin;
        zones[zoneOf(bpm, rhr, maxHr)] += c / 5;
        load += (c / 5) * minuteWeight(bpm, rhr, maxHr);
      }
    }
    return { zones, load, minutes };
  }

  /* zones + load for a workout with no histogram: spread avg/max HR over the session (v1 triangle) */
  function spreadLoad(w, rhr, maxHr) {
    const zones = [0, 0, 0, 0, 0, 0];
    let load = 0;
    const avg = isNum(w.avgHr) ? w.avgHr : rhr + 0.55 * (maxHr - rhr);
    const mx = isNum(w.maxHr) && w.maxHr >= avg ? w.maxHr : avg + 15;
    const n = Math.max(1, Math.round(w.durationMin || 0));
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n;
      const s = Math.sin(Math.PI * t);
      const bpm = avg + (mx - avg) * s * 0.6 - (1 - s) * 8;
      zones[zoneOf(bpm, rhr, maxHr)]++;
      load += minuteWeight(bpm, rhr, maxHr);
    }
    return { zones, load, minutes: n };
  }

  function workoutLoadZones(w, rhr, maxHr) {
    return w && w.hrHist && Array.isArray(w.hrHist.counts) ? histLoad(w.hrHist, rhr, maxHr) : spreadLoad(w || {}, rhr, maxHr);
  }

  /* Strain 0–21 from load: a saturating curve; 21 is approached but never reached. */
  const strainFromLoad = (L) => (L > 0 ? Math.min(20.9, r1((21 * L) / (L + STRAIN_K))) : 0);
  const loadForStrain = (s) => (s > 0 && s < 21 ? (STRAIN_K * s) / (21 - s) : s >= 21 ? Infinity : 0);

  /* ---------- baselines (previous 30 calendar days, today excluded) ---------- */
  function windowVals(days, idx, get) {
    const vals = [];
    for (let i = idx - 1; i >= 0; i--) {
      const dd = dayDiff(days[i].date, days[idx].date);
      if (dd > 30) break;
      if (dd <= 0) continue;
      const v = get(i);
      if (isNum(v)) vals.push(v);
    }
    return vals;
  }
  function baselineOf(vals, minN) {
    if (vals.length < (minN || 4)) return null;
    return { mean: mean(vals), sd: vals.length > 1 ? sd(vals) : 0, n: vals.length, median: median(vals) };
  }

  /* sleep consistency: intersection / union of tonight's window with each of the previous 4 nights,
     each shifted onto tonight's calendar so only clock time matters */
  function overlapPct(a, b) {
    const lo = Math.max(a[0], b[0]);
    const hi = Math.min(a[1], b[1]);
    const inter = Math.max(0, hi - lo);
    const uni = Math.max(a[1], b[1]) - Math.min(a[0], b[0]);
    return uni > 0 ? (inter / uni) * 100 : 0;
  }

  /* ---------- the main computation ---------- */
  /**
   * days: array of merged day objects sorted ascending by date (gaps allowed). day.entry holds user data.
   * Returns array of derived metrics aligned with input (see CONTRACT-v2.md).
   */
  function computeAll(days, profileIn) {
    const p = { ...DEFAULT_PROFILE, ...(profileIn || {}) };
    const maxHr = maxHrOf(p);
    const out = [];
    const sleepS = days.map(sleepStats);
    const hrvPop = hrvNormOf(p.age);

    // personal sleep baseline: 30-day average asleep when ≥ 14 nights, clamped 7–9 h
    const needBaseline = (i) => {
      const v = windowVals(days, i, (k) => sleepS[k] && sleepS[k].asleep);
      return v.length >= 14 ? clamp(mean(v), 420, 540) : NEED_BASE;
    };
    const napMinOf = (day) =>
      ((day && day.naps) || []).reduce((s, n) => s + (isNum(n.asleepMin) ? n.asleepMin : 0), 0);

    /* projected need for the night that ends on the morning after day j (uses day j's strain and naps) */
    const needFor = (iNight, prevIdx) => {
      const baseline = needBaseline(iNight < days.length ? iNight : days.length - 1);
      const prev = prevIdx >= 0 ? out[prevIdx] : null;
      const consecutive = prev && (iNight >= days.length || dayDiff(days[prevIdx].date, iNight < days.length ? days[iNight].date : addDays(days[prevIdx].date, 1)) === 1);
      const strainAdj = consecutive && isNum(prev.strain) ? Math.max(0, prev.strain - 10) * NEED_STRAIN_PER_PT : 0;
      let debt = 0;
      const refDate = iNight < days.length ? days[iNight].date : addDays(days[prevIdx].date, 1);
      for (let k = 0; k < DEBT_W.length; k++) {
        const j = prevIdx - k;
        if (j < 0) break;
        const back = dayDiff(days[j].date, refDate);
        if (back < 1 || back > DEBT_W.length) continue;
        const o = out[j];
        if (o && o.sleep && o.sleepNeed) debt += DEBT_W[back - 1] * Math.max(0, o.sleepNeed.total - o.sleep.asleep);
      }
      const nap = consecutive ? napMinOf(days[prevIdx]) : 0;
      const total = clamp(baseline + strainAdj + debt - nap, 390, 660);
      return { total: Math.round(total), baseline: Math.round(baseline), strain: Math.round(strainAdj), debt: Math.round(debt), nap: -Math.round(nap) };
    };

    for (let i = 0; i < days.length; i++) {
      const d = days[i];
      const rhrVals = windowVals(days, i, (k) => days[k].restingHr);
      const rhr = isNum(d.restingHr) ? d.restingHr : rhrVals.length ? mean(rhrVals) : 60;

      /* ---- workouts: device first, then manual (keeps ids, aligned by position) ---- */
      const devW = Array.isArray(d.workouts) ? d.workouts : [];
      const manW = (d.entry && Array.isArray(d.entry.workouts) && d.entry.workouts) || [];
      const workouts = [];
      for (const [w, manual] of devW.map((w) => [w, false]).concat(manW.map((w) => [w, true]))) {
        const lz = workoutLoadZones(w, rhr, maxHr);
        workouts.push({ ...w, manual, strain: strainFromLoad(lz.load), load: r1(lz.load), zones: lz.zones.map((z) => Math.round(z)) });
      }
      const workoutMin = workouts.reduce((s, w) => s + (w.durationMin || 0), 0);
      const wLoad = workouts.reduce((s, w) => s + w.load, 0);

      /* ---- day load ---- */
      let load, zones;
      const hasHist = d.hrHist && Array.isArray(d.hrHist.counts);
      if (hasHist) {
        const hl = histLoad(d.hrHist, rhr, maxHr);
        load = hl.load;
        zones = hl.zones;
        // manual workouts that don't overlap a device workout were probably not worn: add them
        for (let k = devW.length; k < workouts.length; k++) {
          const w = workouts[k];
          const ws = Date.parse(w.start);
          const overl = devW.some((dw) => {
            const a = Date.parse(dw.start);
            return isFinite(a) && isFinite(ws) && ws < a + (dw.durationMin || 0) * 60000 && a < ws + (w.durationMin || 0) * 60000;
          });
          if (!overl) {
            load += w.load;
            w.zones.forEach((z, q) => (zones[q] += z));
          }
        }
      } else {
        zones = [0, 0, 0, 0, 0, 0];
        workouts.forEach((w) => w.zones.forEach((z, q) => (zones[q] += z)));
        const steps = isNum(d.steps) ? d.steps : 0;
        const walkMin = Math.max(0, steps / 110 - workoutMin * 0.5);
        zones[0] += walkMin;
        load = wLoad + walkMin * WALK_W + (isNum(d.steps) || d.hr || workouts.length ? AWAKE_BG : 0);
      }
      zones = zones.map((z) => Math.round(z));
      const strain = strainFromLoad(load);
      const activityStrainShare = load > 0 ? r2(clamp(wLoad / load, 0, 1)) : 0;

      /* ---- energy ---- */
      const activeK = isNum(d.activeKcal) ? d.activeKcal : Math.round(workouts.reduce((s, w) => s + (isNum(w.kcal) ? w.kcal : 0), 0) + (isNum(d.steps) ? d.steps * 0.04 : 0));
      const totalK = isNum(d.totalKcal) ? d.totalKcal : bmr(p) + activeK;

      /* ---- sleep ---- */
      const ss = sleepS[i];
      const sleepNeed = needFor(i, i - 1);
      let sleepPerformance = null, sleepConsistency = null, sleepEfficiency = null, restorative = null, sleepParts = null;
      if (ss) {
        sleepPerformance = Math.round(clamp((ss.asleep / sleepNeed.total) * 100, 0, 100));
        sleepEfficiency = Math.round(clamp(ss.efficiency * 100, 0, 100));
        restorative = { min: Math.round(ss.deep + ss.rem), pct: Math.round(ss.restorative * 100) };
        const tw = [ss.start.getTime(), ss.end.getTime()];
        const ov = [];
        for (let k = i - 1; k >= 0 && ov.length < 4; k--) {
          const back = dayDiff(days[k].date, d.date);
          if (back > 7) break;
          const o = sleepS[k];
          if (!o || back < 1) continue;
          const shift = back * 86400000;
          ov.push(overlapPct(tw, [o.start.getTime() + shift, o.end.getTime() + shift]));
        }
        sleepConsistency = ov.length ? Math.round(mean(ov)) : null;
        sleepParts = {
          duration: sleepPerformance,
          efficiency: Math.round(clamp(((ss.efficiency - 0.7) / 0.25) * 100, 0, 100)),
          restorative: Math.round(clamp((ss.restorative / 0.42) * 100, 0, 100)),
          consistency: isNum(sleepConsistency) ? sleepConsistency : 70,
        };
      }

      /* ---- recovery ---- */
      const lnHrvB = baselineOf(windowVals(days, i, (k) => (days[k].hrv > 0 ? Math.log(days[k].hrv) : null)));
      const rhrB = baselineOf(rhrVals);
      const respB = baselineOf(windowVals(days, i, (k) => days[k].respRate));
      const hB = lnHrvB ? { mean: lnHrvB.mean, sd: Math.max(lnHrvB.sd, 0.06) } : { mean: Math.log(hrvPop), sd: 0.25 };
      const rB = rhrB ? { mean: rhrB.mean, sd: Math.max(rhrB.sd, 1.5) } : { mean: 60, sd: 5 };
      const pB = respB ? { mean: respB.mean, sd: Math.max(respB.sd, 0.3) } : { mean: 15, sd: 1 };
      let recovery = null, band = null, contributors = null, recParts = null, strainTarget = null;
      if (isNum(d.hrv) && d.hrv > 0) {
        const zH = clamp((Math.log(d.hrv) - hB.mean) / hB.sd, -4, 4);
        const zR = isNum(d.restingHr) ? clamp((d.restingHr - rB.mean) / rB.sd, -4, 4) : 0;
        const zP = isNum(d.respRate) ? clamp((d.respRate - pB.mean) / pB.sd, -4, 4) : 0;
        const zS = isNum(sleepPerformance) ? clamp((sleepPerformance - SLEEP_REF.mean) / SLEEP_REF.sd, -4, 4) : 0;
        const x = REC_W.hrv * zH - REC_W.rhr * zR - REC_W.resp * zP + REC_W.sleep * zS;
        recovery = Math.round(clamp(100 * logistic(REC_A + REC_B * x), 1, 99));
        band = recovery >= 67 ? "green" : recovery >= 34 ? "yellow" : "red";
        const sc = (z) => Math.round(100 * logistic(1.2 * z));
        contributors = {
          hrv: { value: d.hrv, baseline: r1(Math.exp(hB.mean)), z: r2(zH), score: sc(zH) },
          rhr: { value: isNum(d.restingHr) ? d.restingHr : null, baseline: r1(rB.mean), z: r2(zR), score: sc(-zR) },
          resp: { value: isNum(d.respRate) ? d.respRate : null, baseline: r1(pB.mean), z: r2(zP), score: sc(-zP) },
          sleep: { value: sleepPerformance, score: isNum(sleepPerformance) ? sc(zS) : null },
        };
        recParts = { hrv: contributors.hrv.score, rhr: contributors.rhr.score, sleep: isNum(sleepPerformance) ? contributors.sleep.score : 50, resp: contributors.resp.score };
        strainTarget = strainTargetFor(recovery);
      }

      /* ---- health monitor ---- */
      const mon = (key, value, get, sdFloor, rule) => {
        const b = baselineOf(windowVals(days, i, get), 5);
        const v = isNum(value) ? value : null;
        let lo = null, hi = null;
        if (rule === "spo2") {
          lo = 94;
          hi = 100;
        } else if (b) {
          const half = rule === "temp" ? 0.5 : 2 * Math.max(b.sd, sdFloor);
          lo = b.mean - half;
          hi = b.mean + half;
        }
        const status = v == null || lo == null ? "none" : v < lo ? "low" : v > hi ? "high" : "normal";
        const dp = rule === "temp" ? r2 : r1;
        return {
          value: v,
          baseline: b ? dp(b.mean) : null,
          sd: b ? r2(b.sd) : null,
          lo: lo == null ? null : dp(lo),
          hi: hi == null ? null : dp(hi),
          status,
        };
      };
      const monitor = {
        hrv: mon("hrv", d.hrv, (k) => days[k].hrv, 3),
        rhr: mon("rhr", d.restingHr, (k) => days[k].restingHr, 1.5),
        resp: mon("resp", d.respRate, (k) => days[k].respRate, 0.3),
        spo2: mon("spo2", d.spo2, (k) => days[k].spo2, 0.6, "spo2"),
        skinTemp: mon("skinTemp", d.skinTempDev, (k) => days[k].skinTempDev, 0.2, "temp"),
      };

      const row = {
        date: d.date,
        strain,
        load: r1(load),
        zones,
        workouts,
        activityStrainShare,
        kcal: { active: Math.round(activeK), total: Math.round(totalK) },
        sleep: ss,
        sleepNeed,
        sleepNeedTonight: null,
        sleepPerformance,
        sleepConsistency,
        sleepEfficiency,
        restorative,
        sleepScore: sleepPerformance,
        recovery,
        band,
        contributors,
        strainTarget,
        monitor,
        bedtimeTonight: null,
        maxHr,
        rhr: r1(rhr),
        // v1 compatibility
        trimp: r1(load),
        workoutMin,
        recParts,
        sleepParts,
        hrvBaseline: lnHrvB ? r1(Math.exp(lnHrvB.mean)) : null,
        rhrBaseline: rhrB ? r1(rhrB.mean) : null,
        respBaseline: respB ? r2(respB.mean) : null,
      };
      out.push(row);

      /* ---- tonight: need for the night after today + bedtime suggestion ---- */
      const tn = needFor(days.length, i); // uses today's strain and naps
      row.sleepNeedTonight = tn.total;
      const wakes = [], lats = [];
      for (let k = i; k >= 0; k--) {
        if (dayDiff(days[k].date, d.date) > 6) break;
        if (sleepS[k]) {
          wakes.push(sleepS[k].wakeMin);
          lats.push(sleepS[k].latency);
        }
      }
      if (wakes.length >= 3) {
        const latency = clamp(median(lats), 5, 40);
        const bedClock = median(wakes) - tn.total - latency; // minutes after tomorrow's midnight (negative = tonight)
        const bt = parseYmd(addDays(d.date, 1));
        bt.setMinutes(Math.round(bedClock / 5) * 5);
        row.bedtimeTonight = bt;
      }
    }
    return out;
  }

  /* strain target from recovery: green ≈ 14–18.5, yellow ≈ 10–14.5, red ≈ 4–10 */
  function strainTargetFor(rec) {
    if (!isNum(rec)) return null;
    if (rec >= 67) {
      const t = clamp((rec - 67) / 32, 0, 1);
      return [r1(14 + t), r1(17.5 + t)];
    }
    if (rec >= 34) {
      const t = clamp((rec - 34) / 32, 0, 1);
      return [r1(10 + 1.5 * t), r1(13 + 1.5 * t)];
    }
    const t = clamp(rec / 33, 0, 1);
    return [r1(4 + 2 * t), r1(8 + 2 * t)];
  }

  /* ============================================================
   * Biological age (estimate)
   * Each factor's hazard ratio (HR) vs a reference level is turned into years with the
   * Gompertz rule: adult mortality doubles about every 8 years, so years = 8 · log2(HR) ≈ 11.5 · ln(HR).
   * Associations are observational and overlap (fitness, steps and exercise minutes move together),
   * so every factor is counted at EVIDENCE_W of its full size, each is capped, and the total is capped ±12 y.
   * ============================================================ */
  const GOMPERTZ = 8 / Math.LN2; // years per unit ln(HR)
  const EVIDENCE_W = 0.6;
  const PACE_SHRINK = 0.06;
  const yrs = (lnHr) => GOMPERTZ * lnHr * EVIDENCE_W;
  const STRENGTH_RE = /strength|weight|resist|gym|lift|crossfit|kettlebell|calisthenic|bodyweight|pilates/i;
  const fmtInt = (v) => Math.round(v).toLocaleString("en-US");

  function bioCore(days, derived, p, endIdx) {
    if (!days.length || endIdx < 0 || endIdx >= days.length) return null;
    const maxHr = maxHrOf(p);
    const endDate = days[endIdx].date;
    const idxs = [];
    for (let i = endIdx; i >= 0; i--) {
      if (dayDiff(days[i].date, endDate) > 29) break;
      idxs.push(i);
    }
    const pick = (f) => idxs.map(f).filter(isNum);
    const rhrA = pick((i) => days[i].restingHr);
    const hrvA = pick((i) => days[i].hrv);
    if (rhrA.length < 3) return null;
    const rhr = mean(rhrA);
    const hrv = hrvA.length ? mean(hrvA) : null;
    const dv = (i) => (derived && derived[i]) || {};
    const asleepA = pick((i) => dv(i).sleep && dv(i).sleep.asleep);
    const consA = pick((i) => dv(i).sleepConsistency);
    const stepsA = pick((i) => days[i].steps);
    const zoneDays = idxs.filter((i) => Array.isArray(dv(i).zones));
    const weeks = Math.max(1, idxs.length / 7);
    const age = p.age;
    const sexAdj = p.sex === "male" ? 4 : p.sex === "female" ? -4 : 0;
    const parts = [];

    /* 1. Cardio fitness — VO2max: Uth ratio blended with running evidence (ACSM running equation + %HRR ≈ %VO2R) */
    const uth = 15.3 * (maxHr / rhr);
    const runEst = [];
    for (const i of idxs) {
      for (const w of dv(i).workouts || days[i].workouts || []) {
        if (!/run/i.test(w.type || "") || !isNum(w.avgHr) || !isNum(w.distanceM) || !(w.durationMin >= 15)) continue;
        const speed = w.distanceM / w.durationMin; // m/min
        const hrr = (w.avgHr - rhr) / (maxHr - rhr);
        if (speed < 80 || speed > 400 || hrr < 0.4 || hrr > 0.95) continue;
        const vo2 = 0.2 * speed + 3.5;
        runEst.push(3.5 + (vo2 - 3.5) / hrr);
      }
    }
    const vo2 = runEst.length >= 2 ? 0.5 * uth + 0.5 * median(runEst) : uth;
    const vo2Norm = 41 + sexAdj - 0.35 * (age - 25);
    const vo2Y = clamp(yrs(Math.log(0.87) * ((vo2 - vo2Norm) / 3.5)), -5, 5);
    parts.push({ key: "Cardio fitness", detail: `VO₂max est. ${vo2.toFixed(0)} ml/kg/min${runEst.length >= 2 ? " (heart rate + runs)" : " (heart-rate ratio)"}`,
      value: r1(vo2), target: `${Math.round(vo2Norm + 7)}+`, years: r1(vo2Y),
      tip: vo2 < vo2Norm + 7 ? "Add one 25-minute interval session a week (4 × 4 min hard, 3 min easy)." : "Keep one hard interval session a week to hold your fitness." });

    /* 2. Resting heart rate — HR 1.09 per 10 bpm (Zhang 2016), reference 60 bpm */
    const rhrY = clamp(yrs(Math.log(1.09) * ((rhr - 60) / 10)), -2, 3);
    parts.push({ key: "Resting heart rate", detail: `30-day avg ${rhr.toFixed(0)} bpm`, value: Math.round(rhr), target: "≤ 60", years: r1(rhrY),
      tip: rhr > 60 ? "Build easy aerobic time: 3 × 40 min at conversational pace each week." : "Steady aerobic work keeps resting heart rate low." });

    /* 3. HRV vs age norm — low HRV ~1.38× first CV event (Hillebrand 2013); counted at half (CV, not all-cause) */
    const hrvNorm = hrvNormOf(age);
    if (isNum(hrv)) {
      const hrvY = clamp(yrs(-0.5 * Math.log(1.38) * Math.log2(hrv / hrvNorm)), -2, 2.5);
      parts.push({ key: "Heart rate variability", detail: `30-day avg ${hrv.toFixed(0)} ms (age norm ${hrvNorm.toFixed(0)})`, value: Math.round(hrv), target: `${Math.round(hrvNorm)}+`, years: r1(hrvY),
        tip: hrv < hrvNorm ? "Protect sleep and limit alcohol on weeknights — both lift overnight HRV." : "Keep alcohol and late meals rare to hold HRV high." });
    } else parts.push({ key: "Heart rate variability", detail: "No HRV data", value: null, target: `${Math.round(hrvNorm)}+`, years: 0, tip: "Wear the tracker overnight to record HRV." });

    /* 4. Sleep duration — U-curve (Cappuccio 2010): short < 7 h RR 1.12, long > 9 h RR 1.30 */
    if (asleepA.length) {
      const h = mean(asleepA) / 60;
      let lnHr = 0;
      if (h < 7) lnHr = Math.log(1.12) * Math.min(2, 7 - h);
      else if (h > 8.5) lnHr = Math.log(1.3) * Math.min(2, (h - 8.5) / 0.5);
      else lnHr = -0.05; // in the 7–8.5 h sweet spot: slightly better than the average adult
      const y = clamp(yrs(lnHr), -0.5, 3);
      parts.push({ key: "Sleep duration", detail: `30-day avg ${Math.floor(h)}h ${pad(Math.round((h % 1) * 60))}m asleep`, value: r1(h), target: "7–8.5 h", years: r1(y),
        tip: h < 7 ? `Go to bed ${Math.round((7.25 - h) * 60)} minutes earlier to reach about 7¼ h.` : h > 8.5 ? "Keep a fixed wake time; long sleep is often a sign of poor quality sleep." : "Your sleep length is in the healthy range — keep it." });
    } else parts.push({ key: "Sleep duration", detail: "No sleep data", value: null, target: "7–8.5 h", years: 0, tip: "Wear the tracker to bed to record sleep." });

    /* 5. Sleep regularity — top vs bottom fifth ≈ 30 % lower mortality (Windred 2024); our consistency 55 %→85 % spans that range */
    if (consA.length >= 5) {
      const c = mean(consA);
      const pos = clamp((c - 55) / 30, 0, 1);
      const y = clamp(yrs(Math.log(0.7) * (pos - 0.5)), -2, 2);
      parts.push({ key: "Sleep consistency", detail: `30-day avg overlap ${c.toFixed(0)}%`, value: Math.round(c), target: "80%+", years: r1(y),
        tip: c < 80 ? "Keep bed and wake times within 30 minutes, weekends included." : "Your schedule is steady — hold it on weekends too." });
    } else parts.push({ key: "Sleep consistency", detail: "Needs a week of sleep", value: null, target: "80%+", years: 0, tip: "Track a full week of sleep to score regularity." });

    /* 6. Daily steps — Paluch 2022: ~10,900 vs ~3,550 steps HR 0.47; plateau 8–10k (<60 y) or 6–8k (≥60 y); reference 7,000 */
    const plateau = age >= 60 ? 7000 : 9000;
    const fSteps = (s) => clamp((s - 3500) / (plateau - 3500), 0, 1);
    if (stepsA.length) {
      const s = mean(stepsA);
      const y = clamp(yrs(Math.log(0.47) * (fSteps(s) - fSteps(7000))), -3, 4);
      parts.push({ key: "Daily movement", detail: `${fmtInt(s)} steps/day`, value: Math.round(s), target: `${fmtInt(plateau)}+`, years: r1(y),
        tip: s < plateau ? `Add ${fmtInt(Math.ceil((plateau - s) / 500) * 500)} steps a day — a 15–20 minute walk.` : "You're at the step count where the benefit levels off — keep it." });
    } else parts.push({ key: "Daily movement", detail: "No step data", value: null, target: `${fmtInt(plateau)}+`, years: 0, tip: "Carry or wear the tracker during the day to count steps." });

    /* 7. Exercise minutes — weekly zone 2–3 (moderate) + 2× zone 4–5 (vigorous) vs 150 min guideline (Arem 2015) */
    if (zoneDays.length >= 7) {
      let mod = 0, vig = 0;
      for (const i of zoneDays) {
        const z = dv(i).zones;
        mod += (z[2] || 0) + (z[3] || 0);
        vig += (z[4] || 0) + (z[5] || 0);
      }
      const wk = Math.max(1, zoneDays.length / 7);
      mod /= wk;
      vig /= wk;
      const eq = mod + 2 * vig;
      const ratio = eq / 150;
      // HR vs no activity: 0×→1.00, 0.5×→0.80, 1.5×→0.69, 2.5×→0.63, 4×→0.61 (log-interpolated)
      const pts = [[0, 1], [0.5, 0.8], [1.5, 0.69], [2.5, 0.63], [4, 0.61]];
      const lnHrAt = (x) => {
        x = clamp(x, 0, 4);
        for (let k = 1; k < pts.length; k++) {
          if (x <= pts[k][0]) {
            const t = (x - pts[k - 1][0]) / (pts[k][0] - pts[k - 1][0]);
            return Math.log(pts[k - 1][1]) * (1 - t) + Math.log(pts[k][1]) * t;
          }
        }
        return Math.log(0.61);
      };
      const y = clamp(yrs(lnHrAt(ratio) - lnHrAt(1)), -1.5, 2.5);
      parts.push({ key: "Exercise minutes", detail: `${Math.round(mod)} moderate + ${Math.round(vig)} vigorous min/week`, value: Math.round(eq), target: "150+", years: r1(y),
        tip: eq < 150 ? `Add ${Math.round(150 - eq)} minutes a week of brisk effort (zone 2 or higher).` : eq < 300 ? "Push toward 300 equivalent minutes a week for extra benefit." : "You're well past the guideline — focus on recovery and consistency." });
    } else parts.push({ key: "Exercise minutes", detail: "Needs a week of heart-rate data", value: null, target: "150+", years: 0, tip: "Wear the tracker during workouts to log exercise minutes." });

    /* 8. Strength training — RR 0.83 at ~40 min/week, J-shaped (Momma 2022) */
    let sMin = 0, sN = 0;
    for (const i of idxs) {
      for (const w of dv(i).workouts || days[i].workouts || []) {
        if (STRENGTH_RE.test(w.type || "")) {
          sMin += w.durationMin || 0;
          sN++;
        }
      }
    }
    const sWk = sMin / weeks;
    const nWk = sN / weeks;
    const strengthLn = sWk <= 40 ? Math.log(0.83) * (sWk / 40) : sWk <= 60 ? Math.log(0.83) : Math.log(0.83) * clamp(1 - (sWk - 60) / 100, 0, 1);
    const sY = clamp(yrs(strengthLn), -1.5, 0);
    parts.push({ key: "Strength training", detail: `${nWk.toFixed(1)} sessions · ${Math.round(sWk)} min/week`, value: r1(nWk), target: "2/week", years: r1(sY),
      tip: sWk < 40 ? "Add two 20-minute strength sessions a week (squats, push, pull, carry)." : sWk > 90 ? "More isn't better here — 2–3 sessions a week is plenty." : "Two sessions a week is the sweet spot — keep it." });

    /* 9. Body composition — BMI: nadir 20–25; HR 1.39 per 5 kg/m² above 25 (GBMC 2016) */
    const wts = pick((i) => days[i].weightKg);
    const wKg = wts.length ? wts[0] : isNum(p.weightKg) ? p.weightKg : null; // idxs[0] is the latest day
    const hM = isNum(p.heightCm) && p.heightCm > 100 ? p.heightCm / 100 : null;
    if (isNum(wKg) && hM) {
      const bmi = wKg / (hM * hM);
      const lnHr = bmi > 25 ? Math.log(1.39) * ((bmi - 25) / 5) : bmi < 20 ? Math.log(1.39) * ((20 - bmi) / 5) * 0.8 : 0;
      const bf = pick((i) => days[i].bodyFatPct);
      const y = clamp(yrs(lnHr), 0, 4);
      parts.push({ key: "Body composition", detail: `BMI ${bmi.toFixed(1)}${bf.length ? ` · body fat ${bf[0].toFixed(0)}%` : ""}`, value: r1(bmi), target: "20–25", years: r1(y),
        tip: bmi > 25 ? "Aim for a slow loss of about 0.25 kg a week with more protein and fewer liquid calories." : bmi < 20 ? "Add protein and strength work to build lean mass." : "Your weight is in the lowest-risk range — keep it steady." });
    }

    const delta = r1(clamp(parts.reduce((s, x) => s + x.years, 0), -12, 12));
    const hrvDays = hrvA.length, sleepN = asleepA.length, stepN = stepsA.length;
    const confidence = rhrA.length >= 21 && hrvDays >= 21 && sleepN >= 14 && stepN >= 14 && zoneDays.length >= 14 ? "high"
      : rhrA.length >= 14 && hrvDays >= 10 && sleepN >= 7 ? "medium" : "low";
    return { age: r1(age + delta), chronological: age, delta, parts, vo2: r1(vo2), confidence, coverageDays: rhrA.length };
  }

  function bioAge(days, derived, profileIn, endIdx) {
    const p = { ...DEFAULT_PROFILE, ...(profileIn || {}) };
    if (!Array.isArray(days) || !days.length) return null;
    if (!isNum(endIdx)) endIdx = days.length - 1;
    const now = bioCore(days, derived, p, endIdx);
    if (!now) return null;
    // weekly history (up to 12 weeks back)
    const history = [];
    const endDate = days[endIdx].date;
    for (let w = 12; w >= 1; w--) {
      const target = addDays(endDate, -7 * w);
      let j = -1;
      for (let k = endIdx; k >= 0; k--) if (days[k].date <= target) { j = k; break; }
      if (j < 0 || dayDiff(days[j].date, target) > 3) continue;
      const b = bioCore(days, derived, p, j);

    // pace: least-squares trend of bio age minus calendar age over the whole history (up to 12 weeks),

    let pace = null;
    if (history.length >= 3) {
      const xs = history.map((h) => -dayDiff(h.date, endDate) / 365);

      const mx = mean(xs), my = mean(ys);
      let num = 0, den = 0;
      xs.forEach((x, k) => {
        num += (x - mx) * (ys[k] - my);
        den += (x - mx) ** 2;

      const slope = den > 0 ? num / den : 0;
      pace = r2(clamp(1 + PACE_SHRINK * slope, 0.5, 1.5));

    return {
      age: now.age,
      chronological: now.chronological,
      delta: now.delta,
      pace,
      paceLabel,
      confidence: now.confidence,
      parts: now.parts,
      history: history.map((h) => ({ date: h.date, age: h.age })),
      vo2: now.vo2,
    };
  }

  /* ---------- journal impact: avg next-morning recovery with vs without a tag ---------- */
  function journalImpact(days, derived) {
    const byTag = {};
    const nights = [];
    for (let i = 0; i < days.length - 1; i++) {
      const next = derived[i + 1];
      if (!next || !isNum(next.recovery) || dayDiff(days[i].date, days[i + 1].date) !== 1) continue;
      const tags = (days[i].entry && days[i].entry.journal && days[i].entry.journal.tags) || [];
      nights.push([tags, next.recovery]);
      for (const t of tags) byTag[t] = byTag[t] || { yes: [], no: [] };
    }
    for (const [tags, rec] of nights) for (const t of Object.keys(byTag)) (tags.includes(t) ? byTag[t].yes : byTag[t].no).push(rec);
    const res = [];
    for (const [tag, v] of Object.entries(byTag)) {
      if (v.yes.length >= 3 && v.no.length >= 3) {
        res.push({ tag, n: v.yes.length, diff: mean(v.yes) - mean(v.no), withAvg: mean(v.yes), withoutAvg: mean(v.no) });

    return res.sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));
  }

  /* ---------- energy (Mifflin–St Jeor) ---------- */
  function bmr(p) {
    const q = { ...DEFAULT_PROFILE, ...(p || {}) };
    const s = q.sex === "male" ? 5 : q.sex === "female" ? -161 : -78;
    return Math.round(10 * q.weightKg + 6.25 * q.heightCm - 5 * q.age + s);

  /* ---------- plain-language methods ---------- */
  const METHODS = [
    { title: "Strain (0–21)",
      body: "Strain measures how much load your heart carried today. Each minute is placed in a heart-rate zone using your heart-rate reserve: the gap between your resting and maximum heart rate. Zones 1 to 5 start at 50, 60, 70, 80 and 90 % of that reserve and count 1 to 5 points per minute. Light movement below zone 1 counts a little. The points are summed into a load, and strain = 21 × load ÷ (load + 90). The scale rises fast at first and slowly near the top, so 21 is never reached. A rest day is about 4–9, a 45-minute steady run about 11–14 and a hard two-hour session about 17–19." },

  /* ---------- import validation ---------- */
  const STAGES = new Set(["awake", "light", "deep", "rem"]);
  function cleanHist(h) {
    if (!h || typeof h !== "object") return undefined;
    if (!isNum(h.start) || h.start < 0 || h.start > 100) return undefined;
    if (!isNum(h.bin) || h.bin < 1 || h.bin > 20) return undefined;
    if (!Array.isArray(h.counts) || !h.counts.length || h.counts.length > 400) return undefined;
    if (!h.counts.every((c) => isNum(c) && c >= 0)) return undefined;
    const tot = h.counts.reduce((s, c) => s + c, 0);
    if (tot > 1440 || tot <= 0) return undefined;
    return { start: h.start, bin: h.bin, counts: h.counts.map((c) => Math.round(c * 10) / 10) };
  }
  function cleanDay(raw) {
    if (!raw || typeof raw !== "object" || !/^\d{4}-\d{2}-\d{2}$/.test(raw.date || "")) return null;
    const num = (v, lo, hi) => (isNum(v) && v >= lo && v <= hi ? v : undefined);
    const d = { date: raw.date };
    const fields = {
      steps: [0, 200000], distanceM: [0, 500000], activeKcal: [0, 15000], totalKcal: [0, 20000], floors: [0, 2000],
      restingHr: [25, 140], hrv: [3, 400], spo2: [70, 100], respRate: [4, 40], skinTempDev: [-5, 5],
      weightKg: [20, 400], bodyFatPct: [2, 70],
    };
    for (const [k, [lo, hi]] of Object.entries(fields)) {
      const v = num(raw[k], lo, hi);
      if (v !== undefined) d[k] = v;
    }
    if (Array.isArray(raw.hr)) {
      d.hr = raw.hr
        .filter((x) => Array.isArray(x) && isNum(x[0]) && isNum(x[1]) && x[0] >= 0 && x[0] < 1440 && x[1] >= 25 && x[1] <= 240)
        .map((x) => [Math.round(x[0]), Math.round(x[1])])
        .sort((a, b) => a[0] - b[0]);

    if (hh) d.hrHist = hh;

    }
    if (Array.isArray(raw.naps)) {
      const naps = raw.naps
        .filter((n) => n && typeof n === "object" && !isNaN(Date.parse(n.start)) && !isNaN(Date.parse(n.end)))
        .map((n) => {
          const dur = (Date.parse(n.end) - Date.parse(n.start)) / 60000;
          if (!(dur > 0 && dur < 180)) return null;
          const a = isNum(n.asleepMin) && n.asleepMin >= 0 ? Math.min(n.asleepMin, dur) : dur;

        })
        .filter(Boolean);
      if (naps.length) d.naps = naps;
    }
    if (Array.isArray(raw.workouts)) {
      d.workouts = raw.workouts
        .filter((w) => w && typeof w === "object" && isNum(w.durationMin) && w.durationMin > 0 && w.durationMin < 1440)
        .map((w) => {
          const o = {
            type: String(w.type || "Workout").slice(0, 40),
            start: !isNaN(Date.parse(w.start)) ? w.start : `${raw.date}T12:00:00`,
            durationMin: Math.round(w.durationMin),
          };
          if (w.id != null && (typeof w.id === "string" || isNum(w.id))) o.id = String(w.id).slice(0, 80);
          const opt = { avgHr: num(w.avgHr, 40, 230), maxHr: num(w.maxHr, 40, 240), kcal: num(w.kcal, 0, 10000), distanceM: num(w.distanceM, 0, 500000) };
          for (const [k, v] of Object.entries(opt)) if (v !== undefined) o[k] = v;
          const src = String(w.source || "").slice(0, 60);
          if (src) o.source = src;
          const wh = cleanHist(w.hrHist);
          if (wh) o.hrHist = wh;
          return o;
        });
    }
    return d;
  }

  function parseImport(text) {
    let j;
    try {
      j = JSON.parse(text);
    } catch (e) {
      return { error: "This file isn't valid JSON. Export it again from the Cadence Sync app." };
    }
    if (!j || typeof j !== "object") return { error: "No days found. The file should come from the Cadence Sync app (format cadence.v2)." };
    if (!Array.isArray(j) && typeof j.format === "string" && /^cadence\./.test(j.format) && !/^cadence\.v[12]$/.test(j.format)) {
      return { error: `This file uses format ${j.format.slice(0, 30)}, which this version of Cadence can't read yet.` };
    }
    const list = Array.isArray(j) ? j : Array.isArray(j.days) ? j.days : null;
    if (!list) return { error: "No days found. The file should come from the Cadence Sync app (format cadence.v2)." };
    const seen = new Map();
    for (const raw of list) {
      const d = cleanDay(raw);
      if (d) seen.set(d.date, d); // later duplicates win
    }
    const days = [...seen.values()].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    if (!days.length) return { error: "The file had no usable days." };
    const format = !Array.isArray(j) && typeof j.format === "string" ? j.format : "cadence.v1";
    return { days, profile: !Array.isArray(j) && j.profile && typeof j.profile === "object" ? j.profile : null, source: (!Array.isArray(j) && j.source) || null, format };
  }

  /* ---------- sample data (seeded, deterministic) ---------- */
  function rng(seed) {
    let s = seed >>> 0;
    return () => {

      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

    let n = HIST_N;
    while (n > 1 && counts[n - 1] === 0) n--;
    return { start: HIST_START, bin: HIST_BIN, counts: counts.slice(0, n) };
  }

  function sampleData(endDate, n) {

    let fatigue = 0;
    let lastAlcohol = false;

      ["Overnight oats with berries", "08:10", 420, 18, 62, 11],
      ["Masala omelette, toast", "08:30", 460, 28, 30, 24],
      ["Greek yoghurt, granola", "07:50", 350, 22, 44, 9],
      ["Dal, rice, sabzi", "13:20", 640, 24, 96, 16],
      ["Chicken salad bowl", "13:00", 560, 42, 38, 24],
      ["Paneer wrap", "13:40", 610, 30, 58, 26],
      ["Protein shake, banana", "17:30", 280, 27, 34, 4],
      ["Grilled fish, quinoa, greens", "20:15", 620, 46, 52, 20],

      ["Pasta arrabbiata", "20:45", 720, 22, 118, 16],

          bpm = restingHr - 3 + ar * 0.5 + (m < 180 ? 2 : 0);
        } else {
          if (burst <= 0 && rm() < 0.012) {
            burst = 4 + Math.round(rm() * 14);
            burstAmp = 14 + rm() * 22;
          }
          bpm = restingHr + 15 + Math.sin((m / 1440) * Math.PI * 2 - 1) * 5 + ar + (burst > 0 ? burstAmp : 0);
          if (burst > 0) burst--;
        }
        for (const ww of wWin) {
          if (m >= ww.a && m < ww.b) {
            const x = (m - ww.a) / ww.w.durationMin;
            const warm = Math.min(1, (m - ww.a + 1) / 5);
            const target = ww.w.avgHr + (Math.sin(Math.PI * x) - 0.64) * 12 + (ww.w.type === "HIIT" ? Math.sin(m / 1.5) * 9 : 0);
            bpm = restingHr + 20 + (target - restingHr - 20) * warm + gm() * 3.5;
            ww.bpms.push(Math.round(clamp(bpm, 35, 215)));
          }
        }
        minute.push(Math.round(clamp(bpm, 35, 215)));
      }
      for (const ww of wWin) if (ww.bpms.length) ww.w.hrHist = toHist(ww.bpms);
      // downsampled curve: 5-minute medians
      const hr = [];
      for (let m = 0; m < minute.length; m += 5) hr.push([m, Math.round(median(minute.slice(m, m + 5)))]);
      const hrHist = minute.length ? toHist(minute) : undefined;

      const frac = isToday ? clamp(nowMin / 1320, 0.05, 1) : 1;
      const steps = Math.round((6800 + gauss() * 2200 + (workouts[0] && workouts[0].type === "Running" ? workouts[0].distanceM * 1.3 : 0) + (dow === 0 ? 1500 : 0)) * frac);
      const activeKcal = Math.round(steps * 0.04 + workouts.reduce((s, w) => s + w.kcal, 0));
      const day = {
        date,
        steps: Math.max(300, steps),
        distanceM: Math.round(Math.max(300, steps) * 0.74),
        activeKcal,
        totalKcal: Math.round(1390 * frac + activeKcal),
        floors: Math.max(0, Math.round(8 + gauss() * 4)),
        restingHr,
        hrv,
        spo2: clamp(Math.round((96.8 + gauss() * 0.7) * 10) / 10, 92, 100),
        respRate: Math.round((14.6 + (lastAlcohol ? 0.6 : 0) + gauss() * 0.4) * 10) / 10,
        skinTempDev: Math.round((gauss() * 0.18 + (lastAlcohol ? 0.25 : 0)) * 100) / 100,
        weightKg: Math.round((62.8 - (n - k) * 0.008 + gauss() * 0.25) * 10) / 10,
        hr,
        sleep: { start: startD.toISOString(), end: endD.toISOString(), stages },
        workouts: workouts.map((w) => {
          const o = { ...w };
          if (o.distanceM === undefined) delete o.distanceM;
          return o;
        }),
      };
      if (hrHist) day.hrHist = hrHist;
      if (naps.length) day.naps = naps;
      days.push(day);

      // logged entries: most days, not all
      if (r() < 0.82 && !isToday) {
        const pickM = (lo, hi) => meals[lo + Math.floor(r() * (hi - lo))];
        const ms = [pickM(0, 3), pickM(3, 6), r() < 0.5 ? pickM(6, 7) : null, pickM(7, 10)].filter(Boolean);
        const tags = [];
        if (alcohol) tags.push("Alcohol");
        if (lateMeal) tags.push("Late meal");
        if (r() < 0.3) tags.push("Caffeine after 2 pm");
        if (r() < 0.25) tags.push("Meditation");
        if (r() < 0.35) tags.push("Screens in bed");
        if (dow === 0 && r() < 0.5) tags.push("Stretching");
        if (naps.length) tags.push("Nap");
        entries[date] = {
          meals: ms.map((m, idx) => ({ id: `s${date}${idx}`, name: m[0], time: m[1], kcal: m[2], protein: m[3], carbs: m[4], fat: m[5] })),
          waterMl: Math.round((1800 + r() * 1200) / 250) * 250,
          caffeineMg: [80, 160, 160, 240][Math.floor(r() * 4)],
          journal: { tags, stress, mood: clamp(6 - stress + Math.round(gauss() * 0.6), 1, 5), note: "" },
          workouts: [],
        };
      }
      lastAlcohol = alcohol;
    }
    return { days, entries, profile: { age: 30, sex: "female", heightCm: 165, weightKg: 62.5, maxHr: MAXHR } };
  }

  const api = {
    clamp, mean, median, sd, isNum, ymd, parseYmd, addDays, dayDiff,
    DEFAULT_PROFILE, maxHrOf, sleepStats, computeAll, bioAge, journalImpact, bmr,
    cleanDay, parseImport, sampleData, zoneOf,
    // v2 helpers
    METHODS, histLoad, workoutLoadZones, strainFromLoad, loadForStrain, strainTargetFor, toHist,
