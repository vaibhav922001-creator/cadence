  }

  /* monotone cubic (Fritsch–Carlson) through points sorted by x: smooth, never overshoots the data */
  function monoPath(P, move) {
    const n = P.length;
    if (!n) return "";
    let d = `${move === false ? "L" : "M"}${f1(P[0][0])},${f1(P[0][1])}`;
    if (n === 1) return d;
    if (n === 2) return d + `L${f1(P[1][0])},${f1(P[1][1])}`;
    const dx = [], m = [], t = new Array(n);
    for (let i = 0; i < n - 1; i++) {
      dx[i] = P[i + 1][0] - P[i][0];
      m[i] = dx[i] ? (P[i + 1][1] - P[i][1]) / dx[i] : 0;
    }
    t[0] = m[0];
    t[n - 1] = m[n - 2];
    for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
      const a = t[i] / m[i], b = t[i + 1] / m[i], h = a * a + b * b;
      if (h > 9) { const s = 3 / Math.sqrt(h); t[i] = s * a * m[i]; t[i + 1] = s * b * m[i]; }
    }
    for (let i = 0; i < n - 1; i++) {
      const h = dx[i] / 3;
      d += `C${f1(P[i][0] + h)},${f1(P[i][1] + t[i] * h)} ${f1(P[i + 1][0] - h)},${f1(P[i + 1][1] - t[i + 1] * h)} ${f1(P[i + 1][0])},${f1(P[i + 1][1])}`;
    }
    return d;
  }
  /* "var(--green)" → its -glow token (falls back to a 35 % mix of the colour) */
  function glowOf(color) {
    const m = /^var\(--([\w-]+)\)$/.exec(String(color).trim());
    const mix = `color-mix(in srgb, ${color} 35%, transparent)`;
    return m ? `var(--${m[1]}-glow, ${mix})` : mix;
  }
  /* vertical gradient defs: area (colour → 0) and bar (solid → softer) */
  function areaGrad(id, color, top) {
    return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${esc(color)};stop-opacity:${top == null ? 0.3 : top}"/><stop offset="1" style="stop-color:${esc(color)};stop-opacity:0"/></linearGradient>`;
  }
  function barGrad(id, color) {
    return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${esc(color)};stop-opacity:1"/><stop offset="1" style="stop-color:${esc(color)};stop-opacity:.5"/></linearGradient>`;
  }
  /* emphasised last point: soft halo + solid dot */
  const lastDot = (x, y, color) =>
    `<circle class="ch-halo" cx="${f1(x)}" cy="${f1(y)}" r="10" style="fill:${esc(color)}"/>` +
    `<circle class="ch-dot-last" cx="${f1(x)}" cy="${f1(y)}" r="4.5" style="fill:${esc(color)}"/>`;
  /* rounded-top bar path */
  function barPath(x, base, bw, h, rad) {
    const r = Math.min(rad, bw / 2, h);
    return `M${f1(x)},${f1(base)}V${f1(base - h + r)}Q${f1(x)},${f1(base - h)} ${f1(x + r)},${f1(base - h)}H${f1(x + bw - r)}Q${f1(x + bw)},${f1(base - h)} ${f1(x + bw)},${f1(base - h + r)}V${f1(base)}Z`;
  }

  function xLabels(data, idxs, xAt, W, padT, ph) {
    let s = "";
    for (const i of idxs) {
      const t = String(data[i].label == null ? "" : data[i].label);
      const w = textW(t);
      const x = clamp(xAt(i), w / 2, W - w / 2);
      s += `<text class="ch-t" x="${f1(x)}" y="${f1(padT + ph + 16)}" text-anchor="middle">${esc(t)}</text>`;
    }
    return s;
  }

  function yAxis(ticks, yAt, padL, W, fmt) {
    let s = "";
    for (const t of ticks) {
      const y = f1(yAt(t));
      s += `<line class="ch-grid" x1="${padL}" x2="${W}" y1="${y}" y2="${y}"/>`;
      s += `<text class="ch-t" x="${padL - 7}" y="${f1(y + 3.5)}" text-anchor="end">${esc(fmt(t))}</text>`;
    }
    return s;
  }

  /* crosshair (vertical + faint horizontal) and the hover dot; positioned by bind() */
  const hoverBits = (padT, ph, x0, x1) =>
    `<line class="ch-cursor" x1="-10" x2="-10" y1="${padT}" y2="${padT + ph}"/>` +
    (isNum(x0) && isNum(x1) ? `<line class="ch-cursor-h" x1="${f1(x0)}" x2="${f1(x1)}" y1="-10" y2="-10"/>` : "") +
    `<circle class="ch-hover" r="4.5" cx="-10" cy="-10" style="opacity:0;stroke:var(--bg);stroke-width:2"/>`;

  const svgOpen = (W, H) =>
    `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">`;

  function emptyOut(msg) {
    return { html: `<div class="ch-empty">${esc(msg)}</div>`, hit: null };
  }

  /* ---------------- line ---------------- */
  function drawLine(s, W, H) {
    const data = (s.data || []).map((d) => ({ label: d && d.label, v: d && isNum(d.v) ? d.v : null }));
    const fmt = fmtOf(s);
    const color = s.color || "var(--accent)";
    const vals = data.map((d) => d.v).filter(isNum);
    if (!vals.length) return emptyOut("No data for this range");
    const band = Array.isArray(s.band) && isNum(s.band[0]) && isNum(s.band[1]) ? [Math.min(s.band[0], s.band[1]), Math.max(s.band[0], s.band[1])] : null;
    const ref = s.ref && isNum(s.ref.v) ? s.ref : null;
    let lo = Math.min(...vals);
    let hi = Math.max(...vals);
    if (band) { lo = Math.min(lo, band[0]); hi = Math.max(hi, band[1]); }
    if (ref) { lo = Math.min(lo, ref.v); hi = Math.max(hi, ref.v); }
    const allPos = lo >= 0;
    if (hi === lo) { const p = Math.abs(hi) * 0.1 || 1; lo -= p; hi += p; }
    else { const p = (hi - lo) * 0.08; lo -= p; hi += p; }
    if (allPos && lo < 0) lo = 0;
    const nT = H < 150 ? 3 : 4;
    let T;
    if (isNum(s.yMin) || isNum(s.yMax)) {
      const a = isNum(s.yMin) ? s.yMin : lo;
      const b = isNum(s.yMax) ? s.yMax : hi;
      const nt = niceTicks(a, b, nT);
      T = { lo: a, hi: b > a ? b : a + 1, ticks: nt.ticks.filter((t) => t >= a - 1e-9 && t <= b + 1e-9) };
    } else T = niceTicks(lo, hi, nT);

    const padT = 10, padB = 24, padR = 10;
    const padL = Math.ceil(Math.max(...T.ticks.map((t) => textW(fmt(t))), 16)) + 10;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(10, H - padT - padB);
    const n = data.length;
    const step = n > 1 ? pw / (n - 1) : 0;
    const xAt = (i) => (n > 1 ? padL + i * step : padL + pw / 2);
    const yAt = (v) => padT + ph - ((v - T.lo) / (T.hi - T.lo)) * ph;
    const base = padT + ph;

    let s1 = svgOpen(W, H);
    const id = "cg" + ++gid;
    s1 += `<defs>${areaGrad(id, color, 0.32)}</defs>`;
    s1 += yAxis(T.ticks, yAt, padL, W - padR, fmt);
    if (band) {
      // baseline as a soft ribbon: tinted fill with faint dotted edges
      const y1 = yAt(clamp(band[1], T.lo, T.hi)), y2 = yAt(clamp(band[0], T.lo, T.hi));
      const bh = Math.max(0, y2 - y1);
      s1 += `<rect class="ch-band" x="${padL}" y="${f1(y1)}" width="${f1(pw)}" height="${f1(bh)}" rx="${f1(Math.min(6, bh / 2))}" style="fill:${esc(color)};fill-opacity:.08"/>`;
      s1 += `<line class="ch-band-edge" x1="${padL}" x2="${f1(padL + pw)}" y1="${f1(y1)}" y2="${f1(y1)}" style="stroke:${esc(color)}"/>`;
      s1 += `<line class="ch-band-edge" x1="${padL}" x2="${f1(padL + pw)}" y1="${f1(y2)}" y2="${f1(y2)}" style="stroke:${esc(color)}"/>`;
    }
    // segments
    const segs = [];
    let cur = null;
    data.forEach((d, i) => {
      if (isNum(d.v)) { if (!cur) segs.push((cur = [])); cur.push(i); }
      else cur = null;
    });
    for (const sg of segs) {
      const P = sg.map((i) => [xAt(i), yAt(data[i].v)]);
      if (sg.length === 1) {
        s1 += `<circle cx="${f1(P[0][0])}" cy="${f1(P[0][1])}" r="2.5" style="fill:${esc(color)}"/>`;
        continue;
      }
      const curve = monoPath(P);
      if (s.area !== false) {
        s1 += `<path d="${curve}L${f1(P[P.length - 1][0])},${base}L${f1(P[0][0])},${base}Z" style="fill:url(#${id})"/>`;
      }
      s1 += `<path d="${curve}" fill="none" style="stroke:${esc(color)}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    if (ref) {
      const y = f1(yAt(clamp(ref.v, T.lo, T.hi)));
      s1 += `<line class="ch-ref" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
      if (ref.label) s1 += `<text class="ch-t" x="${W - padR}" y="${f1(y - 5)}" text-anchor="end">${esc(ref.label)}</text>`;
    }
    s1 += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"/>`;
    // emphasized last point
    let last = -1;
    for (let i = n - 1; i >= 0; i--) if (isNum(data[i].v)) { last = i; break; }
    if (last >= 0) s1 += lastDot(xAt(last), yAt(data[last].v), color);
    const maxLW = Math.max(...data.map((d) => textW(d.label == null ? "" : d.label)), 10);
    s1 += xLabels(data, labelIdx(n, pw, maxLW), xAt, W, padT, ph);
    s1 += hoverBits(padT, ph, padL, W - padR) + "</svg>";

    const hit = (x) => {
      if (x < padL - 12 || x > W) return null;
      const i = n > 1 ? clamp(Math.round((x - padL) / step), 0, n - 1) : 0;
      const d = data[i];
      const lab = d.label == null ? "" : esc(d.label);
      if (!isNum(d.v)) return { x: xAt(i), y: padT + ph / 2, html: `${lab} · <span>No data</span>` };
      return { x: xAt(i), y: yAt(d.v), dot: color, html: `<b>${esc(fmt(d.v))}</b>${lab ? " · " + lab : ""}` };
    };
    return { html: s1, hit };
  }

  /* ---------------- bars ---------------- */
  function drawBars(s, W, H) {
    const data = (s.data || []).map((d) => ({ label: d && d.label, v: d && isNum(d.v) ? d.v : null, color: d && d.color }));
    const fmt = fmtOf(s);
    const color = s.color || "var(--accent)";
    const vals = data.map((d) => d.v).filter(isNum);
    if (!data.length) return emptyOut("No data for this range");
    const ref = s.ref && isNum(s.ref.v) ? s.ref : null;
    const nT = H < 150 ? 3 : 4;
    let T;
    if (isNum(s.max) && s.max > 0) {
      const nt = niceTicks(0, s.max, nT);
      T = { lo: 0, hi: s.max, ticks: nt.ticks.filter((t) => t <= s.max + 1e-9) };
    } else {
      let hi = Math.max(0, ...vals, ref ? ref.v : 0);
      if (hi <= 0) hi = 1;
      T = niceTicks(0, hi * 1.04, nT);
    }
    const padT = 10, padB = 24, padR = 6;
    const padL = Math.ceil(Math.max(...T.ticks.map((t) => textW(fmt(t))), 16)) + 10;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(10, H - padT - padB);
    const n = data.length;
    const step = pw / n;
    const bw = Math.max(1, Math.min(step * 0.68, 30));
    const xAt = (i) => padL + step * (i + 0.5);
    const yAt = (v) => padT + ph - (clamp(v, T.lo, T.hi) / (T.hi - T.lo)) * ph;
    const base = padT + ph;

    let s1 = svgOpen(W, H);
    // one vertical gradient per distinct bar colour
    const grads = new Map();
    const gradFor = (c) => {
      if (!grads.has(c)) grads.set(c, "cb" + ++gid);
      return grads.get(c);
    };
    let bars = "";
    let lastI = -1;
    data.forEach((d, i) => { if (isNum(d.v) && d.v > 0) lastI = i; });
    data.forEach((d, i) => {
      if (!isNum(d.v) || d.v <= 0) return;
      const y = yAt(d.v);
      const h = Math.max(1, base - y);
      const x = xAt(i) - bw / 2;
      const c = d.color || color;
      bars += `<path d="${barPath(x, base, bw, h, 4)}" style="fill:url(#${gradFor(c)})${i === lastI || n <= 1 ? "" : ";fill-opacity:.82"}"/>`;
    });
    s1 += `<defs>${[...grads].map(([c, gidc]) => barGrad(gidc, c)).join("")}</defs>`;
    s1 += yAxis(T.ticks, yAt, padL, W - padR, fmt);
    s1 += bars;
    if (ref) {
      const y = f1(yAt(ref.v));
      s1 += `<line class="ch-ref" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
      if (ref.label) s1 += `<text class="ch-t" x="${W - padR}" y="${f1(y - 5)}" text-anchor="end">${esc(ref.label)}</text>`;
    }
    s1 += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"/>`;
    const maxLW = Math.max(...data.map((d) => textW(d.label == null ? "" : d.label)), 10);
    s1 += xLabels(data, labelIdx(n, pw, maxLW), xAt, W, padT, ph);
    s1 += hoverBits(padT, ph, padL, W - padR) + "</svg>";

    const hit = (x) => {
      if (x < padL || x > W) return null;
      const i = clamp(Math.floor((x - padL) / step), 0, n - 1);
      const d = data[i];
      const lab = d.label == null ? "" : esc(d.label);
      if (!isNum(d.v)) return { x: xAt(i), y: base - 10, html: `${lab} · No data` };
      return { x: xAt(i), y: yAt(d.v), dot: d.color || color, html: `<b>${esc(fmt(d.v))}</b>${lab ? " · " + lab : ""}` };
    };
    return { html: s1, hit };
  }

  /* ---------------- hypnogram ---------------- */
  const ROWS = [
    ["awake", "Awake"],
    ["rem", "REM"],
    ["light", "Light"],
    ["deep", "Deep"],
  ];
  function drawHypno(s, W, H) {
    const sl = s.sleep;
    if (!sl || !Array.isArray(sl.stages) || !sl.stages.length) return emptyOut("No sleep recorded");
    const stages = sl.stages.filter((x) => Array.isArray(x) && isNum(x[1]) && isNum(x[2]) && x[2] > x[1]).slice().sort((a, b) => a[1] - b[1]);
    if (!stages.length) return emptyOut("No sleep recorded");
    const total = Math.max(...stages.map((x) => x[2]));
    const st = new Date(sl.start);
    const startMin = isNaN(st) ? 0 : st.getHours() * 60 + st.getMinutes() + st.getSeconds() / 60;
    const padT = 6, padB = 24, padR = 8, padL = 50;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(40, H - padT - padB);
    const rh = ph / ROWS.length;
    const rowOf = {};
    ROWS.forEach(([k], i) => (rowOf[k] = i));
    const xAt = (m) => padL + (m / total) * pw;
    const yMid = (k) => padT + rh * (rowOf[k] + 0.5);

    let s1 = svgOpen(W, H);
    ROWS.forEach(([k, lab], i) => {
      const y = padT + rh * i;
      s1 += `<rect x="${padL}" y="${f1(y + 1)}" width="${f1(pw)}" height="${f1(rh - 2)}" rx="3" style="fill:var(--surface-2)"/>`;
      s1 += `<text class="ch-t" x="0" y="${f1(y + rh / 2 + 4)}">${lab}</text>`;
    });
    // connectors (step outline)
    let path = "";
    for (let i = 0; i < stages.length - 1; i++) {
      const a = stages[i], b = stages[i + 1];
      if (rowOf[a[0]] === undefined || rowOf[b[0]] === undefined) continue;
      if (Math.abs(b[1] - a[2]) > 1) continue;
      const x = f1(xAt(a[2]));
      path += `M${x},${f1(yMid(a[0]))}V${f1(yMid(b[0]))}`;
    }
    if (path) s1 += `<path d="${path}" fill="none" style="stroke:var(--muted)" stroke-opacity=".35" stroke-width="1"/>`;
    for (const [k, a, b] of stages) {
      if (rowOf[k] === undefined) continue;
      const y = padT + rh * rowOf[k] + rh * 0.16;
      const w = Math.max(1, xAt(b) - xAt(a));
      s1 += `<rect x="${f1(xAt(a))}" y="${f1(y)}" width="${f1(w)}" height="${f1(rh * 0.68)}" rx="${Math.min(2, w / 2)}" style="fill:var(--st-${k})"/>`;
    }
    // hour ticks
    const hourW = (pw / total) * 60;
    const every = [1, 2, 3, 4].find((h) => hourW * h >= 54) || 4;
    const first = (60 - (startMin % 60)) % 60;
    const base = padT + ph;
    for (let m = first; m <= total; m += 60) {
      const hourAbs = Math.round((startMin + m) / 60);
      if (hourAbs % every) continue;
      const x = xAt(m);
      s1 += `<line class="ch-axis" x1="${f1(x)}" x2="${f1(x)}" y1="${base}" y2="${base + 4}"/>`;
      const t = clk(startMin + m);
      const w = textW(t);
      s1 += `<text class="ch-t" x="${f1(clamp(x, padL + w / 2, W - w / 2))}" y="${base + 16}" text-anchor="middle">${t}</text>`;
    }
    s1 += `<line class="ch-cursor" x1="-10" x2="-10" y1="${padT}" y2="${base}"/>` + `</svg>`;

    const label = Object.fromEntries(ROWS);
    const hit = (x) => {
      if (x < padL || x > padL + pw) return null;
      const m = ((x - padL) / pw) * total;
      const sg = stages.find((g) => m >= g[1] && m < g[2]) || stages[stages.length - 1];
      return {
        x,
        y: yMid(sg[0]) - rh * 0.3,
        html: `<b>${esc(label[sg[0]] || sg[0])}</b> · ${clk(startMin + sg[1])}–${clk(startMin + sg[2])} (${dur(sg[2] - sg[1])})`,
      };
    };
    return { html: s1, hit };
  }

  /* ---------------- intraday heart rate ---------------- */
  function midnightOf(date) {
    if (typeof date === "string" && /^\d{4}-\d{2}-\d{2}/.test(date)) {
      const [y, m, d] = date.slice(0, 10).split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    const d = date instanceof Date ? new Date(date) : new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function drawHrday(s, W, H) {
    const hr = (s.hr || []).filter((p) => Array.isArray(p) && isNum(p[0]) && isNum(p[1])).slice().sort((a, b) => a[0] - b[0]);
    if (!hr.length) return emptyOut("No heart rate data for this day");
    const mid = midnightOf(s.date);
    const color = s.color || "var(--red)";
    const bpms = hr.map((p) => p[1]);
    const T = niceTicks(Math.min(...bpms) - 4, Math.max(...bpms) + 4, H < 160 ? 3 : 4);
    const padT = 18, padB = 24, padR = 8;
    const padL = Math.ceil(Math.max(...T.ticks.map((t) => textW(String(t))))) + 10;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(20, H - padT - padB);
    const xAt = (m) => padL + (clamp(m, 0, 1440) / 1440) * pw;
    const yAt = (v) => padT + ph - ((v - T.lo) / (T.hi - T.lo)) * ph;
    const base = padT + ph;
    const minsOf = (iso) => {
      const t = new Date(iso);
      return isNaN(t) ? null : (t - mid) / 60000;
    };

    let s1 = svgOpen(W, H);
    s1 += yAxis(T.ticks, yAt, padL, W - padR, String);
    const spans = [];
    const shade = (a, b, fill, op, lab) => {
      if (!isNum(a) || !isNum(b)) return;
      const x0 = xAt(Math.max(0, a)), x1 = xAt(Math.min(1440, b));
      if (x1 - x0 < 0.5) return;
      s1 += `<rect x="${f1(x0)}" y="${padT}" width="${f1(x1 - x0)}" height="${f1(ph)}" style="fill:${fill};fill-opacity:${op}"/>`;
      if (lab && x1 - x0 >= textW(lab) + 4) s1 += `<text class="ch-t" x="${f1(x0 + 2)}" y="${padT - 5}" style="fill:${fill}">${esc(lab)}</text>`;
    };
    if (s.sleep && s.sleep.start && s.sleep.end) {
      const a = minsOf(s.sleep.start), b = minsOf(s.sleep.end);
      shade(a, b, "var(--sleep)", 0.12, "Sleep");
      if (isNum(a) && isNum(b)) spans.push([a, b, "Sleep"]);
    }
    for (const w of s.workouts || []) {
      if (!w) continue;
      const a = minsOf(w.start);
      if (!isNum(a)) continue;
      const b = a + (w.durationMin || 0);
      shade(a, b, "var(--strain)", 0.16, w.type || "Workout");
      spans.push([a, b, w.type || "Workout"]);
    }
    // split at gaps > 40 min, smooth each run, gradient area under it
    const runs = [];
    let run = null;
    for (let i = 0; i < hr.length; i++) {
      if (i === 0 || hr[i][0] - hr[i - 1][0] > 40) runs.push((run = []));
      run.push([xAt(hr[i][0]), yAt(hr[i][1])]);
    }
    const gA = "ch" + ++gid;
    s1 += `<defs>${areaGrad(gA, color, 0.26)}</defs>`;
    let area = "", stroke = "";
    for (const P of runs) {
      const c = monoPath(P);
      stroke += c;
      if (P.length > 1) area += `${c}L${f1(P[P.length - 1][0])},${base}L${f1(P[0][0])},${base}Z`;
    }
    if (area) s1 += `<path d="${area}" style="fill:url(#${gA})"/>`;
    s1 += `<path d="${stroke}" fill="none" style="stroke:${esc(color)}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lp = hr[hr.length - 1];
    s1 += lastDot(xAt(lp[0]), yAt(lp[1]), color);
    s1 += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"/>`;
    const every = pw >= 440 ? 180 : 360;
    for (let m = 0; m <= 1440; m += every) {
      const x = xAt(m);
      const t = m === 720 ? "noon" : clk(m);
      const w = textW(t);
      s1 += `<line class="ch-axis" x1="${f1(x)}" x2="${f1(x)}" y1="${base}" y2="${base + 4}"/>`;
      s1 += `<text class="ch-t" x="${f1(clamp(x, padL + w / 2 - 4, W - w / 2))}" y="${base + 16}" text-anchor="middle">${t}</text>`;
    }
    s1 += hoverBits(padT, ph, padL, W - padR) + "</svg>";

    const hit = (x) => {
      if (x < padL || x > padL + pw) return null;
      const m = ((x - padL) / pw) * 1440;
      let lo = 0, hi = hr.length - 1;
      while (hi - lo > 1) {
        const c = (lo + hi) >> 1;
        if (hr[c][0] < m) lo = c; else hi = c;
      }
      const p = Math.abs(hr[lo][0] - m) <= Math.abs(hr[hi][0] - m) ? hr[lo] : hr[hi];
      const sp = spans.find((z) => p[0] >= z[0] && p[0] < z[1]);
      return {
        x: xAt(p[0]),
        y: yAt(p[1]),
        dot: color,
        html: `<b>${p[1]} bpm</b> · ${clk(p[0])}${sp ? " · " + esc(sp[2]) : ""}`,
      };
    };
    return { html: s1, hit };
  }

  /* ---------------- bedtime → wake range ---------------- */
  function drawRange(s, W, H) {
    const data = (s.data || []).map((d) => ({
      label: d && d.label,
      start: d && isNum(d.start) ? d.start : null,
      end: d && isNum(d.end) ? d.end : null,
    }));
    const ok = data.filter((d) => isNum(d.start) && isNum(d.end));
    if (!ok.length) return emptyOut("No sleep recorded in this range");
    const color = s.color || "var(--sleep)";
    const lo0 = Math.min(...ok.map((d) => d.start)) - 20;
    const hi0 = Math.max(...ok.map((d) => d.end)) + 20;
    const lo = Math.floor(lo0 / 60) * 60;
    const hi = Math.ceil(hi0 / 60) * 60;
    const padT = 8, padB = 24, padR = 6;
    const padL = Math.ceil(textW("10:00 pm")) - 6;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(20, H - padT - padB);
    const yAt = (m) => padT + ((m - lo) / (hi - lo)) * ph;
    const n = data.length;
    const step = pw / n;
    const bw = Math.max(2, Math.min(step * 0.56, 20));
    const xAt = (i) => padL + step * (i + 0.5);
    const hourPx = (ph / (hi - lo)) * 60;
    const every = ([1, 2, 3, 4].find((h) => hourPx * h >= 24) || 4) * 60;

    let s1 = svgOpen(W, H);
    const gR = "cr" + ++gid;
    s1 += `<defs><linearGradient id="${gR}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${esc(color)};stop-opacity:.55"/><stop offset="1" style="stop-color:${esc(color)};stop-opacity:1"/></linearGradient></defs>`;
    for (let m = lo; m <= hi; m += 60) {
      if (((m % every) + every) % every) continue;
      const y = f1(yAt(m));
      s1 += `<line class="ch-grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
      s1 += `<text class="ch-t" x="${padL - 7}" y="${f1(+y + 3.5)}" text-anchor="end">${clk(m)}</text>`;
    }
    data.forEach((d, i) => {
      if (!isNum(d.start) || !isNum(d.end) || d.end <= d.start) return;
      const y0 = yAt(d.start), y1 = yAt(d.end);
      s1 += `<rect x="${f1(xAt(i) - bw / 2)}" y="${f1(y0)}" width="${f1(bw)}" height="${f1(Math.max(1, y1 - y0))}" rx="${f1(Math.min(bw / 2, 5))}" style="fill:url(#${gR})"/>`;
    });
    const maxLW = Math.max(...data.map((d) => textW(d.label == null ? "" : d.label)), 10);
    s1 += xLabels(data, labelIdx(n, pw, maxLW), xAt, W, padT, ph);
    s1 += hoverBits(padT, ph) + "</svg>";

    const hit = (x) => {
      if (x < padL || x > W) return null;
      const i = clamp(Math.floor((x - padL) / step), 0, n - 1);
      const d = data[i];
      const lab = d.label == null ? "" : esc(d.label);
      if (!isNum(d.start) || !isNum(d.end)) return { x: xAt(i), y: padT + ph / 2, html: `${lab} · No sleep` };
      return { x: xAt(i), y: yAt(d.start), html: `<b>${lab}</b> · ${clk(d.start)} → ${clk(d.end)} (${dur(d.end - d.start)})` };
    };
    return { html: s1, hit };
  }

  /* ---------------- strain line over recovery bars ---------------- */
  function drawStrainline(s, W, H) {
    const data = (s.data || []).map((d) => ({
      label: d && d.label,
      strain: d && isNum(d.strain) ? d.strain : d && isNum(d.v) ? d.v : null,
      recovery: d && isNum(d.recovery) ? d.recovery : null,
      band: d && typeof d.band === "string" ? d.band : null,
      color: d && typeof d.color === "string" && d.color ? d.color : null,
    }));
    if (!data.some((d) => isNum(d.strain) || isNum(d.recovery))) return emptyOut("No data for this range");
    const BAND = { green: "var(--green)", yellow: "var(--yellow)", red: "var(--red)" };
    const recCol = (v) => (v >= 67 ? "var(--green)" : v >= 34 ? "var(--yellow)" : "var(--red)");
    const barCol = (d) => d.color || BAND[d.band] || recCol(d.recovery);
    const legH = 22;
    const padT = 8 + legH, padB = 24;
    const padL = Math.ceil(textW("21")) + 10;
    const padR = Math.ceil(textW("100%")) + 8;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(20, H - padT - padB);
    const n = data.length;
    const step = pw / n;
    const bw = Math.max(1.5, Math.min(step * 0.6, 22));
    const xAt = (i) => padL + step * (i + 0.5);
    const yS = (v) => padT + ph - (clamp(v, 0, 21) / 21) * ph;
    const yR = (v) => padT + ph - (clamp(v, 0, 100) / 100) * ph;
    const base = padT + ph;

    let s1 = svgOpen(W, H);
    // legend
    s1 += `<g class="ch-leg">` +
      `<line x1="0" x2="16" y1="9" y2="9" style="stroke:var(--strain)" stroke-width="2.5" stroke-linecap="round"/>` +
      `<text class="ch-t strong" x="22" y="12.5">Strain 0–21</text>` +
      `<rect x="${f1(22 + textW("Strain 0–21") + 12)}" y="3" width="10" height="12" rx="2" style="fill:var(--muted);fill-opacity:.55"/>` +
      `<text class="ch-t strong" x="${f1(22 + textW("Strain 0–21") + 28)}" y="12.5">Recovery %</text></g>`;
    for (const t of [0, 7, 14, 21]) {
      const y = f1(yS(t));
      s1 += `<line class="ch-grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
      s1 += `<text class="ch-t" x="${padL - 7}" y="${f1(+y + 3.5)}" text-anchor="end" style="fill:var(--strain)">${t}</text>`;
      const rv = Math.round((t / 21) * 100);
      s1 += `<text class="ch-t" x="${W - padR + 7}" y="${f1(+y + 3.5)}">${rv}%</text>`;
    }
    data.forEach((d, i) => {
      if (!isNum(d.recovery) || d.recovery <= 0) return;
      const y = yR(d.recovery);
      const h = Math.max(1, base - y);
      const r = Math.min(3, bw / 2, h);
      const x = xAt(i) - bw / 2;
      s1 += `<path d="M${f1(x)},${f1(base)}V${f1(base - h + r)}Q${f1(x)},${f1(base - h)} ${f1(x + r)},${f1(base - h)}H${f1(x + bw - r)}Q${f1(x + bw)},${f1(base - h)} ${f1(x + bw)},${f1(base - h + r)}V${f1(base)}Z" style="fill:${esc(barCol(d))};fill-opacity:.32"/>`;
    });
    const runs = [];
    let run = null;
    data.forEach((d, i) => {
      if (!isNum(d.strain)) { run = null; return; }
      if (!run) runs.push((run = []));
      run.push([xAt(i), yS(d.strain)]);
    });
    const path = runs.map((P) => monoPath(P)).join("");
    if (path) s1 += `<path d="${path}" fill="none" style="stroke:var(--strain)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    let lastS = -1;
    data.forEach((d, i) => { if (isNum(d.strain)) lastS = i; });
    if (n <= 31) data.forEach((d, i) => {
      if (isNum(d.strain) && i !== lastS) s1 += `<circle cx="${f1(xAt(i))}" cy="${f1(yS(d.strain))}" r="${n <= 14 ? 3.2 : 2}" style="fill:var(--strain);stroke:var(--bg);stroke-width:1.5"/>`;
    });
    if (lastS >= 0) s1 += lastDot(xAt(lastS), yS(data[lastS].strain), "var(--strain)");
    s1 += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"/>`;
    const maxLW = Math.max(...data.map((d) => textW(d.label == null ? "" : d.label)), 10);
    s1 += xLabels(data, labelIdx(n, pw, maxLW), xAt, W, padT, ph);
    s1 += hoverBits(padT, ph, padL, W - padR) + "</svg>";

    const hit = (x) => {
      if (x < padL || x > W - padR + 4) return null;
      const i = clamp(Math.floor((x - padL) / step), 0, n - 1);
      const d = data[i];
      const lab = d.label == null ? "" : esc(d.label);
      const sv = isNum(d.strain) ? (Math.round(d.strain * 10) / 10).toFixed(1) : "–";
      const rv = isNum(d.recovery) ? Math.round(d.recovery) + "%" : "–";
      return {
        x: xAt(i),
        y: isNum(d.strain) ? yS(d.strain) : padT + ph / 2,
        dot: isNum(d.strain) ? "var(--strain)" : null,
        html: `${lab ? lab + " · " : ""}Strain <b>${sv}</b> · Recovery <b>${rv}</b>`,
      };
    };
    return { html: s1, hit };
  }

  /* ---------------- 0–21 horizontal gauge with target zone ---------------- */
  function drawGauge21(s, W, H) {
    const v = isNum(s.value) ? clamp(s.value, 0, 21) : null;
    const tg = Array.isArray(s.target) && isNum(s.target[0]) && isNum(s.target[1]) ? [clamp(Math.min(s.target[0], s.target[1]), 0, 21), clamp(Math.max(s.target[0], s.target[1]), 0, 21)] : null;
    const color = s.color || "var(--strain)";
    const padL = 8, padR = 8;
    const pw = Math.max(10, W - padL - padR);
    const xAt = (x) => padL + (x / 21) * pw;
    const barH = 10;
    const barY = Math.max(22, Math.round(H / 2 - barH / 2) - 2);
    let s1 = svgOpen(W, H);
    const gG = "cq" + ++gid;
    s1 += `<defs><linearGradient id="${gG}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:color-mix(in srgb, ${esc(color)} 55%, var(--bg))"/><stop offset="1" style="stop-color:${esc(color)}"/></linearGradient></defs>`;
    s1 += `<rect x="${padL}" y="${barY}" width="${f1(pw)}" height="${barH}" rx="${barH / 2}" style="fill:var(--surface-3)"/>`;
    if (tg && tg[1] > tg[0]) {
      const x0 = xAt(tg[0]), x1 = xAt(tg[1]);
      s1 += `<rect x="${f1(x0)}" y="${barY - 3}" width="${f1(x1 - x0)}" height="${barH + 6}" rx="3" style="fill:${esc(color)};fill-opacity:.2;stroke:${esc(color)};stroke-opacity:.6" stroke-width="1" stroke-dasharray="3 2"/>`;
      const lab = `Target ${f1(tg[0])}–${f1(tg[1])}`;
      const w = textW(lab);
      s1 += `<text class="ch-t strong" x="${f1(clamp((x0 + x1) / 2, w / 2, W - w / 2))}" y="${barY - 9}" text-anchor="middle">${esc(lab)}</text>`;
    }
    if (v != null && v > 0) s1 += `<rect x="${padL}" y="${barY}" width="${f1(Math.max(barH, xAt(v) - padL))}" height="${barH}" rx="${barH / 2}" style="fill:url(#${gG});filter:drop-shadow(0 0 6px ${glowOf(color)})"/>`;
    if (v != null) {
      const x = xAt(v);
      s1 += `<line x1="${f1(x)}" x2="${f1(x)}" y1="${barY - 6}" y2="${barY + barH + 6}" style="stroke:var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
    }
    for (const t of [0, 7, 14, 21]) {
      const x = xAt(t);
      const a = t === 0 ? "start" : t === 21 ? "end" : "middle";
      s1 += `<text class="ch-t" x="${f1(x)}" y="${barY + barH + 18}" text-anchor="${a}">${t}</text>`;
    }
    s1 += "</svg>";
    return { html: s1, hit: null };
  }

  /* ---------------- horizontal bars (HTML, no measuring needed) ---------------- */
  function hbars(s) {
    const data = (s.data || []).filter(Boolean);
    const max = isNum(s.max) && s.max > 0 ? s.max : Math.max(1e-9, ...data.map((d) => (isNum(d.v) ? d.v : 0)));
    if (!data.length) return `<div class="chart chart-hb"><div class="ch-empty" style="height:64px">No data</div></div>`;
    const rows = data
      .map((d) => {
        const p = isNum(d.v) && max > 0 ? clamp((d.v / max) * 100, 0, 100) : 0;
        const c = d.color || s.color || "var(--accent)";
        const disp = d.display != null ? d.display : defFmt(d.v);
        return `<div class="hb-row"><span class="hb-l">${esc(d.label)}</span><span class="hb-t"><span class="hb-f" style="width:${p.toFixed(1)}%;--c:${esc(c)}"></span></span><span class="hb-v">${esc(disp)}</span></div>`;
      })
      .join("");
    return `<div class="chart chart-hb"><div class="hb">${rows}</div></div>`;
  }

  /* ---------------- ring gauge ---------------- */
  /* number text → "<span data-count>62</span>%" so count-up only touches the digits */
  function countable(txt, enabled) {
    const m = enabled ? /^([+−-]?)(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?(.*)$/.exec(txt) : null;
    if (!m) return esc(txt);
    const neg = m[1] === "-" || m[1] === "−";
    const intPart = m[2].replace(/,/g, "");
    const dp = m[3] ? m[3].length : 0;
    const val = Number(intPart + (dp ? "." + m[3] : "")) * (neg ? -1 : 1);
    if (!isFinite(val)) return esc(txt);
    const fmtAttr = m[2].includes(",") ? ' data-format="comma"' : "";
    const lead = m[1] === "+" ? esc(m[1]) : "";
    const numTxt = (neg ? m[1] : "") + m[2] + (dp ? "." + m[3] : "");
    return `${lead}<span class="cnt" data-count="${val}" data-dp="${dp}"${fmtAttr}>${esc(numTxt)}</span>${esc(m[4])}`;
  }

  /* the signature dial: 270° thick arc, rounded caps, 2-stop gradient of its hue, soft glow, 10 % ticks.
     The value arc carries stroke-dasharray = its length, stroke-dashoffset = data-arc = 0 (final state), so it is
     correct without script; Charts.animate() sweeps it from empty on first paint. */
  function dial(o) {
    const max = isNum(o.max) && o.max > 0 ? o.max : 100;
    const size = isNum(o.size) && o.size > 40 ? o.size : 156;
    const color = o.color || "var(--accent)";
    const has = isNum(o.value);
    const frac = has ? clamp(o.value / max, 0, 1) : 0;
    const sw = Math.max(8, Math.round(size * 0.13));
    const r = (size - sw) / 2 - 1;
    const cx = size / 2;
    const SWEEP = 270;
    const a0 = 135; // degrees from +x axis, clockwise (SVG); gap centred at bottom
    const pt = (deg, rr) => {
      const t = (deg * Math.PI) / 180;
      return [cx + (rr || r) * Math.cos(t), cx + (rr || r) * Math.sin(t)];
    };
    const arcPath = (from, to) => {
      const [x0, y0] = pt(from), [x1, y1] = pt(to);
      const large = to - from > 180 ? 1 : 0;
      return `M${f1(x0)},${f1(y0)}A${f1(r)},${f1(r)} 0 ${large} 1 ${f1(x1)},${f1(y1)}`;
    };
    const txt = o.display != null && o.display !== "" ? String(o.display) : has ? String(Math.round(o.value)) : "–";
    const unit = o.unit ? String(o.unit) : "";
    const len = txt.length + (unit ? unit.length * 0.5 : 0);
    const ratio = len > 5 ? 0.2 : len > 4 ? 0.24 : 0.29;
    const fs = Math.round(size * ratio);
    const k = ++gid;
    const gId = "dg" + k, fId = "df" + k;
    let defs =
      `<linearGradient id="${gId}" gradientUnits="userSpaceOnUse" x1="0" y1="${size}" x2="${size}" y2="0">` +
      `<stop offset="0" style="stop-color:color-mix(in srgb, ${esc(color)} 58%, #ffffff)"/><stop offset="1" style="stop-color:${esc(color)}"/></linearGradient>`;
    let arc = "";
    if (has && frac > 0) {
      const d = arcPath(a0, a0 + Math.max(0.5, SWEEP * frac));
      defs += `<filter id="${fId}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="${f1(sw * 0.42)}"/></filter>`;
      const dash = `pathLength="100" stroke-dasharray="100 200" stroke-dashoffset="0" data-arc="0"`;
      arc =
        `<path class="dial-glow" d="${d}" fill="none" stroke-width="${sw}" stroke-linecap="round" ${dash} filter="url(#${fId})" style="stroke:${esc(glowOf(color))}"/>` +
        `<path class="ring-arc dial-arc" d="${d}" fill="none" stroke-width="${sw}" stroke-linecap="round" ${dash} style="stroke:url(#${gId})"/>`;
    }
    // faint tick marks every 10 % just inside the track
    let ticks = "";
    const r1 = r - sw / 2 - Math.max(3, size * 0.03);
    for (let i = 0; i <= 10; i++) {
      const deg = a0 + SWEEP * (i / 10);
      const major = i % 5 === 0;
      const r2 = r1 - Math.max(2, size * (major ? 0.045 : 0.028));
      const [xa, ya] = pt(deg, r1), [xb, yb] = pt(deg, r2);
      ticks += `<line class="dial-tick" x1="${f1(xa)}" y1="${f1(ya)}" x2="${f1(xb)}" y2="${f1(yb)}" stroke-width="${major ? 1.5 : 1}" stroke-linecap="round"${major ? ' style="stroke-opacity:.28"' : ""}/>`;
    }
    // optional target zone on the track (e.g. strain target)
    let zone = "";
    if (Array.isArray(o.target) && isNum(o.target[0]) && isNum(o.target[1])) {
      const z0 = a0 + SWEEP * clamp(o.target[0] / max, 0, 1), z1 = a0 + SWEEP * clamp(o.target[1] / max, 0, 1);
      if (z1 > z0) {
        const rz = r + sw / 2 + Math.max(3, size * 0.025);
        const [x0, y0] = pt(z0, rz), [x1, y1] = pt(z1, rz);
        zone = `<path class="dial-zone" d="M${f1(x0)},${f1(y0)}A${f1(rz)},${f1(rz)} 0 ${z1 - z0 > 180 ? 1 : 0} 1 ${f1(x1)},${f1(y1)}" fill="none" stroke-width="${Math.max(2, Math.round(sw * 0.22))}" stroke-linecap="round"/>`;
      }
    }
    const aria = o.aria || `${o.label ? o.label + " " : ""}${txt}${unit ? " " + unit : ""}${has && max !== 100 && o.display == null && !unit ? " of " + max : ""}`;
    const numeric = has && (o.display == null || /^[+−-]?[\d,]*\.?\d+\D{0,3}$/.test(txt));
    return (
      `<div class="ring-wrap dial-wrap"><div class="ring dial" style="width:${size}px;height:${size}px;--c:${esc(color)}">` +
      `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(aria)}"><defs>${defs}</defs>` +
      `<path class="ring-track dial-track" d="${arcPath(a0, a0 + SWEEP)}" fill="none" stroke-width="${sw}" stroke-linecap="round"/>${ticks}${arc}${zone}</svg>` +
      `<div class="ring-c" aria-hidden="true"><div class="ring-v dial-v" style="font-size:${fs}px;font-size:min(${fs}px, ${(ratio * 100).toFixed(1)}cqi)">${countable(txt, numeric)}${unit ? `<span class="dial-u">${esc(unit)}</span>` : ""}</div>` +
      `${o.label ? `<div class="ring-l dial-l">${esc(o.label)}</div>` : ""}</div></div>` +
      `${o.sub ? `<div class="ring-sub">${esc(o.sub)}</div>` : ""}</div>`
    );
  }

  function ring(o) {
    o = o || {};
    if (o.variant === "dial") return dial(o);
    const max = isNum(o.max) && o.max > 0 ? o.max : 100;
    const size = isNum(o.size) && o.size > 20 ? o.size : 148;
    const color = o.color || "var(--accent)";
    const has = isNum(o.value);
    const frac = has ? clamp(o.value / max, 0, 1) : 0;
    const sw = Math.max(5, Math.round(size * 0.085));
    const r = (size - sw) / 2 - 1;
    const c = 2 * Math.PI * r;
    const cx = size / 2;
    const txt = o.display != null && o.display !== "" ? String(o.display) : has ? String(Math.round(o.value)) : "–";
    const fs = Math.round(size * (txt.length > 5 ? 0.17 : txt.length > 3 ? 0.21 : 0.28));
    const showL = o.label && size >= 92;
    const off = f1(c * (1 - frac));
    const arc = has && frac > 0
      ? `<circle class="ring-arc" cx="${cx}" cy="${cx}" r="${f1(r)}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${f1(c)}" stroke-dashoffset="${off}" data-arc="${off}" transform="rotate(-90 ${cx} ${cx})" style="stroke:${esc(color)}"/>`
      : "";
    const aria = `${o.label ? o.label + " " : ""}${txt}${has && max === 100 && o.display == null ? " of 100" : ""}`;
    const numeric = has && (o.display == null || /^[+−-]?[\d,]*\.?\d+\D{0,3}$/.test(txt));
    return (
      `<div class="ring-wrap"><div class="ring" style="width:${size}px;height:${size}px">` +
      `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(aria)}">` +
      `<circle class="ring-track" cx="${cx}" cy="${cx}" r="${f1(r)}" fill="none" stroke-width="${sw}"/>${arc}</svg>` +
      `<div class="ring-c" aria-hidden="true"><div class="ring-v" style="font-size:${fs}px">${countable(txt, numeric)}</div>${showL ? `<div class="ring-l">${esc(o.label)}</div>` : ""}</div></div>` +
      `${o.sub ? `<div class="ring-sub">${esc(o.sub)}</div>` : ""}</div>`
    );
  }

  /* ---------------- fitness / fatigue / form (performance management) ----------------
     spec: {type:"pmc", data:[{label, ctl, atl, tsb}], height?}
     CTL & ATL as lines on a shared load axis, TSB as bars around zero; last day emphasised. */
  function drawPmc(s, W, H) {
    const num = (x) => (isNum(x) ? x : null);
    const data = (s.data || []).map((d) => ({ label: d && d.label, ctl: num(d && d.ctl), atl: num(d && d.atl), tsb: num(d && d.tsb) }));
    const all = [];
    for (const d of data) for (const k of ["ctl", "atl", "tsb"]) if (isNum(d[k])) all.push(d[k]);
    if (!all.length) return emptyOut("No training load yet");
    const C_CTL = "var(--strain)", C_ATL = "var(--z4)";
    const tsbCol = (v) => (v >= 0 ? "var(--green)" : v >= -10 ? "var(--yellow)" : "var(--red)");
    const legH = 22;
    let lo = Math.min(0, ...all), hi = Math.max(1, ...all);
    const pad = (hi - lo) * 0.06;
    const T = niceTicks(lo - (lo < 0 ? pad : 0), hi + pad, H < 190 ? 3 : 4);
    const fmt = (v) => String(Math.round(v));
    const padT = 8 + legH, padB = 24, padR = 10;
    const padL = Math.ceil(Math.max(...T.ticks.map((t) => textW(fmt(t))), 16)) + 10;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(20, H - padT - padB);
    const n = data.length;
    const step = pw / Math.max(1, n);
    const xAt = (i) => padL + step * (i + 0.5);
    const yAt = (v) => padT + ph - ((v - T.lo) / (T.hi - T.lo)) * ph;
    const y0 = yAt(clamp(0, T.lo, T.hi));
    const bw = Math.max(1, Math.min(step * 0.62, 14));

    let s1 = svgOpen(W, H);
    // legend
    const items = [["Fitness (CTL)", C_CTL, "line"], ["Fatigue (ATL)", C_ATL, "line"], ["Form (TSB)", "var(--green)", "bar"]];
    let lx = 0;
    s1 += `<g class="ch-leg">`;
    for (const [t, c, kind] of items) {
      const w = textW(t) + 26;
      if (lx + w > W) break;
      s1 += kind === "line"
        ? `<line x1="${f1(lx)}" x2="${f1(lx + 14)}" y1="9" y2="9" style="stroke:${c}" stroke-width="2.5" stroke-linecap="round"/>`
        : `<rect x="${f1(lx + 2)}" y="3" width="10" height="12" rx="2" style="fill:${c};fill-opacity:.5"/>`;
      s1 += `<text class="ch-t strong" x="${f1(lx + 20)}" y="12.5">${esc(t)}</text>`;
      lx += w + 6;
    }
    s1 += `</g>`;
    s1 += yAxis(T.ticks, yAt, padL, W - padR, fmt);
    // TSB bars around zero
    data.forEach((d, i) => {
      if (!isNum(d.tsb) || d.tsb === 0) return;
      const y = yAt(clamp(d.tsb, T.lo, T.hi));
      const top = Math.min(y, y0), h = Math.max(1, Math.abs(y - y0));
      const last = i === n - 1;
      s1 += `<rect x="${f1(xAt(i) - bw / 2)}" y="${f1(top)}" width="${f1(bw)}" height="${f1(h)}" rx="${f1(Math.min(2, bw / 2))}" style="fill:${tsbCol(d.tsb)};fill-opacity:${last ? 0.9 : 0.38}"/>`;
    });
    s1 += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${f1(y0)}" y2="${f1(y0)}"/>`;
    const line = (k, c, wdt) => {
      const runs = [];
      let run = null;
      data.forEach((p, i) => {
        if (!isNum(p[k])) { run = null; return; }
        if (!run) runs.push((run = []));
        run.push([xAt(i), yAt(p[k])]);
      });
      const d = runs.map((P) => monoPath(P)).join("");
      return d ? `<path d="${d}" fill="none" style="stroke:${c}" stroke-width="${wdt}" stroke-linejoin="round" stroke-linecap="round"/>` : "";
    };
    // fitness gets a soft area under it
    const gP = "cp" + ++gid;
    {
      const P = [];
      data.forEach((p, i) => { if (isNum(p.ctl)) P.push([xAt(i), yAt(p.ctl)]); });
      if (P.length > 1) s1 += `<defs>${areaGrad(gP, C_CTL, 0.18)}</defs><path d="${monoPath(P)}L${f1(P[P.length - 1][0])},${f1(y0)}L${f1(P[0][0])},${f1(y0)}Z" style="fill:url(#${gP})"/>`;
    }
    s1 += line("atl", C_ATL, 1.8) + line("ctl", C_CTL, 2.6);
    // last point emphasised
    const L = n - 1;
    if (L >= 0) {
      for (const [k, c] of [["atl", C_ATL], ["ctl", C_CTL]]) {
        if (isNum(data[L][k])) s1 += lastDot(xAt(L), yAt(data[L][k]), c);
      }
    }
    if (T.lo < 0) s1 += `<text class="ch-t" x="${W - padR}" y="${f1(Math.min(padT + ph - 4, y0 + 13))}" text-anchor="end">fresh ↑ · tired ↓</text>`;
    const maxLW = Math.max(...data.map((d) => textW(d.label == null ? "" : d.label)), 10);
    s1 += xLabels(data, labelIdx(n, pw, maxLW), xAt, W, padT, ph);
    s1 += hoverBits(padT, ph, padL, W - padR) + "</svg>";

    const r1 = (v) => (isNum(v) ? (Math.round(v * 10) / 10).toFixed(1) : "–");
    const hit = (x) => {
      if (x < padL - 8 || x > W) return null;
      const i = clamp(Math.floor((x - padL) / step), 0, n - 1);
      const d = data[i];
      const lab = d.label == null ? "" : esc(d.label) + " · ";
      return {
        x: xAt(i),
        y: isNum(d.ctl) ? yAt(d.ctl) : padT + ph / 2,
        dot: isNum(d.ctl) ? C_CTL : null,
        html: `${lab}Fitness <b>${r1(d.ctl)}</b> · Fatigue <b>${r1(d.atl)}</b> · Form <b>${isNum(d.tsb) ? (d.tsb > 0 ? "+" : d.tsb < 0 ? "−" : "") + r1(Math.abs(d.tsb)) : "–"}</b>`,
      };
    };
    return { html: s1, hit };
  }

  /* ---------------- acute:chronic workload ratio gauge ----------------
     spec: {type:"acwr", value, height?}; zones <0.8, 0.8–1.3, 1.3–1.5, >1.5 on a 0–2 scale */
  const ACWR_Z = [
    [0, 0.8, "var(--z1)", "Detraining", "Load is below what you're used to."],
    [0.8, 1.3, "var(--green)", "Sweet spot", "Load matches your base."],
    [1.3, 1.5, "var(--yellow)", "Caution", "Load is rising faster than your base."],
    [1.5, 2, "var(--red)", "High risk", "Load spike well above your base."],
  ];
  function drawAcwr(s, W, H) {
    const MAX = 2;
    const raw = isNum(s.value) ? s.value : null;
    const v = raw == null ? null : clamp(raw, 0, MAX);
    const padL = 8, padR = 8;
    const pw = Math.max(10, W - padL - padR);
    const xAt = (x) => padL + (x / MAX) * pw;
    const barH = 12;
    const barY = Math.max(24, Math.round(H / 2 - barH / 2) - 4);
    let s1 = svgOpen(W, H);
    ACWR_Z.forEach(([a, b, c], k) => {
      const x0 = xAt(a), x1 = xAt(b);
      const gap = k ? 1.5 : 0;
      const on = v != null && v >= a && (v < b || (k === ACWR_Z.length - 1 && v <= b));
      s1 += `<rect x="${f1(x0 + gap)}" y="${barY}" width="${f1(Math.max(1, x1 - x0 - gap))}" height="${barH}" rx="3" style="fill:${c};fill-opacity:${on ? 0.95 : 0.3}"/>`;
    });
    for (const t of [0, 0.8, 1.3, 1.5, 2]) {
      const x = xAt(t);
      const a = t === 0 ? "start" : t === 2 ? "end" : "middle";
      const lab = t === 2 ? "2.0+" : t === 0 ? "0" : String(t);
      if (t === 1.5 && pw < 260) continue; // keep 1.3 / 1.5 labels from colliding on phones
      s1 += `<text class="ch-t" x="${f1(x)}" y="${barY + barH + 17}" text-anchor="${a}">${lab}</text>`;
    }
    if (v != null) {
      const x = xAt(v);
      s1 += `<path d="M${f1(x - 6)},${barY - 11}L${f1(x + 6)},${barY - 11}L${f1(x)},${barY - 3}Z" style="fill:var(--ink)"/>`;
      s1 += `<line x1="${f1(x)}" x2="${f1(x)}" y1="${barY - 3}" y2="${barY + barH + 3}" style="stroke:var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
      const lab = raw.toFixed(2) + (raw > MAX ? "+" : "");
      const w = textW(lab, 11);
      s1 += `<text class="ch-t strong" x="${f1(clamp(x, w / 2, W - w / 2))}" y="${barY - 15}" text-anchor="middle">${esc(lab)}</text>`;
    }
    s1 += hoverBits(barY, barH) + "</svg>";
    const hit = (x) => {
      if (x < padL || x > padL + pw) return null;
      const r = ((x - padL) / pw) * MAX;
      const z = ACWR_Z.find(([a, b]) => r >= a && r < b) || ACWR_Z[ACWR_Z.length - 1];
      return { x: xAt((z[0] + z[1]) / 2), y: barY, html: `<b>${z[3]}</b> · ${z[0]}–${z[1] === 2 ? "" : z[1]}${z[1] === 2 ? "+" : ""} · ${z[4]}` };
    };
    return { html: s1, hit };
  }

  /* ---------------- slot / mount ---------------- */
  const DEF_H = { line: 180, bars: 180, hypno: 172, hrday: 190, range: 220, strainline: 220, gauge21: 64, pmc: 230, acwr: 76 };
  const DRAW = { line: drawLine, bars: drawBars, hypno: drawHypno, hrday: drawHrday, range: drawRange, strainline: drawStrainline, gauge21: drawGauge21, pmc: drawPmc, acwr: drawAcwr };

  function slot(spec) {
    if (!spec || !spec.type) return "";
    if (spec.type === "hbars") return hbars(spec);
    if (!DRAW[spec.type]) return "";
    const id = "c" + ++seq;
    reg.set(id, spec);
    const h = isNum(spec.height) && spec.height > 30 ? spec.height : DEF_H[spec.type];
    let aria = spec.label || spec.title || "";
    if (!aria && spec.type === "gauge21" && isNum(spec.value)) aria = `Strain ${(Math.round(spec.value * 10) / 10).toFixed(1)} of 21` + (Array.isArray(spec.target) ? `, target ${spec.target[0]} to ${spec.target[1]}` : "");
    if (!aria && spec.type === "strainline") aria = "Daily strain with recovery";
    if (!aria && spec.type === "pmc") aria = "Fitness, fatigue and form over time";
    if (!aria && spec.type === "acwr" && isNum(spec.value)) aria = `Acute to chronic load ratio ${spec.value.toFixed(2)}`;
    return `<div class="chart" data-chart="${id}" data-noswipe style="height:${h}px"${aria ? ` role="img" aria-label="${esc(aria)}"` : ""}></div>`;
  }

  function hideTip(el) {
    el.classList.remove("hovering");
    const tip = el.querySelector(".ch-tip");
    if (tip) tip.hidden = true;
    const dot = el.querySelector(".ch-hover");
    if (dot) dot.style.opacity = 0;
  }

  /* crosshair + floating tooltip pill; mouse hover and touch drag (horizontal drags stay inside the chart,
     so they never reach a page-level day swipe; vertical drags still scroll the page) */
  function bind(el) {
    if (el._chBound) return;
    el._chBound = true;
    let t = null;
    const move = (e) => {
      if (!el._chHit) return;
      const rect = el.getBoundingClientRect();
      const h = el._chHit(e.clientX - rect.left, e.clientY - rect.top);
      if (!h) return hideTip(el);
      clearTimeout(t);
      const tip = el.querySelector(".ch-tip");
      if (!tip) return;
      el.classList.add("hovering");
      tip.innerHTML = (h.dot ? `<span class="sw" style="--c:${esc(h.dot)}"></span>` : "") + h.html;
      tip.hidden = false;
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      const W = el.clientWidth, H = el.clientHeight;
      const left = clamp(h.x - tw / 2, 0, Math.max(0, W - tw));
      const py = isNum(h.y) ? h.y : 20;
      // touch: keep the pill clear of the finger
      let top = py - th - (e.pointerType === "touch" ? 28 : 12);
      if (top < 0) top = Math.min(Math.max(0, H - th), py + 14);
      tip.style.transform = `translate(${Math.round(left)}px,${Math.round(top)}px)`;
      const cur = el.querySelector(".ch-cursor");
      if (cur) { cur.setAttribute("x1", h.x); cur.setAttribute("x2", h.x); }
      const curH = el.querySelector(".ch-cursor-h");
      if (curH) {
        const yy = h.dot && isNum(h.y) ? h.y : -10;
        curH.setAttribute("y1", yy);
        curH.setAttribute("y2", yy);
      }
      const dot = el.querySelector(".ch-hover");
      if (dot) {
        if (h.dot && isNum(h.y)) {
          dot.setAttribute("cx", h.x);
          dot.setAttribute("cy", h.y);
          dot.style.fill = h.dot;
          dot.style.opacity = 1;
        } else dot.style.opacity = 0;
      }
    };
    const later = () => { clearTimeout(t); t = setTimeout(() => hideTip(el), 1800); };
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "touch") e.stopPropagation();
      move(e);
    });
    el.addEventListener("pointerup", (e) => { if (e.pointerType === "touch") later(); });
    el.addEventListener("pointercancel", () => hideTip(el));
    el.addEventListener("pointerleave", (e) => {
      clearTimeout(t);
      if (e.pointerType === "touch") later();
      else hideTip(el);
    });
    for (const ev of ["touchstart", "touchmove", "touchend"]) el.addEventListener(ev, (e) => e.stopPropagation(), { passive: true });
  }

  function draw(el, spec, force) {
    const W = Math.floor(el.clientWidth);
    if (!W) return;
    const H = Math.floor(el.clientHeight) || (isNum(spec.height) ? spec.height : DEF_H[spec.type]);
    if (!force && el._chW === W && el._chSpec === spec) return;
    el._chW = W;
    el._chSpec = spec;
    let out;
    try {
      out = DRAW[spec.type](spec, W, H);
    } catch (err) {
      console.warn("Chart failed", spec.type, err);
      out = emptyOut("Chart unavailable");
    }
    el.innerHTML = out.html + `<div class="ch-tip" hidden></div>`;
    el._chHit = out.hit;
    if (out.hit) bind(el);
  }

  function mount(rootEl) {
    const r = rootEl || (typeof document !== "undefined" ? document : null);
    if (!r || !r.querySelectorAll) return;
    r.querySelectorAll(".chart[data-chart]").forEach((el) => {
      const spec = reg.get(el.dataset.chart);
      if (spec) draw(el, spec, false);
    });
    if (reg.size > 400 && typeof document !== "undefined") {
      for (const id of [...reg.keys()]) if (!document.querySelector(`[data-chart="${id}"]`)) reg.delete(id);
    }
    // after the caller finishes this render (core sets #view[data-anim] right after mounting)
    const later = root.queueMicrotask ? root.queueMicrotask.bind(root) : (f) => Promise.resolve().then(f);
    later(() => animate(r));
  }

  /* ---------------- first-paint motion: dial sweep + number count-up ----------------
     Markup is always in its final state (arc stroke-dashoffset = data-arc, text = final number), so nothing
     depends on this running. Delegates to window.CadenceMotion when present; otherwise a small rAF fallback.
     Elements are marked data-cm-done (shared with CadenceMotion), so repeated calls (resize remounts) are no-ops. */
  const easeOutCubic = (p) => 1 - Math.pow(1 - p, 3);
  function reducedMotion() {
    try { return !!(root.matchMedia && root.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch (e) { return false; }
  }
  function tween(ms, step, done) {
    const raf = root.requestAnimationFrame ? root.requestAnimationFrame.bind(root) : (f) => setTimeout(() => f(Date.now()), 16);
    const t0 = root.performance && performance.now ? performance.now() : Date.now();
    const frame = () => {
      const now = root.performance && performance.now ? performance.now() : Date.now();
      const p = clamp((now - t0) / ms, 0, 1);
      step(easeOutCubic(p));
      if (p < 1) raf(frame);
      else done();
    };
    raf(frame);
  }
  function fmtCount(v, dp, comma) {
    const s = comma ? v.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp }) : v.toFixed(dp);
    return s.charAt(0) === "-" ? "−" + s.slice(1) : s;
  }
  function animateFallback(r) {
    const pick = (sel) => {
      const out = [];
      if (r.matches && r.matches(sel)) out.push(r);
      r.querySelectorAll(sel).forEach((x) => out.push(x));
      return out.filter((x) => !x.hasAttribute("data-cm-done"));
    };
    const arcs = pick("[data-arc]"), nums = pick("[data-count]");
    arcs.concat(nums).forEach((x) => x.setAttribute("data-cm-done", ""));
    if (reducedMotion()) return;
    for (const el of arcs) {
      const to = parseFloat(el.getAttribute("data-arc"));
      const da = parseFloat(String(el.getAttribute("stroke-dasharray") || "").split(/[ ,]+/)[0]);
      const from = isNum(parseFloat(el.getAttribute("data-arc-from"))) ? parseFloat(el.getAttribute("data-arc-from")) : da;
      if (!isNum(to) || !isNum(from)) continue;
      el.style.strokeDashoffset = String(from);
      tween(800, (p) => { el.style.strokeDashoffset = (from + (to - from) * p).toFixed(2); }, () => { el.style.strokeDashoffset = ""; });
    }
    for (const el of nums) {
      const to = parseFloat(el.getAttribute("data-count"));
      if (!isNum(to)) continue;
      const dp = clamp(Math.round(parseFloat(el.getAttribute("data-dp")) || 0), 0, 6);
      const comma = el.getAttribute("data-format") === "comma";
      const from = parseFloat(el.getAttribute("data-from")) || 0;
      const fin = el.textContent;
      el.textContent = fmtCount(from, dp, comma);
      tween(800, (p) => { el.textContent = fmtCount(from + (to - from) * p, dp, comma); }, () => { el.textContent = fin && fin.trim() ? fin : fmtCount(to, dp, comma); });
    }
  }
  function animate(rootEl) {
    if (typeof document === "undefined") return;
    const r = rootEl || document;
    if (!r || !r.querySelectorAll) return;
    // nothing new to animate → no-op (cheap on resize remounts)
    if (!r.querySelector("[data-arc]:not([data-cm-done]), [data-count]:not([data-cm-done])") &&
        !(r.matches && r.matches("[data-arc]:not([data-cm-done]), [data-count]:not([data-cm-done])"))) return;
    // quiet re-render (core: #view[data-anim="quiet"] / .stagger.settled): settle at once, don't replay
    const host = r.closest ? r.closest("[data-anim]") : null;
    const quiet = (host && host.getAttribute("data-anim") === "quiet") || (r.querySelector && r.querySelector(".stagger.settled") && !r.querySelector(".stagger:not(.settled)"));
    if (quiet || reducedMotion()) {
      r.querySelectorAll("[data-arc], [data-count]").forEach((x) => x.setAttribute("data-cm-done", ""));
      return;
    }
    const CM = root.CadenceMotion;
    if (CM && typeof CM.sweepDials === "function" && typeof CM.countUp === "function") {
      try {
        CM.sweepDials(r);
        CM.countUp(r);
        return;
      } catch (e) {
        console.warn("CadenceMotion failed; using built-in animation", e);
      }
    }
    try { animateFallback(r); } catch (e) { /* motion is decoration only */ }
  }

  root.Charts = { ring, slot, mount, animate, clock: clk, monotone: monoPath };
})(typeof window !== "undefined" ? window : globalThis);
</script>

(function (root) {
