      const contribCard = `<div class="card">${head("What drove it", "value · baseline · score")}` +
        (hasContrib ? Charts.slot({ type: "hbars", data: contribRows, max: 100 }) : `<p class="muted">Contributors appear once there's an HRV reading.</p>`) + `</div>`;

      // 30-day recovery bars
      const recBars = idx.map((k) => {
        const dd = ctx.derived[k] || {};
        const v = dd.recovery;
        return { label: label(ctx.days[k].date), v: isNum(v) ? v : null, color: isNum(v) ? bandColor(dd.band || bandOf(v)) : "var(--muted)" };
      });
      const recVals = recBars.map((b) => b.v).filter(isNum);
      const recCard = `<div class="card span-2">${head("Recovery", recVals.length ? `30-day avg <span class="num">${Math.round(avg(recVals))}%</span>` : "last 30 days")}` +
        (recVals.length ? Charts.slot({ type: "bars", data: recBars, max: 100, fmt: (v) => `${Math.round(v)}%` }) : `<p class="muted">No scores yet.</p>`) + `</div>`;

      // HRV line with ±1 SD
      const hv = vital(ctx, "hrv");
      const hrvData = lineSeries(ctx, idx, (k) => ctx.days[k].hrv);
      let band1, ref;
      if (isNum(hv.baseline)) {
        let sd = hv.sd;
        if (!isNum(sd) || sd <= 0) { const ps = pastStats(ctx, ctx.i, "hrv"); sd = ps && isNum(ps.sd) && ps.sd > 0 ? ps.sd : hv.baseline * 0.12; }
        band1 = [Math.round(hv.baseline - sd), Math.round(hv.baseline + sd)];
        ref = { v: Math.round(hv.baseline), label: `baseline ${Math.round(hv.baseline)}` };
      }
      const hasHrv = hrvData.some((x) => x.v !== null);
      const hrvCard = `<div class="card span-2">${head("Heart rate variability", "ms · shaded = baseline ±1 SD")}` +
        (hasHrv ? Charts.slot({ type: "line", data: hrvData, color: "var(--accent)", fmt: (v) => `${Math.round(v)} ms`, band: band1, ref }) : `<p class="muted">No HRV readings yet.</p>`) + `</div>`;

      const rv = vital(ctx, "rhr");
      const rhrData = lineSeries(ctx, idx, (k) => ctx.days[k].restingHr);
      const rhrCard = `<div class="card">${head("Resting heart rate", "bpm")}` +
        (rhrData.some((x) => x.v !== null)
          ? Charts.slot({ type: "line", data: rhrData, color: "var(--red)", height: 150, area: false, fmt: (v) => `${Math.round(v)} bpm`,
            ref: isNum(rv.baseline) ? { v: Math.round(rv.baseline * 10) / 10, label: `baseline ${Math.round(rv.baseline)}` } : undefined })
          : `<p class="muted">No readings yet.</p>`) + `</div>`;

      const how = methodText(ctx, /recover/i) ||
        "Recovery compares last night's HRV, resting heart rate and breathing rate with your own 30-day baselines, then adds how well you slept. HRV carries the most weight. Higher HRV and lower resting heart rate than usual mean your body has absorbed recent load. Green is 67–100%, yellow 34–66%, red 0–33%.";
      const howCard = `<div class="card">${head("How recovery works")}<p class="muted">${esc(how)}</p>` +
        (isNum(hv.baseline) ? "" : `<p class="muted cv-note">Baselines are still forming, so early scores are rough.</p>`) + `</div>`;

      return `<div class="page v-recovery">${pageHead("Recovery", ctx)}${top}` +
        `<div class="grid">${contribCard}${howCard}${recCard}${hrvCard}${rhrCard}</div></div>`;
    },
  };

  /* ================= STRAIN ================= */

  Views.strain = {
    label: "Strain",
    icon: "strain",
    dated: true,
    css: CSS,
    render(ctx) {
      if (ctx.i === -1 || !ctx.day || !ctx.d) return emptyPage("Strain", ctx, "v-strain");
      const { d, day } = ctx;
      const ts = targetStatus(d);
      const today = isToday(day.date);

      const top = `<div class="card hero"><div class="cv-top">` +
        Charts.ring({ variant: "dial", value: isNum(d.strain) ? d.strain : null, max: 21, color: "var(--strain)", label: "Strain",
          target: ts ? [ts.lo, ts.hi] : undefined, display: fStrain(d.strain), sub: "out of 21" }) +
        `<div>${ts
          ? `${head(today ? "Today's target" : "Target", chip(ts.level, ts.text))}` +
            Charts.slot({ type: "gauge21", value: d.strain, target: [ts.lo, ts.hi], height: 72, label: `Strain ${fStrain(d.strain)}, target ${fStrain(ts.lo)} to ${fStrain(ts.hi)}` }) +
            `<p class="insight">${ts.where === "below" ? (today ? `Room for <span class="num">${fStrain(Math.max(0, ts.lo - d.strain))}</span> more to reach the low end of today's target.` : "Finished under target — a lighter day than recovery allowed.")
              : ts.where === "in" ? "Load matches how recovered you were. A good place to stop."
              : "Above what recovery suggested. Plan an easier day and an earlier night."}</p>`
          : `<p class="insight">A strain target appears on days with a recovery score.</p>`}</div></div></div>`;

      const z = Array.isArray(d.zones) ? d.zones : [];
      const zRows = [1, 2, 3, 4, 5].map((k) => ({ label: `Zone ${k}`, v: isNum(z[k]) ? z[k] : 0, color: `var(--z${k})`, display: mins(isNum(z[k]) ? z[k] : 0) }));
      const zTotal = zRows.reduce((s, r) => s + r.v, 0);
      const zoneCard = `<div class="card">${head("Heart-rate zones", zTotal ? `<span class="num">${mins(zTotal)}</span> above 50% HRR` : "")}` +
        (zTotal ? Charts.slot({ type: "hbars", data: zRows, max: Math.max(...zRows.map((r) => r.v), 1) }) : `<p class="muted">No time above zone 1 on this day.</p>`) +
        `<p class="muted cv-note">Zones are % of heart-rate reserve: Z1 50–60, Z2 60–70, Z3 70–80, Z4 80–90, Z5 90+.</p></div>`;

      const share = isNum(d.activityStrainShare) ? Math.round(d.activityStrainShare * 100) : null;
      const actCard = `<div class="card">${head("Activities", share !== null ? `<span class="num">${share}%</span> of load` : "")}` +
        activityList(d, "No workouts on this day. All strain came from everyday movement.") + `</div>`;

      const k = d.kcal || {};
      const kcalCard = `<div class="card">${head("Calories", "kcal")}<div class="stats">` +
        stat("Active", show(isNum(k.active) ? k.active : day.activeKcal), "kcal") + stat("Total", show(isNum(k.total) ? k.total : day.totalKcal), "kcal") +
        `</div></div>`;

      const hasHr = Array.isArray(day.hr) && day.hr.length > 0;
      const hrCard = `<div class="card span-2">${head("Heart rate", "bpm")}` +
        (hasHr ? Charts.slot({ type: "hrday", hr: day.hr, workouts: workoutsOf(d), sleep: day.sleep || null, date: day.date }) : `<p class="muted">No heart-rate samples for this day.</p>`) + `</div>`;

      const idx = windowIdx(ctx, 30);
      const series = idx.map((j) => {
        const dd = ctx.derived[j] || {};
        return { label: label(ctx.days[j].date), strain: isNum(dd.strain) ? dd.strain : null, recovery: isNum(dd.recovery) ? dd.recovery : null,
          color: isNum(dd.recovery) ? bandColor(dd.band || bandOf(dd.recovery)) : "var(--muted)" };
      });
      const sv = series.map((x) => x.strain).filter(isNum);
      const lineCard = `<div class="card span-2">${head("Strain and recovery", sv.length ? `30-day avg strain <span class="num">${fStrain(avg(sv))}</span>` : "last 30 days")}` +
        (sv.length ? Charts.slot({ type: "strainline", data: series, height: 200 }) : `<p class="muted">No strain history yet.</p>`) +
        `<div class="legend"><span class="key" style="--c:var(--strain)">Strain (0–21)</span><span class="key" style="--c:var(--green)">Recovery %</span></div></div>`;

      return `<div class="page v-strain">${pageHead("Strain", ctx)}${top}<div class="grid">${zoneCard}${actCard}${kcalCard}${hrCard}${lineCard}</div></div>`;
    },
  };
})();
</script>
<script>/* Cadence v2 views: Health monitor, Journal, Trends (+ Biological age), Coach.
 * Codes only against the contract APIs: App.*, Charts.*, CadenceEngine and the shared CSS vocabulary.
 * Reads engine v2 derived fields (strain 0–21, recovery + band, sleepPerformance, sleepNeed, monitor …)
 * and degrades gracefully when one is missing. */
(function () {
  "use strict";
  const Views = (window.Views = window.Views || {});
  const E = window.CadenceEngine;
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const avg = (a) => {
    const v = a.filter(isNum);
    return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
  };
  const sdOf = (a) => {
    const v = a.filter(isNum);
    if (v.length < 2) return null;
    const m = avg(v);
    return Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1));
  };
  const F = () => App.fmt;
  const esc = (s) => App.esc(s == null ? "" : String(s));
  const n = (v, dp) => (isNum(v) ? F().num(v, dp || 0) : "—");
  const sgn = (v, dp) => (isNum(v) ? F().signed(v, dp || 0) : "—");
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pad = (x) => String(x).padStart(2, "0");
  const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const minsOf = (t) => {
    const m = /^(\d{1,2}):(\d{2})/.exec(t || "");
    return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : null;
  };
  const clockOf = (t) => {
    const m = minsOf(t);
    return m == null ? "" : F().clock(m);
  };
  const fullProfile = (p) => ({ ...(E.DEFAULT_PROFILE || {}), ...(p || {}) });
  const empty = (title, text) => `<div class="empty"><h2>${title}</h2><p class="muted">${text}</p></div>`;
  const head = (title, sub) => `<div class="page-head"><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
  const cardHead = (title, meta) => `<div class="card-head"><h2>${title}</h2>${meta ? `<div class="card-meta">${meta}</div>` : ""}</div>`;
  const stat = (label, value, unit, sub) =>
    `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value num">${value}${unit ? `<span class="stat-unit">${unit}</span>` : ""}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ""}</div>`;
  const bar = (pct, color) =>
    `<div class="bar-track"><div class="bar-fill" style="width:${Math.max(0, Math.min(100, isNum(pct) ? pct : 0)).toFixed(1)}%;--c:${color}"></div></div>`;

  /* ---------- v2 helpers (tolerant of v1 engine output) ---------- */
  const BAND_VAR = { green: "var(--green, var(--rec-high))", yellow: "var(--yellow, var(--rec-mid))", red: "var(--red, var(--rec-low))" };
  const BAND_CHIP = { green: "good", yellow: "warn", red: "bad" };
  const bandOf = (r) => (!isNum(r) ? null : r >= 67 ? "green" : r >= 34 ? "yellow" : "red");
  const bandOfD = (d) => (d ? (BAND_VAR[d.band] ? d.band : bandOf(d.recovery)) : null);
  const bandColor = (b) => {
    if (!b) return "var(--muted)";
    const c = App.bandColor ? App.bandColor(b) : null;
    return typeof c === "string" && c ? c : BAND_VAR[b] || "var(--muted)";
  };
  const strainF = (v) => {
    if (!isNum(v)) return "—";
    const f = F().strain;
    return typeof f === "function" ? f(v) : v.toFixed(1);
  };
  const needOf = (d) => (!d ? null : isNum(d.sleepNeed) ? d.sleepNeed : d.sleepNeed && isNum(d.sleepNeed.total) ? d.sleepNeed.total : null);
  const perfOf = (d) => (!d ? null : isNum(d.sleepPerformance) ? d.sleepPerformance : isNum(d.sleepScore) ? d.sleepScore : null);
  const asleepOf = (d) => (d && d.sleep && isNum(d.sleep.asleep) ? d.sleep.asleep : null);

  /* indices of days in the window of `count` records ending at i */
  const windowIdx = (i, count) => {
    const out = [];
    for (let k = Math.max(0, i - count + 1); k <= i; k++) out.push(k);
    return out;
  };

  /* all workouts of one merged day: device + manual, with v2 per-workout strain when the engine gives it */
  const workoutsOf = (day, d) => {
    if (!day) return [];
    const strainById = {};
    for (const w of (d && d.workouts) || []) if (w && w.id != null && isNum(w.strain)) strainById[w.id] = w.strain;
    const dw = (d && d.workouts) || [];
    const dev = (day.workouts || []).map((w, k) => {
      const dv = dw[k] && dw[k].start === w.start && dw[k].type === w.type ? dw[k] : null;
      return { ...w, manual: false, strain: dv && isNum(dv.strain) ? dv.strain : strainById[w.id] };
    });
    const man = ((day.entry && day.entry.workouts) || []).map((w) => ({ ...w, manual: true, strain: strainById[w.id] }));
    return dev.concat(man).sort((a, b) => String(a.start).localeCompare(String(b.start)));
  };
  const startClock = (w) => {
    const d = new Date(w.start);
    return isNaN(d) ? "" : F().clock(d);
  };

  function update(fn) {
    const sel = App.sel();
    const entry = App.getEntry(sel);
    if (fn(entry) === false) return;
    App.saveEntry(sel, entry);
  }
  const on = (kind, name, fn) => {
    if (window.App && App[kind]) App[kind](name, fn);
  };

  /* ===================================================================== HEALTH MONITOR */
  const VITALS = [
    { key: "hrv", label: "Heart rate variability", unit: "ms", dp: 0, raw: (x) => x.hrv, minSd: 3, color: "var(--accent)" },
    { key: "rhr", label: "Resting heart rate", unit: "bpm", dp: 0, raw: (x) => x.restingHr, minSd: 1.5, color: "var(--red, var(--bad))" },
    { key: "resp", label: "Respiratory rate", unit: "br/min", dp: 1, raw: (x) => x.respRate, minSd: 0.3, color: "var(--sleep)" },
    { key: "spo2", label: "Blood oxygen", unit: "%", dp: 1, raw: (x) => x.spo2, minSd: 0.6, color: "var(--strain)" },
    { key: "skinTemp", label: "Skin temperature", unit: "°C", dp: 1, raw: (x) => x.skinTempDev, minSd: 0.2, signed: true, color: "var(--yellow, var(--warn))" },
  ];
  const STATUS = {
    normal: { chip: "good", text: "Normal" },
    high: { chip: "warn", text: "High" },
    low: { chip: "warn", text: "Low" },
    none: { chip: "neutral", text: "No data" },
  };

  /* monitor entry for one vital: engine v2 d.monitor when present, else a local 30-day baseline */
  function vitalAt(days, derived, i, v) {
    const m = derived[i] && derived[i].monitor && derived[i].monitor[v.key];
    const hist = windowIdx(i - 1, 30).filter((k) => k >= 0).map((k) => v.raw(days[k]));
    let value, baseline, sd, status, lo, hi;
    if (m && typeof m === "object") {
      value = isNum(m.value) ? m.value : null;
      baseline = isNum(m.baseline) ? m.baseline : avg(hist);
      sd = isNum(m.sd) ? m.sd : sdOf(hist);
      status = STATUS[m.status] ? m.status : null;
      if (isNum(m.lo) && isNum(m.hi)) [lo, hi] = [m.lo, m.hi];
    } else {
      const raw = v.raw(days[i]);
      value = isNum(raw) ? raw : null;
      baseline = avg(hist);
      sd = sdOf(hist);
    }
    if (isNum(sd)) sd = Math.max(sd, v.minSd);
    if (!isNum(lo) && isNum(baseline) && isNum(sd)) [lo, hi] = [baseline - 2 * sd, baseline + 2 * sd];
    if (!status) {
      if (!isNum(value)) status = "none";
      else if (isNum(lo) && value > hi) status = "high";
      else if (isNum(lo) && value < lo) status = "low";
      else status = "normal";
    }
    if (!isNum(value)) status = "none";
    return { value, baseline: isNum(baseline) ? baseline : null, lo: isNum(lo) ? lo : null, hi: isNum(hi) ? hi : null, status };
  }

  const vfmt = (v, x) => (isNum(x) ? (v.signed ? sgn(x, v.dp) : n(x, v.dp)) : "—");

  function bodyCard(days, i, fmt) {
    const win = windowIdx(i, 30);
    const metric = (field, label, unit) => {
      let lastK = -1;
      for (let k = i; k >= 0 && k > i - 60; k--) if (isNum(days[k][field])) { lastK = k; break; }
      if (lastK < 0) return "";
      const pts = win.map((k) => ({ label: fmt.short(days[k].date), v: isNum(days[k][field]) ? days[k][field] : null }));
      const firstV = pts.find((p) => isNum(p.v));
      const change = firstV && isNum(days[lastK][field]) && pts.filter((p) => isNum(p.v)).length >= 2 ? days[lastK][field] - firstV.v : null;
      const sub = `${lastK === i ? "Today" : fmt.short(days[lastK].date)}${isNum(change) ? ` · <span class="num">${sgn(change, 1)} ${unit}</span> over 30 days` : ""}`;
      return `<div class="hm-body">${stat(label, n(days[lastK][field], 1), unit, sub)}
        ${pts.filter((p) => isNum(p.v)).length >= 2 ? Charts.slot({ type: "line", data: pts, color: "var(--muted)", height: 80, area: false, fmt: (x) => App.fmt.num(x, 1) }) : ""}</div>`;
    };
    const parts = [metric("weightKg", "Weight", "kg"), metric("bodyFatPct", "Body fat", "%")].filter(Boolean);
    if (!parts.length) return "";
    return `<div class="card">${cardHead("Body", "Latest and 30-day trend")}<div class="hm-bodies">${parts.join("")}</div></div>`;
  }

  Views.health = {
    label: "Health",
    icon: "health",
    dated: true,
    render(ctx) {
      const { days, derived, i, day, fmt } = ctx;
      if (i < 0 || !day) {
        return `<div class="page">${head("Health")}${empty("No readings for this day", "There's no health data for this date. Pick another day or import your data in the Data tab.")}</div>`;
      }
      const vit = VITALS.map((v) => ({ v, m: vitalAt(days, derived, i, v) }));
      const out = vit.filter((x) => x.m.status === "high" || x.m.status === "low");
      const have = vit.filter((x) => x.m.status !== "none");
      let summary, sumCls;
      if (!have.length) {
        summary = "No vitals recorded for this day.";
        sumCls = "neutral";
      } else if (!out.length) {
        summary = have.length === vit.length ? "All vitals in your normal range" : `All ${have.length} recorded vitals in your normal range`;
        sumCls = "good";
      } else {
        summary =
          out.length === 1
            ? `${out[0].v.label} is ${out[0].m.status === "high" ? "above" : "below"} your normal range`
            : `${out.length} vitals out of range: ${out.map((x) => `${x.v.label.toLowerCase()} (${x.m.status})`).join(", ")}`;
        sumCls = "warn";
      }

      const win = windowIdx(i, 30);
      const rows = vit
        .map(({ v, m }) => {
          const st = STATUS[m.status];
          const pts = win.map((k) => {
            const x = v.raw(days[k]);
            return { label: fmt.short(days[k].date), v: isNum(x) ? x : null };
          });
          const enough = pts.filter((p) => isNum(p.v)).length >= 2;
          const spec = { type: "line", data: pts, color: v.color, height: 84, area: false, fmt: (x) => (v.signed ? App.fmt.signed(x, v.dp) : App.fmt.num(x, v.dp)) };
          if (isNum(m.lo) && isNum(m.hi)) spec.band = [m.lo, m.hi];
          return `<div class="card hm-vital hm-${m.status}">
            <div class="hm-top">
              <div class="hm-name"><h2>${v.label}</h2><span class="chip ${st.chip}">${st.text}</span></div>
              <div class="hm-val num">${vfmt(v, m.value)}<span class="stat-unit">${v.unit}</span></div>
            </div>
            <div class="hm-meta muted num">Baseline ${vfmt(v, m.baseline)} ${v.unit} · Normal ${isNum(m.lo) ? `${vfmt(v, m.lo)} to ${vfmt(v, m.hi)}` : "— (needs a week of readings)"}</div>
            ${enough ? Charts.slot(spec) : `<p class="muted hm-none">Not enough readings to draw 30 days.</p>`}
          </div>`;
        })
        .join("");

      return `<div class="page">
        ${head("Health", fmt.day(day.date))}
        <div class="card hero hm-sum hm-sum-${sumCls}">
          <div class="hm-sum-dot" aria-hidden="true"></div>
          <div><div class="hm-sum-text">${esc(summary)}</div>
          <div class="muted hm-sum-sub">Each vital is compared with your own last 30 days. Shaded band = your normal range.</div></div>
          <div class="hm-count num"><strong>${have.length - out.length}</strong>/${vit.length}<span class="muted"> in range</span></div>
        </div>
        <div class="grid">${rows}${bodyCard(days, i, fmt)}</div>
        <p class="muted hm-foot">Changes in these numbers can come from training, alcohol, travel or getting ill. They're a nudge to look at how you feel, not a diagnosis.</p>
      </div>`;
    },
    css: `
.hm-sum{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.hm-sum > * + *{margin-top:0}
.hm-sum-dot{width:14px;height:14px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 5px color-mix(in srgb,var(--muted) 18%,transparent)}
.hm-sum-good .hm-sum-dot{background:var(--green,var(--good));box-shadow:0 0 0 5px color-mix(in srgb,var(--green,var(--good)) 20%,transparent)}
.hm-sum-warn .hm-sum-dot{background:var(--yellow,var(--warn));box-shadow:0 0 0 5px color-mix(in srgb,var(--yellow,var(--warn)) 22%,transparent)}
.hm-sum-text{font-family:var(--f-display);font-size:1.2rem;font-weight:600;line-height:1.25}
.hm-sum-sub{font-size:.85em;margin-top:2px}
.hm-count{font-size:1.4rem;white-space:nowrap}
.hm-count .muted{font-size:.6em}
@media (max-width:560px){.hm-sum{grid-template-columns:auto 1fr}.hm-count{grid-column:2}}
.hm-vital{border-left:3px solid var(--line)}
.hm-normal{border-left-color:var(--green,var(--good))}
.hm-high,.hm-low{border-left-color:var(--yellow,var(--warn))}
.hm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hm-name{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.hm-name h2{font-size:15px;font-weight:600}
.hm-val{font-family:var(--f-mono);font-size:1.9rem;font-weight:600;line-height:1;white-space:nowrap}
.hm-meta{font-size:.8em}
.hm-none{font-size:.85em}
.hm-bodies{display:grid;gap:14px}
.hm-foot{font-size:.82em;margin-top:14px}`,
  };

  /* ===================================================================== JOURNAL (fuel + habits + manual activities) */
  const TAGS = ["Alcohol", "Late meal", "Caffeine after 2 pm", "Screens in bed", "Meditation", "Stretching", "Travel", "Sick", "Sauna", "Cold exposure", "Nap", "Hydrated well"];
  const WORKOUT_TYPES = ["Running", "Walking", "Cycling", "Strength training", "HIIT", "Yoga", "Swimming", "Sport", "Rowing", "Hiking", "Other"];
  const WATER_TARGET = 2500;
  const CAF_LIMIT = 400;

  function fuelTargets(ctx) {
    const { days, i, day } = ctx;
    const p = fullProfile(ctx.profile);
    let active = day && isNum(day.activeKcal) ? day.activeKcal : null;
    let activeNote = "";
    if (active == null) {
      const end = i >= 0 ? i : days.length - 1;
      active = (end >= 0 && avg(windowIdx(end, 30).map((k) => days[k] && days[k].activeKcal))) || 0;
      activeNote = "your 30-day average";
    }
    const bmr = E.bmr ? E.bmr(p) : 1400;
    const kcal = Math.round((isNum(bmr) ? bmr : 1400) * 1.2 + active);
    const weight = isNum(p.weightKg) ? p.weightKg : (day && day.weightKg) || 62;
    return {
      kcal,
      protein: Math.round(weight * 1.6),
      carbs: Math.round((kcal * 0.45) / 4),
      fat: Math.round((kcal * 0.3) / 9),
      active: Math.round(active),
      activeNote,
    };
  }

  const segScale = (key, cur, lowWord, highWord) =>
    `<div class="jr-scale"><div class="seg" role="group" aria-label="${key}">${[1, 2, 3, 4, 5]
      .map((v) => `<button type="button" class="${cur === v ? "on" : ""}" data-action="jr-scale" data-k="${key}" data-v="${v}" aria-pressed="${cur === v}">${v}</button>`)
      .join("")}</div><div class="jr-scale-ends muted"><span>${lowWord}</span><span>${highWord}</span></div></div>`;

  function impactBlock(days, derived) {
    let impact = [];
    try {
      impact = (E.journalImpact && E.journalImpact(days, derived)) || [];
    } catch (e) {
      impact = [];
    }
    impact = impact.filter((r) => r && isNum(r.diff));
    if (!impact.length) {
      return `<div class="empty"><p><strong>Not enough nights yet.</strong></p><p class="muted">Keep tagging your evenings. A habit shows up here once it has at least 3 nights with it and 3 without, each followed by a recovery score.</p></div>`;
    }
    const maxAbs = Math.max(5, ...impact.map((r) => Math.abs(r.diff)));
    const rows = impact
      .map((r) => {
        const b = Math.abs(r.diff) < 3 ? "yellow" : r.diff > 0 ? "green" : "red";
        const c = bandColor(b);
        const w = (Math.abs(r.diff) / maxAbs) * 50;
        const style = r.diff >= 0 ? `left:50%;width:${w.toFixed(1)}%` : `right:50%;width:${w.toFixed(1)}%`;
        return `<div class="jr-imp">
          <div class="jr-imp-top"><strong>${esc(r.tag)}</strong><span class="jr-imp-v num" style="color:${c}">${sgn(r.diff, 0)}%</span></div>
          <div class="jr-div" aria-hidden="true"><div class="jr-div-fill" style="${style};--c:${c}"></div></div>
          <div class="muted jr-imp-sub num">${n(r.withAvg)}% after · ${n(r.withoutAvg)}% otherwise · ${isNum(r.n) ? r.n : 0} night${r.n === 1 ? "" : "s"}</div>
        </div>`;
      })
      .join("");
    return `<div class="jr-imps">${rows}</div><p class="muted jr-foot">Next-morning recovery after nights with the habit, compared with nights without. A pattern in your data, not proof of cause.</p>`;
  }

  Views.journal = {
    label: "Journal",
    icon: "journal",
    dated: true,
    render(ctx) {
      const { days, derived, i, day, d, fmt } = ctx;
      const entry = ctx.entry || App.getEntry(App.sel());
      const meals = entry.meals || [];
      const t = fuelTargets(ctx);
      const tot = { kcal: 0, protein: 0, carbs: 0, fat: 0 };
      for (const m of meals) for (const k in tot) tot[k] += isNum(+m[k]) ? +m[k] : 0;

      const macro = (label, have, want, unit, color) => {
        const pct = want ? (have / want) * 100 : 0;
        const left = want - have;
        return `<div class="jr-macro">
          <div class="jr-macro-top"><span>${label}</span><span class="num"><strong>${n(have)}</strong> / ${n(want)} ${unit}</span></div>
          ${bar(pct, color)}
          <div class="muted jr-small">${left >= 0 ? `${n(left)} ${unit} left` : `${n(-left)} ${unit} over`}</div></div>`;
      };

      const mealList = meals.length
        ? `<div class="list">${[...meals]
            .sort((a, b) => String(a.time || "").localeCompare(String(b.time || "")))
            .map(
              (m) => `<div class="row jr-row"><div><strong>${esc(m.name || "Meal")}</strong>
            <div class="muted num">${[clockOf(m.time), `${n(+m.kcal || 0)} kcal`, `P ${n(+m.protein || 0)} g`, `C ${n(+m.carbs || 0)} g`, `F ${n(+m.fat || 0)} g`].filter(Boolean).join(" · ")}</div></div>
            <button class="btn ghost small" data-action="jr-del-meal" data-id="${esc(m.id)}" aria-label="Delete ${esc(m.name || "meal")}">Delete</button></div>`,
            )
            .join("")}</div>`
        : `<p class="muted">Nothing logged yet for this day.</p>`;

      const now = new Date();
      const mealForm = `<form data-submit="jr-add-meal" class="stack">
        <div class="form-row">
          <label class="field jr-grow"><span>What you ate</span><input name="name" maxlength="80" required placeholder="e.g. Dal, rice, salad"></label>
          <label class="field"><span>Time</span><input type="time" name="time" value="${hhmm(now)}"></label>
        </div>
        <div class="form-row">
          <label class="field"><span>kcal</span><input type="number" name="kcal" min="0" max="5000" inputmode="numeric" required></label>
          <label class="field"><span>Protein g</span><input type="number" name="protein" min="0" max="500" step="any" inputmode="decimal"></label>
          <label class="field"><span>Carbs g</span><input type="number" name="carbs" min="0" max="1000" step="any" inputmode="decimal"></label>
          <label class="field"><span>Fat g</span><input type="number" name="fat" min="0" max="500" step="any" inputmode="decimal"></label>
        </div>
        <div><button class="btn primary" type="submit">Add meal</button></div>
      </form>`;

      // activities (device + manual)
      const ws = i >= 0 && day ? workoutsOf(day, d) : (entry.workouts || []).map((w) => ({ ...w, manual: true }));
      const wsHtml = ws.length
        ? `<div class="list">${ws
            .map(
              (w) => `<div class="row jr-row">
          <div><strong>${esc(w.type || "Workout")}</strong> ${w.manual ? '<span class="chip neutral">Logged</span>' : ""}
          <div class="muted num">${[startClock(w), isNum(w.durationMin) ? fmt.mins(w.durationMin) : "", isNum(w.avgHr) ? `${n(w.avgHr)} bpm avg` : "", isNum(w.kcal) ? `${n(w.kcal)} kcal` : ""].filter(Boolean).join(" · ")}</div></div>
          <div class="jr-w-end">${isNum(w.strain) ? `<span class="jr-strain num" title="Activity strain">${strainF(w.strain)}</span>` : ""}
          ${w.manual ? `<button class="btn ghost small" data-action="jr-del-workout" data-id="${esc(w.id)}" aria-label="Delete ${esc(w.type || "activity")}">Delete</button>` : ""}</div>
        </div>`,
            )
            .join("")}</div>`
        : `<p class="muted">No activities recorded this day.</p>`;
      const wForm = `<form data-submit="jr-add-workout" class="stack">
        <div class="form-row">
          <label class="field"><span>Type</span><select name="type">${WORKOUT_TYPES.map((x) => `<option>${x}</option>`).join("")}</select></label>
          <label class="field"><span>Start</span><input type="time" name="start" value="18:00" required></label>
          <label class="field"><span>Minutes</span><input type="number" name="duration" min="1" max="600" inputmode="numeric" required></label>
        </div>
        <div class="form-row">
          <label class="field"><span>Avg HR (optional)</span><input type="number" name="avgHr" min="40" max="230" inputmode="numeric"></label>
          <label class="field"><span>kcal (optional)</span><input type="number" name="kcal" min="0" max="5000" inputmode="numeric"></label>
        </div>
        <div><button class="btn primary" type="submit">Add activity</button></div>
        <p class="muted jr-small">Add an average heart rate so the session counts toward strain.</p>
      </form>`;

      const water = entry.waterMl || 0;
      const caf = entry.caffeineMg || 0;
      const j = entry.journal || { tags: [], stress: null, mood: null, note: "" };
      const tags = j.tags || [];
      const extraTags = tags.filter((x) => !TAGS.includes(x));

      return `<div class="page">
        ${head("Journal", fmt.day(App.sel()))}
        <div class="grid">
          <div class="card hero span-2">
            ${cardHead("Tonight's habits", "They shape tomorrow's recovery")}
            <div class="jr-tags">${TAGS.concat(extraTags)
              .map((tg) => `<button type="button" class="tag ${tags.includes(tg) ? "on" : ""}" data-action="jr-tag" data-tag="${esc(tg)}" aria-pressed="${tags.includes(tg)}">${esc(tg)}</button>`)
              .join("")}</div>
            <div class="form-row">
              <div class="field"><span>Stress</span>${segScale("stress", j.stress, "calm", "very stressed")}</div>
              <div class="field"><span>Mood</span>${segScale("mood", j.mood, "low", "great")}</div>
            </div>
            <label class="field"><span>Note</span><textarea name="note" rows="3" maxlength="2000" data-input="jr-note" placeholder="Anything worth remembering about today">${esc(j.note || "")}</textarea></label>
          </div>
          <div class="card">
            ${cardHead("Fuel targets", `<span class="num">${n(t.kcal)} kcal</span>`)}
            ${macro("Calories", tot.kcal, t.kcal, "kcal", "var(--strain)")}
            ${macro("Protein", tot.protein, t.protein, "g", "var(--green, var(--good))")}
            ${macro("Carbs", tot.carbs, t.carbs, "g", "var(--sleep)")}
            ${macro("Fat", tot.fat, t.fat, "g", "var(--yellow, var(--warn))")}
            <p class="muted jr-small">Resting burn ×1.2 plus <span class="num">${n(t.active)}</span> active kcal${t.activeNote ? ` (${t.activeNote})` : ""}. Protein at 1.6 g per kg.</p>
          </div>
          <div class="card">
            ${cardHead("Meals", `<span class="num">${meals.length}</span>`)}
            ${mealList}
          </div>
          <div class="card">
            ${cardHead("Add a meal")}
            ${mealForm}
          </div>
          <div class="card">
            ${cardHead("Water", `<span class="num">${n(water)} / ${n(WATER_TARGET)} ml</span>`)}
            ${bar((water / WATER_TARGET) * 100, "var(--sleep)")}
            <div class="jr-btns">
              <button class="btn small" data-action="jr-water" data-d="-250" ${water <= 0 ? "disabled" : ""} aria-label="Remove 250 ml">−250 ml</button>
              <button class="btn primary small" data-action="jr-water" data-d="250" aria-label="Add 250 ml">+250 ml</button>
            </div>
            <div class="card-head jr-sub"><h2>Caffeine</h2><div class="card-meta num">${n(caf)} mg</div></div>
            ${bar((caf / CAF_LIMIT) * 100, caf > CAF_LIMIT ? "var(--red, var(--bad))" : "var(--yellow, var(--warn))")}
            <div class="jr-btns">
              <button class="btn small" data-action="jr-caf" data-d="-40" ${caf <= 0 ? "disabled" : ""} aria-label="Remove 40 mg">−</button>
              <button class="btn small" data-action="jr-caf" data-d="40">+ Tea <span class="muted">40</span></button>
              <button class="btn small" data-action="jr-caf" data-d="80">+ Coffee <span class="muted">80</span></button>
            </div>
            ${caf > CAF_LIMIT ? `<p class="insight">That's over ${CAF_LIMIT} mg, the usual daily ceiling for adults. Caffeine late in the day can also cut into deep sleep.</p>` : ""}
          </div>
          <div class="card">
            ${cardHead("Activities", `<span class="num">${ws.length}</span>`)}
            ${wsHtml}
          </div>
          <div class="card">
            ${cardHead("Log an activity")}
            ${wForm}
          </div>
          <div class="card span-2">
            ${cardHead("What affects your recovery", "Next-morning recovery")}
            ${impactBlock(days || [], derived || [])}
          </div>
        </div>
      </div>`;
    },
    css: `
.jr-macro{margin:10px 0}
.jr-macro-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.jr-small,.jr-foot{font-size:.82em;margin-top:4px}
.jr-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.jr-w-end{display:flex;align-items:center;gap:10px;flex:none}
.jr-strain{font-family:var(--f-mono);font-weight:700;color:var(--strain);font-size:1.05rem}
.jr-grow{flex:1 1 200px}
.jr-btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.jr-sub{margin-top:18px}
.jr-tags{display:flex;flex-wrap:wrap;gap:8px}
.jr-scale-ends{display:flex;justify-content:space-between;font-size:.78em;margin-top:4px}
.jr-imps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 22px}
.jr-imp{padding:8px 0;border-bottom:1px solid var(--line)}
.jr-imp-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.jr-imp-v{font-family:var(--f-mono);font-weight:700;font-size:1.1rem}
.jr-imp-sub{font-size:.78em;margin-top:4px}
.jr-div{position:relative;height:6px;border-radius:3px;background:var(--surface-2);margin-top:6px}
.jr-div::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.jr-div-fill{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--c)}`,
  };

  on("onSubmit", "jr-add-meal", (form, fd) => {
    const name = String(fd.get("name") || "").trim().slice(0, 80);
    const kcal = +fd.get("kcal");
    if (!name) return App.toast("Give the meal a name.");
    if (fd.get("kcal") == null || fd.get("kcal") === "" || !(kcal >= 0 && kcal <= 5000)) return App.toast("Enter the calories (0–5,000).");
    const g = (k) => {
      const v = +fd.get(k);
      return v >= 0 && v < 1000 ? Math.round(v * 10) / 10 : 0;
    };
    const time = minsOf(fd.get("time")) != null ? fd.get("time") : hhmm(new Date());
    update((e) => {
      e.meals = e.meals || [];
      e.meals.push({ id: uid(), name, time, kcal: Math.round(kcal), protein: g("protein"), carbs: g("carbs"), fat: g("fat") });
    });
    App.toast("Meal added");
  });
  on("on", "jr-del-meal", (el) => {
    const id = el.dataset.id;
    update((e) => {
      const before = (e.meals || []).length;
      e.meals = (e.meals || []).filter((m) => String(m.id) !== id);
      if (e.meals.length === before) return false;
    });
  });
  on("onSubmit", "jr-add-workout", (form, fd) => {
    const dur = Math.round(+fd.get("duration"));
    if (!(dur > 0 && dur <= 600)) return App.toast("Enter how many minutes the activity lasted.");
    const type = WORKOUT_TYPES.includes(fd.get("type")) ? fd.get("type") : "Other";
    const t = minsOf(fd.get("start")) ?? 18 * 60;
    const sel = App.sel();
    const avgHr = +fd.get("avgHr");
    const kcal = +fd.get("kcal");
    const w = { id: uid(), type, start: `${sel}T${pad(Math.floor(t / 60))}:${pad(t % 60)}:00`, durationMin: dur, source: "Manual" };
    if (avgHr >= 40 && avgHr <= 230) w.avgHr = Math.round(avgHr);
    if (kcal > 0 && kcal <= 5000) w.kcal = Math.round(kcal);
    update((e) => {
      e.workouts = e.workouts || [];
      e.workouts.push(w);
    });
    App.toast(`${type} added`);
  });
  on("on", "jr-del-workout", (el) => {
    const id = el.dataset.id;
    update((e) => {
      const before = (e.workouts || []).length;
      e.workouts = (e.workouts || []).filter((w) => String(w.id) !== id);
      if (e.workouts.length === before) return false;
    });
  });
  on("on", "jr-water", (el) => {
    const d = +el.dataset.d || 0;
    update((e) => {
      e.waterMl = Math.max(0, Math.min(10000, (e.waterMl || 0) + d));
    });
  });
  on("on", "jr-caf", (el) => {
    const d = +el.dataset.d || 0;
    update((e) => {
      e.caffeineMg = Math.max(0, Math.min(2000, (e.caffeineMg || 0) + d));
    });
  });
  const journalOf = (e) => (e.journal = { tags: [], stress: null, mood: null, note: "", ...(e.journal || {}) });
  on("on", "jr-tag", (el) => {
    const tag = el.dataset.tag;
    update((e) => {
      const j = journalOf(e);
      const tags = j.tags || [];
      if (!TAGS.includes(tag) && !tags.includes(tag)) return false;
      j.tags = tags.includes(tag) ? tags.filter((x) => x !== tag) : tags.concat(tag);
    });
  });
  on("on", "jr-scale", (el) => {
    const k = el.dataset.k;
    const v = +el.dataset.v;
    if ((k !== "stress" && k !== "mood") || !(v >= 1 && v <= 5)) return;
    update((e) => {
      const j = journalOf(e);
      j[k] = j[k] === v ? null : v;
    });
  });
  on("onInput", "jr-note", (el) => {
    const note = String(el.value || "").slice(0, 2000);
    update((e) => {
      const j = journalOf(e);
      if (j.note === note) return false;
      j.note = note;
    });
  });

  /* ===================================================================== TRENDS + BIOLOGICAL AGE */
  let trendRange = 30; // 7 | 30 | 90 | 0 (all)
  let trendTab = "trends"; // trends | bio

  function rangeIdx(days, range) {
    const last = days.length - 1;
    if (!range) return { cur: days.map((_, k) => k), prev: [] };
    const start = E.addDays(days[last].date, -(range - 1));
    const pStart = E.addDays(start, -range);
    const cur = [], prev = [];
    days.forEach((d, k) => {
      if (d.date >= start) cur.push(k);
      else if (d.date >= pStart) prev.push(k);
    });
    return { cur, prev };
  }

  function weekly(days, derived) {
    const groups = new Map();
    days.forEach((day, k) => {
      const dt = E.parseYmd(day.date);
      const wk = E.addDays(day.date, -((dt.getDay() + 6) % 7));
      if (!groups.has(wk)) groups.set(wk, []);
      groups.get(wk).push(k);
    });
    return [...groups.entries()].slice(-8).reverse().map(([wk, ks]) => ({
      week: wk,
      rec: avg(ks.map((k) => derived[k] && derived[k].recovery)),
      strain: avg(ks.map((k) => derived[k] && derived[k].strain)),
      perf: avg(ks.map((k) => perfOf(derived[k]))),
      asleep: avg(ks.map((k) => asleepOf(derived[k]))),
      hrv: avg(ks.map((k) => days[k].hrv)),
    }));
  }

  /* ---- biological age ---- */
  function safeBio(days, derived, profile) {
    try {
      const ba = E.bioAge ? E.bioAge(days, derived, profile, days.length - 1) : null;
      return ba && isNum(ba.age) ? ba : null;
    } catch (e) {
      return null;
    }
  }
  const bioDelta = (ba) => (isNum(ba.delta) ? ba.delta : isNum(ba.chronological) ? ba.age - ba.chronological : 0);
  const bioDeltaText = (ba) => {
    const dl = bioDelta(ba);
    if (Math.abs(dl) < 0.05) return "Right on your calendar age";
    return `${Math.abs(dl).toFixed(1)} years ${dl < 0 ? "younger" : "older"}`;
  };
  const paceLabelOf = (ba) =>
    typeof ba.paceLabel === "string" && ba.paceLabel
      ? ba.paceLabel
      : ba.pace < 0.95 ? "Slower than calendar" : ba.pace > 1.05 ? "Faster than calendar" : "In step with calendar";
  function confidenceOf(ba) {
    const c = ba.confidence;
    let level = null;
    if (typeof c === "string") level = c.toLowerCase();
    else if (isNum(c)) level = c > 1 ? (c >= 70 ? "high" : c >= 40 ? "medium" : "low") : c >= 0.7 ? "high" : c >= 0.4 ? "medium" : "low";
    if (!level) return "";
    const cls = level === "high" ? "good" : level === "low" ? "warn" : "neutral";
    return `<span class="chip ${cls}">${esc(level.charAt(0).toUpperCase() + level.slice(1))} confidence</span>`;
  }
  const valText = (v) => (isNum(v) ? n(v, Math.abs(v) < 10 && v % 1 ? 1 : 0) : v != null && v !== "" ? esc(v) : "");

  function paceScale(ba) {
    if (!isNum(ba.pace)) return "";
    const p = Math.max(0.5, Math.min(1.5, ba.pace));
    const left = ((p - 0.5) / 1) * 100;
    return `<div class="ba-pace">
      <div class="ba-pace-head"><span class="stat-label">Pace of aging</span><span><strong class="num ba-pace-v">${ba.pace.toFixed(2)}×</strong> <span class="muted">${esc(paceLabelOf(ba))}</span></span></div>
      <div class="ba-pace-track" role="img" aria-label="Pace ${ba.pace.toFixed(2)} times calendar"><div class="ba-pace-mid"></div><div class="ba-pace-mark" style="left:${left.toFixed(1)}%"></div></div>
      <div class="ba-pace-ticks muted num"><span>0.5×</span><span>1.0×</span><span>1.5×</span></div>
    </div>`;
  }

  function bioSummaryCard(ba) {
    if (!ba) return "";
    const dl = bioDelta(ba);
    const c = Math.abs(dl) < 0.5 ? "var(--ink)" : dl < 0 ? bandColor("green") : bandColor("red");
    return `<div class="card hero ba-mini">
      <div><div class="stat-label">Biological age</div><div class="ba-mini-v num" style="color:${c}">${ba.age.toFixed(1)}</div></div>
      <div class="ba-mini-t"><div>${esc(bioDeltaText(ba))}${isNum(ba.chronological) ? ` <span class="muted">than ${n(ba.chronological)}</span>` : ""}</div>
      ${isNum(ba.pace) ? `<div class="muted num">Aging at ${ba.pace.toFixed(2)}× · ${esc(paceLabelOf(ba))}</div>` : ""}</div>
      <button class="btn small" data-action="trend-tab" data-t="bio">See what drives it</button>
    </div>`;
  }

  function bioPage(ba, fmt) {
    if (!ba) return `<div class="card">${empty("Not enough data yet", "Biological age needs a few weeks of resting heart rate and HRV readings.")}</div>`;
    const dl = bioDelta(ba);
    const cls = Math.abs(dl) < 0.5 ? "neutral" : dl < 0 ? "good" : "bad";
    const parts = (ba.parts || []).filter((p) => p && isNum(p.years)).sort((a, b) => Math.abs(b.years) - Math.abs(a.years));
    const maxAbs = Math.max(2, ...parts.map((p) => Math.abs(p.years)));
    const rows = parts
      .map((p) => {
        const younger = p.years <= 0;
        const c = bandColor(Math.abs(p.years) < 0.1 ? "yellow" : younger ? "green" : "red");
        const w = (Math.abs(p.years) / maxAbs) * 50;
        const style = younger ? `right:50%;width:${w.toFixed(1)}%` : `left:50%;width:${w.toFixed(1)}%`;
        const now = valText(p.value), target = valText(p.target);
        return `<div class="ba-part">
          <div class="ba-part-top"><strong>${esc(p.key || "Factor")}</strong><span class="num ba-yrs" style="color:${c}">${sgn(p.years, 1)} yr</span></div>
          <div class="jr-div" aria-hidden="true"><div class="jr-div-fill" style="${style};--c:${c}"></div></div>
          <div class="ba-part-meta muted num">${[p.detail ? esc(p.detail) : "", now ? `Now ${now}` : "", target ? `Target ${target}` : ""].filter(Boolean).join(" · ")}</div>
          ${p.tip ? `<div class="ba-tip">${esc(p.tip)}</div>` : ""}
        </div>`;
      })
      .join("");
    const hist = (Array.isArray(ba.history) ? ba.history : []).filter((h) => h && h.date && isNum(h.age));
    let histHtml = `<p class="muted">The history line appears after a few weeks of readings.</p>`;
    if (hist.length >= 2) {
      const vals = hist.map((h) => h.age).concat(isNum(ba.chronological) ? [ba.chronological] : []);
      const spec = {
        type: "line",
        data: hist.map((h) => ({ label: fmt.short(h.date), v: h.age })),
        color: "var(--accent)",
        height: 180,
        area: false,
        fmt: (x) => App.fmt.num(x, 1),
        yMin: Math.floor(Math.min(...vals) - 1),
        yMax: Math.ceil(Math.max(...vals) + 1),
      };
      if (isNum(ba.chronological)) spec.ref = { v: ba.chronological, label: "Calendar age" };
      histHtml = Charts.slot(spec);
    }
    return `<div class="grid-2">
      <div class="card hero ba-hero">
        <div class="ba-head">
          <div><div class="stat-label">Biological age</div><div class="ba-big num">${ba.age.toFixed(1)}</div></div>
          <div class="ba-vs"><span class="chip ${cls}">${esc(bioDeltaText(ba))}</span>${isNum(ba.chronological) ? `<div class="muted">Calendar age <span class="num">${n(ba.chronological)}</span></div>` : ""}${confidenceOf(ba)}</div>
        </div>
        ${paceScale(ba)}
      </div>
      <div class="card">${cardHead("Biological age over time", "Weekly")}${histHtml}</div>
      <div class="card span-2">
        ${cardHead("What moves it", parts.length ? `<span class="legend"><span class="key" style="--c:${bandColor("green")}">Younger</span><span class="key" style="--c:${bandColor("red")}">Older</span></span>` : "")}
        ${parts.length ? `<div class="ba-parts">${rows}</div>` : `<p class="muted">No components available yet.</p>`}
      </div>
    </div>
    <p class="muted ba-note">An estimate built from wearable data such as resting heart rate, HRV, sleep and activity. It is not a medical test.</p>`;
  }

  Views.trends = {
    label: "Trends",
    icon: "trends",
    dated: false,
    render(ctx) {
      const { days, derived, fmt } = ctx;
      if (!days || !days.length) return `<div class="page">${head("Trends")}${empty("No data yet", "Import your health data in the Data tab to see trends.")}</div>`;
      const ba = safeBio(days, derived, ctx.profile);
      const tabs = `<div class="seg" role="tablist" aria-label="Section">${[["trends", "Trends"], ["bio", "Biological age"]]
        .map(([k, l]) => `<button type="button" role="tab" class="${trendTab === k ? "on" : ""}" data-action="trend-tab" data-t="${k}" aria-selected="${trendTab === k}">${l}</button>`)
        .join("")}</div>`;
      if (trendTab === "bio") {
        return `<div class="page">${head("Trends", "Biological age · last 30 days of data")}<div class="tr-bar">${tabs}</div>${bioPage(ba, fmt)}</div>`;
      }

      const { cur, prev } = rangeIdx(days, trendRange);
      const seg = `<div class="seg" role="group" aria-label="Range">${[[7, "7D"], [30, "30D"], [90, "90D"], [0, "All"]]
        .map(([r, l]) => `<button type="button" class="${trendRange === r ? "on" : ""}" data-action="trend-range" data-r="${r}" aria-pressed="${trendRange === r}">${l}</button>`)
        .join("")}</div>`;
      const H = 150;
      const lbl = (k) => fmt.short(days[k].date);
      const dv = (k) => derived[k] || {};

      const deltaChip = (fn, dir, dp, unit) => {
        const a = avg(cur.map(fn)), b = avg(prev.map(fn));
        if (!isNum(a) || !isNum(b) || prev.filter((k) => isNum(fn(k))).length < 3) return "";
        const diff = a - b;
        const tiny = Math.abs(diff) < (dp ? 0.05 : 0.5);
        const cls = tiny || !dir ? "neutral" : diff * dir > 0 ? "good" : "bad";
        return `<span class="chip ${cls} num" title="Change vs the previous ${trendRange} days">${sgn(diff, dp)}${unit || ""}</span>`;
      };
      const card = (title, unit, avgText, chip, body, extra) =>
        `<div class="card">${cardHead(title + (unit ? ` <span class="muted">(${unit})</span>` : ""), chip)}
          <div class="tr-avg"><span class="muted">Average</span> <span class="num tr-avg-v">${avgText}</span>${extra || ""}</div>${body}</div>`;
      const has = (fn) => cur.some((k) => isNum(fn(k)));
      const none = (what) => `<p class="muted">No ${what} in this range.</p>`;
      const lineCard = (title, unit, fn, color, dir, dp, opts) => {
        const a = avg(cur.map(fn));
        const spec = { type: "line", data: cur.map((k) => ({ label: lbl(k), v: isNum(fn(k)) ? fn(k) : null })), color, height: H, area: true, fmt: (x) => App.fmt.num(x, dp) };
        Object.assign(spec, opts || {});
        return card(title, unit, isNum(a) ? n(a, dp) : "—", deltaChip(fn, dir, dp, ""), has(fn) ? Charts.slot(spec) : none(title.toLowerCase()));
      };

      // Recovery
      const recF = (k) => dv(k).recovery;
      const counts = { green: 0, yellow: 0, red: 0 };
      for (const k of cur) {
        const b = bandOfD(dv(k));
        if (b) counts[b]++;
      }
      const recAvg = avg(cur.map(recF));
      const recCard = card(
        "Recovery",
        "",
        isNum(recAvg) ? `${n(recAvg)}%` : "—",
        deltaChip(recF, 1, 0, " pts"),
        has(recF)
          ? Charts.slot({ type: "bars", data: cur.map((k) => ({ label: lbl(k), v: isNum(recF(k)) ? recF(k) : null, color: bandColor(bandOfD(dv(k))) })), height: H, max: 100, fmt: (x) => App.fmt.num(x) + "%" })
          : none("recovery scores"),
        `<span class="tr-counts num">${["green", "yellow", "red"].map((b) => `<span class="key" style="--c:${bandColor(b)}">${counts[b]}</span>`).join("")}</span>`,
      );

      // Strain 0–21
      const stF = (k) => dv(k).strain;
      const stAvg = avg(cur.map(stF));
      const strainCard = card(
        "Strain",
        "0–21",
        isNum(stAvg) ? strainF(stAvg) : "—",
        deltaChip(stF, 0, 1, ""),
        has(stF) ? Charts.slot({ type: "bars", data: cur.map((k) => ({ label: lbl(k), v: isNum(stF(k)) ? stF(k) : null })), color: "var(--strain)", height: H, max: 21, fmt: (x) => App.fmt.num(x, x % 1 ? 1 : 0) }) : none("strain"),
      );

      const perfCard = lineCard("Sleep performance", "%", (k) => perfOf(dv(k)), "var(--sleep)", 1, 0, { yMin: 0, yMax: 100, band: [85, 100] });

      // Hours asleep vs need
      const hA = (k) => (isNum(asleepOf(dv(k))) ? asleepOf(dv(k)) / 60 : null);
      const hN = (k) => (isNum(needOf(dv(k))) ? needOf(dv(k)) / 60 : null);
      const aA = avg(cur.map(hA)), aN = avg(cur.map(hN));
      const metNights = cur.filter((k) => isNum(hA(k)) && isNum(hN(k)) && hA(k) >= hN(k) * 0.95).length;
      const sleepNights = cur.filter((k) => isNum(hA(k))).length;
      const hoursSpec = {
        type: "bars",
        data: cur.map((k) => ({ label: lbl(k), v: hA(k), color: isNum(hA(k)) && isNum(hN(k)) && hA(k) < hN(k) * 0.95 ? "color-mix(in srgb, var(--sleep) 45%, transparent)" : "var(--sleep)" })),
        height: H,
        fmt: (x) => App.fmt.num(x, 1),
      };
      if (isNum(aN)) hoursSpec.ref = { v: Math.round(aN * 10) / 10, label: "Avg need" };
      const hoursCard = card(
        "Hours asleep vs need",
        "h",

        })

      const rangeLabel = trendRange ? `Last ${trendRange} days${prev.length ? `, vs the ${trendRange} before` : ""}` : `All ${days.length} days`;
      return `<div class="page">

    },
    css: `

  };

  on("on", "trend-range", (el) => {
    const r = +el.dataset.r;
    if (![0, 7, 30, 90].includes(r) || r === trendRange) return;
    trendRange = r;
    App.rerender();
  });
  on("on", "trend-tab", (el) => {
    const t = el.dataset.t;
    if ((t !== "trends" && t !== "bio") || t === trendTab) return;
    trendTab = t;
    App.rerender();
  });

  /* ===================================================================== COACH */
  const coach = {
    status: "unknown", // unknown | checking | ready | absent | blocked
    sample: null,
    log: [], // {role, content, error?}
    streaming: false,
    live: "",
  };
  const SUGGESTIONS = [
    "How hard should I train today?",
    "Why is my recovery where it is?",
    "Am I sleeping enough for my training load?",
    "Which habits help my recovery most?",
    "Plan my next 7 days around recovery",
    "What would lower my biological age?",
  ];

  function renderMd(text) {
    const lines = esc(text).replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>").split(/\r?\n/);
    let html = "", inList = false, para = [];
    const flush = () => {
      if (para.length) html += `<p>${para.join("<br>")}</p>`;
      para = [];
    };
    for (const raw of lines) {
      const line = raw.trimEnd();
      const li = /^\s*(?:[-•*]|\d+\.)\s+(.*)$/.exec(line);
      if (li) {
        flush();
        if (!inList) { html += "<ul>"; inList = true; }
        html += `<li>${li[1]}</li>`;
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        if (!line.trim()) flush();
        else para.push(line.replace(/^#{1,6}\s+/, ""));
      }
    }
    flush();
    if (inList) html += "</ul>";
    return html;
  }

  function buildContext() {
    const days = App.days();
    const derived = App.derived();
    const p = fullProfile(App.profile());
    if (!days.length) return "No health data has been recorded yet.";
    const last = days.length - 1;
    const r = (v, dp) => (isNum(v) ? (dp ? v.toFixed(dp) : String(Math.round(v))) : "");
    const q = (s) => `"${String(s).replace(/"/g, "'")}"`;
    const rows = ["date,recovery,band,strain,sleepPerf,asleepMin,needMin,hrv,rhr,resp,zoneMin_z1-z5,workouts,tags,outOfRange"];
    for (const k of windowIdx(last, 30)) {
      const day = days[k], d = derived[k] || {};
      const ws = workoutsOf(day, d)
        .map((w) => `${w.type} ${isNum(w.durationMin) ? w.durationMin : "?"}m${isNum(w.avgHr) ? " " + w.avgHr + "bpm" : ""}${isNum(w.strain) ? " strain " + w.strain.toFixed(1) : ""}`)
        .join("; ");
      const tags = ((day.entry && day.entry.journal && day.entry.journal.tags) || []).join("; ");
      const z = Array.isArray(d.zones) ? d.zones.slice(1, 6).map((x) => r(x)).join("/") : "";
      const mon = d.monitor && typeof d.monitor === "object"
        ? Object.entries(d.monitor).filter(([, m]) => m && (m.status === "high" || m.status === "low")).map(([kk, m]) => `${kk} ${m.status}`).join("; ")
        : "";
      rows.push([day.date, r(d.recovery), bandOfD(d) || "", r(d.strain, 1), r(perfOf(d)), r(asleepOf(d)), r(needOf(d)), r(day.hrv), r(day.restingHr), r(day.respRate, 1), z, q(ws), q(tags), q(mon)].join(","));
    }
    const k90 = windowIdx(last, 90);
    const a90 = (f) => avg(k90.map(f));
    const dl = derived[last] || {};
    const target = Array.isArray(dl.strainTarget) && isNum(dl.strainTarget[0]) ? `${dl.strainTarget[0]}–${dl.strainTarget[1]}` : "";
    let ba = null;
    try { ba = E.bioAge ? E.bioAge(days, derived, p, last) : null; } catch (e) { ba = null; }
    let imp = [];
    try { imp = ((E.journalImpact && E.journalImpact(days, derived)) || []).filter((x) => x && isNum(x.diff)).slice(0, 6); } catch (e) { imp = []; }
    const counts = { green: 0, yellow: 0, red: 0 };
    for (const k of windowIdx(last, 30)) { const b = bandOfD(derived[k]); if (b) counts[b]++; }
    return [
      `Profile: age ${p.age}, sex ${p.sex}, height ${p.heightCm} cm, weight ${p.weightKg} kg, max HR ${E.maxHrOf ? E.maxHrOf(p) : ""}.`,
      App.mode && App.mode() === "sample" ? "Note: this is built-in SAMPLE data, not the viewer's real data." : "",
      `Scales: strain 0–21 (cardio load, log-like; 21 is near impossible). Recovery 0–100% with bands green 67–100, yellow 34–66, red 0–33. Sleep performance = % of computed sleep need. Zone minutes z1–z5 by heart-rate reserve.`,
      `Latest day: ${days[last].date}. Recovery ${r(dl.recovery)}% (${bandOfD(dl) || "no band"}), strain ${r(dl.strain, 1)}${target ? `, suggested strain today ${target}` : ""}, sleep performance ${r(perfOf(dl))}%, sleep need ${r(needOf(dl))} min.`,
      "",
      "Last 30 days (CSV; outOfRange lists vitals outside the user's normal range):",
      rows.join("\n"),
      "",
      `Last 30 days recovery bands: ${counts.green} green, ${counts.yellow} yellow, ${counts.red} red.`,
      `90-day averages: recovery ${r(a90((k) => derived[k] && derived[k].recovery))}%, strain ${r(a90((k) => derived[k] && derived[k].strain), 1)}, sleep performance ${r(a90((k) => perfOf(derived[k])))}%, asleep ${r(a90((k) => asleepOf(derived[k])))} min, HRV ${r(a90((k) => days[k].hrv))} ms, resting HR ${r(a90((k) => days[k].restingHr))} bpm, steps ${r(a90((k) => days[k].steps))}.`,
      ba && isNum(ba.age)
        ? `Biological age estimate: ${ba.age.toFixed(1)} (calendar ${ba.chronological})${isNum(ba.pace) ? `; pace of aging ${ba.pace.toFixed(2)}x (${paceLabelOf(ba)})` : ""}; components: ${(ba.parts || []).filter((x) => x && isNum(x.years)).map((x) => `${x.key} ${x.years >= 0 ? "+" : ""}${x.years.toFixed(1)} yr${x.detail ? ` (${x.detail})` : ""}`).join("; ")}.`
        : "Biological age: not enough data.",
      imp.length ? `Journal tags vs next-morning recovery: ${imp.map((x) => `${x.tag} ${x.diff >= 0 ? "+" : ""}${x.diff.toFixed(0)} pts (n=${x.n})`).join("; ")}.` : "",
    ].filter(Boolean).join("\n");
  }

  const INSTRUCTIONS = `You are the Cadence coach inside a personal training and recovery dashboard. Answer the user's question about their own data below.
Rules: be concise (under ~180 words unless they ask for a plan). Be specific: cite actual numbers and dates. Tie advice to strain, recovery band and sleep need (e.g. how hard to go today, when to go to bed). Use plain language, short sentences, and "- " bullets where useful; **bold** sparingly. Don't diagnose or name medical conditions; if something looks like a medical concern, suggest they talk to a doctor. Don't invent data; say when it's missing. Recovery, strain, sleep performance and biological age are Cadence estimates, not medical measures.`;

  function modelMessages() {
    const turns = [];
    for (let k = 0; k < coach.log.length; k++) {
      const t = coach.log[k];
      const next = coach.log[k + 1];
      if (t.error) continue;
      if (t.role === "user" && next && next.error) continue;
      turns.push({ role: t.role, content: t.content });
    }
    let msgs = turns.slice(-8);
    while (msgs.length && msgs[0].role !== "user") msgs = msgs.slice(1);
    if (!msgs.length) return msgs;
    msgs[0] = { role: "user", content: `${INSTRUCTIONS}\n\n<data>\n${buildContext()}\n</data>\n\nQuestion: ${msgs[0].content}` };
    return msgs;
  }

  const liveBubble = () => (typeof document !== "undefined" ? document.getElementById("coach-live") : null);
  function scrollThread() {
    const t = typeof document !== "undefined" && document.getElementById("coach-thread");
    if (t && t.lastElementChild && t.lastElementChild.scrollIntoView) t.lastElementChild.scrollIntoView({ block: "end", behavior: "smooth" });
  }

  async function ask(q) {
    q = String(q || "").trim().slice(0, 1000);
    if (!q || coach.streaming || coach.status !== "ready" || !coach.sample) return;
    coach.log.push({ role: "user", content: q });
    coach.streaming = true;
    coach.live = "";
    App.rerender();
    scrollThread();
    try {
      const res = await coach.sample(modelMessages(), {
        onText: ({ text }) => {
          coach.live = text || "";
          const b = liveBubble();
          if (b) b.innerHTML = renderMd(coach.live);
        },
        modelTier: "default",
        cache: false,
      });
      const text = (res && res.text) || coach.live || "";
      coach.log.push({ role: "assistant", content: text || "I couldn't come up with an answer. Try asking another way." });
    } catch (e) {
      const code = e && e.code;
      if (code === "bad_key") {
        coach.log.push({ role: "assistant", error: true, content: "Anthropic didn't accept your API key. Check it below, or remove it and paste a new one." });
      } else if (code === "overloaded") {
        coach.log.push({ role: "assistant", error: true, content: "Claude is busy right now. Try again in a minute." });
      } else if (code === "not_granted") {
        coach.status = "blocked";
        coach.log.push({ role: "assistant", error: true, content: "The coach needs your permission to use Claude. It's switched off for this visit." });
      } else if (code === "rate_limited") {
        coach.log.push({ role: "assistant", error: true, content: "Too many questions at once. Try again in a minute." });
      } else {
        const partial = e && typeof e.text === "string" && e.text.trim();
        coach.log.push({ role: "assistant", error: !partial, content: partial ? e.text : "Something went wrong getting an answer. Try again." });
      }
    } finally {
      coach.streaming = false;
      coach.live = "";
      if (coach.log.length > 40) coach.log = coach.log.slice(-40);
      App.rerender();
      scrollThread();
    }
  }

  function checkSample() {
    if (coach.status !== "unknown") return;
    coach.status = "checking";
    Promise.resolve()
      .then(() => App.sample.use())
      .then((fn) => {
        coach.sample = typeof fn === "function" ? fn : null;
        coach.status = coach.sample ? "ready" : "absent";
      })
      .catch(() => {
        coach.status = "absent";
      })
      .then(() => {
        if (!App.view || App.view() === "coach") App.rerender();
      });
  }

  Views.coach = {
    label: "Coach",
    icon: "coach",
    dated: false,
    render(ctx) {
      const hasData = ctx.days && ctx.days.length;
      const sub = "Training and recovery advice from your own numbers";
      if (coach.status === "unknown" || coach.status === "checking") {
        return `<div class="page">${head("Coach", sub)}<div class="card"><p class="muted">Connecting to the coach…</p></div></div>`;
      }
      const web = App.env && App.env() === "web";
      if (coach.status === "absent" && web) {
        return `<div class="page">${head("Coach", sub)}${keyCard(false)}</div>`;
      }
      if (coach.status === "absent") {
        return `<div class="page">${head("Coach", sub)}${empty("The coach works inside Claude", "Open this page in Claude to ask about your strain, recovery and sleep. Everything else in Cadence works here as normal.")}</div>`;
      }
      const thread = coach.log
        .map((t) =>
          t.role === "user"
            ? `<div class="co-msg co-user">${esc(t.content)}</div>`
            : `<div class="co-msg co-bot${t.error ? " co-err" : ""}">${t.error ? esc(t.content) : renderMd(t.content)}</div>`,
        )
        .join("");
      const live = coach.streaming ? `<div class="co-msg co-bot" id="coach-live" aria-live="polite">${coach.live ? renderMd(coach.live) : '<span class="muted">Thinking…</span>'}</div>` : "";
      const intro = !coach.log.length
        ? `<div class="insight">Ask how hard to push today, why your recovery moved, or how to hit your sleep need. The coach reads your last 30 days and 90-day averages${App.mode && App.mode() === "sample" ? " (sample data right now)" : ""}. It's not a doctor.</div>`
        : "";
      const chips = !coach.streaming && coach.status === "ready" && hasData
        ? `<div class="co-chips">${SUGGESTIONS.map((s) => `<button type="button" class="tag" data-action="coach-chip" data-q="${esc(s)}">${esc(s)}</button>`).join("")}</div>`
        : "";
      const composer =
        coach.status === "blocked"
          ? `<p class="muted co-note">The coach is off because Claude access wasn't allowed. Reload the page to be asked again.</p>`
          : !hasData
            ? `<p class="muted co-note">Import some health data first so the coach has something to work with.</p>`
            : `<form data-submit="coach-ask" class="co-form">
              <label class="field co-field"><span class="co-sr">Your question</span><input name="q" maxlength="1000" autocomplete="off" placeholder="Ask about your training, recovery or sleep" ${coach.streaming ? "disabled" : ""}></label>
              <button class="btn primary" type="submit" ${coach.streaming ? "disabled" : ""}>${coach.streaming ? "Answering…" : "Ask"}</button>
            </form>`;
      return `<div class="page">
        ${head("Coach", sub)}
        <div class="card co-card">
          ${intro}
          <div class="co-thread" id="coach-thread">${thread}${live}</div>
          ${chips}
          ${composer}
        </div>
        ${coach.log.length && !coach.streaming ? `<div><button class="btn ghost small" data-action="coach-clear">Clear conversation</button></div>` : ""}
        ${web ? keyCard(true) : ""}
      </div>`;
    },
    after(root) {
      checkSample();
      if (coach.status === "ready" && !coach.streaming && root && root.querySelector) {
        const inp = root.querySelector('form[data-submit="coach-ask"] input[name="q"]');
        if (inp && coach.log.length && inp.focus) inp.focus({ preventScroll: true });
      }
    },
    css: `
.co-card{display:flex;flex-direction:column;gap:14px}
.co-card > * + *{margin-top:0}
.co-thread{display:flex;flex-direction:column;gap:10px}
.co-thread:empty{display:none}
.co-msg{max-width:min(640px,92%);padding:10px 14px;border-radius:14px;line-height:1.5;overflow-wrap:anywhere}
.co-msg p{margin:0 0 .5em}.co-msg p:last-child{margin-bottom:0}

.co-bot{align-self:flex-start;background:var(--surface-2);color:var(--ink);border-bottom-left-radius:4px;border-left:2px solid var(--strain)}

.co-form{display:flex;gap:8px;align-items:flex-end}
.co-field{flex:1;margin:0}
