<!doctype html>
<html lang="en" data-env="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence Health</title>
<meta name="description" content="Cadence is a private health dashboard: recovery, strain and sleep scores, heart rate, journal and trends from your own data. Runs in your browser.">
<meta name="theme-color" content="#0A0E13">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com https://*.gstatic.com; connect-src 'self' https: https://health.googleapis.com https://oauth2.googleapis.com https://accounts.google.com https://api.anthropic.com; frame-src https://accounts.google.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com">

<style>/* Cadence v4 design system — near-black athletic panel, layered surfaces, glowing dials.
   One deliberate dark theme. Page CSS lives in Views.x.css and uses these tokens + shared classes. */
:root {
  color-scheme: dark;

  /* ground + layered surfaces */
  --bg: #05070A;
  --s1: #0C1015;
  --s2: #121821;
  --s3: #19212C;
  --s4: #212B38;
  --surface: var(--s1);
  --surface-2: var(--s2);
  --surface-3: var(--s3);
  --hairline: rgba(255, 255, 255, 0.06);
  --hairline-2: rgba(255, 255, 255, 0.1);
  --hi: rgba(255, 255, 255, 0.04); /* 1px top inner highlight on cards */
  --line: var(--hairline);
  --line-2: rgba(255, 255, 255, 0.04);

  /* ink (all ≥ 4.5:1 on --s3 except --faint, which is decoration/placeholder only) */
  --ink: #F2F5F7;
  --fg: var(--ink);
  --ink-2: #C9D1DA;
  --muted: #93A0AE;
  --faint: #5D6977;

  /* semantic */
  --green: #19E68C;
  --yellow: #FFC93C;
  --red: #FF4F5E;
  --strain: #3D8BFF;
  --sleep: #8A7CFF;
  --hrv: #2EE6D6;
  --green-glow: rgba(25, 230, 140, 0.35);
  --yellow-glow: rgba(255, 201, 60, 0.35);
  --red-glow: rgba(255, 79, 94, 0.35);
  --strain-glow: rgba(61, 139, 255, 0.35);
  --sleep-glow: rgba(138, 124, 255, 0.35);
  --hrv-glow: rgba(46, 230, 214, 0.35);
  --accent: var(--green);
  --accent-glow: var(--green-glow);
  --accent-ink: #03140C;
  --accent-soft: rgba(25, 230, 140, 0.12);

  /* v1 aliases (keep) */
  --rec-high: var(--green);
  --rec-mid: var(--yellow);
  --rec-low: var(--red);
  --good: var(--green);
  --warn: var(--yellow);
  --bad: var(--red);

  /* sleep stages (sleep hue family + warm awake) */
  --st-awake: #F2A27E;
  --st-rem: #B3A9FF;
  --st-light: #6C74F5;
  --st-deep: #3F2FC4;

  /* heart-rate zones: cool grey-blue → hot red */
  --z0: #39434F;
  --z1: #6F8499;
  --z2: #3D8BFF;
  --z3: #19E68C;
  --z4: #FF9F2E;
  --z5: #FF4F5E;

  /* type */
  --f-display: "Archivo", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cond: 68%;
  --fs-hero: 72px;
  --fs-xl: 44px;
  --fs-l: 28px;
  --fs-m: 20px;
  --fs-body: 15px;
  --fs-s: 13px;
  --fs-xs: 11px;
  --track-caps: 0.14em;

  /* shape + depth */
  --radius: 16px;
  --r-md: 14px;
  --r-sm: 11px;
  --r-xs: 8px;
  --card-hi: inset 0 1px 0 var(--hi);
  --shadow: none;
  --shadow-pop: 0 18px 48px rgba(0, 0, 0, 0.62), 0 2px 8px rgba(0, 0, 0, 0.5);
  --side-w: 240px;
  --tab-h: 64px;
  --top-h: 54px;
  --gutter: 16px;

  /* motion */
  --ease-out: cubic-bezier(0.33, 1, 0.68, 1); /* ease-out-cubic */
  --ease-spring: cubic-bezier(0.2, 0.8, 0.2, 1);
  --dur-fast: 120ms;
  --dur: 180ms;
  --stagger-step: 40ms;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: #05070A;
  background: var(--bg);
  color-scheme: dark;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  background: #05070A;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: var(--fs-body);
  font-weight: 400;
  line-height: 1.5;
  font-stretch: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: clip;
}
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 800; font-stretch: 85%; letter-spacing: -0.01em; margin: 0; line-height: 1.12; }
p { margin: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img, svg { max-width: 100%; }
svg { display: block; }
::selection { background: color-mix(in srgb, var(--strain) 45%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--strain); outline-offset: 2px; border-radius: 6px; }
.num, .stat-value, .card-meta, .ch-t, .tnum { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: 0.9em; }
.muted { color: var(--muted); }
.small { font-size: var(--fs-s); }
.eyebrow, .label-caps {
  font-family: var(--f-mono); font-size: var(--fs-xs); font-weight: 500; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--muted);
}
.big-num, .display {
  font-family: var(--f-display); font-weight: 900; font-stretch: var(--cond); font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em; line-height: 0.92;
}
.fs-hero { font-size: var(--fs-hero); } .fs-xl { font-size: var(--fs-xl); } .fs-l { font-size: var(--fs-l); }
.fs-m { font-size: var(--fs-m); } .fs-s { font-size: var(--fs-s); } .fs-xs { font-size: var(--fs-xs); }
.c-green { color: var(--green); } .c-yellow { color: var(--yellow); } .c-red { color: var(--red); }
.c-strain { color: var(--strain); } .c-sleep { color: var(--sleep); } .c-hrv { color: var(--hrv); }
.c-muted { color: var(--muted); } .c-ink { color: var(--ink); }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
[hidden] { display: none !important; }

/* ---------- app shell ---------- */
.app { min-height: 100vh; min-height: 100dvh; background: var(--bg); }
.col { min-width: 0; }
.side { display: none; }

.top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(5, 7, 10, 0.72);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  backdrop-filter: blur(18px) saturate(150%);
  border-bottom: 1px solid var(--hairline);
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in {
  max-width: 1180px;
  margin-inline: auto;
  min-height: var(--top-h);
  display: flex;
  align-items: center;
  gap: 10px;
}
.top-title { display: flex; align-items: center; gap: 9px; min-width: 0; flex: 1 1 auto; }
.top-title .brand-mark { flex: none; display: none; }
@media (min-width: 420px) { .top-title .brand-mark { display: block; } }
.top-title h1 {
  font-size: var(--fs-body);
  font-weight: 800;
  font-stretch: 88%;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pill-sample {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 9px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--yellow) 40%, transparent);
  color: var(--yellow);
  background: color-mix(in srgb, var(--yellow) 8%, transparent);
  font-family: var(--f-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  white-space: nowrap;
}
.pill-sample::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px var(--yellow-glow); }
.pill-sample .long { display: none; }
@media (min-width: 520px) { .pill-sample .long { display: inline; } .pill-sample .short { display: none; } }

/* state dot (header readiness indicator) */
.state-dot {
  flex: none;
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--c, var(--muted));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--muted)) 18%, transparent), 0 0 10px var(--g, transparent);
}
.state-dot.green { --c: var(--green); --g: var(--green-glow); }
.state-dot.yellow { --c: var(--yellow); --g: var(--yellow-glow); }
.state-dot.red { --c: var(--red); --g: var(--red-glow); }
.state-dot.strain { --c: var(--strain); --g: var(--strain-glow); }
.state-dot.sleep { --c: var(--sleep); --g: var(--sleep-glow); }

/* date switcher: compact pill with chevrons */
.dsw {
  flex: none;
  display: flex;
  align-items: center;
  gap: 0;
  height: 38px;
  padding: 2px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: var(--s2);
  box-shadow: var(--card-hi);
}
.dsw-btn {
  width: 34px; height: 32px;
  display: grid; place-items: center;
  border: 0;
  background: transparent;
  border-radius: 999px;
  color: var(--ink);
  transition: background var(--dur-fast), transform var(--dur-fast) var(--ease-out);
}
.dsw-btn:hover:not(:disabled) { background: var(--s3); }
.dsw-btn:active:not(:disabled) { transform: scale(0.92); }
.dsw-btn:disabled { opacity: 0.3; cursor: default; }
.dsw-btn svg { width: 16px; height: 16px; stroke-width: 2.2; }
.dsw-date {
  position: relative;
  min-width: 92px;
  height: 32px;
  padding: 0 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-family: var(--f-display);
  font-weight: 800;
  font-stretch: 80%;
  font-size: 13.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  border-radius: 999px;
  cursor: pointer;
}
.dsw-date:hover { background: var(--s3); }
.dsw-date input {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer; border: 0; padding: 0;
}
.dsw-date:focus-within { outline: 2px solid var(--strain); outline-offset: 1px; }
@media (min-width: 560px) { .dsw-date { min-width: 128px; padding: 0 12px; } }
@media (min-width: 700px) {
  .top-in.has-dsw { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
  .top-in.has-dsw .dsw { grid-column: 2; }
}

.main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom, 0px));
  min-width: 0;
}
#view {
  max-width: 1180px;
  margin-inline: auto;
  container-type: inline-size;
  container-name: view;
  min-width: 0;
}

/* bottom tab bar (phone): blurred glass, glowing pill on the active tab */
.tabs {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  background: rgba(8, 11, 15, 0.7);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  border-top: 1px solid var(--hairline);
  box-shadow: inset 0 1px 0 var(--hi);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .tabs, .top, .glass { background: rgba(8, 11, 15, 0.96); }
}
.tabs-in { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--tab-h); max-width: 560px; margin-inline: auto; }
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--muted);
  text-decoration: none;
  font-family: var(--f-mono);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: none;
  border: 0;
  padding: 0 2px;
  min-width: 0;
  position: relative;
  transition: color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
}
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab svg { width: 22px; height: 22px; transition: color var(--dur-fast), filter var(--dur); }
.tab:hover { color: var(--ink); }
.tab:active { transform: scale(0.94); }
.tab.on { color: var(--ink); }
.tab.on svg { color: var(--accent); filter: drop-shadow(0 0 6px var(--accent-glow)); }
.tab.on::before {
  content: "";
  position: absolute;
  top: 5px;
  left: 50%;
  width: 18px;
  height: 4px;
  margin-left: -9px;
  border-radius: 999px;
  background: var(--accent);
  box-shadow: 0 0 10px 1px var(--accent-glow), 0 0 2px var(--accent);
}
.tab:focus-visible { outline-offset: -4px; border-radius: 12px; }
.more-sheet {
  position: fixed;
  right: max(10px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--tab-h) + 10px + env(safe-area-inset-bottom, 0px));
  z-index: 31;
  width: min(260px, calc(100vw - 20px));
  background: rgba(18, 24, 33, 0.86);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--hairline-2);
  border-radius: var(--radius);
  box-shadow: var(--shadow-pop), var(--card-hi);
  padding: 6px;
  animation: cad-pop var(--dur) var(--ease-out) both;
  transform-origin: bottom right;
}
.more-h { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--muted); padding: 8px 12px 6px; }
.more-sheet a {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 12px;
  border-radius: var(--r-sm);
  color: var(--ink);
  text-decoration: none;
  font-weight: 600;
}
.more-sheet a svg { width: 20px; height: 20px; color: var(--muted); }
.more-sheet a:hover, .more-sheet a.on { background: var(--s3); }
.more-sheet a.on svg { color: var(--accent); filter: drop-shadow(0 0 6px var(--accent-glow)); }

/* left rail (desktop ≥ 1100 px) */
@media (min-width: 1100px) {
  .side {
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    width: calc(var(--side-w) + env(safe-area-inset-left, 0px));
    padding: 22px 14px 16px calc(14px + env(safe-area-inset-left, 0px));
    border-right: 1px solid var(--hairline);
    background: var(--bg);
    z-index: 25;
    overflow-y: auto;
  }
  .col { margin-left: calc(var(--side-w) + env(safe-area-inset-left, 0px)); }
  .tabs, .more-sheet { display: none !important; }
  .top-title .brand-mark { display: none; }
  .top-in { min-height: 64px; }
  .top-title h1 { font-size: 16px; }
  .main { padding-block: 28px 56px; }
}
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px 24px;
  color: var(--ink); text-decoration: none;
}
.brand-name { font-family: var(--f-display); font-weight: 900; font-stretch: 70%; font-size: 23px; letter-spacing: 0.06em; text-transform: uppercase; }
.brand-mark { width: 26px; height: 26px; color: var(--accent); filter: drop-shadow(0 0 6px var(--accent-glow)); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 12px;
  height: 42px;
  padding: 0 12px;
  border-radius: var(--r-sm);
  color: var(--muted);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.01em;
  position: relative;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.nav a svg { width: 20px; height: 20px; flex: none; }
.nav a:hover { background: var(--s1); color: var(--ink); }
.nav a.on { background: var(--s2); color: var(--ink); box-shadow: var(--card-hi); }
.nav a.on::before {
  content: ""; position: absolute; left: -2px; top: 12px; bottom: 12px; width: 4px; border-radius: 999px;
  background: var(--accent); box-shadow: 0 0 10px 1px var(--accent-glow);
}
.nav a.on svg { color: var(--accent); filter: drop-shadow(0 0 6px var(--accent-glow)); }
.nav-sep { height: 1px; background: var(--hairline); margin: 10px 12px; }
.side-foot { margin-top: auto; display: grid; gap: 10px; padding: 12px 8px 0; }
.side-status { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 7px; line-height: 1.4; }
.side-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); flex: none; box-shadow: 0 0 8px var(--yellow-glow); }
.side-status .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green-glow); }

/* toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 8px);
  z-index: 50;
  max-width: calc(100vw - 32px);
  padding: 11px 16px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--bg);
  font-size: 14px;
  font-weight: 600;
  box-shadow: var(--shadow-pop);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) ease, transform var(--dur) var(--ease-out);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 1100px) {
  .toast { bottom: 24px; left: calc(50% + var(--side-w) / 2); }
}

/* ---------- page layout ---------- */
.page { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.page-head { display: flex; flex-direction: column; gap: 6px; padding: 2px 0 4px; }
.page-head h1 { font-size: var(--fs-l); font-weight: 900; font-stretch: 70%; letter-spacing: 0.005em; text-transform: uppercase; line-height: 1; }
.page-head .sub { color: var(--muted); font-size: 14.5px; max-width: 62ch; }
.section-h, .page h2.section, .section-title {
  font-family: var(--f-mono); font-size: var(--fs-xs); font-weight: 500; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--muted);
  margin: 8px 0 -6px;
}
.section-title {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  min-width: 0;
}
.section-title > :first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.section-title a, .section-title button {
  flex: none; font: inherit; letter-spacing: inherit; color: var(--ink-2); background: none; border: 0; padding: 0; text-decoration: none;
}
.section-title a:hover, .section-title button:hover { color: var(--ink); }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
  gap: 14px;
}
.grid-2, .grid-3 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.grid > *, .grid-2 > *, .grid-3 > * { min-width: 0; }
@container view (min-width: 620px) {
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}

/* ---------- cards & surfaces ---------- */
.card {

}

.glass {

  -webkit-backdrop-filter: blur(20px) saturate(150%);
  backdrop-filter: blur(20px) saturate(150%);
  border: 1px solid rgba(255, 255, 255, 0.07);
  box-shadow: var(--card-hi);
}

/* ---------- hero (overview + page tops) ---------- */
.hero { position: relative; min-width: 0; }

.hero-title {

.hero-dial {

  text-align: center; gap: 10px; min-width: 0;
}

}

/* ---------- tiles & metrics ---------- */
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr));

}

.tile {

.delta {

/* ---------- stats (v2, kept) ---------- */
.stats {
  display: grid;

}

  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.stat-value {
  font-family: var(--f-display);
  font-size: var(--fs-l);
  font-weight: 800;
  font-stretch: var(--cond);

  letter-spacing: -0.01em;
  white-space: nowrap;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stat-sub { font-size: 12.5px; color: var(--muted); }

/* ---------- rings & dials ---------- */

.ring-l { font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--muted); margin-top: 5px; }

.dials { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; justify-items: stretch; }
.dials .ring-wrap { width: 100%; }
.dials .ring { width: 100% !important; height: auto !important; aspect-ratio: 1; max-width: 180px; margin-inline: auto; }
.dials .ring svg { width: 100%; height: 100%; }

/* ---------- pills, chips, buttons, controls ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px;
  padding: 0 11px;

}

}

  font-weight: 500;

  text-transform: uppercase;

  color: var(--muted);
  border: 1px solid var(--hairline);
  vertical-align: middle;
}
.chip.good { color: var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); border-color: color-mix(in srgb, var(--green) 32%, transparent); }
.chip.warn { color: var(--yellow); background: color-mix(in srgb, var(--yellow) 10%, transparent); border-color: color-mix(in srgb, var(--yellow) 32%, transparent); }
.chip.bad { color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); border-color: color-mix(in srgb, var(--red) 36%, transparent); }
.chip.neutral { color: var(--ink); }
.chip.strain { color: var(--strain); background: color-mix(in srgb, var(--strain) 12%, transparent); border-color: color-mix(in srgb, var(--strain) 36%, transparent); }
.chip.sleep { color: var(--sleep); background: color-mix(in srgb, var(--sleep) 12%, transparent); border-color: color-mix(in srgb, var(--sleep) 36%, transparent); }
.chip.hrv { color: var(--hrv); background: color-mix(in srgb, var(--hrv) 10%, transparent); border-color: color-mix(in srgb, var(--hrv) 32%, transparent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 42px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid var(--hairline-2);
  background: var(--s2);
  color: var(--ink);
  font-weight: 700;

  font-size: var(--fs-s);

  text-decoration: none;
  white-space: nowrap;
  box-shadow: var(--card-hi);

}

.btn.primary:hover:not(:disabled) { background: #FFFFFF; border-color: #FFFFFF; box-shadow: 0 0 18px rgba(255, 255, 255, 0.14); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 0 transparent; }
.btn.accent:hover:not(:disabled) { box-shadow: 0 0 20px var(--accent-glow); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); box-shadow: none; }
.btn.ghost:hover:not(:disabled) { background: var(--s2); color: var(--ink); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 42%, transparent); background: transparent; box-shadow: none; }
.btn.danger.primary { background: var(--red); color: #16040A; border-color: var(--red); }
.btn.small { height: 32px; padding: 0 13px; font-size: 11.5px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.seg {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: var(--s1);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}
.seg::-webkit-scrollbar { display: none; }
.seg button {
  border: 0;
  background: transparent;
  color: var(--muted);
  height: 30px;
  padding: 0 13px;
  border-radius: 999px;
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: background var(--dur-fast), color var(--dur-fast);
}
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--s3); color: var(--ink); box-shadow: var(--card-hi), 0 1px 3px rgba(0, 0, 0, 0.4); }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {

  height: 34px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--hairline-2);

}
.tag:hover { border-color: rgba(255, 255, 255, 0.18); }
.tag.on { background: color-mix(in srgb, var(--accent) 12%, var(--s2)); border-color: color-mix(in srgb, var(--accent) 70%, transparent); color: var(--ink); }
.tag.on::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }

/* tap feedback */
.btn:active:not(:disabled), .tag:active, .seg button:active, .chip:is(button, a):active, .pill:is(button, a):active,

  transform: scale(0.98);

a.card, button.card, a.tile, button.tile, .tap { transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast), background var(--dur-fast); }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column; }
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--hairline);
  min-width: 0;
}
.row:last-child { border-bottom: 0; }
.row:first-child { padding-top: 2px; }
.row > :first-child { min-width: 0; }
.row .row-main { min-width: 0; flex: 1 1 auto; }
.row .row-title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
.row .row-sub { font-size: 12.5px; color: var(--muted); }

/* ---------- bars ---------- */
.bar-track {
  position: relative;
  height: 6px;
  border-radius: 999px;
  background: var(--s3);
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, color-mix(in srgb, var(--c, var(--accent)) 70%, transparent), var(--c, var(--accent)));
  max-width: 100%;
}

/* ---------- empty + loading ---------- */
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  text-align: center;
  padding: 40px 20px;
  border: 1px dashed var(--hairline-2);
  border-radius: var(--radius);
  color: var(--muted);
  background: var(--s1);
}
.empty strong, .empty h2, .empty h3 { color: var(--ink); font-family: var(--f-display); font-size: var(--fs-m); font-weight: 800; font-stretch: 80%; }
.empty p { max-width: 42ch; font-size: 14px; }
.empty .btn { margin-top: 6px; }

.skeleton {
  display: block;
  position: relative;
  overflow: hidden;
  min-height: 12px;
  border-radius: var(--r-sm);
  background: var(--s2);
  color: transparent !important;
  pointer-events: none;
  user-select: none;
}

  content: "";
  position: absolute; inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.055) 45%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.055) 55%, transparent);
  animation: cad-shimmer 1.4s ease-in-out infinite;
}
.skeleton > * { visibility: hidden; }
.skeleton.text { height: 12px; width: var(--w, 100%); border-radius: 6px; }
.skeleton.title { height: 22px; width: var(--w, 60%); border-radius: 8px; }
.skeleton.block { height: var(--h, 120px); }
.skeleton.card { height: var(--h, 160px); border-radius: var(--radius); border: 1px solid var(--hairline); padding: 0; }
.skeleton.tile { height: var(--h, 88px); border-radius: var(--r-md); padding: 0; }
.skeleton.circle, .skeleton.dial { width: var(--s, 160px); height: var(--s, 160px); border-radius: 50%; margin-inline: auto; }
.skeleton.chart { height: var(--h, 180px); }
.skeleton-stack { display: flex; flex-direction: column; gap: 10px; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.field > span { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, input.input, select.input, textarea.input {
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 0 13px;
  border: 1px solid var(--hairline-2);
  border-radius: var(--r-sm);
  background: var(--s1);
  color: var(--ink);
  font-size: var(--fs-body);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
  transition: border-color var(--dur-fast), background var(--dur-fast);
}
.field input:hover, .field select:hover, .field textarea:hover, .input:hover { border-color: rgba(255, 255, 255, 0.16); }
.field input::placeholder, .field textarea::placeholder, .input::placeholder { color: var(--faint); }
.field textarea, textarea.input { height: auto; min-height: 88px; padding: 10px 13px; resize: vertical; line-height: 1.45; }
.field select, select.input {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 32px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible,
.input:focus-visible { outline: 2px solid var(--strain); outline-offset: 0; border-color: var(--strain); background: var(--s2); }
.field .hint { font-size: 12px; color: var(--muted); }
.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr));
  gap: 12px;
}
input[type="number"] { font-variant-numeric: tabular-nums; }
input[type="range"] { accent-color: var(--strain); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }

/* ---------- insight, legend ---------- */
.insight {
  padding: 13px 15px;
  border-left: 3px solid var(--accent);
  background: var(--s2);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 14px;
  line-height: 1.55;
  color: var(--ink-2);
}
.insight strong { font-weight: 700; color: var(--ink); }
.insight.warn { border-left-color: var(--yellow); }
.insight.bad { border-left-color: var(--red); }
.insight.strain { border-left-color: var(--strain); }
.insight.sleep { border-left-color: var(--sleep); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--muted); }
.key { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.key::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--c, var(--accent)); flex: none; }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; min-width: 0; overflow: hidden; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
.chart svg { overflow: visible; }
.chart-hb { overflow: visible; touch-action: auto; -webkit-user-select: auto; user-select: auto; }
.ch-t { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.02em; }
.ch-t.strong { fill: var(--ink-2); font-weight: 500; }
.ch-grid { stroke: rgba(255, 255, 255, 0.045); stroke-width: 1; shape-rendering: crispEdges; }
.ch-axis { stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; shape-rendering: crispEdges; }
.ch-ref { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.7; }
.ch-band-edge { stroke-width: 1; stroke-opacity: 0.28; stroke-dasharray: 1 3; }
.ch-cursor, .ch-cursor-h { stroke: var(--ink); stroke-width: 1; opacity: 0; pointer-events: none; shape-rendering: crispEdges; transition: opacity var(--dur-fast); }
.ch-cursor-h { stroke-dasharray: 2 3; }
.chart.hovering .ch-cursor { opacity: 0.32; }
.chart.hovering .ch-cursor-h { opacity: 0.18; }
.ch-hover { transition: opacity var(--dur-fast); }
.ch-dot-last { stroke: var(--bg); stroke-width: 2; }
.ch-halo { opacity: 0.22; transform-box: fill-box; transform-origin: center; animation: cad-halo 2.4s ease-in-out infinite; }
.ch-tip {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 3;
  pointer-events: none;
  padding: 6px 12px;
  border-radius: 999px;
  background: rgba(25, 33, 44, 0.9);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border: 1px solid var(--hairline-2);
  color: var(--ink);
  font-size: 12px;
  line-height: 1.35;
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), var(--card-hi);
  transition: transform 70ms linear;
}
.ch-tip b { font-weight: 800; font-family: var(--f-display); font-stretch: 85%; font-size: 13px; font-variant-numeric: tabular-nums; }
.ch-tip .sw { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--c, var(--accent)); }
.ch-empty { display: grid; place-items: center; height: 100%; color: var(--muted); font-size: 13px; border: 1px dashed var(--hairline-2); border-radius: var(--r-sm); }

.hb { display: flex; flex-direction: column; gap: 10px; }
.hb-row { display: grid; grid-template-columns: minmax(64px, 30%) minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 13px; }
.hb-l { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-t { height: 8px; border-radius: 999px; background: var(--s3); overflow: hidden; }
.hb-f { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, color-mix(in srgb, var(--c, var(--accent)) 65%, transparent), var(--c, var(--accent))); }
.hb-v { color: var(--muted); font-family: var(--f-mono); font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; font-size: 11.5px; }

/* ---------- data view bits (shared) ---------- */
.drop {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  text-align: center;
  padding: 28px 16px;
  border: 1.5px dashed var(--hairline-2);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--muted);
  transition: border-color var(--dur-fast), background var(--dur-fast);
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { width: 28px; height: 28px; color: var(--accent); }
.drop strong { color: var(--ink); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: st; }
.steps li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; counter-increment: st; }
.steps li::before {
  content: counter(st);
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--hairline-2);
  background: var(--s2);
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--accent);
  font-weight: 500;
}
.steps b { display: block; font-weight: 700; }
.steps span { color: var(--muted); font-size: 14px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.04em; }
.flow span { padding: 4px 8px; border: 1px solid var(--hairline-2); border-radius: 999px; background: var(--s2); color: var(--ink); white-space: nowrap; }
.flow i { font-style: normal; color: var(--faint); }
.msg { font-size: 14px; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--hairline-2); }
.msg.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); background: color-mix(in srgb, var(--green) 7%, transparent); }
.msg.bad { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); background: color-mix(in srgb, var(--red) 7%, transparent); }
.note { font-size: 12.5px; color: var(--muted); }
.err-card { border-color: color-mix(in srgb, var(--red) 45%, transparent); }

/* accordion (How scores work) */
.acc { display: flex; flex-direction: column; }
.acc details { border-bottom: 1px solid var(--hairline); }
.acc details:last-child { border-bottom: 0; }
.acc summary {
  list-style: none;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 2px;
  cursor: pointer;
  font-weight: 700;
  font-size: var(--fs-body);
  border-radius: 6px;
}
.acc summary::-webkit-details-marker { display: none; }
.acc summary::after {
  content: ""; flex: none; width: 8px; height: 8px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(45deg) translate(-2px, -2px);
  transition: transform var(--dur);
}
.acc details[open] summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
.acc summary:hover { color: var(--accent); }
.acc .acc-b { padding: 0 2px 16px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.acc .acc-b p + p { margin-top: 8px; }

/* ---------- motion ---------- */
@keyframes cad-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes cad-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes cad-slide-next { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes cad-slide-prev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes cad-pop { from { opacity: 0; transform: translateY(6px) scale(0.97); } to { opacity: 1; transform: none; } }
@keyframes cad-shimmer { to { transform: translateX(100%); } }
@keyframes cad-halo { 0%, 100% { transform: scale(1); opacity: 0.22; } 50% { transform: scale(1.35); opacity: 0.08; } }

/* page enter: 180 ms fade + 8 px rise (helper classes; core also drives #view transitions itself) */
.page-enter, .anim-enter > * { animation: cad-enter var(--dur) var(--ease-out) both; }
/* day switch: content slides in from the side it came from */
.slide-next, .anim-slide-next > * { animation: cad-slide-next 220ms var(--ease-out) both; }
.slide-prev, .anim-slide-prev > * { animation: cad-slide-prev 220ms var(--ease-out) both; }
.fade-in { animation: cad-fade var(--dur) ease both; }
/* staggered children: 40 ms apart (first 12; the rest arrive with the 12th) */
.stagger > * { animation: cad-enter var(--dur) var(--ease-out) both; animation-delay: calc(var(--i, 11) * var(--stagger-step)); }
.stagger > :nth-child(1) { --i: 0; } .stagger > :nth-child(2) { --i: 1; } .stagger > :nth-child(3) { --i: 2; }
.stagger > :nth-child(4) { --i: 3; } .stagger > :nth-child(5) { --i: 4; } .stagger > :nth-child(6) { --i: 5; }
.stagger > :nth-child(7) { --i: 6; } .stagger > :nth-child(8) { --i: 7; } .stagger > :nth-child(9) { --i: 8; }
.stagger > :nth-child(10) { --i: 9; } .stagger > :nth-child(11) { --i: 10; }
/* in-place re-renders (typing, toggles) should not replay entrance motion */
.no-anim, .no-anim *, .is-static .stagger > *, .is-static.stagger > *, .stagger.settled > *, #view[data-anim="quiet"] .stagger > * { animation: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
  .skeleton::after { display: none; }
  .btn:active, .tag:active, .tab:active, a.card:active, button.card:active, a.tile:active, button.tile:active, .tap:active { transform: none !important; }
}

<div class="app">
  <aside class="side" id="cad-side" aria-label="Cadence"></aside>
  <div class="col">
    <header class="top" id="cad-top"></header>
    <main class="main" id="cad-main">
      <div id="view" aria-live="polite"></div>
    </main>
  </div>
  <nav class="tabs" id="cad-tabs" aria-label="Sections"></nav>
</div>

<script>/* Cadence engine v2: data model, scores and sample data. Pure functions, no DOM.
 *
 * Day record (format "cadence.v2", a superset of "cadence.v1"; same shape the Android sync app exports):
 * {
 *   date: "YYYY-MM-DD",
 *   steps, distanceM, activeKcal, totalKcal, floors,
 *   restingHr, hrv (RMSSD ms), spo2 (%), respRate (br/min), skinTempDev (°C vs baseline),
 *   weightKg, bodyFatPct,
 *   hr: [[minuteOfDay, bpm], ...]                 // downsampled curve (5-min medians allowed)
 *   hrHist: { start: 30, bin: 5, counts: [...] }  // v2: minutes in each bpm bucket over the whole day
 *   sleep: { start: ISO, end: ISO, stages: [[stage, startMin, endMin], ...] }
 *          // stage: "awake" | "light" | "deep" | "rem"; minutes from sleep.start
 *   naps: [{ start: ISO, end: ISO, asleepMin }]   // v2: sleep sessions < 3 h that are not the main sleep
 *   workouts: [{ id?, type, start: ISO, durationMin, avgHr, maxHr, kcal, distanceM, source, hrHist?,
 *                hrAfter?,   // v3: [[secondsAfterEnd, bpm], ...] 0–180 s after the end, full resolution
 *                hrSeries?,  // v3: [[secondsFromStart, bpm], ...] at most one point per 15 s
 *                speedMps? }] // v3: derived in cleanDay from distanceM / duration
 *   steps5: [[minuteOfDay, steps], ...]            // v3: 5-minute step buckets; a missing bucket = no data
 * }
 * User-entered data (kept separately so imports never overwrite it):
 * { meals: [...], waterMl, caffeineMg, journal: { tags: [], stress, mood, note }, workouts: [...] }
 *
 * The maths below is our own implementation of well-known public sports-science methods
 * (heart-rate reserve zones, zone-weighted training load, personal-baseline z-scores).
 */
(function (root) {
  "use strict";

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const mean = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN);
  const sd = (a) => {
    if (a.length < 2) return NaN;
    const m = mean(a);
    return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1));
  };
  const median = (a) => {
    if (!a.length) return NaN;
    const s = [...a].sort((x, y) => x - y);
    const h = s.length >> 1;
    return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
  };
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;
  const logistic = (x) => 1 / (1 + Math.exp(-x));

  /* ---------- dates (local calendar days) ---------- */
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseYmd = (s) => {
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  };
  const addDays = (s, n) => {
    const d = parseYmd(s);
    d.setDate(d.getDate() + n);
    return ymd(d);
  };
  const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000);
  const clockMin = (d) => d.getHours() * 60 + d.getMinutes();

  /* ---------- profile ---------- */
  // dob (YYYY-MM-DD) wins over age when valid; age stays as the fallback.
  const DEFAULT_PROFILE = { age: 30, dob: "2001-02-09", sex: "unspecified", heightCm: 165, weightKg: 62, maxHr: null };
  const YMD_RE = /^\d{4}-\d{2}-\d{2}$/;
  const validYmd = (s) => typeof s === "string" && YMD_RE.test(s) && ymd(parseYmd(s)) === s;
  /* exact decimal age in years on a calendar date: whole days / 365.2425 (mean Gregorian year), 2 dp */
  function ageOn(dob, dateYmd) {
    if (!validYmd(dob)) return null;
    const on = validYmd(dateYmd) ? dateYmd : ymd(new Date());
    const days = dayDiff(dob, on);
    if (!(days >= 0) || days > 130 * 366) return null;
    return r2(days / 365.2425);
  }
  /* age used by the engine on a date (default today): from dob when set, else profile.age, else 30 */
  function ageOf(p, dateYmd) {
    const a = p ? ageOn(p.dob, dateYmd) : null;
    if (isNum(a) && a >= 5) return a;
    return p && isNum(p.age) && p.age > 0 && p.age < 130 ? p.age : 30;
  }
  const maxHrOf = (p, dateYmd) => (isNum(p.maxHr) && p.maxHr > 120 ? p.maxHr : Math.round(208 - 0.7 * ageOf(p, dateYmd)));
  const hrvNormOf = (age) => Math.max(18, 62 - 0.75 * (age - 20)); // population RMSSD reference (ms)

  /* ============================================================
   * Constants (documented in METHODS)
   * ============================================================ */
  const ZONE_W = [0, 1, 2, 3, 4, 5]; // Edwards-style weights per minute in zones 1–5
  const Z0_W = 0.5; // max weight for zone-0 minutes, reached at 50 % HRR

  const WALK_W = 0.45; // fallback: load per minute of walking from steps
  const AWAKE_BG = 14; // fallback: load of ordinary awake movement not captured by steps
  const NEED_BASE = 450; // default sleep baseline (7.5 h)
  const NEED_STRAIN_PER_PT = 5; // + min of need per strain point above 10
  const DEBT_W = [0.33, 0.22, 0.13, 0.08]; // share of each previous night's shortfall carried
  const REC_W = { hrv: 0.5, rhr: 0.25, resp: 0.08, sleep: 0.22 };
  const REC_A = 0.05; // logistic offset
  const REC_B = 1.25; // logistic slope
  const SLEEP_REF = { mean: 85, sd: 12 }; // sleep performance reference for the recovery z-score

  /* ---------- sleep ---------- */
  function sleepStats(day) {
    const s = day && day.sleep;
    if (!s || !Array.isArray(s.stages) || !s.stages.length) return null;
    const mins = { awake: 0, light: 0, deep: 0, rem: 0 };
    for (const [stage, a, b] of s.stages) {
      if (mins[stage] !== undefined && b > a) mins[stage] += b - a;
    }
    const asleep = mins.light + mins.deep + mins.rem;
    const inBed = asleep + mins.awake;
    if (asleep <= 0) return null;
    const start = new Date(s.start);
    const end = new Date(s.end);
    if (isNaN(start) || isNaN(end)) return null;
    let bedMin = clockMin(start);
    if (bedMin > 12 * 60) bedMin -= 24 * 60;
    const wakeMin = clockMin(end);
    const first = s.stages[0];
    const latency = first && first[0] === "awake" && first[1] === 0 ? first[2] - first[1] : 0;
    return {
      ...mins,
      asleep,
      inBed,
      efficiency: inBed ? asleep / inBed : 0,
      restorative: asleep ? (mins.deep + mins.rem) / asleep : 0,
      start,
      end,
      bedMin,
      wakeMin,
      latency,
      awakenings: s.stages.filter((x) => x[0] === "awake" && x[1] > 0 && x[2] - x[1] >= 2).length,

  }

  /* ---------- heart-rate zones & load ---------- */
  function trimpFactor(hrr, sex) {
    const b = sex === "male" ? [0.64, 1.92] : sex === "female" ? [0.86, 1.67] : [0.75, 1.795];
    return hrr * b[0] * Math.exp(b[1] * hrr);
  }
