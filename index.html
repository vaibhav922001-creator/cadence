    return null;
  }

  /* deep-clean output: NaN / ±Infinity / undefined → null; Dates → ISO strings */
  function clean(x) {
    if (x === undefined) return null;
    if (typeof x === "number") return isFinite(x) ? x : null;
    if (x instanceof Date) return isNaN(x) ? null : x.toISOString();
    if (Array.isArray(x)) return x.map(clean);
    if (x && typeof x === "object") {
      const o = {};
      for (const k of Object.keys(x)) o[k] = clean(x[k]);
      return o;
    }
    return x;
  }
  const notEnough = (needed, have, message) => ({ status: "not_enough_data", needed, have, message });

  /* strain ↔ load (engine's saturating curve: strain = 21·L/(L+K), K = 90). Fallback mirrors it. */
  const STRAIN_K_FALLBACK = 90;
  const strainFromLoad = typeof E.strainFromLoad === "function"
    ? (L) => (isNum(L) ? E.strainFromLoad(L) : null)
    : (L) => (isNum(L) && L > 0 ? Math.min(20.9, r1((21 * L) / (L + STRAIN_K_FALLBACK))) : 0);
  const loadForStrain = typeof E.loadForStrain === "function"
    ? (s) => E.loadForStrain(clamp(s, 0, 20.9))
    : (s) => { s = clamp(s, 0, 20.9); return s > 0 ? (STRAIN_K_FALLBACK * s) / (21 - s) : 0; };
  const strainTargetFor = typeof E.strainTargetFor === "function"
    ? E.strainTargetFor
    : (rec) => (!isNum(rec) ? null : rec >= 67 ? [14, 18] : rec >= 34 ? [10, 14] : [4, 10]);

  /* sleep stats of the night that ended on the morning of days[k] */
  function sleepOf(days, derived, k) {
    let s = derived && derived[k] && derived[k].sleep;
    if (!s && typeof E.sleepStats === "function") s = E.sleepStats(days[k]);
    if (!s || !isNum(s.asleep) || s.asleep <= 0) return null;
    const start = new Date(s.start);
    const end = new Date(s.end);
    if (isNaN(start) || isNaN(end) || end <= start) return null;
    const latency = isNum(s.latency) ? s.latency : 0;
    const bedMin = isNum(s.bedMin) ? s.bedMin : toBedMin(start.getHours() * 60 + start.getMinutes());
    const wakeMin = isNum(s.wakeMin) ? s.wakeMin : end.getHours() * 60 + end.getMinutes();
    const windowMin = (end - start) / 60000;
    return { asleep: s.asleep, bedMin, wakeMin, latency, windowMin, onsetMin: bedMin + latency };
  }
  const tagsOf = (day) => {
    const t = day && day.entry && day.entry.journal && day.entry.journal.tags;
    return Array.isArray(t) ? t.map((x) => String(x).toLowerCase()) : [];
  };
  const hasTag = (day, re) => tagsOf(day).some((t) => re.test(t));
  const idxOfDate = (days, date) => {
    for (let k = days.length - 1; k >= 0; k--) if (days[k] && days[k].date === date) return k;
    return -1;
  };
  const validInput = (days, derived) => Array.isArray(days) && Array.isArray(derived) && days.length > 0 && derived.length === days.length;

  /* ============================================================
   * 1. Training load: CTL / ATL / TSB / ACWR
   *
   * Banister impulse-response model (Banister 1975; Coggan's PMC form): fitness and fatigue are
   * exponentially weighted moving averages of daily load,
   *     X_t = X_{t−1} + k·(L_t − X_{t−1}),   k = 1 − exp(−1/τ)
   * (the exact discrete decay of a continuous exponential with time constant τ days),
   * τ = 42 d for chronic load (CTL, "fitness") and τ = 7 d for acute load (ATL, "fatigue").
   * TSB ("form") for day t = CTL_{t−1} − ATL_{t−1}: the balance you start the day with.
   * Daily load is derived[i].load (zone-weighted HR minutes); strain equivalents use the engine curve.
   * Missing calendar days count as zero load (you may have trained without the band), and are flagged.
   * Seed: CTL_0 = ATL_0 = mean load of the first 7 recorded days, to shorten the start-up bias.
   *
   * ACWR (Gabbett 2016; Hulin 2016) = acute 7-d mean load / chronic mean load, using rolling averages
   * and the UNCOUPLED form (Windt & Gabbett 2018; Lolli 2019): the chronic window is the 28 days before
   * the acute week, so the acute week is not inside its own denominator (the coupled form is biased
   * toward 1). Known limitations: ratio of two noisy averages, mathematical coupling and spurious
   * correlation critiques (Impellizzeri 2020), risk zones derived from team-sport injury data rather
   * than individuals. We use it only as a load-change guide, never as an injury predictor.
   * ============================================================ */
  const TAU_CTL = 42;
  const TAU_ATL = 7;
  const K_CTL = 1 - Math.exp(-1 / TAU_CTL);
  const K_ATL = 1 - Math.exp(-1 / TAU_ATL);
  const ACUTE_N = 7;
  const CHRONIC_N = 28;
  const CHRONIC_MIN = 14; // ≥ 21 days of history (7 acute + 14 chronic) before a status is given
  /* zones: < 0.8 detraining, 0.8–1.3 sweet spot (inclusive), > 1.3–1.5 caution, > 1.5 high risk */
  const acwrStatus = (a) =>
    !isNum(a) ? "building baseline" : a < 0.8 ? "detraining" : a <= 1.3 ? "sweet spot" : a <= 1.5 ? "caution" : "high risk";

  /* contiguous calendar series from the first to the last recorded day */
  function loadSeries(days, derived) {
    const first = dayNum(days[0].date);
    const last = dayNum(days[days.length - 1].date);
    const N = Math.max(1, last - first + 1);
    const L = new Array(N).fill(0);
    const has = new Array(N).fill(false); // a record with load > 0 exists for that date
    const rec = new Array(N).fill(false); // any record exists
    const idx = new Array(N).fill(-1);
    for (let k = 0; k < days.length; k++) {
      if (!days[k] || !isYmd(days[k].date)) continue;
      const c = dayNum(days[k].date) - first;
      if (c < 0 || c >= N) continue;
      const v = derived[k] && derived[k].load;
      rec[c] = true;
      idx[c] = k;
      if (isNum(v) && v > 0) {
        L[c] = v;
        has[c] = true;
      }
    }
    // seed: mean of the first 7 recorded (non-zero) days
    const seedVals = [];
    for (let c = 0; c < N && seedVals.length < 7; c++) if (has[c]) seedVals.push(L[c]);
    const seed = seedVals.length ? mean(seedVals) : 0;
    const ctl = new Array(N), atl = new Array(N);
    let C = seed, A = seed;
    for (let c = 0; c < N; c++) {
      C += K_CTL * (L[c] - C);
      A += K_ATL * (L[c] - A);
      ctl[c] = C;
      atl[c] = A;
    }
    return { first, N, L, has, rec, idx, ctl, atl, seed };
  }
  const prefixSum = (L) => {
    const P = [0];
    for (let c = 0; c < L.length; c++) P.push(P[c] + L[c]);
    return P;
  };
  /* chronic (uncoupled) mean for calendar index t: days t−34 … t−7 that exist; count returned */
  function chronicAt(S, P, t) {
    const b = t - ACUTE_N; // last chronic index
    const a = Math.max(0, t - ACUTE_N - CHRONIC_N + 1);
    if (b < 0) return { mean: null, n: 0 };
    const n = b - a + 1;
    return { mean: (P[b + 1] - P[a]) / n, n };
  }
  function acwrAt(S, P, t) {
    if (t < ACUTE_N - 1) return null;
    const ch = chronicAt(S, P, t);
    if (ch.n < CHRONIC_MIN || !(ch.mean > 0)) return null;
    const acute = (P[t + 1] - P[t + 1 - ACUTE_N]) / ACUTE_N;
    return acute / ch.mean;
  }

  function load(days, derived) {
    if (!validInput(days, derived)) return [];
    const S = loadSeries(days, derived);
    const P = prefixSum(S.L);
    const out = [];
    for (let k = 0; k < days.length; k++) {
      const d = days[k];
      if (!d || !isYmd(d.date)) continue;
      const t = dayNum(d.date) - S.first;
      const ctl = S.ctl[t], atl = S.atl[t];
      const ctlY = t > 0 ? S.ctl[t - 1] : S.seed;
      const atlY = t > 0 ? S.atl[t - 1] : S.seed;
      const acwr = t >= ACUTE_N + CHRONIC_MIN - 1 ? acwrAt(S, P, t) : null;
      let gapDays = 0;
      for (let c = Math.max(0, t - 27); c <= t; c++) if (!S.has[c]) gapDays++;
      const ramp = t >= 7 ? S.ctl[t] - S.ctl[t - 7] : null;
      out.push({
        date: d.date,
        load: r1(S.L[t]),
        ctl: r1(ctl),
        atl: r1(atl),
        tsb: r1(ctlY - atlY),
        acwr: r2(acwr),
        ramp: r1(ramp), // CTL change over the last 7 days (load units per week)
        ctlStrain: r1(strainFromLoad(ctl)),
        atlStrain: r1(strainFromLoad(atl)),
        status: t + 1 < ACUTE_N + CHRONIC_MIN || acwr == null ? "building baseline" : acwrStatus(acwr),
        noData: !S.has[t], // no load recorded for this day (counted as 0)
        gapBefore: t > 0 && !S.rec[t - 1], // previous calendar day missing entirely
        gapDays, // days without load in the last 28 (each counted as 0)
      });
    }
    return clean(out);
  }

  /* ---------- weekPlan ----------
   * For each of the next 7 days (day 0 = startDate, default the last recorded day = "today"):
   * 1. Chronic mean C for that day is fixed: in the uncoupled ACWR the chronic window ends 7 days
   *    before the day, so for the coming week it is made of days already recorded.
   * 2. Day type by rules: two hard days in a row → easy; after an easy day → hard; after a hard day →
   *    moderate; hard then moderate → easy; otherwise hard. The H-M-E cycle averages ≈ 1.07·C. Day 0 also follows today's recovery band
   *    (green → hard allowed, yellow → at most moderate, red → easy and capped).
   * 3. Type range in load units: hard 1.3–2.0·C, moderate 0.8–1.3·C, easy 0.3–0.7·C.
   * 4. Inverse of the ACWR model: the planned load x keeps (S + x)/7/C inside 0.8–1.3, where S is the
   *    sum of the previous 6 days (recorded or planned midpoints) → x ∈ [5.6·C − S, 9.1·C − S].
   *    The type range is intersected with this; if they don't overlap, the ACWR bound wins on the
   *    high side (protect against spikes), while on the low side the plan builds back gradually
   *    (at most 25 % above the type range instead of one huge day).
   * 5. Caps: red band → strain ≤ engine red target; easy day → strain ≤ 10; yellow → engine target.
   * 6. Load range → strain range with the engine's curve strain = 21·L/(L+K).
   */
  const HARD_STRAIN = 14;
  const TYPE_RANGE = { hard: [1.3, 2.0], moderate: [0.8, 1.3], easy: [0.3, 0.7] };
  const EASY_CAP = 10;

  function weekPlan(days, derived, opts) {
    opts = opts || {};
    if (!validInput(days, derived)) return clean(notEnough(7, 0, "No data yet."));
    const lastDate = days[days.length - 1].date;
    const start = isYmd(opts.startDate) ? opts.startDate : lastDate;
    const S = loadSeries(days, derived);
    const s = dayNum(start) - S.first; // calendar index of day 0
    const histN = Math.min(s, S.N); // days before day 0
    let recorded = 0;
    for (let c = 0; c < histN; c++) if (S.has[c]) recorded++;
    if (recorded < 7) return clean(notEnough(7, recorded, "A weekly plan needs at least 7 days of recorded load."));

    // working arrays: history before day 0, then 7 planned days
    const L = S.L.slice(0, histN);
    const hard = L.map((v, c) => S.has[c] && strainFromLoad(v) >= HARD_STRAIN);
    const k0 = idxOfDate(days, start);
    const today = k0 >= 0 ? derived[k0] : null;
    const band = opts.band || (today && today.band) || null;
    const recToday = today && isNum(today.recovery) ? today.recovery : null;
    const restFloor = quantile(L.slice(-28).filter((v, i, a) => v > 0), 0.1) || 0;
    let ctl = histN > 0 ? S.ctl[histN - 1] : S.seed;
    let atl = histN > 0 ? S.atl[histN - 1] : S.seed;
    const ctl0 = ctl, atl0 = atl;
    const P0 = prefixSum(L);
    const chronicOK = chronicAt(null, P0, histN).n >= CHRONIC_MIN;
    const outDays = [];
    let prevType = null;
    for (let j = 0; j < 7; j++) {
      const t = histN + j;
      const date = addDays(start, j);
      const P = prefixSum(L);
      const ch = chronicAt(null, P, t);
      const C = ch.n >= CHRONIC_MIN && ch.mean > 0 ? ch.mean : mean(L.slice(-28).filter((v) => v > 0)) || 1;
      const Ssum = P[t] - P[Math.max(0, t - (ACUTE_N - 1))]; // previous 6 days
      const prev1 = t - 1 >= 0 ? hard[t - 1] : false;
      const prev2 = t - 2 >= 0 ? hard[t - 2] : false;
      const prevLoad = t - 1 >= 0 ? L[t - 1] : C;
      const reasons = [];
      let type;
      if (prev1 && prev2) {
        type = "easy";
        reasons.push("Two hard days in a row: keep this one easy.");
      } else if (prevType === "easy" || (prevType == null && prevLoad < 0.7 * C)) {
        type = "hard";
        reasons.push("Easy day yesterday: a harder day fits.");
      } else if (prevType === "hard" || (prevType == null && prev1)) {
        type = "moderate";
        reasons.push("Hard day yesterday: aim for moderate.");
      } else if (prev2) {
        type = "easy";
        reasons.push("Hard, then moderate: an easy day keeps the week balanced.");
      } else {
        type = "hard";
        reasons.push("Moderate day yesterday: a harder day fits.");
      }
      const dayBand = j === 0 ? band : null;
      if (dayBand === "red") {
        type = "easy";
        reasons.push(`Recovery is red${isNum(recToday) ? ` (${recToday} %)` : ""}: keep it light.`);
      } else if (dayBand === "yellow" && type === "hard") {
        type = "moderate";
        reasons.push(`Recovery is yellow${isNum(recToday) ? ` (${recToday} %)` : ""}: moderate at most.`);
      } else if (dayBand === "green" && type !== "easy") {
        reasons.push(`Recovery is green${isNum(recToday) ? ` (${recToday} %)` : ""}: your body can take load.`);
      }
      if (j > 0) reasons.push("Recovery not known yet: check the morning score and adjust.");

      const [ta, tb] = TYPE_RANGE[type];
      let lo = ta * C, hi = tb * C;
      const feasLo = Math.max(0, 7 * 0.8 * C - Ssum);
      const feasHi = Math.max(0, 7 * 1.3 * C - Ssum);
      if (chronicOK) {
        if (hi > feasHi) {
          hi = Math.max(feasHi, restFloor);
          lo = Math.min(lo, hi);
          reasons.push("This week's load is already high: capped to keep the load ratio ≤ 1.3.");
        }
        if (lo < feasLo) {
          if (feasLo <= hi) lo = feasLo;
          else {
            lo = Math.min(hi, tb * C);
            hi = Math.min(hi * 1.25, Math.max(hi, feasLo));
            reasons.push("Load has dropped: build back gradually, not in one big day.");
          }
        }
      } else {
        reasons.push("Less than 3 weeks of data: range based on recent average and recovery only.");
      }
      // recovery / type caps (strain scale)
      const capStrain = (sMax, why) => {
        const Lmax = loadForStrain(sMax);
        if (hi > Lmax) {
          hi = Lmax;
          if (why) reasons.push(why);
        }
      };
      if (type === "easy") capStrain(EASY_CAP);
      if (dayBand === "red") {
        const tg = strainTargetFor(recToday == null ? 20 : recToday) || [4, 10];
        capStrain(tg[1], `Red-band cap: strain ≤ ${r1(tg[1])}.`);
      } else if (dayBand === "yellow") {
        const tg = strainTargetFor(recToday == null ? 50 : recToday);
        if (tg) capStrain(tg[1]);
      }
      hi = Math.max(hi, restFloor);
      lo = clamp(Math.max(lo, restFloor * 0.9), 0, hi);
      if (hi - lo < 1) lo = Math.max(0, hi - 1);
      const mid = (lo + hi) / 2;
      const acwrMid = chronicOK && C > 0 ? (Ssum + mid) / 7 / C : null;
      ctl += K_CTL * (mid - ctl);
      atl += K_ATL * (mid - atl);
      L.push(mid);
      hard.push(strainFromLoad(mid) >= HARD_STRAIN || type === "hard");
      prevType = type;
      outDays.push({
        date,
        weekday: WD3[weekdayOf(date)],
        type,
        lo: r1(strainFromLoad(lo)),
        hi: r1(strainFromLoad(hi)),
        loadLo: r0(lo),
        loadHi: r0(hi),
        acwr: r2(acwrMid), // projected ACWR if you train at the middle of the range
        ctl: r1(ctl),
        atl: r1(atl),
        reasons,
      });
    }
    return clean({
      status: chronicOK ? "ok" : "building baseline",
      start,
      band,
      ctl: r1(ctl0),
      atl: r1(atl0),
      tsb: r1(ctl0 - atl0),
      acwr: r2(histN - 1 >= 0 ? acwrAt(null, P0, histN - 1) : null),
      chronicLoad: r1(chronicAt(null, prefixSum(S.L.slice(0, histN)), histN).mean),
      target: [0.8, 1.3],
      days: outDays,
      note: "Ranges assume you train near the middle of each day's range; re-plan after each morning's recovery.",
    });
  }

  /* ============================================================
   * Ridge regression (used by forecast)
   *
   * Columns are standardised (z = (x − mean)/sd, sample sd); y is centred, so the intercept (ȳ) is not
   * penalised. β(λ) = (ZᵀZ + λI)⁻¹ Zᵀ(y − ȳ)  (Hoerl & Kennard 1970).
   * λ is chosen on a log grid by exact closed-form leave-one-out CV: for a linear smoother ŷ = Hy,
   *     e_(i) = (y_i − ŷ_i) / (1 − h_ii),   H = Z(ZᵀZ + λI)⁻¹Zᵀ + 11ᵀ/n
   * (Allen 1974 PRESS; Hastie, Tibshirani & Friedman ESL §7.10). Standardisation uses the full sample,
   * a negligible leak for n ≥ 28. Q² ("r2cv") = 1 − PRESS / Σ(y − ȳ)²; it can be ≤ 0 (no skill).
   * 80 % prediction interval: ŷ + [10th, 90th percentile] of the LOO residuals (empirical, no
   * normality assumption; Lei et al. 2018 jackknife-style interval).
   * ============================================================ */
  function invert(M) {
    const n = M.length;
    const a = M.map((row, i) => row.concat(Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))));
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(a[r][c]) > Math.abs(a[p][c])) p = r;
      if (Math.abs(a[p][c]) < 1e-12) return null;
      [a[c], a[p]] = [a[p], a[c]];
      const piv = a[c][c];
      for (let j = 0; j < 2 * n; j++) a[c][j] /= piv;
      for (let r = 0; r < n; r++) {
        if (r === c) continue;
        const f = a[r][c];
        if (f) for (let j = 0; j < 2 * n; j++) a[r][j] -= f * a[c][j];
      }
    }
    return a.map((row) => row.slice(n));
  }
  /* one λ on already-standardised Z (n×p) and centred yc */
  function ridgeFixed(Z, yc, lambda) {
    const n = Z.length, p = Z[0] ? Z[0].length : 0;
    const G = Array.from({ length: p }, (_, a) => Array.from({ length: p }, (_, b) => {
      let s = 0;
      for (let i = 0; i < n; i++) s += Z[i][a] * Z[i][b];
      return s + (a === b ? lambda : 0);
    }));
    const Gi = p ? invert(G) : [];
    if (!Gi) return null;
    const Zy = Array.from({ length: p }, (_, a) => Z.reduce((s, z, i) => s + z[a] * yc[i], 0));
    const beta = Gi.map((row) => row.reduce((s, g, b) => s + g * Zy[b], 0));
    const fit = [], h = [], loo = [];
    for (let i = 0; i < n; i++) {
      const z = Z[i];
      let f = 0, hi = 1 / n;
      for (let a = 0; a < p; a++) {
        f += z[a] * beta[a];
        let s = 0;
        for (let b = 0; b < p; b++) s += Gi[a][b] * z[b];
        hi += z[a] * s;
      }
      fit.push(f);
      h.push(hi);
      loo.push((yc[i] - f) / Math.max(1e-9, 1 - hi));
    }
    const press = loo.reduce((s, e) => s + e * e, 0);
    return { beta, fit, h, loo, press };
  }
  const LAMBDAS = Array.from({ length: 31 }, (_, k) => Math.pow(10, -3 + k * 0.2)); // 0.001 … 1000
  function ridge(X, y, opts) {
    opts = opts || {};
    const n = X.length;
    const p = n ? X[0].length : 0;
    const mu = [], sd = [], keep = [];
    for (let a = 0; a < p; a++) {
      const col = X.map((r) => r[a]);
      const m = mean(col), s = sdOf(col);
      mu.push(m);
      sd.push(s);
      if (isNum(s) && s > 1e-9) keep.push(a);
    }
    const Z = X.map((r) => keep.map((a) => (r[a] - mu[a]) / sd[a]));
    const ybar = mean(y);
    const yc = y.map((v) => v - ybar);
    const sst = yc.reduce((s, v) => s + v * v, 0);
    const grid = isNum(opts.lambda) ? [opts.lambda] : LAMBDAS;
    let best = null;
    for (const lam of grid) {
      const f = ridgeFixed(Z, yc, lam);
      if (f && (!best || f.press < best.press - 1e-12)) best = { ...f, lambda: lam };
    }
    if (!best) return null;
    const betaFull = new Array(p).fill(0);
    keep.forEach((a, q) => (betaFull[a] = best.beta[q]));
    return {
      n, p, mu, sd, keep, ybar, lambda: best.lambda,
      beta: betaFull, // per standardised feature (outcome units per 1 sd)
      fitted: best.fit.map((f) => f + ybar),
      h: best.h,
      looResid: best.loo, // y_i − ŷ_(−i)
      press: best.press,
      q2: sst > 0 ? 1 - best.press / sst : null,
      predict(x) {
        let v = ybar;
        for (const a of keep) v += best.beta[keep.indexOf(a)] * ((x[a] - mu[a]) / sd[a]);
        return v;
      },
    };
  }

  /* ============================================================
   * 4 (part). Sleep debt: rolling 7 nights, Σ max(0, need − asleep), hours.
   * Need is the engine's per-night sleep need (baseline + strain + carried debt − naps).
   * Needs ≥ 4 recorded nights in the 7-day window; missing nights are skipped (not counted as debt).
   * ============================================================ */
  function debtAt(days, derived, i) {
    let debt = 0, surplus = 0, nights = 0;
    const per = [];
    for (let k = i; k >= 0; k--) {
      const back = dayDiff(days[k].date, days[i].date);
      if (back > 6) break;
      if (back < 0) continue;
      const sl = sleepOf(days, derived, k);
      const need = derived[k] && derived[k].sleepNeed && derived[k].sleepNeed.total;
      if (!sl || !isNum(need)) continue;
      nights++;
      const diff = need - sl.asleep;
      debt += Math.max(0, diff);
      surplus += Math.max(0, -diff);
      per.push({ date: days[k].date, needMin: r0(need), asleepMin: r0(sl.asleep), shortMin: r0(Math.max(0, diff)) });
    }
    return { debtMin: debt, surplusMin: surplus, nights, per: per.reverse() };
  }
  function sleepDebt(days, derived, i) {
    if (!validInput(days, derived)) return clean(notEnough(4, 0, "No sleep recorded yet."));
    if (!isNum(i)) i = days.length - 1;
    i = clamp(Math.round(i), 0, days.length - 1);
    const d = debtAt(days, derived, i);
    if (d.nights < 4) return clean(notEnough(4, d.nights, "Sleep debt needs at least 4 of the last 7 nights."));
    const hours = d.debtMin / 60;
    return clean({
      status: "ok",
      date: days[i].date,
      hours: r1(hours),
      minutes: Math.round(d.debtMin),
      netHours: r1((d.debtMin - d.surplusMin) / 60), // shortfall minus extra sleep
      nights: d.nights,
      perNight: d.per,
      level: hours < 1.5 ? "low" : hours <= 3 ? "moderate" : "high",
    });
  }

  /* ============================================================
   * 3. Forecast of next-morning recovery
   * Training pairs: day t → morning t+1 (consecutive calendar days) with recovery on both days.
   * Features (raw units): recovery today, strain today, 7-night sleep debt (h), time in bed tonight (h)
   * (= usual wake − planned bedtime when forecasting; actual sleep window when training), bedtime minus
   * usual bedtime (h, median of 14 prior nights), ACWR today, alcohol tag, late-meal tag (only when each
   * tag is logged on ≥ 3 and missing on ≥ 3 training days). Of any feature pair with |r| > 0.9 only the
 * first is kept (time in bed and bedtime deviation usually collide). Missing feature values → training mean
   * (z = 0, i.e. no contribution). Needs ≥ 28 pairs.
   * ============================================================ */
  const FEATS = [
    ["rec", "Today's recovery"],
    ["strain", "Strain today"],
    ["debt", "Sleep debt (7 nights)"],
    ["tib", "Time in bed tonight"],
    ["bedDev", "Bedtime vs usual"],
    ["acwr", "Load ratio (ACWR)"],
    ["alcohol", "Alcohol"],
    ["lateMeal", "Late meal"],
  ];
  const FORECAST_MIN = 28;
  const RE_ALC = /alcohol|drink|beer|wine/;
  const RE_LATE = /late meal|late dinner|late eating/;

  function usualBed(days, derived, i, back) {
    const v = [];
    for (let k = i; k >= 0; k--) {
      const dd = dayDiff(days[k].date, days[i].date);
      if (dd > (back || 14)) break;
      const s = sleepOf(days, derived, k);
      if (s) v.push(s.bedMin);
    }
    return v.length >= 3 ? median(v) : null;
  }
  function usualWake(days, derived, i) {
    const v = [];
    for (let k = i; k >= 0; k--) {
      if (dayDiff(days[k].date, days[i].date) > 14) break;
      const s = sleepOf(days, derived, k);
      if (s) v.push(s.wakeMin);
    }
    return v.length >= 3 ? median(v) : null;
  }

  function buildModel(days, derived, iEnd) {
    const S = loadSeries(days, derived);
    const P = prefixSum(S.L);
    const acwrOf = (k) => {
      const t = dayNum(days[k].date) - S.first;
      return t >= ACUTE_N + CHRONIC_MIN - 1 ? acwrAt(S, P, t) : null;
    };
    const featRow = (k, night) => {
      // k: day index of "today"; night: {tib, bed} for the night after day k
      const ub = usualBed(days, derived, k);
      const debt = debtAt(days, derived, k);
      return {
        rec: derived[k].recovery,
        strain: derived[k].strain,
        debt: debt.nights >= 4 ? debt.debtMin / 60 : null,
        tib: night && isNum(night.tib) ? night.tib : null,
        bedDev: night && isNum(night.bed) && isNum(ub) ? (night.bed - ub) / 60 : null,
        acwr: acwrOf(k),
        alcohol: hasTag(days[k], RE_ALC) ? 1 : 0,
        lateMeal: hasTag(days[k], RE_LATE) ? 1 : 0,
      };
    };
    const rows = [], ys = [], dates = [];
    for (let t = 0; t + 1 <= iEnd; t++) {
      if (dayDiff(days[t].date, days[t + 1].date) !== 1) continue;
      const y = derived[t + 1] && derived[t + 1].recovery;
      if (!isNum(y) || !isNum(derived[t].recovery)) continue;
      // Same information as at forecast time: planned bedtime (here the actual one) and the USUAL wake
      // time (median of the 14 nights up to day t), not the actual wake, which is unknown in advance.
      const sl = sleepOf(days, derived, t + 1);
      const uw = usualWake(days, derived, t);
      rows.push(featRow(t, sl ? { tib: isNum(uw) ? (uw - sl.bedMin) / 60 : null, bed: sl.bedMin } : null));
      ys.push(y);
      dates.push(days[t + 1].date);
    }
    if (rows.length < FORECAST_MIN) return { status: "not_enough_data", have: rows.length };
    let used = FEATS.filter(([key]) => {
      const col = rows.map((r) => r[key]);
      if (key === "alcohol" || key === "lateMeal") {
        const c = col.reduce((s, v) => s + v, 0);
        return c >= 3 && rows.length - c >= 3;
      }
      return nums(col).length >= Math.max(10, rows.length * 0.5);
    });
    // Collinearity guard: planned time in bed (usual wake − bedtime) and bedtime deviation are nearly the
    // same quantity with opposite sign; with both in, ridge splits them into large opposite effects and the
    // bedtime scenario can flip direction. Drop the later feature of any pair with |Pearson r| > 0.9.
    const corr = (a, b) => {
      const pa = [], pb = [];
      rows.forEach((r) => { if (isNum(r[a]) && isNum(r[b])) { pa.push(r[a]); pb.push(r[b]); } });
      if (pa.length < 10) return 0;
      const ma = mean(pa), mb = mean(pb);
      let sab = 0, saa = 0, sbb = 0;
      pa.forEach((x, q) => { sab += (x - ma) * (pb[q] - mb); saa += (x - ma) ** 2; sbb += (pb[q] - mb) ** 2; });
      return saa > 0 && sbb > 0 ? sab / Math.sqrt(saa * sbb) : 0;
    };
    for (let a = 0; a < used.length; a++)
      for (let b = used.length - 1; b > a; b--)
        if (Math.abs(corr(used[a][0], used[b][0])) > 0.9) used.splice(b, 1);
    const colMean = {};
    for (const [key] of used) colMean[key] = mean(rows.map((r) => r[key]));
    const toX = (r) => used.map(([key]) => (isNum(r[key]) ? r[key] : colMean[key]));
    const X = rows.map(toX);
    const model = ridge(X, ys);
    if (!model) return { status: "not_enough_data", have: rows.length };
    const q10 = quantile(model.looResid, 0.1);
    const q90 = quantile(model.looResid, 0.9);
    return { status: "ok", model, used, toX, featRow, q10, q90, n: rows.length, ys, dates, usualWake: (i) => usualWake(days, derived, i) };
  }

  function predictWith(M, days, derived, i, opts) {
    opts = opts || {};
    const strain = isNum(opts.strain) ? clamp(opts.strain, 0, 21) : derived[i].strain;
    let bed = opts.bedtime != null ? parseClock(opts.bedtime) : null;
    if (bed == null && derived[i].bedtimeTonight) bed = parseClock(new Date(derived[i].bedtimeTonight));
    if (bed == null) bed = usualBed(days, derived, i);
    const wake = M.usualWake(i);
    const tib = isNum(bed) && isNum(wake) ? (wake - bed) / 60 : null;
    const row = M.featRow(i, { tib, bed });
    row.strain = strain;
    const x = M.toX(row);
    const yhat = M.model.predict(x);
    const drivers = M.used.map(([key, name], q) => {
      const a = q; // column in x
      const z = (x[a] - M.model.mu[a]) / (M.model.sd[a] || 1);
      return { name, key, value: key === "alcohol" || key === "lateMeal" ? (x[a] >= 0.5 ? "yes" : "no") : r2(row[key]), effect: r1(M.model.beta[a] * (isNum(z) ? z : 0)) };
    }).filter((d) => d.effect !== 0).sort((a, b) => Math.abs(b.effect) - Math.abs(a.effect));
    return {
      recovery: r0(clamp(yhat, 1, 99)),
      lo: r0(clamp(yhat + M.q10, 1, 99)),
      hi: r0(clamp(yhat + M.q90, 1, 99)),
      strain: r1(strain),
      bedtime: clockStr(bed),
      timeInBedH: r1(tib),
      drivers,
    };
  }

  function forecast(days, derived, i, opts) {
    if (!validInput(days, derived)) return clean(notEnough(FORECAST_MIN, 0, "No data yet."));
    if (!isNum(i)) i = days.length - 1;
    i = clamp(Math.round(i), 0, days.length - 1);
    const M = buildModel(days, derived, i);
    if (M.status !== "ok") return clean(notEnough(FORECAST_MIN, M.have, `The forecast needs ${FORECAST_MIN} pairs of consecutive days with recovery.`));
    const p = predictWith(M, days, derived, i, opts);
    return clean({
      status: "ok",
      date: addDays(days[i].date, 1),
      ...p,
      n: M.n,
      r2cv: r2(M.model.q2),
      lambda: r3(M.model.lambda),
      intervalPct: 80,
      features: M.used.map(([, name]) => name),
      note: "Effects are associations in your own history, not proof of cause.",
    });
  }

  /* recovery grid: bedtimes 21:30–00:30 (30 min) × strain low / medium / high (your 20th / 50th / 85th
     percentile of the last 56 days) */
  const SCEN_BEDS = ["21:30", "22:00", "22:30", "23:00", "23:30", "00:00", "00:30"];
  function scenario(days, derived, i, opts) {
    opts = opts || {};
    if (!validInput(days, derived)) return clean(notEnough(FORECAST_MIN, 0, "No data yet."));
    if (!isNum(i)) i = days.length - 1;
    i = clamp(Math.round(i), 0, days.length - 1);
    const M = buildModel(days, derived, i);
    if (M.status !== "ok") return clean(notEnough(FORECAST_MIN, M.have, `Scenarios need ${FORECAST_MIN} pairs of consecutive days with recovery.`));
    const recent = [];
    for (let k = i; k >= 0 && dayDiff(days[k].date, days[i].date) < 56; k--) if (isNum(derived[k].strain) && derived[k].strain > 0) recent.push(derived[k].strain);
    const levels = Array.isArray(opts.strains) && opts.strains.length
      ? opts.strains.map((s, q) => ({ label: ["low", "medium", "high"][q] || `s${q}`, strain: r1(s) }))
      : [["low", 0.2], ["medium", 0.5], ["high", 0.85]].map(([label, q]) => ({ label, strain: r1(quantile(recent, q) || [6, 11, 15][label === "low" ? 0 : label === "medium" ? 1 : 2]) }));
    const beds = Array.isArray(opts.bedtimes) && opts.bedtimes.length ? opts.bedtimes : SCEN_BEDS;
    const grid = beds.map((b) =>
      levels.map((lv) => {
        const p = predictWith(M, days, derived, i, { strain: lv.strain, bedtime: b });
        return { recovery: p.recovery, lo: p.lo, hi: p.hi, timeInBedH: p.timeInBedH };
      })
    );
    let best = null;
    grid.forEach((row, a) => row.forEach((c, b) => {
      if (!best || c.recovery > best.recovery) best = { bedtime: beds[a], strain: levels[b].label, recovery: c.recovery };
    }));
    return clean({ status: "ok", date: addDays(days[i].date, 1), bedtimes: beds.map((b) => clockStr(parseClock(b))), strains: levels, grid, best, n: M.n, r2cv: r2(M.model.q2), usualWake: clockStr(M.usualWake(i)) });
  }

  /* ============================================================
   * 4. Sleep timing
   * sleepWindow: bin each night's bedtime into 30-min bins; per bin the mean next-morning recovery and
   * sleep performance with a t-based 95 % CI. Recommend the bin (n ≥ 4) with the highest LOWER bound,
   * which favours bins that are both good and consistently so. Same for sleep duration (30-min bins).
   * If recovery is unavailable (no HRV), sleep performance is used instead.
   * Observational: late nights cluster with weekends, alcohol, etc., so a bin's score is not purely the
   * effect of the bedtime.
   * ============================================================ */
  const BIN = 30;
  const MIN_BIN_N = 4;
  function binRecommend(entries, keyOf, labelOf) {
    const bins = new Map();
    for (const e of entries) {
      const b = keyOf(e);
      if (!isNum(b)) continue;
      if (!bins.has(b)) bins.set(b, []);
      bins.get(b).push(e);
    }
    const list = [...bins.entries()].sort((a, b) => a[0] - b[0]).map(([b, es]) => ({
      key: b,
      ...labelOf(b),
      n: es.length,
      recovery: tCI(es.map((e) => e.rec), [0, 100]),
      sleepPerformance: tCI(es.map((e) => e.perf), [0, 100]),
    }));
    const useRec = list.some((x) => x.recovery.n >= MIN_BIN_N);
    const metric = useRec ? "recovery" : "sleepPerformance";
    let best = null;
    for (const x of list) {
      const c = x[metric];
      if (c.n < MIN_BIN_N || !isNum(c.lo)) continue;
      if (!best || c.lo > best[metric].lo) best = x;
    }
    return { list, best, metric };
  }
  function sleepWindow(days, derived, opts) {
    opts = opts || {};
    if (!validInput(days, derived)) return clean(notEnough(MIN_BIN_N * 2, 0, "No sleep recorded yet."));
    const end = isNum(opts.endIdx) ? clamp(Math.round(opts.endIdx), 0, days.length - 1) : days.length - 1;
    const look = isNum(opts.lookbackDays) ? opts.lookbackDays : 120;
    const nights = [];
    for (let k = end; k >= 0; k--) {
      if (dayDiff(days[k].date, days[end].date) >= look) break;
      const s = sleepOf(days, derived, k);
      if (!s) continue;
      const dv = derived[k];
      nights.push({ bed: s.bedMin, dur: s.asleep, rec: dv && isNum(dv.recovery) ? dv.recovery : null, perf: dv && isNum(dv.sleepPerformance) ? dv.sleepPerformance : null });
    }
    if (nights.length < MIN_BIN_N * 2) return clean(notEnough(MIN_BIN_N * 2, nights.length, "The sleep window needs at least 8 recorded nights."));
    const bedR = binRecommend(nights, (e) => Math.floor(e.bed / BIN) * BIN, (b) => ({ from: clockStr(b), to: clockStr(b + BIN) }));
    const durR = binRecommend(nights, (e) => Math.floor(e.dur / BIN) * BIN, (b) => ({ fromH: r1(b / 60), toH: r1((b + BIN) / 60), label: `${r1(b / 60)}–${r1((b + BIN) / 60)} h` }));
    const strip = (x) => {
      const { key, ...rest } = x;
      return rest;
    };
    const ub = median(nights.map((e) => e.bed));
    return clean({
      status: bedR.best ? "ok" : "not_enough_data",
      needed: MIN_BIN_N,
      nights: nights.length,
      metric: bedR.metric,
      usualBedtime: clockStr(ub),
      bins: bedR.list.map(strip),
      best: bedR.best ? { from: bedR.best.from, to: bedR.best.to, n: bedR.best.n, recovery: bedR.best.recovery, sleepPerformance: bedR.best.sleepPerformance } : null,
      durationBins: durR.list.map(strip),
      bestDuration: durR.best ? { fromH: durR.best.fromH, toH: durR.best.toH, n: durR.best.n, recovery: durR.best.recovery, sleepPerformance: durR.best.sleepPerformance } : null,
      note: "Based on your own nights. Other habits that go with late nights also affect these numbers.",
    });
  }

  /* mid-sleep on work vs free days.
   * Free-day nights = nights ending Saturday or Sunday morning (nights before a day off);
   * work nights = nights ending Monday–Friday. Mid-sleep = sleep onset (bed + latency) + SD/2,
   * SD = wake − onset (MCTQ definitions, Roenneberg 2003). Clock minutes relative to the midnight
   * before waking, so 00:30 = 30 and 23:30 = −30. Window: last 28 days (default). */
  function midSleeps(days, derived, end, look) {
    const work = [], free = [];
    for (let k = end; k >= 0; k--) {
      if (dayDiff(days[k].date, days[end].date) >= look) break;
      const s = sleepOf(days, derived, k);
      if (!s) continue;
      const onset = s.onsetMin;
      let wake = s.wakeMin;
      if (wake < onset) wake += 1440; // safety (should not happen with the bed convention)
      const sd = wake - onset;
      if (!(sd > 120 && sd < 960)) continue;
      const rec = { date: days[k].date, mid: onset + sd / 2, sd };
      const wd = weekdayOf(days[k].date);
      (wd === 0 || wd === 6 ? free : work).push(rec);
    }
    return { work, free };
  }
  function socialJetlag(days, derived, opts) {
    opts = opts || {};
    if (!validInput(days, derived)) return clean(notEnough(6, 0, "No sleep recorded yet."));
    const end = isNum(opts.endIdx) ? clamp(Math.round(opts.endIdx), 0, days.length - 1) : days.length - 1;
    const { work, free } = midSleeps(days, derived, end, opts.lookbackDays || 28);
    if (work.length < 4 || free.length < 2) return clean(notEnough(6, work.length + free.length, "Social jetlag needs at least 4 work-day and 2 free-day nights."));
    const msw = mean(work.map((x) => x.mid));
    const msf = mean(free.map((x) => x.mid));
    const h = Math.abs(msf - msw) / 60;
    return clean({
      status: "ok",
      hours: r1(h),
      midSleepWork: clockStr(msw),
      midSleepFree: clockStr(msf),
      direction: msf >= msw ? "later on free days" : "earlier on free days",
      nWork: work.length,
      nFree: free.length,
      level: h < 1 ? "low" : h < 2 ? "moderate" : "high",
    });
  }
  /* MSFsc (Roenneberg et al. 2012): if SDf > SDw, MSFsc = MSF − (SDf − SDweek)/2, SDweek = (5·SDw + 2·SDf)/7;
     else MSFsc = MSF. Category bands (1-h bins around the population mode ≈ 4:00–4:30 for adults). */
  function chronotype(days, derived, opts) {
    opts = opts || {};
    if (!validInput(days, derived)) return clean(notEnough(6, 0, "No sleep recorded yet."));
    const end = isNum(opts.endIdx) ? clamp(Math.round(opts.endIdx), 0, days.length - 1) : days.length - 1;
    const { work, free } = midSleeps(days, derived, end, opts.lookbackDays || 56);
    if (work.length < 4 || free.length < 4) return clean(notEnough(8, work.length + free.length, "Chronotype needs at least 4 free-day and 4 work-day nights (about 2–4 weeks)."));
    const msf = mean(free.map((x) => x.mid));
    const sdf = mean(free.map((x) => x.sd));
    const sdw = mean(work.map((x) => x.sd));
    const sdWeek = (5 * sdw + 2 * sdf) / 7;
    const msfsc = sdf > sdw ? msf - (sdf - sdWeek) / 2 : msf;
    const hh = msfsc / 60; // hours after midnight (can be negative)
    const type = hh < 3 ? "early" : hh < 4 ? "moderately early" : hh < 5 ? "intermediate" : hh < 6 ? "moderately late" : "late";
    return clean({
      status: "ok",
      msfsc: clockStr(msfsc),
      msfscHours: r2(hh),
      msf: clockStr(msf),
      sleepFreeH: r1(sdf / 60),
      sleepWorkH: r1(sdw / 60),
      type,
      nFree: free.length,
      nWork: work.length,
      note: "From tracked sleep, not a questionnaire. Alarms on free days make you look earlier than you are.",
    });
  }

  /* ============================================================
   * 8. Weekly report (rule-based)
   * ============================================================ */
  const METRIC_DEFS = [
    // name, unit, getter, better ("up" | "down" | null), noise threshold for "about the same", decimals
    ["Recovery", "%", (d, dv) => dv.recovery, "up", 3, 0],
    ["HRV", "ms", (d) => d.hrv, "up", 2, 0],
    ["Resting HR", "bpm", (d) => d.restingHr, "down", 1, 1],
    ["Sleep", "h", (d, dv) => (dv.sleep && isNum(dv.sleep.asleep) ? dv.sleep.asleep / 60 : null), "up", 0.2, 1],
    ["Sleep performance", "%", (d, dv) => dv.sleepPerformance, "up", 3, 0],
    ["Sleep consistency", "%", (d, dv) => dv.sleepConsistency, "up", 3, 0],
    ["Strain", "", (d, dv) => dv.strain, null, 0.5, 1],
    ["Steps", "", (d) => d.steps, "up", 500, 0],
  ];
  const fmtN = (v, dp) => (dp === 0 ? Math.round(v).toLocaleString("en-US") : String(r1(v)));

  function weeklyReport(days, derived, endDate, profile) {
    if (!validInput(days, derived)) return clean(notEnough(4, 0, "No data yet."));
    const end = isYmd(endDate) ? endDate : days[days.length - 1].date;
    const startThis = addDays(end, -6);
    const startPrev = addDays(end, -13);
    const inRange = (date, a, b) => dayNum(date) >= dayNum(a) && dayNum(date) <= dayNum(b);
    const thisIdx = [], prevIdx = [];
    days.forEach((d, k) => {
      if (!d || !isYmd(d.date)) return;
      if (inRange(d.date, startThis, end)) thisIdx.push(k);
      else if (inRange(d.date, startPrev, addDays(end, -7))) prevIdx.push(k);
    });
    if (thisIdx.length < 4) return clean(notEnough(4, thisIdx.length, "A weekly report needs at least 4 days in the week."));
    const endIdx = thisIdx[thisIdx.length - 1];

    const metrics = METRIC_DEFS.map(([name, unit, get, better, noise, dp]) => {
      const a = mean(thisIdx.map((k) => get(days[k], derived[k] || {})));
      const b = mean(prevIdx.map((k) => get(days[k], derived[k] || {})));
      const round = dp === 0 ? r0 : r1;
      const change = isNum(a) && isNum(b) ? a - b : null;
      let good = null;
      if (isNum(change) && better && Math.abs(change) >= noise) good = better === "up" ? change > 0 : change < 0;
      return { name, unit, thisWeek: round(a), lastWeek: round(b), change: round(change), good };
    });
    const mByName = (n) => metrics.find((m) => m.name === n);

    // best / toughest day by recovery (fallback: sleep performance)
    const scored = thisIdx.map((k) => ({ k, s: isNum(derived[k].recovery) ? derived[k].recovery : derived[k].sleepPerformance })).filter((x) => isNum(x.s));
    const dayCard = (k, why) => ({
      date: days[k].date,
      weekday: WD[weekdayOf(days[k].date)],
      recovery: derived[k].recovery,
      strain: derived[k].strain,
      sleepH: derived[k].sleep && isNum(derived[k].sleep.asleep) ? r1(derived[k].sleep.asleep / 60) : null,
      note: why,
    });
    let bestDay = null, toughestDay = null;
    if (scored.length) {
      const hi = scored.reduce((a, b) => (b.s > a.s ? b : a));
      const lo = scored.reduce((a, b) => (b.s < a.s ? b : a));
      const why = (k, good) => {
        const prev = k > 0 && dayDiff(days[k - 1].date, days[k].date) === 1 ? k - 1 : -1;
        const sl = derived[k].sleep && derived[k].sleep.asleep;
        const bits = [];
        if (isNum(sl)) bits.push(`${r1(sl / 60)} h sleep`);
        if (prev >= 0 && isNum(derived[prev].strain)) bits.push(`strain ${derived[prev].strain} the day before`);
        if (prev >= 0 && hasTag(days[prev], RE_ALC)) bits.push("alcohol the night before");
        return bits.length ? `${good ? "Best" : "Lowest"} recovery after ${bits.join(", ")}.` : "";
      };
      bestDay = dayCard(hi.k, why(hi.k, true));
      toughestDay = lo.k !== hi.k ? dayCard(lo.k, why(lo.k, false)) : null;
    }

    // load
    const ld = load(days, derived);
    const ldEnd = ld.find((x) => x.date === days[endIdx].date) || null;
    const plan = weekPlan(days, derived, { startDate: addDays(end, 1) });
    const loadOut = ldEnd
      ? { ctl: ldEnd.ctl, atl: ldEnd.atl, tsb: ldEnd.tsb, acwr: ldEnd.acwr, status: ldEnd.status, ramp: ldEnd.ramp, totalStrain: r1(thisIdx.reduce((s, k) => s + (derived[k].strain || 0), 0)) }
      : null;

    // warnings (analytics2), guarded
    const warnings = [];
    if (typeof A.warning === "function") {
      for (const k of thisIdx) {
        try {
          const w = A.warning(days, derived, k);

    return { rho, n, t, df: n - 2, p, lo: Math.tanh(z - zc * se), hi: Math.tanh(z + zc * se) };
  }
  /* Welch's t-test (unequal variances) with Welch–Satterthwaite df; diff = mean(a) − mean(b);
   * 95 % CI = diff ± t(0.975, df)·SE; Hedges g = Cohen d (pooled SD) × J, J = 1 − 3/(4(n1+n2)−9) (Hedges 1981). */
  function welch(a, b, level) {
    const n1 = a.length, n2 = b.length;
    if (n1 < 2 || n2 < 2) return null;
    const m1 = mean(a), m2 = mean(b), v1 = variance(a), v2 = variance(b);
    const q1 = v1 / n1, q2 = v2 / n2;
    const se = Math.sqrt(q1 + q2);
    if (!(se > 0)) return null;
    const df = (q1 + q2) ** 2 / ((q1 * q1) / (n1 - 1) + (q2 * q2) / (n2 - 1));
    const diff = m1 - m2;
    const t = diff / se;
    const p = tTwoSided(t, df);
    const tc = tInv(1 - (1 - (level || 0.95)) / 2, df);
    const sp = Math.sqrt(((n1 - 1) * v1 + (n2 - 1) * v2) / (n1 + n2 - 2));
    const J = 1 - 3 / (4 * (n1 + n2) - 9);
    const g = sp > 0 ? (diff / sp) * J : 0;
    return { n1, n2, m1, m2, diff, se, df, t, p, lo: diff - tc * se, hi: diff + tc * se, g };
  }
  /* Benjamini–Hochberg (1995) adjusted q-values: q(i) = min_{j≥i} p(j)·m/j, capped at 1, in input order. */
  function bhAdjust(ps) {
    const m = ps.length;
    const order = ps.map((p, i) => [p, i]).sort((x, y) => x[0] - y[0]);
    const q = new Array(m);
    let run = 1;
    for (let k = m - 1; k >= 0; k--) {
      run = Math.min(run, (order[k][0] * m) / (k + 1));
      q[order[k][1]] = Math.min(1, run);
    }
    return q;
  }
  /* Robust baseline: median and MAD scaled by 1.4826 (consistent with SD under normality; Rousseeuw & Croux 1993),
   * with a floor so a very steady baseline can't turn tiny changes into large z-scores. */
  function robust(vals, floor) {
    if (!vals.length) return null;
    const med = median(vals);
    const mad = median(vals.map((v) => Math.abs(v - med)));
    return { median: med, mad, scale: Math.max(1.4826 * mad, floor || 0), n: vals.length };
  }

  /* ============================================================
   * 2. Early warning (illness / overreaching)
   * ============================================================
   * Baseline: robust median & 1.4826·MAD over a 28-calendar-day window that ends 2 days before the day checked
   * (dates d−29 … d−2), so the last two days — when a change may already be starting — don't move the baseline.
   * Signals: RHR z ≥ +1.5; ln-HRV z ≤ −1.5; respiratory rate z ≥ +1.5; skin temperature ≥ +0.4 °C above its
   * baseline median; SpO2 ≤ baseline − 2 points or < 94 %.
   * Research context only (not a validated diagnostic): pre-symptomatic RHR / HRV / skin-temperature changes in
   * wearable data — Mishra et al. 2020, Nat Biomed Eng 4:1208; Quer et al. 2021, Nat Med 27:73; Radin et al. 2020,
   * Lancet Digit Health 2:e85; Natarajan et al. 2020, npj Digit Med 3:156 (respiratory rate).
   */
  const WARN = {
    baseDays: 28,
    gap: 2,
    minBase: 14, // baseline values needed per metric
    z: 1.5,
    floors: { rhr: 1.5, lnHrv: 0.06, resp: 0.4, temp: 0.15, spo2: 0.5 }, // floors on 1.4826·MAD
    tempDelta: 0.4,
    spo2Drop: 2,
    spo2Abs: 94,
    weights: { rhr: 1, hrv: 1, temp: 1, resp: 0.75, spo2: 0.75 },
  };
  const WARN_LABEL = { rhr: "Resting heart rate", hrv: "HRV", resp: "Breathing rate", temp: "Skin temperature", spo2: "Blood oxygen" };

  function baseWindow(days, i, get) {
    const vals = [];
    const lo = WARN.gap, hi = WARN.gap + WARN.baseDays - 1;
    for (let k = i - 1; k >= 0; k--) {
      const dd = dayDiff(days[k].date, days[i].date);
      if (dd > hi) break;
      if (dd < lo) continue;
      const v = get(days[k]);
      if (isNum(v)) vals.push(v);
    }
    return vals;
  }

  /* signals for one day: { signals, evaluated } (evaluated = metrics that had a value and a baseline) */
  function warningSignalsAt(days, i) {
    const d = days[i];
    const signals = [];
    let evaluated = 0;
    const lnH = (x) => (isNum(x && x.hrv) && x.hrv > 0 ? Math.log(x.hrv) : null);
    const z = (x, b) => (x - b.median) / b.scale;

    // resting heart rate (up)
    {
      const b = robust(baseWindow(days, i, (x) => x.restingHr), WARN.floors.rhr);
      if (b && b.n >= WARN.minBase && isNum(d.restingHr)) {
        evaluated++;
        const zz = z(d.restingHr, b);
        if (zz >= WARN.z) signals.push({ metric: "rhr", label: WARN_LABEL.rhr, value: r1(d.restingHr), baseline: r1(b.median), z: r2(zz), direction: "up",
          reason: `Resting heart rate ${fmt(d.restingHr)} bpm is ${fmt(d.restingHr - b.median, 1)} bpm above your usual ${fmt(b.median, 1)}.` });
      }
    }
    // HRV on the log scale (down)
    {
      const b = robust(baseWindow(days, i, lnH), WARN.floors.lnHrv);
      const x = lnH(d);
      if (b && b.n >= WARN.minBase && isNum(x)) {
        evaluated++;
        const zz = z(x, b);
        if (zz <= -WARN.z) {
          const pct = (1 - Math.exp(x - b.median)) * 100;
          signals.push({ metric: "hrv", label: WARN_LABEL.hrv, value: r1(d.hrv), baseline: r1(Math.exp(b.median)), z: r2(zz), direction: "down",
            reason: `HRV ${fmt(d.hrv)} ms is ${fmt(pct)} % below your usual ${fmt(Math.exp(b.median))} ms.` });
        }
      }
    }
    // respiratory rate (up)
    {
      const b = robust(baseWindow(days, i, (x) => x.respRate), WARN.floors.resp);
      if (b && b.n >= WARN.minBase && isNum(d.respRate)) {
        evaluated++;
        const zz = z(d.respRate, b);
        if (zz >= WARN.z) signals.push({ metric: "resp", label: WARN_LABEL.resp, value: r1(d.respRate), baseline: r1(b.median), z: r2(zz), direction: "up",
          reason: `Breathing rate ${fmt(d.respRate, 1)} /min is ${fmt(d.respRate - b.median, 1)} above your usual ${fmt(b.median, 1)}.` });
      }
    }
    // skin temperature: absolute rise vs baseline median
    {
      const b = robust(baseWindow(days, i, (x) => x.skinTempDev), WARN.floors.temp);
      if (b && b.n >= WARN.minBase && isNum(d.skinTempDev)) {
        evaluated++;
        const delta = d.skinTempDev - b.median;
        if (delta >= WARN.tempDelta - 1e-9) signals.push({ metric: "temp", label: WARN_LABEL.temp, value: r2(d.skinTempDev), baseline: r2(b.median), z: r2(delta / b.scale), direction: "up",
          reason: `Skin temperature is ${fmt(delta, 1)} °C above your usual.` });
      }
    }
    // SpO2: drop of ≥ 2 points vs baseline median, or below 94 %
    {
      const b = robust(baseWindow(days, i, (x) => x.spo2), WARN.floors.spo2);
      if (isNum(d.spo2) && ((b && b.n >= WARN.minBase) || d.spo2 < WARN.spo2Abs)) {
        evaluated++;
        const low = d.spo2 < WARN.spo2Abs;
        const drop = b && b.n >= WARN.minBase ? b.median - d.spo2 : null;
        if (low || (isNum(drop) && drop >= WARN.spo2Drop - 1e-9)) {
          signals.push({ metric: "spo2", label: WARN_LABEL.spo2, value: r1(d.spo2), baseline: b ? r1(b.median) : null, z: b ? r2((d.spo2 - b.median) / b.scale) : null, direction: "down",
            reason: low ? `Blood oxygen ${fmt(d.spo2, 1)} % is below 94 %.` : `Blood oxygen ${fmt(d.spo2, 1)} % is ${fmt(drop, 1)} points below your usual ${fmt(b.median, 1)} %.` });
        }
      }
    }
    return { signals, evaluated };
  }

  /**
   * warning(days, derived, i) → { date, level: "none"|"watch"|"alert", score, signals, since, reasons, ready, message }
   * level: "alert" when ≥ 3 signals today, or ≥ 2 signals today and yesterday;
   *        "watch" when ≥ 2 signals today, or ≥ 1 signal today and yesterday; else "none".
   * score: weighted count of today's signals (RHR, HRV, temperature 1.0; breathing, SpO2 0.75).
   * since: first day of the current unbroken run of days with ≥ 1 signal (null when level is "none").
   */
  function warning(days, derived, i) {
    const empty = (msg, date) => ({ date: date || null, level: "none", score: 0, signals: [], since: null, reasons: [], ready: false, message: msg, consecutiveDays: 0 });
    if (!Array.isArray(days) || !days.length) return empty("Not enough data yet: the early warning needs about 2 weeks of nights.");
    if (!isNum(i)) i = days.length - 1;
    i = Math.round(i);
    if (i < 0 || i >= days.length || !days[i]) return empty("Not enough data yet: the early warning needs about 2 weeks of nights.");
    const today = warningSignalsAt(days, i);
    if (!today.evaluated) return empty("Not enough data yet: the early warning needs about 2 weeks of nights with heart-rate and HRV readings.", days[i].date);

    const consec = (k) => k - 1 >= 0 && dayDiff(days[k - 1].date, days[k].date) === 1;
    const yest = consec(i) ? warningSignalsAt(days, i - 1) : { signals: [], evaluated: 0 };
    const c0 = today.signals.length, c1 = yest.signals.length;
    let level = "none";
    if (c0 >= 3 || (c0 >= 2 && c1 >= 2)) level = "alert";
    else if (c0 >= 2 || (c0 >= 1 && c1 >= 1)) level = "watch";
    const score = r2(today.signals.reduce((s, x) => s + (WARN.weights[x.metric] || 1), 0));

    // run of consecutive days with ≥ 1 signal, ending today (look back at most 21 days)
    let since = null, run = 0;
    if (c0 > 0) {
      let k = i;
      since = days[i].date;
      run = 1;
      while (run < 21 && consec(k)) {
        const s = k - 1 === i - 1 ? yest : warningSignalsAt(days, k - 1);
        if (!s.signals.length) break;
        k--;
        since = days[k].date;
        run++;
      }
    }
    const reasons = today.signals.map((s) => s.reason);
    if (c1 > 0 && c0 > 0) reasons.push(`Signals have now shown on ${run} days in a row.`);
    let message;
    if (level === "alert") message = "Several of your body signals are off your normal at once. This pattern often comes before a cold or other illness, or follows heavy training, alcohol or poor sleep. Consider an easy day and extra sleep. If you feel unwell, talk to a doctor.";
    else if (level === "watch") message = "Some body signals are off your normal. Worth keeping today easy and watching tomorrow's numbers.";
    else message = c0 === 1 ? "One signal is off your normal today. A single change is common and usually not a concern." : "Your body signals are within your normal range.";
    return { date: days[i].date, level, score, signals: today.signals, since: level === "none" ? null : since, reasons, ready: true, message, consecutiveDays: level === "none" ? 0 : run, evaluated: today.evaluated };
  }

  /* ============================================================
   * 5. Cardio fitness
   * ============================================================ */
  const CARDIO = {
    hrrAbnormal: 12, // HRR at 1 min ≤ 12 bpm abnormal (Cole et al. 1999, NEJM 341:1351; walking cool-down)
    hrrMinIntensity: 0.5, // judge HRR only when the end-of-exercise HR is ≥ 50 % of HR reserve
    driftNotable: 5, // % (aerobic decoupling > 5 % is the common endurance-coaching threshold)
    warmupSec: 300, // ignore at least the first 5 min (or 10 %) for drift and stability
    vo2MinMin: 10, // runs ≥ 10 min
    vo2Speed: [80, 400], // m/min; ACSM running equation, valid for true jogging ≥ 80 m/min
    vo2Hrr: [0.5, 0.95], // %HRR range where %HRR ≈ %VO2R holds well (Swain & Leutholtz 1997)
    stableCv: 0.08, // HR coefficient of variation after warm-up for a "steady" run
    stableDrift: 10, // and |drift| ≤ 10 %
    runWeightPer: 1 / 6, // blend: run weight = n/6, capped
    runWeightMax: 0.85,
    trendDays: 28,
  };
  /* VO2max percentiles (ml/kg/min), FRIEND registry treadmill CPX: Kaminsky et al. 2015, Mayo Clin Proc 90:1515
   * (the reference norms in ACSM's Guidelines for Exercise Testing and Prescription, 10th–11th ed.). Columns: P10 P25 P50 P75 P90. */
  const VO2_NORMS = {
    male: {
      20: [32.1, 40.1, 48.0, 55.2, 61.8], 30: [30.2, 35.9, 42.4, 49.2, 56.5], 40: [26.8, 31.9, 37.8, 45.0, 52.1],
      50: [22.8, 27.1, 32.6, 39.7, 45.6], 60: [19.8, 23.7, 28.2, 34.5, 40.3], 70: [17.1, 20.4, 24.4, 30.4, 36.6],
    },
    female: {
      20: [23.9, 30.5, 37.6, 44.7, 51.3], 30: [20.9, 25.3, 30.2, 36.1, 41.4], 40: [18.8, 22.1, 26.7, 32.4, 38.4],
      50: [17.3, 19.9, 23.4, 27.6, 32.0], 60: [14.6, 17.2, 20.0, 23.8, 27.0], 70: [13.6, 15.6, 18.3, 20.8, 23.1],
    },
  };
  const VO2_PCTS = [10, 25, 50, 75, 90];
  function vo2Norm(vo2, age, sex) {
    if (!isNum(vo2)) return null;
    const a = isNum(age) ? age : 30;
    const g = clamp(Math.floor(a / 10) * 10, 20, 70);
    let row;
    if (sex === "male" || sex === "female") row = VO2_NORMS[sex][g];
    else row = VO2_NORMS.male[g].map((v, k) => (v + VO2_NORMS.female[g][k]) / 2);
    let pct;
    if (vo2 < row[0]) pct = 5;
    else if (vo2 >= row[4]) pct = 95;
    else {
      for (let k = 0; k < 4; k++) {
        if (vo2 >= row[k] && vo2 < row[k + 1]) {
          pct = VO2_PCTS[k] + ((vo2 - row[k]) / (row[k + 1] - row[k])) * (VO2_PCTS[k + 1] - VO2_PCTS[k]);
          break;
        }
      }
    }
    const category = pct < 25 ? "below average" : pct < 50 ? "average" : pct < 75 ? "good" : pct < 90 ? "excellent" : "superior";
    const text = pct === 5 ? "below the 10th percentile" : pct === 95 ? "above the 90th percentile" : `about the ${Math.round(pct)}th percentile`;
    return {
      percentile: Math.round(pct),
      category,
      text,
      ageGroup: `${g}–${g + 9}`,
      sex: sex === "male" || sex === "female" ? sex : "all",
      median: r1(row[2]),
      source: "FRIEND registry (Kaminsky et al. 2015), as used by ACSM",
      note: a < 20 ? "Norms start at age 20; the 20–29 group is used." : a >= 80 ? "Norms end at 79; the 70–79 group is used." : null,
    };
  }

  const cleanSeries = (s) =>
    (Array.isArray(s) ? s : [])
      .filter((x) => Array.isArray(x) && isNum(x[0]) && isNum(x[1]) && x[1] >= 30 && x[1] <= 240 && x[0] >= 0)
      .map((x) => [x[0], x[1]])
      .sort((a, b) => a[0] - b[0]);
  /* HR at time t from a sorted series: exact sample within 2 s, else linear interpolation between neighbours
   * that are each within maxGap seconds of t; else null. */
  function hrAt(series, t, maxGap) {
    const g = maxGap || 30;
    let before = null, after = null;
    for (const s of series) {
      if (s[0] <= t) before = s;
      if (s[0] >= t) {
        after = s;
        break;
      }
    }
    if (before && Math.abs(before[0] - t) <= 2) return before[1];
    if (after && Math.abs(after[0] - t) <= 2) return after[1];
    if (before && after && t - before[0] <= g && after[0] - t <= g) {
      return before[1] + ((after[1] - before[1]) * (t - before[0])) / (after[0] - before[0]);
    }
    return null;
  }
  const STEADY = /run|jog|walk|hike|cycl|bike|ride|row|swim|ellip|ski/i;

  function analyseWorkout(w, date, rhr, maxHr) {
    const dur = isNum(w.durationMin) ? w.durationMin : 0;
    const durSec = dur * 60;
    const after = cleanSeries(w.hrAfter);
    const series = cleanSeries(w.hrSeries);
    const out = {
      date, id: w.id != null ? String(w.id) : null, type: String(w.type || "Workout"), start: w.start || null, durationMin: r0(dur),
      avgHr: isNum(w.avgHr) ? r0(w.avgHr) : null, hrEnd: null, hrr60: null, hrr120: null, hrrAbnormal: null, hrrNote: null,
      speedMpm: null, efficiency: null, drift: null, driftNotable: null, stable: null, pctHrr: null, vo2: null, vo2Note: null,
    };
    const reserve = maxHr - rhr;
    /* heart-rate recovery: end-of-exercise HR (highest sample in the last 30 s of the session or the first 5 s after)
       minus HR 60 / 120 s after the end */
    if (after.length) {
      const cand = [];
      for (const s of series) if (s[0] >= durSec - 30 && s[0] <= durSec + 5) cand.push(s[1]);
      for (const s of after) if (s[0] <= 5) cand.push(s[1]);
      const end = cand.length ? Math.max(...cand) : null;
      if (isNum(end)) {
        out.hrEnd = r0(end);
        const h60 = hrAt(after, 60, 30), h120 = hrAt(after, 120, 30);
        if (isNum(h60)) out.hrr60 = r0(end - h60);
        if (isNum(h120)) out.hrr120 = r0(end - h120);
        if (isNum(out.hrr60)) {
          if (reserve > 0 && (end - rhr) / reserve >= CARDIO.hrrMinIntensity) {
            out.hrrAbnormal = out.hrr60 <= CARDIO.hrrAbnormal;
          } else {
            out.hrrNote = "Session ended too easy to judge heart-rate recovery.";
          }
        }
      }
    }
    /* efficiency (runs/walks): speed in m/min per beat above resting */
    let speed = null;
    if (isNum(w.speedMps) && w.speedMps > 0) speed = w.speedMps * 60;
    else if (isNum(w.distanceM) && w.distanceM > 0 && dur > 0) speed = w.distanceM / dur;
    if (isNum(speed)) out.speedMpm = r1(speed);
    if (/run|jog|walk|hike/i.test(out.type) && isNum(speed) && isNum(w.avgHr) && dur >= 10 && w.avgHr - rhr >= 10) {
      out.efficiency = r2(speed / (w.avgHr - rhr));
    }
    /* HR drift (cardiac drift / Pa:HR decoupling at an assumed steady pace): mean HR of the 2nd half vs the 1st half
       after a warm-up of max(5 min, 10 %) */
    if (series.length && dur >= 20) {
      const cut = Math.max(CARDIO.warmupSec, 0.1 * durSec);
      const body = series.filter((s) => s[0] >= cut && s[0] <= durSec);
      const mid = (cut + durSec) / 2;
      const h1 = body.filter((s) => s[0] < mid).map((s) => s[1]);
      const h2 = body.filter((s) => s[0] >= mid).map((s) => s[1]);
      if (h1.length >= 6 && h2.length >= 6) {
        const m1 = mean(h1), m2 = mean(h2);
        const drift = ((m2 - m1) / m1) * 100;
        const cv = sdOf(body.map((s) => s[1])) / mean(body.map((s) => s[1]));
        out.stable = cv <= CARDIO.stableCv && Math.abs(drift) <= CARDIO.stableDrift;
        // report drift only for steady sessions: very uneven heart rate means pace changed, so drift is not interpretable
        if (STEADY.test(out.type) && cv <= CARDIO.stableCv * 1.5 && Math.abs(drift) <= 25) {
          out.drift = r1(drift);
          out.driftNotable = drift > CARDIO.driftNotable;
        }
      }
    }
    /* VO2max from a run: ACSM running equation (flat) VO2 = 0.2·speed + 3.5; %HRR ≈ %VO2R (Swain & Leutholtz 1997)
       ⇒ VO2max = 3.5 + (VO2 − 3.5) / %HRR */
    if (/run|jog/i.test(out.type) && isNum(speed) && isNum(w.avgHr) && reserve > 0) {
      const ph = (w.avgHr - rhr) / reserve;
      out.pctHrr = r2(ph);
      if (dur < CARDIO.vo2MinMin) out.vo2Note = "Run too short (under 10 min).";
      else if (speed < CARDIO.vo2Speed[0] || speed > CARDIO.vo2Speed[1]) out.vo2Note = "Pace outside the range of the running equation.";
      else if (ph < CARDIO.vo2Hrr[0] || ph > CARDIO.vo2Hrr[1]) out.vo2Note = "Heart rate too low or too close to max for a reliable estimate.";
      else if (out.stable === false) out.vo2Note = "Heart rate was not steady (intervals or hills?).";
      else {
        const v = 3.5 + (0.2 * speed) / ph;
        if (v >= 15 && v <= 90) out.vo2 = r1(v);
        else out.vo2Note = "Estimate outside a plausible range.";
      }
    }
    return out;
  }

  /**
   * cardio(days, derived, profile) → {
   *   workouts: [per-workout analysis, newest last],
   *   trend: [{date, vo2, runMedian, uth, nRuns, runWeight}],     // 28-day rolling, one point per day
   *   latest: {date, vo2, runMedian, uth, nRuns, runWeight, change28, norm} | null,
   *   hrr: {median60, median120, n, abnormal, note} (last 28 days),
   *   efficiency: {median, n}, drift: {median, n, notable},
   *   rhr, maxHr, age, ready, message }
   */
  function cardio(days, derived, profile) {
    const p = profile || {};
    const res = { workouts: [], trend: [], latest: null, hrr: { median60: null, median120: null, n: 0, abnormal: 0, note: null }, efficiency: { median: null, n: 0 }, drift: { median: null, n: 0, notable: 0 }, rhr: null, maxHr: null, age: null, ready: false, message: "Not enough data yet: cardio fitness needs at least a week of resting heart rate." };
    if (!Array.isArray(days) || !days.length) return res;
    const lastDate = days[days.length - 1].date;
    const age = ageOf(p, lastDate);
    res.age = r2(age);
    const dv = (i) => (Array.isArray(derived) && derived[i]) || null;
    const mhr = (i) => (dv(i) && isNum(dv(i).maxHr) && dv(i).maxHr > 120 ? dv(i).maxHr : maxHrFor(p, age));

    // 28-day rolling median resting HR (dates d−27 … d), needs ≥ 3 values
    const rhrMed = days.map((d, i) => {
      const v = [];
      for (let k = i; k >= 0; k--) {
        if (dayDiff(days[k].date, d.date) > CARDIO.trendDays - 1) break;
        if (isNum(days[k].restingHr)) v.push(days[k].restingHr);
      }
      return v.length >= 3 ? median(v) : null;
    });

    // per workout
    const runsByIdx = [];
    for (let i = 0; i < days.length; i++) {
      const ws = (dv(i) && Array.isArray(dv(i).workouts) ? dv(i).workouts : Array.isArray(days[i].workouts) ? days[i].workouts : []) || [];
      const rhr = isNum(rhrMed[i]) ? rhrMed[i] : isNum(days[i].restingHr) ? days[i].restingHr : null;
      for (const w of ws) {
        if (!w || typeof w !== "object" || !isNum(rhr)) continue;
        const a = analyseWorkout(w, days[i].date, rhr, mhr(i));
        res.workouts.push(a);
        if (isNum(a.vo2)) runsByIdx.push([i, a.vo2]);
      }
    }

    // trend: Uth et al. 2004 (VO2max ≈ 15.3 · HRmax / HRrest) blended with the median of run estimates
    let ri = 0;
    const win = [];
    for (let i = 0; i < days.length; i++) {
      while (ri < runsByIdx.length && runsByIdx[ri][0] <= i) win.push(runsByIdx[ri++]);
      while (win.length && dayDiff(days[win[0][0]].date, days[i].date) > CARDIO.trendDays - 1) win.shift();
      if (!isNum(rhrMed[i])) continue;
      const uth = (15.3 * mhr(i)) / rhrMed[i];
      const nRuns = win.length;
      const runMedian = nRuns ? median(win.map((x) => x[1])) : null;
      const wRun = nRuns ? Math.min(CARDIO.runWeightMax, nRuns * CARDIO.runWeightPer) : 0;
      const vo2 = wRun ? wRun * runMedian + (1 - wRun) * uth : uth;
      res.trend.push({ date: days[i].date, vo2: r1(vo2), runMedian: r1(runMedian), uth: r1(uth), nRuns, runWeight: r2(wRun) });
    }
    if (res.trend.length) {
      const L = res.trend[res.trend.length - 1];
      const prev = res.trend.find((t) => dayDiff(t.date, L.date) <= 28 && dayDiff(t.date, L.date) >= 21);
      const nrm = vo2Norm(L.vo2, age, p.sex);
      res.latest = { ...L, change28: prev ? r1(L.vo2 - prev.vo2) : null, norm: nrm };
      res.rhr = r1(rhrMed[days.length - 1]);
      res.maxHr = mhr(days.length - 1);
      const days7 = days.filter((d) => isNum(d.restingHr)).length;
      res.ready = days7 >= 7;
      res.message = !res.ready
        ? "Early estimate: cardio fitness settles after a week of resting heart rate."
        : L.nRuns
          ? `Estimated from your resting heart rate and ${L.nRuns} steady run${L.nRuns > 1 ? "s" : ""} in the last 4 weeks.`
          : "Estimated from your resting and maximum heart rate only. Log runs with distance for a better estimate.";
    }

    // 28-day summaries
    const recent = res.workouts.filter((w) => dayDiff(w.date, lastDate) <= CARDIO.trendDays - 1);
    const h60 = recent.filter((w) => isNum(w.hrr60) && w.hrrAbnormal !== null).map((w) => w.hrr60);
    const h120 = recent.filter((w) => isNum(w.hrr120)).map((w) => w.hrr120);
    res.hrr = {
      median60: h60.length ? r0(median(h60)) : null,
      median120: h120.length ? r0(median(h120)) : null,
      n: h60.length,
      abnormal: recent.filter((w) => w.hrrAbnormal === true).length,
      note: h60.length ? null : "No heart-rate recovery yet: needs workouts with heart rate recorded for 2 minutes after the end.",
    };
    const eff = recent.filter((w) => isNum(w.efficiency)).map((w) => w.efficiency);
    res.efficiency = { median: eff.length ? r2(median(eff)) : null, n: eff.length };
    const dr = recent.filter((w) => isNum(w.drift));
    res.drift = { median: dr.length ? r1(median(dr.map((w) => w.drift))) : null, n: dr.length, notable: dr.filter((w) => w.driftNotable).length };
    return res;
  }

  /* ============================================================
   * 6. Drivers: what goes with better or worse next mornings
   * ============================================================ */
  const DRIVERS = {
    minGroup: 5, // tags: n ≥ 5 with and without
    minPairs: 10, // numeric habits: n ≥ 10 pairs
    q: 0.1,
    p: 0.1,
    minG: 0.3, // |Hedges g| for a "meaningful" tag effect (between small 0.2 and medium 0.5, Cohen 1988)
    minRho: 0.2, // |ρ| for a "meaningful" habit association
  };
  const OUTCOMES = [
    { key: "recovery", label: "next-morning recovery", unit: "pts", get: (days, derived, j) => (derived[j] && isNum(derived[j].recovery) ? derived[j].recovery : null) },
    { key: "sleepPerformance", label: "sleep performance", unit: "pts", get: (days, derived, j) => (derived[j] && isNum(derived[j].sleepPerformance) ? derived[j].sleepPerformance : null) },
    { key: "hrv", label: "next-morning HRV", unit: "%", get: (days, derived, j) => (isNum(days[j].hrv) && days[j].hrv > 0 ? Math.log(days[j].hrv) : null) },
  ];
  const HABITS = [
    { key: "caffeineMg", label: "Caffeine", unit: "mg", get: (d) => (d.entry && isNum(d.entry.caffeineMg) ? d.entry.caffeineMg : null) },
    { key: "steps", label: "Steps", unit: "steps", get: (d) => (isNum(d.steps) ? d.steps : null) },
    { key: "waterMl", label: "Water", unit: "ml", get: (d) => (d.entry && isNum(d.entry.waterMl) ? d.entry.waterMl : null) },
    { key: "strain", label: "Day strain", unit: "", get: (d, r) => (r && isNum(r.strain) ? r.strain : null) },
    { key: "workoutEnd", label: "Workout end time", unit: "h", get: (d, r) => {
      const ws = (r && Array.isArray(r.workouts) ? r.workouts : d.workouts) || [];
      let last = null;
      for (const w of ws) {
        const t = Date.parse(w && w.start);
        if (!isFinite(t) || !isNum(w.durationMin)) continue;
        const e = new Date(t + w.durationMin * 60000);
        if (ymd(e) !== d.date && ymd(new Date(t)) !== d.date) continue;
        const h = (ymd(e) === d.date ? clockMin(e) : 1440 + clockMin(e)) / 60;
        if (last === null || h > last) last = h;
      }
      return last;
    } },
    { key: "bedtime", label: "Bedtime", unit: "min", get: (d, r, next) => (next && next.sleep && isNum(next.sleep.bedMin) ? next.sleep.bedMin : null) },
  ];

  function drivers(days, derived) {
    if (!Array.isArray(days) || !Array.isArray(derived) || days.length < 2) return [];
    const pairs = [];
    for (let i = 0; i < days.length - 1; i++) {
      if (dayDiff(days[i].date, days[i + 1].date) !== 1) continue;
      pairs.push(i);
    }
    const tests = [];
    // tags (only days with a journal entry count, so "no tag" means "logged without it", not "didn't log")
    const tagSet = new Set();
    for (const i of pairs) {
      const j = days[i].entry && days[i].entry.journal;
      if (j && Array.isArray(j.tags)) j.tags.forEach((t) => typeof t === "string" && t && tagSet.add(t));
    }
    for (const tag of tagSet) {
      for (const o of OUTCOMES) {
        const yes = [], no = [];
        for (const i of pairs) {
          const j = days[i].entry && days[i].entry.journal;
          if (!j || !Array.isArray(j.tags)) continue;
          const y = o.get(days, derived, i + 1);
          if (!isNum(y)) continue;
          (j.tags.includes(tag) ? yes : no).push(y);
        }
        if (yes.length < DRIVERS.minGroup || no.length < DRIVERS.minGroup) continue;
        const w = welch(yes, no);
        if (!w || !isNum(w.p)) continue;
        tests.push({ kind: "tag", feature: tag, outcome: o, w, n: yes.length + no.length });
      }
    }
    for (const h of HABITS) {
      for (const o of OUTCOMES) {
        const xs = [], ys = [];
        for (const i of pairs) {
          const x = h.get(days[i], derived[i], derived[i + 1]);
          const y = o.get(days, derived, i + 1);
          if (isNum(x) && isNum(y)) {
            xs.push(x);
            ys.push(y);
          }
        }
        if (xs.length < DRIVERS.minPairs) continue;
        const s = spearman(xs, ys);
        if (!s || !isNum(s.p)) continue;
        tests.push({ kind: "habit", feature: h.label, key: h.key, outcome: o, s, n: xs.length });
      }
    }
    if (!tests.length) return [];
    const qs = bhAdjust(tests.map((t) => (t.w ? t.w.p : t.s.p)));
    const res = tests.map((t, k) => {
      const q = qs[k];
      const o = t.outcome;
      if (t.kind === "tag") {
        const w = t.w;
        const meaningful = Math.abs(w.g) >= DRIVERS.minG;
        const label = q < DRIVERS.q && meaningful ? "likely" : w.p < DRIVERS.p ? "possible" : "no clear effect";
        const isLog = o.key === "hrv";
        const conv = (v) => (isLog ? (Math.exp(v) - 1) * 100 : v);
        const diff = conv(w.diff), lo = conv(w.lo), hi = conv(w.hi);
        const better = w.diff > 0;
        const u = isLog ? " %" : " points";
        const sentence = label === "no clear effect"
          ? `${t.feature}: no clear link with ${o.label} yet (${w.n1} vs ${w.n2} days).`
          : `On days you log ${t.feature}, ${o.label} is ${fmt(diff)}${u} ${better ? "higher" : "lower"} on average (95 % CI ${sign(lo, 0)} to ${sign(hi, 0)}; ${w.n1} vs ${w.n2} days).`;
        return {
          kind: "tag", feature: t.feature, outcome: o.key, outcomeLabel: o.label, unit: o.unit,
          n: t.n, nWith: w.n1, nWithout: w.n2,
          meanWith: isLog ? r1(Math.exp(w.m1)) : r1(w.m1), meanWithout: isLog ? r1(Math.exp(w.m2)) : r1(w.m2),
          diff: r1(diff), ciLo: r1(lo), ciHi: r1(hi), g: r2(w.g), rho: null, df: r1(w.df), t: r2(w.t),
          p: r4(w.p), q: r4(q), label, direction: w.diff > 0 ? "better" : w.diff < 0 ? "worse" : "none",
          strength: Math.abs(w.g), sentence,
        };
      }
      const s = t.s;
      const meaningful = Math.abs(s.rho) >= DRIVERS.minRho;
      const label = q < DRIVERS.q && meaningful ? "likely" : s.p < DRIVERS.p ? "possible" : "no clear effect";
      const more = t.key === "bedtime" ? "A later bedtime" : t.key === "workoutEnd" ? "Finishing workouts later" : `More ${t.feature.toLowerCase()}`;
      const sentence = label === "no clear effect"
        ? `${t.feature}: no clear link with ${o.label} yet (${s.n} days).`
        : `${more} goes with ${s.rho > 0 ? "higher" : "lower"} ${o.label} (ρ = ${s.rho.toFixed(2)}, 95 % CI ${s.lo.toFixed(2)} to ${s.hi.toFixed(2)}; ${s.n} days).`;
      return {
        kind: "habit", feature: t.feature, key: t.key, outcome: o.key, outcomeLabel: o.label, unit: o.unit,
        n: s.n, nWith: null, nWithout: null, meanWith: null, meanWithout: null,
        diff: null, ciLo: r2(s.lo), ciHi: r2(s.hi), g: null, rho: r2(s.rho), df: s.df, t: r2(s.t),
        p: r4(s.p), q: r4(q), label, direction: s.rho > 0 ? "better" : s.rho < 0 ? "worse" : "none",
        // ρ on the d scale (d = 2ρ/√(1−ρ²)) so tags and habits sort on one strength axis
        strength: (2 * Math.abs(s.rho)) / Math.sqrt(1 - Math.min(0.9999, s.rho * s.rho)), sentence,
      };
    });
    const rankOf = { likely: 0, possible: 1, "no clear effect": 2 };
    res.sort((a, b) => rankOf[a.label] - rankOf[b.label] || b.strength - a.strength || a.p - b.p);
    // aliases consumed by the UI and the weekly report: display name and signed effect size
    const OUT = { recovery: "recovery", sleepPerformance: "sleep performance", lnHrv: "HRV", hrv: "HRV" };
    res.forEach((r) => {
      r.strength = r2(r.strength);
      r.name = r.feature;
      r.effect = isNum(r.diff) ? r.diff : isNum(r.rho) ? r.rho : null;
      r.outcomeShort = OUT[r.outcome] || (/hrv/i.test(String(r.outcome)) ? "HRV" : /sleep/i.test(String(r.outcome)) ? "sleep performance" : r.outcome);
    });
    return res;
  }
  /* small status helper for the UI's "not enough data yet" state */
  function driversStatus(days, derived) {
    const res = drivers(days, derived);
    let pairs = 0;
    if (Array.isArray(days)) for (let i = 0; i < days.length - 1; i++) if (dayDiff(days[i].date, days[i + 1].date) === 1 && derived && derived[i + 1] && isNum(derived[i + 1].recovery)) pairs++;
    return {
      pairs, tests: res.length, likely: res.filter((r) => r.label === "likely").length, possible: res.filter((r) => r.label === "possible").length,
      message: res.length ? null : `Not enough data yet: drivers need at least ${DRIVERS.minPairs} paired days, and each tag needs ${DRIVERS.minGroup} days with it and ${DRIVERS.minGroup} without.`,
    };
  }

  /* ============================================================
   * 7. Daytime stress
   * ============================================================
   * 5-minute windows while awake, not in a workout (+10 min after), not napping, with < 60 steps in the window
   * (and < 250 in the window before), whose median HR ≥ resting + max(15, 0.25·HR reserve).
   * Score 0–100 = 100·(1 − e^(−3·share)), share = stress minutes / monitored low-movement minutes.
   * Heart rate rising without movement reflects sympathetic arousal, but also caffeine, heat, illness, posture,
   * digestion or alcohol — this is a physiological-arousal estimate, not a measure of emotional stress.
   */
  const STRESS = { win: 5, stepsMax: 60, prevStepsMax: 250, minDelta: 15, hrrFrac: 0.25, postWorkoutMin: 10, minEligible: 60, k: 3, defaultWake: 360 };
  function stress(day, derived, profile) {
    if (!day || typeof day !== "object" || !Array.isArray(day.steps5) || !day.steps5.length || !Array.isArray(day.hr) || !day.hr.length) return null;
    const row = Array.isArray(derived) ? derived.find((r) => r && r.date === day.date) || null : derived && typeof derived === "object" ? derived : null;
    const p = profile || {};
    const base = row && isNum(row.rhrBaseline) ? row.rhrBaseline : isNum(day.restingHr) ? day.restingHr : row && isNum(row.rhr) ? row.rhr : null;
    if (!isNum(base)) return null;
    const maxHr = row && isNum(row.maxHr) && row.maxHr > 120 ? row.maxHr : maxHrFor(p, ageOf(p, day.date));
    const reserve = Math.max(20, maxHr - base);
    const thrDelta = Math.max(STRESS.minDelta, STRESS.hrrFrac * reserve);
    const thr = base + thrDelta;
    const N = 1440 / STRESS.win;
    const hrBins = Array.from({ length: N }, () => []);
    for (const s of day.hr) {
      if (!Array.isArray(s) || !isNum(s[0]) || !isNum(s[1]) || s[0] < 0 || s[0] >= 1440 || s[1] < 25 || s[1] > 240) continue;
      hrBins[Math.floor(s[0] / STRESS.win)].push(s[1]);
    }
    // a missing 5-min bucket means "no data" (CONTRACT-v3 / engine): such windows are not scored
    const steps = new Array(N).fill(null);
    for (const s of day.steps5) {
      if (!Array.isArray(s) || !isNum(s[0]) || !isNum(s[1]) || s[0] < 0 || s[0] >= 1440 || s[1] < 0) continue;
      const k = Math.floor(s[0] / STRESS.win);
      steps[k] = (steps[k] || 0) + s[1];
    }
    const excl = new Array(N).fill(false);
    const mark = (a, b) => {
      for (let k = Math.max(0, Math.floor(a / STRESS.win)); k < N && k * STRESS.win < b; k++) excl[k] = true;
    };
    // the main sleep that ended this morning (or, without sleep data, assume asleep until 06:00)
    let wake = STRESS.defaultWake;
    if (day.sleep && day.sleep.end) {
      const e = new Date(day.sleep.end);
      if (!isNaN(e)) wake = ymd(e) === day.date ? clockMin(e) : ymd(e) < day.date ? 0 : 1440;
    }
    mark(0, wake);
    const span = (startIso, mins, extra) => {
      const s = new Date(startIso);
      if (isNaN(s) || !isNum(mins)) return;
      const a = ymd(s) === day.date ? clockMin(s) : ymd(s) < day.date ? clockMin(s) - 1440 : 1440;
      mark(a, a + mins + (extra || 0));
    };
    for (const n of Array.isArray(day.naps) ? day.naps : []) {
      if (n && n.start && n.end) span(n.start, (Date.parse(n.end) - Date.parse(n.start)) / 60000, 0);
    }
    const ws = (row && Array.isArray(row.workouts) ? row.workouts : Array.isArray(day.workouts) ? day.workouts : []) || [];
    for (const w of ws) if (w && w.start) span(w.start, w.durationMin, STRESS.postWorkoutMin);

    let eligible = 0;
    const flags = new Array(N).fill(false);
    for (let k = 0; k < N; k++) {
      if (excl[k] || !hrBins[k].length) continue;
      if (steps[k] === null || steps[k] >= STRESS.stepsMax) continue;
      if (k > 0 && steps[k - 1] !== null && steps[k - 1] >= STRESS.prevStepsMax) continue;
      eligible++;
      if (median(hrBins[k]) >= thr) flags[k] = true;
    }
    const windows = [];
    for (let k = 0; k < N; k++) {
      if (!flags[k]) continue;
      const a = k * STRESS.win;
      if (windows.length && windows[windows.length - 1].end === a) windows[windows.length - 1].end = a + STRESS.win;
      else windows.push({ start: a, end: a + STRESS.win });
    }
    windows.forEach((w) => (w.label = `${hhmm(w.start)}–${hhmm(w.end)}`));
    const minutes = flags.filter(Boolean).length * STRESS.win;
    const eligibleMinutes = eligible * STRESS.win;
    const share = eligibleMinutes ? minutes / eligibleMinutes : 0;
    const enough = eligibleMinutes >= STRESS.minEligible;
    return {
