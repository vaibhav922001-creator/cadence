.co-key{display:flex;flex-direction:column;gap:12px}
.co-key > * + *{margin-top:0}
.co-steps{margin:0;padding-left:1.3em;line-height:1.6}
.co-key .co-form{flex-wrap:wrap}`,
  };

  /* website only: the coach runs on the user's own Anthropic API key, kept in this browser */
  function keyCard(hasKey) {
    if (hasKey) {
      return `<div class="card co-key">
        <div class="card-head"><h2>Your Anthropic API key</h2><span class="chip good">In use</span></div>
        <p class="muted">The coach sends your question and a summary of your last 90 days straight from this browser to Anthropic, using your key. The key is stored only in this browser.</p>
        <div class="btn-row"><button class="btn ghost small" type="button" data-action="coach-key-remove">Remove key</button></div>
      </div>`;
    }
    return `<div class="card co-key">
      <div class="card-head"><h2>Turn on the coach</h2><span class="card-meta">Optional</span></div>
      <p class="muted">On this website the coach needs your own Anthropic API key. Everything else in Cadence works without it.</p>
      <ol class="co-steps">
        <li>Sign in at console.anthropic.com and add a little credit.</li>
        <li>Open API Keys and create a key.</li>
        <li>Paste it below.</li>
      </ol>
      <form data-submit="coach-key" class="co-form" autocomplete="off">
        <label class="field co-field"><span>Anthropic API key</span><input name="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" required></label>
        <button class="btn primary" type="submit">Use my key</button>
      </form>
      <p class="note">Your key is stored only in this browser, never on a server we run. Anyone who can use this browser can use it, so don't save it on a shared computer. Each question is billed to your Anthropic account and sends a summary of your health numbers to Anthropic.</p>
    </div>`;
  }
  on("onSubmit", "coach-key", (form, fd) => {
    const k = String(fd.get("key") || "").trim();
    if (!k) return;
    if (!/^sk-ant-/.test(k)) {
      App.toast("That doesn't look like an Anthropic key. It starts with sk-ant-.");
      return;
    }
    if (!App.apiKey.set(k)) {
      App.toast("This browser won't let Cadence store the key.");
      return;
    }
    coach.status = "unknown";
    coach.sample = null;
    App.toast("Coach turned on");
    App.rerender();
  });
  on("on", "coach-key-remove", () => {
    if (coach.streaming) return;
    App.apiKey.set("");
    coach.status = "unknown";
    coach.sample = null;
    App.toast("Key removed");
    App.rerender();
  });

  on("onSubmit", "coach-ask", (form, fd) => ask(fd.get("q")));
  on("on", "coach-chip", (el) => ask(el.dataset.q));
  on("on", "coach-clear", () => {
    if (coach.streaming) return;
    coach.log = [];
    App.rerender();
  });
})();
</script>
<script>/* Cadence v3 views: Insights and Training (performance).
 * Codes against CONTRACT-v3.md: window.CadenceAnalytics (load, weekPlan, forecast, scenario, sleepWindow, sleepDebt,
 * socialJetlag, chronotype, weeklyReport, warning, cardio, drivers, stress, METHODS_ANALYTICS, METHODS_ANALYTICS2).
 * Every call is guarded: a missing feature, an exception or a "not enough data" result renders a designed empty state. */
(function () {
  "use strict";
  const Views = (window.Views = window.Views || {});

  /* ---------- helpers ---------- */
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const DASH = "–";
  const esc = (s) => App.esc(s == null ? "" : String(s));
  const F = () => App.fmt;
  const n0 = (v, dp) => (isNum(v) ? F().num(v, dp || 0) : DASH);
  const sgn = (v, dp) => (isNum(v) ? F().signed(v, dp || 0) : DASH);
  const pick = (o, ...keys) => {
    if (!o || typeof o !== "object") return undefined;
    for (const k of keys) if (o[k] !== undefined && o[k] !== null) return o[k];
    return undefined;
  };
  const numOf = (o, ...keys) => {
    const v = pick(o, ...keys);
    if (isNum(v)) return v;
    if (v && typeof v === "object") {
      const w = pick(v, "value", "mean", "v", "est");
      return isNum(w) ? w : null;
    }
    return null;
  };
  const arr = (x, ...keys) => {
    if (Array.isArray(x)) return x;
    for (const k of keys) if (x && Array.isArray(x[k])) return x[k];
    return [];
  };
  const bandOf = (v) => (!isNum(v) ? null : v >= 67 ? "green" : v >= 34 ? "yellow" : "red");
  const bandColor = (b) => (App.bandColor ? App.bandColor(b) : b ? `var(--${b})` : "var(--muted)");
  const plural = (k, w) => `${k} ${w}${k === 1 ? "" : "s"}`;

  /* time values from analytics may be minutes of day (negative = evening before), hours, "HH:MM" or ISO */
  function tmin(x) {
    if (isNum(x)) return Math.abs(x) <= 36 ? x * 60 : x;
    if (typeof x === "string") {
      const m = /^(\d{1,2}):(\d{2})/.exec(x);
      if (m) return +m[1] * 60 + +m[2];
      const d = new Date(x);
      if (!isNaN(d)) return d.getHours() * 60 + d.getMinutes();
    }
    if (x instanceof Date && !isNaN(x)) return x.getHours() * 60 + x.getMinutes();
    return null;
  }
  const clk = (x) => {
    const m = tmin(x);
    return isNum(m) ? F().clock(m) : DASH;
  };
  const dateLabel = (x) => {
    if (typeof x === "string" && /^\d{4}-\d{2}-\d{2}/.test(x)) return F().day(x.slice(0, 10));
    return x == null ? "" : String(x);
  };
  const shortLabel = (x) => (typeof x === "string" && /^\d{4}-\d{2}-\d{2}/.test(x) ? F().short(x.slice(0, 10)) : x == null ? "" : String(x));

  /* ---------- analytics access: memoised per derived array, always guarded ---------- */
  const AN = () => window.CadenceAnalytics || null;
  const hasFn = (name) => {
    const a = AN();
    return !!(a && typeof a[name] === "function");
  };
  const memo = new WeakMap();
  function call(ctx, key, name, args) {
    if (!hasFn(name)) return { __state: "missing" };
    let m = memo.get(ctx.derived);
    if (!m) memo.set(ctx.derived, (m = new Map()));
    const k = name + "|" + key;
    if (m.has(k)) return m.get(k);
    let r;
    try {
      r = AN()[name].apply(null, args);
    } catch (e) {
      console.warn("Cadence analytics failed:", name, e);
      r = { __state: "error" };
    }
    m.set(k, r);
    return r;
  }
  function stateOf(r) {
    if (r == null) return "short";
    if (r.__state) return r.__state;
    if (typeof r !== "object") return "ok";
    const tags = [r.status, r.error, r.reason, r.state, r.code];
    if (tags.some((t) => typeof t === "string" && /not[_ ]?enough|insufficient|building/i.test(t) && !/baseline/i.test(String(r.status || "")))) return "short";
    if (r.notEnoughData === true || r.insufficient === true || r.ok === false) return "short";
    return "ok";
  }
  /* how many more days the feature needs: from the result when it says, else from the contract minimum */
  function moreDays(r, minDays, have) {
    const direct = numOf(r, "moreDays", "remaining", "daysNeeded", "missing");
    if (isNum(direct) && direct > 0) return Math.ceil(direct);
    const need = numOf(r, "need", "needed", "minDays", "min", "required");
    const got = numOf(r, "have", "has", "days", "count");
    const h = isNum(got) ? got : isNum(r && r.n) && !Array.isArray(r) ? r.n : have;
    if (isNum(need) && isNum(h) && need > h) return Math.ceil(need - h);
    if (isNum(minDays) && isNum(have) && minDays > have) return Math.ceil(minDays - have);
    return null;
  }

  function hasDayData(ctx, k) {
    const d = ctx.derived[k];
    return !!(d && (isNum(d.recovery) || isNum(d.strain) || d.sleep));
  }
  function latestIdx(ctx) {
    for (let k = ctx.days.length - 1; k >= 0; k--) if (hasDayData(ctx, k)) return k;
    return ctx.days.length - 1;
  }
  function haveDays(ctx, upto) {
    let c = 0;
    for (let k = 0; k <= upto && k < ctx.days.length; k++) if (hasDayData(ctx, k)) c++;
    return c;
  }

  /* ---------- building blocks ---------- */
  const head = (title, meta) => `<div class="card-head"><h2>${title}</h2>${meta ? `<div class="card-meta">${meta}</div>` : ""}</div>`;
  const chip = (cls, text) => `<span class="chip ${cls}">${text}</span>`;
  function stat(lbl, value, unit, sub) {
    return `<div class="stat"><div class="stat-label">${lbl}</div>` +
      `<div class="stat-value num">${value}${unit && value !== DASH ? `<span class="stat-unit">${unit}</span>` : ""}</div>` +
      (sub ? `<div class="stat-sub">${sub}</div>` : "") + `</div>`;
  }
  /* designed empty state; says what's missing and, when known, how many more days are needed */
  function wait(title, r, opts) {
    const o = opts || {};
    const st = stateOf(r);
    let text;
    if (st === "missing") text = o.missing || "This part of Cadence is still loading. Reload the page in a moment.";
    else if (st === "error") text = "Couldn't work this out from the current data. It will try again when new days arrive.";
    else {
      const k = moreDays(r, o.min, o.have);
      const own = r && typeof r === "object" ? pick(r, "message", "text") : null;
      text = (typeof own === "string" && own) || o.why || "Not enough data yet.";
      if (isNum(k) && k > 0) text += ` About <span class="num">${plural(k, o.unit || "more day")}</span> to go.`;
    }
    return `<div class="empty in-wait"><h3>${esc(title)}</h3><p>${text}</p></div>`;
  }
  function card(title, meta, body, cls) {
    return `<div class="card ${cls || ""}">${head(title, meta)}${body}</div>`;
  }

  /* horizontal bar centred on zero (effects) */
  function divBar(v, max, color) {
    const m = isNum(max) && max > 0 ? max : 1;
    const p = isNum(v) ? Math.max(-1, Math.min(1, v / m)) * 50 : 0;
    const left = p >= 0 ? 50 : 50 + p;
    return `<span class="in-div"><span class="in-div-f" style="left:${left.toFixed(1)}%;width:${Math.abs(p).toFixed(1)}%;--c:${color}"></span></span>`;
  }
  /* 95 % CI bar around zero with a dot at the estimate */
  function ciBar(est, lo, hi, max, color) {
    const m = isNum(max) && max > 0 ? max : 1;
    const pos = (v) => 50 + Math.max(-1, Math.min(1, v / m)) * 50;
    const a = isNum(lo) ? pos(lo) : isNum(est) ? pos(est) : 50;
    const b = isNum(hi) ? pos(hi) : isNum(est) ? pos(est) : 50;
    const dot = isNum(est) ? `<span class="in-ci-d" style="left:${pos(est).toFixed(1)}%;--c:${color}"></span>` : "";
    return `<span class="in-ci" aria-hidden="true"><span class="in-ci-r" style="left:${Math.min(a, b).toFixed(1)}%;width:${Math.max(0.8, Math.abs(b - a)).toFixed(1)}%;--c:${color}"></span>${dot}</span>`;
  }

  /* ================= metric names ================= */
  const METRIC = {
    rhr: ["Resting heart rate", "bpm", 0, "lower"],
    restinghr: ["Resting heart rate", "bpm", 0, "lower"],
    hrv: ["HRV", "ms", 0, "higher"],
    lnhrv: ["HRV", "ms", 0, "higher"],
    skintemp: ["Skin temperature", "°C", 1, "lower"],
    temp: ["Skin temperature", "°C", 1, "lower"],
    resp: ["Respiratory rate", "/min", 1, "lower"],
    resprate: ["Respiratory rate", "/min", 1, "lower"],
    spo2: ["Blood oxygen", "%", 1, "higher"],
    recovery: ["Recovery", "%", 0, "higher"],
    strain: ["Strain", "", 1, null],
    sleep: ["Sleep", "", 0, "higher"],
    sleepperformance: ["Sleep performance", "%", 0, "higher"],
    asleep: ["Time asleep", "min", 0, "higher"],
    sleepdebt: ["Sleep debt", "min", 0, "lower"],
    consistency: ["Sleep consistency", "%", 0, "higher"],
    sleepconsistency: ["Sleep consistency", "%", 0, "higher"],
    steps: ["Steps", "", 0, "higher"],
  };
  const metaOf = (key) => METRIC[String(key || "").toLowerCase().replace(/[^a-z0-9]/g, "")] || null;

  /* ================= INSIGHTS ================= */

  function warningCard(ctx, li) {
    const w = call(ctx, "w" + li, "warning", [ctx.days, ctx.derived, li]);
    const st = stateOf(w);
    if (st !== "ok") {
      return `<div class="card in-warnbox">${head("Early warning")}${wait("Baseline still forming", w, { min: 14, have: haveDays(ctx, li), why: "Early warning compares last night's vitals with your own 4-week baseline." })}</div>`;
    }
    const level = String(pick(w, "level") || "none").toLowerCase();
    const sigs = arr(w.signals);
    const since = pick(w, "since");
    const sinceTxt = since ? (isNum(since) ? `for ${plural(since, "day")}` : `since ${esc(dateLabel(since))}`) : "";
    if (level === "none" || level === "ok") {
      return `<div class="in-banner in-ok" role="status"><span class="in-banner-dot"></span><div><strong>No early warning signs</strong>` +
        `<p class="muted">Resting heart rate, HRV, breathing rate, skin temperature and blood oxygen are inside your normal range.</p></div></div>`;
    }
    const alert = level === "alert";
    const rows = sigs.map((s) => {
      const key = pick(s, "metric", "key", "name");
      const meta = metaOf(key) || [String(key || "Signal"), pick(s, "unit") || "", 1, null];
      let v = numOf(s, "value"), b = numOf(s, "baseline");
      if (/hrv/i.test(String(key)) && isNum(v) && v < 7 && isNum(b) && b < 7) { v = Math.exp(v); b = Math.exp(b); } // ln(HRV) → ms
      const dp = meta[2];
      const diff = isNum(v) && isNum(b) ? v - b : null;
      const z = numOf(s, "z");
      const unit = meta[1] === "°C" && /skin|temp/i.test(String(key)) ? "°C" : meta[1];
      return `<div class="in-sig"><span class="in-sig-n">${esc(meta[0])}</span>` +
        `<span class="num in-sig-v">${isNum(v) ? n0(v, dp) + (unit ? " " + esc(unit) : "") : DASH}</span>` +
        `<span class="muted num in-sig-b">vs ${isNum(b) ? n0(b, dp) : DASH}${isNum(diff) ? ` · ${sgn(diff, dp)}` : ""}${isNum(z) ? ` · z ${sgn(z, 1)}` : ""}</span></div>`;
    }).join("");
    return `<div class="in-banner ${alert ? "in-alert" : "in-watch"}" role="status"><span class="in-banner-dot"></span><div class="in-banner-b">` +
      `<div class="in-banner-h"><strong>${alert ? "Your body is under strain" : "Something to watch"}</strong>${chip(alert ? "bad" : "warn", alert ? "Alert" : "Watch")}${sinceTxt ? `<span class="muted small">${sinceTxt}</span>` : ""}</div>` +
      `<p class="muted">${alert ? "Several vitals are off your baseline at once. This often comes before illness or after heavy load. Rest, fluids and an early night are the safe call." : "One or more vitals moved away from your baseline. Keep an eye on it and go easy if it persists."}</p>` +
      (rows ? `<div class="in-sigs">${rows}</div>` : "") + `</div></div>`;
  }

  function weeklyCard(ctx, li) {
    const end = ctx.days[li] ? ctx.days[li].date : null;
    const r = call(ctx, "wr" + end, "weeklyReport", [ctx.days, ctx.derived, end]);
    if (stateOf(r) !== "ok") return card("Weekly report", "", wait("Report not ready", r, { min: 14, have: haveDays(ctx, li), why: "The report compares this week with last week, so it needs two weeks of data." }), "span-2");
    const range = pick(r, "range", "period");
    const startD = pick(r, "start", "startDate", "from");
    const endD = pick(r, "end", "endDate", "to") || end;
    const meta = typeof range === "string" ? esc(range) : startD ? `${esc(shortLabel(startD))} – ${esc(shortLabel(endD))}` : `week to ${esc(shortLabel(endD))}`;
    const headline = pick(r, "headline", "title", "summary");
    const rows = arr(r.metrics || r.rows || r.table || r.averages).map((m) => {
      const key = pick(m, "key", "metric", "id", "name", "label");
      const meta2 = metaOf(key);
      const name = pick(m, "label", "name") || (meta2 ? meta2[0] : key);
      const cur = numOf(m, "thisWeek", "current", "cur", "now", "value", "week");
      const prev = numOf(m, "lastWeek", "previous", "prev", "before", "prior");
      let delta = numOf(m, "change", "delta", "diff");
      if (!isNum(delta) && isNum(cur) && isNum(prev)) delta = cur - prev;
      const dp = isNum(m.dp) ? m.dp : meta2 ? meta2[2] : isNum(cur) && Math.abs(cur) < 30 ? 1 : 0;
      const unit = pick(m, "unit") != null ? String(pick(m, "unit")) : meta2 ? meta2[1] : "";
      const isMin = unit === "min";
      const fmtv = (v) => (!isNum(v) ? DASH : isMin ? F().mins(v) : n0(v, dp) + (unit && unit !== "%" ? "" : unit));
      let better = pick(m, "better", "betterWhen", "direction");
      if (better == null && typeof m.higherIsBetter === "boolean") better = m.higherIsBetter ? "higher" : "lower";
      if (better == null && meta2) better = meta2[3];
      const tiny = !isNum(delta) || Math.abs(delta) < (dp ? 0.05 : 0.5);
      const good = !tiny && better ? (better === "higher") === delta > 0 : null;
      const cls = tiny || good === null ? "neutral" : good ? "good" : "warn";
      const dtxt = !isNum(delta) ? DASH : isMin ? (delta < 0 ? "−" : "+") + F().mins(Math.abs(delta)) : sgn(delta, dp);
      return `<div class="in-wk-r"><span class="in-wk-n">${esc(name)}${unit && !isMin && unit !== "%" ? ` <span class="muted">${esc(unit)}</span>` : ""}</span>` +
        `<span class="num in-wk-v">${fmtv(cur)}</span><span class="num muted in-wk-v">${fmtv(prev)}</span>` +
        `<span class="in-wk-c">${chip(cls + " num", esc(dtxt))}</span></div>`;
    }).join("");
    const dayBit = (o, lbl, cls) => {
      if (!o) return "";
      const date = typeof o === "string" ? o : pick(o, "date", "day");
      const rec = typeof o === "object" ? numOf(o, "recovery", "value", "score") : null;
      const why = typeof o === "object" ? pick(o, "why", "reason", "note", "text") : null;
      return `<div class="in-day ${cls}"><div class="stat-label">${lbl}</div><div class="in-day-d">${esc(dateLabel(date))}${isNum(rec) ? ` <span class="num" style="color:${bandColor(bandOf(rec))}">${Math.round(rec)}%</span>` : ""}</div>${why ? `<div class="muted small">${esc(why)}</div>` : ""}</div>`;
    };
    const best = dayBit(pick(r, "best", "bestDay"), "Best day", "good");
    const worst = dayBit(pick(r, "toughest", "worst", "worstDay", "hardest"), "Toughest day", "bad");
    const actions = arr(r.actions || r.todo || r.nextSteps).slice(0, 3).map((a) => (typeof a === "string" ? a : pick(a, "text", "action", "title") || "")).filter(Boolean);
    const lines = arr(r.lines || r.notes || r.sentences || (Array.isArray(r.summary) ? r.summary : null)).map((x) => (typeof x === "string" ? x : pick(x, "text") || "")).filter(Boolean);
    return `<div class="card span-2 in-week">${head("Weekly report", meta)}` +
      (headline && typeof headline === "string" ? `<p class="in-headline">${esc(headline)}</p>` : "") +
      (lines.length ? `<div class="insight">${lines.slice(0, 4).map((l) => esc(l)).join(" ")}</div>` : "") +
      (rows ? `<div class="in-wk"><div class="in-wk-r in-wk-h"><span></span><span>This wk</span><span>Last wk</span><span>Change</span></div>${rows}</div>` : "") +
      (best || worst ? `<div class="in-days">${best}${worst}</div>` : "") +
      (actions.length ? `<div><div class="stat-label">Three things for next week</div><ol class="in-actions">${actions.map((a) => `<li>${esc(a)}</li>`).join("")}</ol></div>` : "") +
      `</div>`;
  }

  const OUTCOME = { recovery: "next recovery", nextrecovery: "next recovery", sleepperformance: "sleep performance", sleep: "sleep performance", hrv: "next HRV" };
  function driversCard(ctx, li) {
    const r = call(ctx, "dr", "drivers", [ctx.days, ctx.derived]);
    const list = stateOf(r) === "ok" ? arr(r, "drivers", "items", "results", "effects") : [];
    if (!list.length) {
      return card("What affects you", "", wait("Still learning your patterns", stateOf(r) === "ok" ? { status: "not_enough_data" } : r, {
        min: 28, have: haveDays(ctx, li),
        why: "Tag your days in the Journal (alcohol, late meal, caffeine…). A factor shows here once there are at least 5 days with it and 5 without.",
      }), "span-2");
    }
    const rows = list.map((x) => {
      const ci = Array.isArray(x.ci) ? x.ci : Array.isArray(x.ci95) ? x.ci95 : null;
      const lab = String(pick(x, "label", "verdict", "strength", "confidence") || "").toLowerCase();
      const kind = String(pick(x, "kind", "type", "test") || "");
      const numeric = /num|spear|rho|corr/i.test(kind) || (isNum(x.rho) && !isNum(x.diff));
      return {
        name: String(pick(x, "name", "factor", "tag", "habit", "key") || "Factor"),
        outcome: String(pick(x, "outcome", "target", "metric", "on") || ""),
        effect: numOf(x, "effect", "diff", "delta", "rho", "estimate"),
        lo: ci ? ci[0] : numOf(x, "lo", "ciLo", "lower", "low"),
        hi: ci ? ci[1] : numOf(x, "hi", "ciHi", "upper", "high"),
        n: pick(x, "n", "count"),
        nA: numOf(x, "nWith", "n1", "nA", "nYes"),
        nB: numOf(x, "nWithout", "n2", "nB", "nNo"),
        q: numOf(x, "q", "qValue", "fdr"),
        unit: pick(x, "unit"),
        numeric,
        lab: /likely/.test(lab) ? "likely" : /possible|maybe|weak/.test(lab) ? "possible" : lab ? "none" : isNum(x.q) ? (x.q < 0.05 ? "likely" : x.q < 0.2 ? "possible" : "none") : "none",
      };
    });
    const groupMax = {};
    for (const r1 of rows) {
      const g = (r1.numeric ? "n" : "t") + r1.outcome;
      groupMax[g] = Math.max(groupMax[g] || 0, ...[r1.effect, r1.lo, r1.hi].filter(isNum).map(Math.abs));
    }
    const rank = { likely: 0, possible: 1, none: 2 };
    rows.sort((a, b) => rank[a.lab] - rank[b.lab] || Math.abs(b.effect || 0) - Math.abs(a.effect || 0));
    const one = (x) => {
      const out = OUTCOME[x.outcome.toLowerCase().replace(/[^a-z]/g, "")] || x.outcome;
      const unit = x.unit != null ? String(x.unit) : x.numeric ? "ρ" : /hrv/i.test(x.outcome) ? "ms" : "pts";
      const eff = !isNum(x.effect) ? DASH : x.numeric && unit === "ρ" ? `ρ ${sgn(x.effect, 2)}` : `${sgn(x.effect, 1)} ${esc(unit)}`;
      const color = x.lab === "none" ? "var(--muted)" : x.effect >= 0 ? "var(--green)" : "var(--red)";
      const nTxt = isNum(x.nA) && isNum(x.nB) ? `n ${x.nA}/${x.nB}` : isNum(x.n) ? `n ${x.n}` : Array.isArray(x.n) ? `n ${x.n.join("/")}` : "";
      const cls = x.lab === "likely" ? "good" : x.lab === "possible" ? "warn" : "neutral";
      const word = x.lab === "likely" ? "Likely" : x.lab === "possible" ? "Possible" : "No clear effect";
      const ciTxt = isNum(x.lo) && isNum(x.hi) ? `95% CI ${sgn(x.lo, x.numeric ? 2 : 1)} to ${sgn(x.hi, x.numeric ? 2 : 1)}` : "";
      return `<div class="in-drv"><div class="in-drv-t"><span class="in-drv-n"><strong>${esc(x.name)}</strong>${out ? ` <span class="muted">→ ${esc(out)}</span>` : ""}</span>` +
        `<span class="num in-drv-e">${eff}</span>${chip(cls, word)}</div>` +
        `<div class="in-drv-b">${ciBar(x.effect, x.lo, x.hi, groupMax[(x.numeric ? "n" : "t") + x.outcome] * 1.08, color)}` +
        `<span class="muted num in-drv-m">${[ciTxt, nTxt, isNum(x.q) ? `q ${x.q < 0.001 ? "<0.001" : x.q.toFixed(3)}` : ""].filter(Boolean).join(" · ")}</span></div></div>`;
    };
    const shown = rows.filter((x) => x.lab !== "none");
    const rest = rows.filter((x) => x.lab === "none");
    return `<div class="card span-2">${head("What affects you", `${rows.length} factor${rows.length === 1 ? "" : "s"} tested`)}` +
      `<p class="muted small">Difference on the day after, with a 95% confidence interval. The bar crosses the centre line when zero is still possible.</p>` +
      (shown.length ? `<div class="in-drvs">${shown.map(one).join("")}</div>` : `<p class="insight">Nothing stands out yet. Every factor's interval still includes zero.</p>`) +
      (rest.length ? `<details class="in-more"><summary>${plural(rest.length, "factor")} with no clear effect</summary><div class="in-drvs">${rest.map(one).join("")}</div></details>` : "") +
      `</div>`;
  }

  function sleepWindowCard(ctx, li) {
    const sw = call(ctx, "sw", "sleepWindow", [ctx.days, ctx.derived]);
    const ok = stateOf(sw) === "ok";
    const best = ok ? pick(sw, "recommended", "best", "window", "bedtime") : null;
    const bStart = best && typeof best === "object" ? pick(best, "start", "from", "lo", "bedtime") : best;
    const bEnd = best && typeof best === "object" ? pick(best, "end", "to", "hi") : null;
    const bStartM = tmin(bStart);
    const bEndM = isNum(tmin(bEnd)) ? tmin(bEnd) : isNum(bStartM) ? bStartM + 30 : null;
    const dur = ok ? pick(sw, "duration", "sleepDuration", "target") : null;
    const durM = isNum(dur) ? dur : dur && typeof dur === "object" ? numOf(dur, "minutes", "mean", "value", "target") : best && typeof best === "object" ? numOf(best, "duration", "durationMin") : null;
    const rec = best && typeof best === "object" ? pick(best, "recovery", "nextRecovery", "mean") : ok ? pick(sw, "recovery") : null;
    const recM = isNum(rec) ? rec : numOf(rec, "mean", "value");
    const recLo = rec && typeof rec === "object" ? numOf(rec, "lo", "lower") : numOf(best, "lo", "ciLo");
    const recHi = rec && typeof rec === "object" ? numOf(rec, "hi", "upper") : numOf(best, "hi", "ciHi");
    const nBest = best && typeof best === "object" ? numOf(best, "n", "nights") : null;

    // secondary metrics, each guarded on its own
    const debtR = call(ctx, "sd" + li, "sleepDebt", [ctx.days, ctx.derived, li]);
    let debt = null;
    if (stateOf(debtR) === "ok") {
      if (isNum(debtR)) debt = debtR;
      else if (Array.isArray(debtR)) { const v = debtR[li]; debt = isNum(v) ? v : numOf(v, "debt", "minutes", "value"); }
      else debt = numOf(debtR, "debt", "minutes", "value", "total");
    }
    const sjR = call(ctx, "sj", "socialJetlag", [ctx.days, ctx.derived]);
    let sj = stateOf(sjR) === "ok" ? (isNum(sjR) ? sjR : numOf(sjR, "hours", "value", "h")) : null;
    if (isNum(sj) && sj > 12) sj = sj / 60; // minutes → hours
    const chR = call(ctx, "ch", "chronotype", [ctx.days, ctx.derived]);
    const chOk = stateOf(chR) === "ok";
    const chLabel = chOk ? (typeof chR === "string" ? chR : pick(chR, "label", "type", "name", "category")) : null;
    const msf = chOk && typeof chR === "object" ? pick(chR, "msfsc", "MSFsc", "midSleep", "msf") : null;

    const extras = `<div class="stats">` +
      stat("Sleep debt", isNum(debt) ? esc(F().mins(debt)) : DASH, "", "rolling 7 days") +
      stat("Social jetlag", isNum(sj) ? `${n0(sj, 1)}` : DASH, "h", "weekend vs weekday") +
      stat("Chronotype", chLabel ? `<span class="in-chrono">${esc(String(chLabel).replace(/^./, (c) => c.toUpperCase()))}</span>` : DASH, "", isNum(tmin(msf)) ? `mid-sleep ${esc(clk(msf))}` : "from free days") +
      `</div>`;

    if (!ok || !isNum(bStartM)) {
      return card("Sleep window", "", wait("No clear best bedtime yet", ok ? { status: "not_enough_data" } : sw, {
        min: 21, have: haveDays(ctx, li), why: "Cadence needs at least 4 nights in a half-hour bedtime slot before it can compare slots fairly.",
      }) + extras);
    }
    const bins = arr(sw.bins || sw.slots).map((b) => {
      const s = tmin(pick(b, "start", "from", "bedtime", "bin"));
      const rr = pick(b, "recovery", "nextRecovery", "mean");
      return {
        s,
        m: isNum(rr) ? rr : numOf(rr, "mean", "value"),
        lo: rr && typeof rr === "object" ? numOf(rr, "lo", "lower") : numOf(b, "lo", "ciLo"),
        hi: rr && typeof rr === "object" ? numOf(rr, "hi", "upper") : numOf(b, "hi", "ciHi"),
        n: numOf(b, "n", "nights", "count"),
      };
    }).filter((b) => isNum(b.s) && isNum(b.m));
    const binRows = bins.length
      ? `<div class="in-bins">${bins.map((b) => {
        const on = Math.abs(((b.s - bStartM) % 1440 + 1440) % 1440) < 1;
        const pos = (v) => Math.max(0, Math.min(100, v));
        const a = isNum(b.lo) ? pos(b.lo) : pos(b.m), z = isNum(b.hi) ? pos(b.hi) : pos(b.m);
        return `<div class="in-bin${on ? " on" : ""}"><span class="num in-bin-t">${esc(clk(b.s))}</span>` +
          `<span class="in-bin-bar"><span class="in-bin-r" style="left:${a.toFixed(1)}%;width:${Math.max(1, z - a).toFixed(1)}%"></span><span class="in-ci-d" style="left:${pos(b.m).toFixed(1)}%;--c:${bandColor(bandOf(b.m))}"></span></span>` +
          `<span class="num muted in-bin-v">${Math.round(b.m)}%${isNum(b.n) ? ` · n${b.n}` : ""}</span></div>`;
      }).join("")}<div class="in-bin in-bin-axis"><span></span><span class="in-bin-ticks num"><span>0</span><span>50</span><span>100%</span></span><span></span></div></div>`
      : "";
    return `<div class="card">${head("Sleep window", isNum(nBest) ? `<span class="num">${nBest}</span> nights in slot` : "from your own nights")}` +
      `<div class="in-big"><span class="num">${esc(clk(bStartM))} – ${esc(clk(bEndM))}</span></div>` +
      `<p class="muted">Best bedtime for you${isNum(durM) ? `, aiming for <span class="num">${esc(F().mins(durM))}</span> asleep` : ""}.` +
      `${isNum(recM) ? ` Next-day recovery averaged <span class="num">${Math.round(recM)}%</span>${isNum(recLo) && isNum(recHi) ? ` (95% CI <span class="num">${Math.round(recLo)}–${Math.round(recHi)}%</span>)` : ""}.` : ""}</p>` +
      binRows + extras + `</div>`;
  }

  /* pull a dated series out of the cardio result, whatever its exact shape */
  function cardioSeries(c, names) {
    const cand = [];
    for (const nm of names) {
      cand.push(c && c.trend && c.trend[nm], c && c.trends && c.trends[nm], c && c.series && c.series[nm], c && c[nm + "Trend"], c && c[nm + "Series"], c && c[nm]);
      if (c && c[nm] && typeof c[nm] === "object" && !Array.isArray(c[nm])) cand.push(c[nm].series, c[nm].trend, c[nm].points);
    }
    let pts = cand.find((x) => Array.isArray(x) && x.length);
    if (!pts) {
      const ws = arr(c, "workouts", "sessions", "items");
      pts = ws.map((w) => {
        for (const nm of names) if (isNum(w[nm])) return { date: pick(w, "date", "day", "start"), v: w[nm] };
        return null;
      }).filter(Boolean);
    }
    return (pts || []).map((p) => {
      if (Array.isArray(p)) return { date: p[0], v: isNum(p[1]) ? p[1] : null };
      return { date: pick(p, "date", "day", "start", "label"), v: numOf(p, "v", "value", ...names, "median") };
    }).filter((p) => isNum(p.v));
  }

  function cardioCard(ctx, li) {
    const c = call(ctx, "cd", "cardio", [ctx.days, ctx.derived, ctx.profile]);
    if (stateOf(c) !== "ok") {
      return card("Cardio fitness", "", wait("Not enough workouts yet", c, {
        why: "Cardio fitness needs at least 3 workouts with heart rate recorded in the minutes after you stop, plus some runs or walks with distance.",
      }), "span-2");
    }
    const vo2 = cardioSeries(c, ["vo2max", "vo2", "VO2max"]);
    const hrr = cardioSeries(c, ["hrr60", "HRR60", "hrr1"]);
    const eff = cardioSeries(c, ["efficiency", "runEfficiency", "eff"]);
    const lbl = (p) => shortLabel(p.date);
    const vo2Now = numOf(c, "vo2maxLatest", "vo2Latest") ?? (c.latest ? numOf(c.latest, "vo2max", "vo2") : null) ?? (vo2.length ? vo2[vo2.length - 1].v : null);
    const vo2n = numOf(c.vo2max && typeof c.vo2max === "object" ? c.vo2max : c, "n", "vo2n", "nVo2") ?? vo2.length;
    const hrrNow = (c.latest ? numOf(c.latest, "hrr60") : null) ?? (hrr.length ? hrr[hrr.length - 1].v : null);
    const bits = [];
    bits.push(`<div class="stats">` +
      stat("VO₂max", isNum(vo2Now) ? n0(vo2Now, 1) : DASH, "ml/kg/min", vo2n ? `${plural(vo2n, "estimate")}` : "") +
      stat("HR recovery", isNum(hrrNow) ? n0(hrrNow) : DASH, "bpm", isNum(hrrNow) ? (hrrNow <= 12 ? `<span class="c-red">at or below 12 · abnormal</span>` : "1 min after stopping") : "") +
      stat("Efficiency", eff.length ? n0(eff[eff.length - 1].v, 2) : DASH, "", "m/min per bpm") +
      `</div>`);
    const charts = [];
    if (vo2.length >= 2) charts.push(`<div><div class="stat-label">VO₂max trend <span class="num">· n ${vo2.length}</span></div>${Charts.slot({ type: "line", data: vo2.map((p) => ({ label: lbl(p), v: p.v })), color: "var(--strain)", height: 140, area: true, fmt: (v) => n0(v, 1) })}</div>`);
    if (hrr.length >= 2) charts.push(`<div><div class="stat-label">Heart-rate recovery, 60 s <span class="num">· n ${hrr.length}</span></div>${Charts.slot({ type: "line", data: hrr.map((p) => ({ label: lbl(p), v: p.v })), color: "var(--green)", height: 140, area: false, fmt: (v) => `${Math.round(v)} bpm`, ref: { v: 12, label: "12 bpm abnormal" } })}</div>`);
    if (eff.length >= 2) charts.push(`<div><div class="stat-label">Running / walking efficiency <span class="num">· n ${eff.length}</span></div>${Charts.slot({ type: "line", data: eff.map((p) => ({ label: lbl(p), v: p.v })), color: "var(--sleep)", height: 140, area: false, fmt: (v) => n0(v, 2) })}</div>`);
    // HR drift notes from the latest sessions
    const ws = arr(c, "workouts", "sessions", "items");
    const drifts = ws.filter((w) => isNum(numOf(w, "drift", "hrDrift", "driftPct"))).slice(-3).reverse().map((w) => {
      const d = numOf(w, "drift", "hrDrift", "driftPct");
      const pct = d; // analytics returns drift already in percent
      return `<li><span class="num">${esc(shortLabel(pick(w, "date", "day", "start")))}</span> ${esc(pick(w, "type", "name") || "Workout")}: heart rate drifted <span class="num">${sgn(pct, 1)}%</span> in the second half${Math.abs(pct) > 5 ? " — more than 5% suggests heat, dehydration or a pace above your aerobic base." : "."}</li>`;
    });
    const notes = arr(c.notes || c.messages).map((x) => (typeof x === "string" ? x : pick(x, "text") || "")).filter(Boolean).slice(0, 3).map((t) => `<li>${esc(t)}</li>`);
    return `<div class="card span-2">${head("Cardio fitness", "from your workouts")}${bits.join("")}` +
      (charts.length ? `<div class="in-charts">${charts.join("")}</div>` : `<p class="muted small">Trends appear once there are two or more estimates.</p>`) +
      (drifts.length || notes.length ? `<div><div class="stat-label">Heart-rate drift</div><ul class="in-notes">${drifts.concat(notes).join("")}</ul></div>` : "") +
      `</div>`;
  }

  function stressCard(ctx, li) {
    const si = ctx.i >= 0 ? ctx.i : li;
    const day = ctx.days[si], d = ctx.derived[si];
    if (!day) return "";
    const r = call(ctx, "st" + si, "stress", [day, d, ctx.profile]);
    const date = day.date;
    if (stateOf(r) !== "ok" || !r) {
      return card("Daytime stress", esc(F().short(date)), wait("No stress reading", r == null ? { status: "not_enough_data" } : r, {
        why: Array.isArray(day.steps5) ? "Not enough awake, still time with heart rate on this day." : "Stress needs 5-minute step counts from the sync app so it can tell calm sitting from movement. Sync again with the latest Cadence Sync.",
      }));
    }
    const minutes = numOf(r, "minutes", "stressMin", "total");
    const score = numOf(r, "score");
    const wins = arr(r.windows || r.periods || r.spans).map((w) => (Array.isArray(w) ? [tmin(w[0]), tmin(w[1])] : [tmin(pick(w, "start", "from")), tmin(pick(w, "end", "to"))])).filter((w) => isNum(w[0]) && isNum(w[1]));
    const pos = (m) => ((Math.max(0, Math.min(1440, m)) / 1440) * 100).toFixed(2);
    const seg = (a, b, cls, t) => (isNum(a) && isNum(b) && b > a ? `<span class="in-tl-s ${cls}" style="left:${pos(a)}%;width:${(pos(b) - pos(a)).toFixed(2)}%"${t ? ` title="${esc(t)}"` : ""}></span>` : "");
    let shade = "";
    const mid = new Date(date + "T00:00:00");
    const minsOf = (iso) => { const t = new Date(iso); return isNaN(t) ? null : (t - mid) / 60000; };
    if (day.sleep && day.sleep.end) shade += seg(0, minsOf(day.sleep.end), "sl", "Sleep");
    for (const w of (d && d.workouts) || day.workouts || []) {
      const a = minsOf(w.start);
      if (isNum(a)) shade += seg(a, a + (w.durationMin || 0), "wo", w.type || "Workout");
    }
    const stressSegs = wins.map(([a, b]) => seg(a, b, "st", `${F().clock(a)}–${F().clock(b)}`)).join("");
    const longest = wins.slice().sort((x, y) => (y[1] - y[0]) - (x[1] - x[0]))[0];
    return `<div class="card">${head("Daytime stress", esc(F().day(date)))}` +
      `<div class="stats">${stat("Stress time", isNum(minutes) ? esc(F().mins(minutes)) : DASH, "", "high heart rate while still")}${isNum(score) ? stat("Score", n0(score), "", "0–100") : ""}</div>` +
      `<div class="in-tl" role="img" aria-label="${esc(`${wins.length} stress windows on ${F().day(date)}`)}">${shade}${stressSegs}</div>` +
      `<div class="in-tl-x num muted"><span>12am</span><span>6am</span><span>noon</span><span>6pm</span><span>12am</span></div>` +
      `<div class="legend"><span class="key" style="--c:var(--yellow)">Stress</span><span class="key" style="--c:var(--strain)">Workout</span><span class="key" style="--c:var(--sleep)">Sleep</span></div>` +
      (longest ? `<p class="muted small">Longest stretch <span class="num">${esc(F().clock(longest[0]))}–${esc(F().clock(longest[1]))}</span>. Counted when heart rate sits well above resting while you're barely moving, outside workouts and sleep.</p>` : `<p class="muted small">No stress windows on this day.</p>`) +
      `</div>`;
  }

  function methodsCard() {
    const a = AN() || {};
    const list = [].concat(Array.isArray(a.METHODS_ANALYTICS) ? a.METHODS_ANALYTICS : [], Array.isArray(a.METHODS_ANALYTICS2) ? a.METHODS_ANALYTICS2 : []).filter((m) => m && (m.title || m.body));
    const para = (t) => String(t == null ? "" : t).split(/\n\s*\n/).map((p) => p.trim()).filter(Boolean).map((p) => `<p>${esc(p)}</p>`).join("");
    const coachLink = App.env && App.env() === "web" && !(App.coachOn && App.coachOn()) && Views.coach
      ? `<p class="note">Want to ask questions in plain words? An optional <a href="#coach">AI coach</a> runs on your own Anthropic key.</p>` : "";
    return `<div class="card span-2"><details class="in-how"><summary>How this is calculated</summary>` +
      `<p class="muted small">Everything on this page is plain statistics on your own data — no AI. Each result needs a minimum sample and shows its uncertainty.</p>` +
      (list.length ? `<div class="acc">${list.map((m) => `<details><summary>${esc(m.title || "")}</summary><div class="acc-b">${para(m.body)}</div></details>`).join("")}</div>` : `<p class="muted">Method notes are loading.</p>`) +
      `</details>${coachLink}</div>`;
  }

  /* ================= TRAINING (performance) ================= */

  const STATUS = {
    "detraining": ["neutral", "Detraining"],
    "sweet spot": ["good", "Sweet spot"],
    "caution": ["warn", "Caution"],
    "high risk": ["bad", "High risk"],
    "building baseline": ["neutral", "Building baseline"],
  };
  const statusChip = (s) => {
    const k = String(s || "").toLowerCase().replace(/[_-]/g, " ");
    const m = STATUS[k] || ["neutral", s ? String(s) : "–"];
    return chip(m[0], esc(m[1]));
  };
  function loadSeries(ctx) {
    const r = call(ctx, "load", "load", [ctx.days, ctx.derived]);
    if (stateOf(r) !== "ok") return { r, list: null };
    const list = arr(r, "days", "series", "load");
    return { r, list: list.length ? list : null };
  }
  function loadAt(list, ctx, i) {
    if (!list) return null;
    const date = ctx.days[i] && ctx.days[i].date;
    if (list.length === ctx.days.length && list[i] && (!list[i].date || list[i].date === date)) return list[i];
    return list.find((x) => x && x.date === date) || null;
  }

  function pmcCard(ctx, list) {
    const end = ctx.i;
    const start = Math.max(0, end - 89);
    const data = [];
    for (let k = start; k <= end; k++) {
      const x = loadAt(list, ctx, k) || {};
      data.push({ label: F().short(ctx.days[k].date), ctl: numOf(x, "ctl", "fitness"), atl: numOf(x, "atl", "fatigue"), tsb: numOf(x, "tsb", "form") });
    }
    const cur = loadAt(list, ctx, end) || {};
    const ctl = numOf(cur, "ctl", "fitness"), atl = numOf(cur, "atl", "fatigue"), tsb = numOf(cur, "tsb", "form");
    let ramp = numOf(cur, "ramp", "rampRate");
    if (!isNum(ramp) && end >= 7) { const p = loadAt(list, ctx, end - 7); const pc = numOf(p, "ctl"); if (isNum(pc) && isNum(ctl)) ramp = ctl - pc; }
    const formWord = !isNum(tsb) ? "" : tsb > 5 ? "Fresh — a good day to go hard." : tsb >= -10 ? "Balanced — training is being absorbed." : tsb >= -30 ? "Tired — productive load, but watch recovery." : "Very tired — back off for a few days.";
    return `<div class="card span-2">${head("Fitness, fatigue and form", `last ${data.length} days`)}` +
      `<div class="stats">${stat("Fitness", n0(ctl, 1), "", "42-day load")}${stat("Fatigue", n0(atl, 1), "", "7-day load")}` +
      `${stat("Form", isNum(tsb) ? sgn(tsb, 1) : DASH, "", "fitness − fatigue")}${stat("Ramp", isNum(ramp) ? sgn(ramp, 1) : DASH, "", "fitness change / week")}</div>` +
      Charts.slot({ type: "pmc", data, height: 240 }) +
      (formWord ? `<p class="insight strain">${formWord}</p>` : "") + `</div>`;
  }

  function acwrCard(ctx, list) {
    const cur = loadAt(list, ctx, ctx.i) || {};
    const acwr = numOf(cur, "acwr", "ratio");
    const status = pick(cur, "status");
    const building = /build/i.test(String(status || "")) || !isNum(acwr);
    const have = haveDays(ctx, ctx.i);
    if (building) {
      return card("Load ratio", statusChip(status || "building baseline"), wait("Building your baseline", { status: "not_enough_data" }, {
        min: 21, have, why: "The acute:chronic ratio compares your last 7 days of load with the last 28. It needs 3 weeks of data.",
      }));
    }
    const hist = [];
    for (let k = Math.max(0, ctx.i - 41); k <= ctx.i; k++) {
      const x = loadAt(list, ctx, k);
      hist.push({ label: F().short(ctx.days[k].date), v: numOf(x, "acwr") });
    }
    const zoneTxt = acwr < 0.8 ? "Your last week was lighter than your usual load. Fine for a taper or rest week; fitness slips if it lasts."
      : acwr <= 1.3 ? "Your last week matches what your body is used to. This is where fitness builds with the least injury risk."
      : acwr <= 1.5 ? "Load is climbing faster than your base. Hold here for a few days before adding more."
      : "A load spike well above your base. Injury and illness risk rises here; plan easier days.";
    return `<div class="card">${head("Load ratio", statusChip(status))}` +
      `<div class="in-big"><span class="num">${acwr.toFixed(2)}</span><span class="stat-unit">acute : chronic</span></div>` +
      Charts.slot({ type: "acwr", value: acwr, height: 70 }) +
      `<div class="legend"><span class="key" style="--c:var(--z1)">&lt;0.8 detraining</span><span class="key" style="--c:var(--green)">0.8–1.3 sweet spot</span><span class="key" style="--c:var(--yellow)">1.3–1.5 caution</span><span class="key" style="--c:var(--red)">&gt;1.5 high risk</span></div>` +
      `<p class="muted small">${zoneTxt}</p>` +
      (hist.filter((h) => isNum(h.v)).length >= 2 ? Charts.slot({ type: "line", data: hist, color: "var(--strain)", height: 120, area: false, band: [0.8, 1.3], fmt: (v) => v.toFixed(2) }) : "") +
      `</div>`;
  }

  function planCard(ctx) {
    const r = call(ctx, "wp" + ctx.i, "weekPlan", [ctx.days, ctx.derived, ctx.i]);
    const list = stateOf(r) === "ok" ? arr(r, "days", "plan", "items") : [];
    if (!list.length) return card("Next 7 days", "", wait("No plan yet", stateOf(r) === "ok" ? { status: "not_enough_data" } : r, { min: 21, have: haveDays(ctx, ctx.i), why: "The plan keeps your load ratio between 0.8 and 1.3, so it needs 3 weeks of load history." }));
    const base = ctx.days[ctx.i] ? ctx.days[ctx.i].date : null;
    const rows = list.slice(0, 7).map((p, k) => {
      const date = pick(p, "date", "day") || (base && ctx.E && ctx.E.addDays ? ctx.E.addDays(base, k + 1) : "");
      const rng = Array.isArray(p.strain) ? p.strain : Array.isArray(p.range) ? p.range : Array.isArray(p.target) ? p.target : null;
      const lo = rng ? rng[0] : numOf(p, "lo", "min", "strainLo", "low");
      const hi = rng ? rng[1] : numOf(p, "hi", "max", "strainHi", "high");
      const why = pick(p, "reason", "why", "note", "label") || "";
      const kind = String(pick(p, "kind", "type", "intensity") || "");
      const mid = isNum(lo) && isNum(hi) ? (lo + hi) / 2 : null;
      const cls = /rest|recover|easy/i.test(kind) || (isNum(mid) && mid < 9) ? "neutral" : isNum(mid) && mid >= 15 ? "bad" : "strain";
      const d = typeof date === "string" && /^\d{4}-\d{2}-\d{2}/.test(date) ? F().day(date).split(" ") : [String(date), ""];
      return `<div class="in-plan-r"><span class="in-plan-d"><strong>${esc(d[0])}</strong> <span class="muted num">${esc(d.slice(1).join(" "))}</span></span>` +
        `<span>${chip(cls + " num", isNum(lo) && isNum(hi) ? `${F().strain(lo)}–${F().strain(hi)}` : DASH)}</span>` +
        `<span class="muted small in-plan-w">${esc(why)}</span></div>`;
    }).join("");
    return `<div class="card">${head("Next 7 days", "strain range")}<div class="in-plan">${rows}</div>` +
      `<p class="muted small">Ranges keep your load ratio in the sweet spot. Follow your morning recovery when it disagrees.</p></div>`;
  }

  function forecastCard(ctx) {
    const r = call(ctx, "fc" + ctx.i, "forecast", [ctx.days, ctx.derived, ctx.i, {}]);
    if (stateOf(r) !== "ok" || !isNum(numOf(r, "recovery", "value", "mean"))) {
      return card("Tomorrow", "", wait("Forecast not ready", stateOf(r) === "ok" ? { status: "not_enough_data" } : r, { min: 29, have: haveDays(ctx, ctx.i), why: "The forecast learns from at least 28 pairs of a day and the morning after." }));
    }
    const rec = numOf(r, "recovery", "value", "mean");
    const lo = numOf(r, "lo", "low", "lower"), hi = numOf(r, "hi", "high", "upper");
    const n = numOf(r, "n"), r2 = numOf(r, "r2cv", "r2", "R2");
    const band = bandOf(rec);
    const drivers = arr(r.drivers).map((x) => ({ name: String(pick(x, "name", "label", "feature") || ""), e: numOf(x, "effect", "contribution", "value") })).filter((x) => isNum(x.e) && x.name)
      .sort((a, b) => Math.abs(b.e) - Math.abs(a.e)).slice(0, 5);
    const mx = Math.max(1, ...drivers.map((x) => Math.abs(x.e)));
    const next = ctx.E && ctx.E.addDays && ctx.days[ctx.i] ? ctx.E.addDays(ctx.days[ctx.i].date, 1) : null;
    return `<div class="card">${head("Tomorrow", next ? esc(F().day(next)) : "")}` +
      `<div class="in-fc"><span class="in-big num" style="color:${bandColor(band)}">${Math.round(rec)}%</span>` +
      `<span class="muted">expected recovery${isNum(lo) && isNum(hi) ? `<br><span class="num">${Math.round(lo)}–${Math.round(hi)}%</span> 80% range` : ""}</span></div>` +
      (isNum(lo) && isNum(hi) ? `<div class="in-range" aria-hidden="true"><span class="in-range-r" style="left:${Math.max(0, lo).toFixed(1)}%;width:${Math.max(1, Math.min(100, hi) - Math.max(0, lo)).toFixed(1)}%"></span><span class="in-ci-d" style="left:${Math.max(0, Math.min(100, rec)).toFixed(1)}%;--c:${bandColor(band)}"></span></div><div class="in-tl-x num muted"><span>0</span><span>33</span><span>67</span><span>100</span></div>` : "") +
      (drivers.length ? `<div><div class="stat-label">What moves it</div><div class="in-fdr">${drivers.map((x) => `<div class="in-fdr-r"><span class="in-fdr-n">${esc(x.name)}</span>${divBar(x.e, mx, x.e >= 0 ? "var(--green)" : "var(--red)")}<span class="num in-fdr-v">${sgn(x.e, 1)}</span></div>`).join("")}</div></div>` : "") +
      `<p class="muted small">Assumes today's strain and your usual bedtime.${isNum(n) ? ` Learned from <span class="num">${n}</span> days` : ""}${isNum(r2) ? `; explains about <span class="num">${Math.round(Math.max(0, r2) * 100)}%</span> of day-to-day change (cross-validated)` : ""}.</p></div>`;
  }

  /* normalise a scenario result to {rows:[bedtimeMin], cols:[{label, strain}], cell(r,c) → recovery} */
  function normScenario(s) {
    if (!s || typeof s !== "object") return null;
    const strainLabel = (v, k) => (typeof v === "string" ? v : isNum(v) ? (k === 0 ? "Low" : k === 1 ? "Medium" : k === 2 ? "High" : "") : pick(v, "label", "name") || "");
    const strainVal = (v) => (isNum(v) ? v : numOf(v, "strain", "value"));
    const recOf = (c) => (isNum(c) ? c : numOf(c, "recovery", "value", "mean"));
    const flat = Array.isArray(s) ? s : Array.isArray(s.cells) && s.cells.length && !Array.isArray(s.cells[0]) && s.cells[0] && pick(s.cells[0], "bedtime") != null ? s.cells : null;
    if (flat) {
      const rowsK = [], colsK = [], map = new Map();
      for (const c of flat) {
        const b = tmin(pick(c, "bedtime", "bed"));
        const sv = pick(c, "strainLabel", "level", "strain");
        const key = typeof sv === "object" ? JSON.stringify(sv) : String(sv);
        if (!isNum(b)) continue;
        if (!rowsK.includes(b)) rowsK.push(b);
        if (!colsK.some((x) => x.key === key)) colsK.push({ key, label: typeof sv === "string" ? sv : isNum(c.strain) ? `Strain ${F().strain(c.strain)}` : strainLabel(sv, colsK.length), strain: isNum(c.strain) ? c.strain : null });
        map.set(b + "|" + key, recOf(c));
      }
      if (!rowsK.length || !colsK.length) return null;
      return { rows: rowsK, cols: colsK, cell: (r, c) => map.get(rowsK[r] + "|" + colsK[c].key) };
    }
    const bed = arr(s.bedtimes || s.rows || s.bedtime);
    const str = arr(s.strains || s.cols || s.columns || s.strain);
    const grid = arr(s.grid || s.values || s.matrix || (Array.isArray(s.cells) ? s.cells : null));
    if (!bed.length || !grid.length) return null;
    const rows = bed.map((b) => (typeof b === "object" ? pick(b, "bedtime", "time", "label") : b));
    const nc = Math.max(...grid.map((g) => (Array.isArray(g) ? g.length : arr(g, "cells", "values").length)));
    const cols = (str.length ? str : Array.from({ length: nc }, (_, k) => k)).map((v, k) => ({ label: strainLabel(v, k) || `Option ${k + 1}`, strain: strainVal(v) }));
    return { rows, cols, cell: (r, c) => { const g = grid[r]; const rowArr = Array.isArray(g) ? g : arr(g, "cells", "values"); return recOf(rowArr[c]); } };
  }

  /* "21:30" → "9:30 pm"; numbers are minutes after midnight (negative = evening) */
  function bedLabel(b) {
    let m = null;
    if (typeof b === "string" && /^\d{1,2}:\d{2}$/.test(b)) { const [h, mm] = b.split(":").map(Number); m = h * 60 + mm; }
    else if (isNum(b)) m = ((Math.round(b) % 1440) + 1440) % 1440;
    if (m == null) return String(b || "");
    const h = Math.floor(m / 60), mm = m % 60;
    return `${h % 12 || 12}:${String(mm).padStart(2, "0")} ${h < 12 ? "am" : "pm"}`;
  }

  function scenarioCard(ctx) {
    const r = call(ctx, "sc" + ctx.i, "scenario", [ctx.days, ctx.derived, ctx.i]);
    const g = stateOf(r) === "ok" ? normScenario(r) : null;
    if (!g) return card("If you…", "", wait("What-if grid not ready", stateOf(r) === "ok" ? { status: "not_enough_data" } : r, { min: 29, have: haveDays(ctx, ctx.i), why: "The grid uses the same forecast model, which needs at least 28 paired days." }), "span-2");
    let best = null;
    g.rows.forEach((_, i) => g.cols.forEach((__, j) => { const v = g.cell(i, j); if (isNum(v) && (!best || v > best.v)) best = { i, j, v }; }));
    const cells = g.rows.map((b, i) =>
      `<tr><th scope="row" class="num">${esc(bedLabel(b))}</th>` +
      g.cols.map((c, j) => {
        const v = g.cell(i, j);
        const bd = bandOf(v);
        const on = best && best.i === i && best.j === j;
        return `<td class="num${on ? " on" : ""}" style="--c:${bandColor(bd)}">${isNum(v) ? Math.round(v) + "%" : DASH}</td>`;
      }).join("") + `</tr>`).join("");
    return `<div class="card span-2">${head("If you…", "tomorrow's recovery")}` +
      `<p class="muted small">Rows are tonight's bedtime, columns are how hard you go today. Each cell is the forecast recovery for tomorrow morning.</p>` +
      `<table class="in-grid"><thead><tr><th scope="col">Bed</th>${g.cols.map((c) => `<th scope="col">${esc(c.label)}${isNum(c.strain) && !/\d/.test(c.label) ? `<span class="num muted"> ${F().strain(c.strain)}</span>` : ""}</th>`).join("")}</tr></thead><tbody>${cells}</tbody></table>` +
      `<div class="legend"><span class="key" style="--c:var(--green)">67–100%</span><span class="key" style="--c:var(--yellow)">34–66%</span><span class="key" style="--c:var(--red)">0–33%</span><span class="key" style="--c:var(--ink)">best option outlined</span></div></div>`;
  }

  /* ---------- CSS (tokens only) ---------- */
  const CSS = `

`;

  /* ---------- views ---------- */
  Views.insights = {
    label: "Insights",
    icon: "insights",
    dated: false,
    css: CSS,
    render(ctx) {
      const headH = `<div class="page-head"><h1>Insights</h1><div class="sub">Patterns in your own data, worked out with plain statistics. No AI.</div></div>`;
      if (!ctx.days.length) return `<div class="page">${headH}<div class="empty"><h2>No data yet</h2><p>Import health data on the Data page to see insights.</p></div></div>`;
      const li = latestIdx(ctx);
      const sec = (f) => { try { return f(); } catch (e) { console.error("Insights section failed", e); return ""; } };
      return `<div class="page v-insights">${headH}` +
        sec(() => warningCard(ctx, li)) +
        `<div class="grid-2">` +
        sec(() => weeklyCard(ctx, li)) +
        sec(() => driversCard(ctx, li)) +
        sec(() => sleepWindowCard(ctx, li)) +
        sec(() => stressCard(ctx, li)) +
        sec(() => cardioCard(ctx, li)) +
        sec(() => methodsCard()) +
        `</div></div>`;
    },
  };

  Views.performance = {
    label: "Training",
    icon: "training",
    dated: true,
    css: CSS,
    render(ctx) {
      const date = ctx.day ? ctx.day.date : App.sel();
      const headH = `<div class="page-head"><h1>Training</h1><div class="sub">${esc(F().day(date))} · load, form and what's next</div></div>`;
      if (ctx.i === -1 || !ctx.day) return `<div class="page">${headH}<div class="empty"><h2>Nothing recorded this day</h2><p>Pick another day, or import data from the Data page.</p></div></div>`;
      const sec = (f) => { try { return f(); } catch (e) { console.error("Training section failed", e); return ""; } };
      const { r, list } = loadSeries(ctx);
      const top = list
        ? sec(() => pmcCard(ctx, list))
        : card("Fitness, fatigue and form", "", wait("Load model not ready", r, { min: 21, have: haveDays(ctx, ctx.i), why: "Fitness and fatigue are running averages of daily strain load." }), "span-2");
      return `<div class="page v-performance">${headH}<div class="grid-2">` +
        top +
        (list ? sec(() => acwrCard(ctx, list)) : "") +
        sec(() => forecastCard(ctx)) +
        sec(() => planCard(ctx)) +
        sec(() => scenarioCard(ctx)) +
        `</div></div>`;
    },
  };
})();
</script>
<script>/* Cadence view: Data (source status, import, phone app, profile, backup). */
(function () {
  "use strict";
  const Views = (window.Views = window.Views || {});
  if (!window.App || !App.on) return;
  const esc = App.esc;

  const st = {
    importMsg: null, // {ok, text}
    busy: false,
    confirmClear: false,
    downloads: undefined, // undefined = not checked, null = unavailable
    dlChecking: false,
  };

  const UPLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>';

  const isWeb = () => !!(App.env && App.env() === "web");
  /* website: save files with a Blob link (same .save() shape as claude downloads) */
  const blobSaver = {
    async save({ filename, data }) {
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.rel = "noopener";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        URL.revokeObjectURL(url);
        a.remove();
      }, 1500);
    },
  };

  function checkDownloads() {
    if (st.downloads === undefined && isWeb()) st.downloads = blobSaver;
    if (st.downloads !== undefined || st.dlChecking) return;
    st.dlChecking = true;
    Promise.resolve()
      .then(() => (window.claude && window.claude.use ? window.claude.use("downloads") : null))
      .catch(() => null)
      .then((d) => {
        st.downloads = d || null;
        st.dlChecking = false;
        if (App.view() === "data") App.rerender();
      });
  }

  async function handleFile(file) {
    if (!file || st.busy) return;
    st.busy = true;
    st.importMsg = { ok: true, text: `Reading ${file.name}…` };
    App.rerender();
    try {

          ok: true,

  /* exact decimal age (years, 2 dp): engine's ageOn when present, else the same days/365.2425 formula */
  function exactAge(dob) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dob || ""))) return null;
    const d = new Date();
    const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    try {
      const E = window.CadenceEngine;
      if (E && typeof E.ageOn === "function") {
        const v = E.ageOn(dob, today);
        if (typeof v === "number" && isFinite(v)) return v;
      }
      if (App.ageOn) {
        const v = App.ageOn(dob, today);
        if (typeof v === "number" && isFinite(v)) return v;
      }
    } catch (e) {}
    const ms = new Date(today + "T00:00:00") - new Date(dob + "T00:00:00");
    return isFinite(ms) && ms >= 0 ? Math.round((ms / 86400000 / 365.2425) * 100) / 100 : null;
  }

  /* ===================================================== Google Health (website only) */
  const G_LS = "cadence.google";
  const gDefaults = () => ({ clientId: "974274557373-akp5c3i2ml53aivk8skbob3eh72b8ojs.apps.googleusercontent.com", proxyUrl: "", lastSync: null, lastCount: 0, sources: [], warnings: [], autoSync: false, firstDays: 90 });
  function gLoad() {

  const G_ERRORS = {
    popup_blocked: "Your browser blocked the Google sign-in window. Allow pop-ups for this site, then try again.",
    popup_closed: "The Google sign-in window was closed before you finished.",

    redirect_uri_mismatch: "This site's address isn't allowed for your Client ID. Add it in Google Cloud.",
    not_connected: "You're not connected to Google Health. Tap Connect.",
    token_expired: "Your Google sign-in has expired. Tap Connect to sign in again.",
    unauthorized: "Your Google sign-in has expired. Tap Connect to sign in again.",
    auth: "Your Google sign-in has expired. Tap Connect to sign in again.",

  const gErr = (e) => {

    const code = e && e.code;

  function gConfigure() {
    const gh = GH();
    if (!gh || !g.cfg.clientId) return false;
    try {
      gh.configure({ clientId: g.cfg.clientId, proxyUrl: g.cfg.proxyUrl || undefined });
      g.configured = true;
    } catch (e) {
      g.configured = false;
      g.msg = { ok: false, text: gErr(e) };
    }
    return g.configured;
  }
  async function gRefresh() {
    const gh = GH();
    let c = false;
    try {
      c = gh && g.configured ? !!(await gh.isConnected()) : false;
    } catch (e) {
      c = false;
    }
    if (c !== g.connected) {
      g.connected = c;
      if (App.view() === "data") App.rerender();
    }
    return c;
  }

  function normProgress(p) {
    if (typeof p === "number") return { frac: p > 1 ? p / 100 : p, label: "" };
    if (!p || typeof p !== "object") return null;
    let f = [p.fraction, p.progress, p.pct, p.percent].find((x) => typeof x === "number");
    if (f == null && typeof p.done === "number" && typeof p.total === "number" && p.total > 0) f = p.done / p.total;
    if (typeof f === "number" && f > 1) f = f / 100;
    return { frac: typeof f === "number" ? Math.max(0, Math.min(1, f)) : null, label: String(p.message || p.label || p.step || p.stage || "") };
  }
  function paintProgress() {
    const bar = document.getElementById("gh-bar");
    const lab = document.getElementById("gh-plabel");
    if (!g.progress) return;
    if (bar) {
      const f = g.progress.frac;
      bar.style.width = f == null ? "35%" : Math.round(f * 100) + "%";
      bar.parentElement.classList.toggle("indet", f == null);
    }
    if (lab) lab.textContent = g.progress.label || (g.progress.frac != null ? Math.round(g.progress.frac * 100) + "%" : "Working…");
  }

  const ymdOf = (d) => window.CadenceEngine.ymd(d);
  async function gSync(auto) {
    const gh = GH();
    if (!gh || g.busy) return;
    if (!g.configured && !gConfigure()) return;
    g.busy = "sync";
    g.msg = null;
    g.progress = { frac: null, label: "Starting…" };
    if (!auto || App.view() === "data") App.rerender();
    try {
      let days, since;
      if (g.cfg.lastSync) {
        const last = new Date(g.cfg.lastSync);
        const s = new Date(last.getTime() - 2 * 864e5); // 2-day overlap catches late-arriving data
        since = ymdOf(s);
        days = Math.max(3, Math.min(180, Math.ceil((Date.now() - s.getTime()) / 864e5) + 1));
      } else {
        days = [30, 90, 180].includes(+g.cfg.firstDays) ? +g.cfg.firstDays : 90;
      }
      const res = await gh.sync({
        days,
        since,
        onProgress: (p) => {
          g.progress = normProgress(p) || g.progress;
          paintProgress();
        },
      });
      const E = window.CadenceEngine;
      const raw = (res && Array.isArray(res.days) ? res.days : []);
      const clean = raw.map((d) => (E.cleanDay ? E.cleanDay(d) : d)).filter(Boolean);
      const n = clean.length ? await App.importDays(clean, { merge: true }) : 0;
      g.cfg.lastSync = new Date().toISOString();
      g.cfg.lastCount = n;
      g.cfg.sources = Array.isArray(res && res.sources) ? res.sources.slice(0, 20) : [];
      g.cfg.warnings = Array.isArray(res && res.warnings) ? res.warnings.slice(0, 20) : [];
      gSave();
      g.msg = { ok: true, text: n ? `Synced ${App.fmt.num(n)} day${n === 1 ? "" : "s"} from Google Health.` : "Synced. No new days in that range." };
      if (!auto) App.toast(n ? `Synced ${n} day${n === 1 ? "" : "s"}` : "Up to date");
    } catch (e) {
      g.msg = { ok: false, text: gErr(e) };
      if (e && /^(token_expired|unauthorized|auth|not_connected)$/.test(String(e.code || ""))) await gRefresh();
    }
    g.busy = null;
    g.progress = null;
    App.rerender();
  }

    const changed = id !== g.cfg.clientId;
    g.cfg.clientId = id;
    g.cfg.proxyUrl = proxy;
