.sh-sheet-grid a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:84px;padding:12px 6px;border-radius:16px;background:var(--surface-2,#121821);border:1px solid var(--line,rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.04);color:var(--ink,#fff);text-decoration:none;font-size:13px;font-weight:500;text-align:center;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.sh-sheet-grid a svg{width:22px;height:22px;color:var(--muted,#8b96a5)}
.sh-sheet-grid a.on{border-color:var(--strain,#3D8BFF)}
.sh-sheet-grid a.on svg{color:var(--strain,#3D8BFF)}
.sh-sheet-grid a:focus-visible{outline:2px solid var(--strain,#3D8BFF);outline-offset:2px}
.sh-sheet-foot{margin-top:14px;padding:0 4px;font-family:var(--f-mono,ui-monospace,monospace);font-size:11px;color:var(--muted,#8b96a5);display:flex;align-items:center;gap:8px}
.sh-sheet-foot .dot,.sh-status .dot{width:6px;height:6px;border-radius:50%;background:var(--yellow,#FFC93C);flex:none}
.sh-sheet-foot .dot.ok,.sh-status .dot.ok{background:var(--green,#19E68C)}
html.sh-lock,html.sh-lock body{overflow:hidden}
.sh-mini{display:grid;gap:4px;padding:12px;border-radius:14px;background:var(--surface,#0C1015);border:1px solid var(--line,rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.sh-mini-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;font-family:var(--f-mono,ui-monospace,monospace);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted,#8b96a5)}
.sh-mini-i{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:3px 4px;border-radius:8px;color:var(--ink,#fff);text-decoration:none}
.sh-mini-i:hover{background:var(--surface-2,#121821)}
.sh-mini-i:focus-visible{outline:2px solid var(--strain,#3D8BFF);outline-offset:1px}
.sh-mini-l{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted,#8b96a5)}
.sh-mini-l::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted,#8b96a5))}
.sh-mini-v{font-family:var(--f-display,inherit);font-weight:800;font-size:20px;font-stretch:75%;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--c,var(--ink,#fff))}
.sh-mini-v.sk{width:44px;height:18px;border-radius:6px}
.sh-skel{display:grid;gap:16px}
.sh-sk-title{height:34px;width:46%;border-radius:10px}
.sh-sk-hero{display:grid;place-items:center;padding:8px 0}
.sh-sk-dial{width:min(62vw,240px);aspect-ratio:1;border-radius:50%}
.sh-sk-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sh-sk-tile{height:88px;border-radius:16px}
.sh-sk-card{height:180px;border-radius:18px}
:where(.skeleton){display:block;background:var(--surface-2,#121821);position:relative;overflow:hidden}
.stagger.settled>*{animation-duration:0s!important;animation-delay:0s!important}
@keyframes sh-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sh-slide-next{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes sh-slide-prev{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes sh-shimmer{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:no-preference){
#view.sh-enter{animation:sh-enter .18s cubic-bezier(.2,.7,.2,1) both}
#view.sh-slide-next{animation:sh-slide-next .2s cubic-bezier(.2,.7,.2,1) both}
#view.sh-slide-prev{animation:sh-slide-prev .2s cubic-bezier(.2,.7,.2,1) both}
:where(.skeleton)::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:sh-shimmer 1.3s infinite}
.sh-date-btn:active:not(:disabled),.sh-sheet-grid a:active,.sh-mini-i:active{transform:scale(.98)}
}
@media (prefers-reduced-motion:reduce){#view{animation:none!important}.sh-sheet-backdrop,.sh-sheet-panel{transition:none!important}}
@media (min-width:1100px){.sh-top-mark{visibility:hidden}}
`;
  function injectShellCss() {
    if (typeof document === "undefined" || $("cad-shell-css")) return;
    const st = document.createElement("style");
    st.id = "cad-shell-css";
    st.textContent = SHELL_CSS;
    const head = document.head || document.documentElement;
    head.insertBefore(st, head.firstChild);
  }

  /* ---------------- rendering ---------------- */
  const cssDone = new Set();
  function injectCss() {
    if (typeof document === "undefined") return;
    injectShellCss();
    for (const k of Object.keys(Views)) {
      const v = Views[k];
      if (!v || !v.css || cssDone.has(k)) continue;
      cssDone.add(k);
      const st = document.createElement("style");
      st.dataset.view = k;
      st.textContent = v.css;
      document.head.appendChild(st);
    }
  }
  const isView = (k) => !!(k && Object.prototype.hasOwnProperty.call(Views, k) && Views[k] && typeof Views[k].render === "function");
  /* the AI coach is optional (CONTRACT-v3): listed only with an API key on the website,
     or inside Claude when the sample capability answers */
  function coachOn() {
    if (env() === "web") return !!apiKey.get();
    return S.sampleOk === true;
  }
  const inNav = (k) => isView(k) && (k !== "coach" || coachOn() || S.view === "coach");
  const viewKeys = () => ORDER.filter(inNav).concat(Object.keys(Views).filter((k) => !ORDER.includes(k) && inNav(k)));
  const defaultView = () => (isView(DEFAULT_VIEW) ? DEFAULT_VIEW : viewKeys()[0] || DEFAULT_VIEW);
  const iconOf = (k) => extIcon(k) || extIcon(Views[k].icon) || localIcon(ICON[Views[k].icon] ? Views[k].icon : k);
  const $ = (id) => (typeof document !== "undefined" ? document.getElementById(id) : null);

  function dateLabel(date) {
    const t = todayStr();
    if (date === t) return "TODAY";
    if (date === E.addDays(t, -1)) return "YESTERDAY";
    return fmt.day(date);
  }
  function dayState(i) {
    let d = null;
    try {
      d = i >= 0 ? derived()[i] : null;
    } catch (e) {}
    const rec = d && isNum(d.recovery) ? d.recovery : null;
    const band = (d && d.band) || bandOf(rec);
    const sleep = d ? (isNum(d.sleepPerformance) ? d.sleepPerformance : isNum(d.sleepScore) ? d.sleepScore : null) : null;
    const strain = d && isNum(d.strain) ? d.strain : null;
    return { rec, band, sleep, strain };
  }
  function statusHtml() {
    return S.mode === "sample"
      ? `<span class="dot"></span>Showing sample data`
      : `<span class="dot ok"></span>Your data · ${S.persist === "cloud" ? "saved to your account" : S.persist === "browser" || S.persist === "device" ? "saved in this browser" : "not saved"}`;
  }
  function miniHtml() {
    const date = latestDate();
    const i = idx(date);
    const st = S.skel ? null : dayState(i);
    const val = (txt) => (st ? `<span class="sh-mini-v num">${esc(txt)}</span>` : `<span class="sh-mini-v sk skeleton" aria-hidden="true"></span>`);
    const item = (view, label, c, txt) =>
      isView(view)
        ? `<a class="sh-mini-i" href="#${view}" data-action="app:mini" data-view="${view}" data-date="${esc(date)}" style="--c:${c}"><span class="sh-mini-l">${label}</span>${val(txt)}</a>`
        : "";
    return (
      `<div class="sh-mini" role="group" aria-label="At a glance, ${esc(fmt.day(date))}">` +
      `<div class="sh-mini-h"><span>${date === todayStr() ? "Today" : "Latest"}</span><span>${esc(fmt.short(date))}</span></div>` +
      item("recovery", "Recovery", bandColor(st && st.band), st ? fmt.pct(st.rec) : "") +
      item("strain", "Strain", "var(--strain)", st ? fmt.strain(st.strain) : "") +
      item("sleep", "Sleep", "var(--sleep)", st ? fmt.pct(st.sleep) : "") +
      `</div>`
    );
  }

  /* ---- More sheet ---- */
  let sheetSig = "";
  let sheetTimer = null;
  function openMore() {
    if (S.moreOpen) return;
    S.moreOpen = true;
    renderChrome();
    const sh = $("cad-more");
    if (!sh) return;
    void sh.offsetWidth; // start the slide-up from the closed position
    sh.classList.add("open");
    try { document.documentElement.classList.add("sh-lock"); } catch (e) {}
    const panel = sheetPanel();
    const first = panel && (panel.querySelector("a.on") || panel.querySelector(FOCUSABLE));
    if (first) try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); }
  }
  function closeMore(restoreFocus) {
    if (!S.moreOpen) return;
    S.moreOpen = false;
    renderChrome();
    if (restoreFocus) {
      const b = document.querySelector("#cad-tabs [data-action='app:more']");
      if (b) try { b.focus({ preventScroll: true }); } catch (e) {}
    }
  }
  function syncSheet(rest) {
    let sh = $("cad-more");
    if (S.moreOpen && rest.length) {
      clearTimeout(sheetTimer);
      const html =
        `<div class="sh-sheet-backdrop" aria-hidden="true"></div>` +
        `<div class="sh-sheet-panel glass" role="dialog" aria-modal="true" aria-labelledby="cad-more-h">` +
        `<div class="sh-sheet-grab" data-sheet-grab><div class="sh-sheet-handle" aria-hidden="true"></div><div class="sh-sheet-h" id="cad-more-h">More</div></div>` +
        `<nav class="sh-sheet-grid" aria-label="More sections">` +
        rest.map((k) => `<a href="#${k}"${k === S.view ? ' class="on" aria-current="page"' : ""}>${iconOf(k)}<span>${esc(Views[k].label || k)}</span></a>`).join("") +
        `</nav><div class="sh-sheet-foot">${statusHtml()}</div></div>`;
      if (!sh) {
        sh = document.createElement("div");
        sh.id = "cad-more";
        sh.className = "sh-sheet";
        document.body.appendChild(sh);
        sheetSig = "";
        bindSheetDrag(sh);
      }
      sh.classList.remove("closing");
      if (html !== sheetSig) {
        sh.innerHTML = html;
        sheetSig = html;
      }
    } else if (sh && !sh.classList.contains("closing")) {
      sh.classList.add("closing");
      sh.classList.remove("open", "dragging");
      try { document.documentElement.classList.remove("sh-lock"); } catch (e) {}
      const kill = () => {
        if (!S.moreOpen && sh.parentNode) sh.remove();
        sheetSig = "";
      };
      if (reduced()) kill();
      else sheetTimer = setTimeout(kill, 280);
    }
  }
  function bindSheetDrag(sh) {
    let d = null;
    sh.addEventListener("pointerdown", (ev) => {
      if (!ev.target.closest || !ev.target.closest("[data-sheet-grab]")) return;
      d = { y: ev.clientY, dy: 0, t: Date.now(), id: ev.pointerId };
      sh.classList.add("dragging");
      try { ev.target.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    sh.addEventListener("pointermove", (ev) => {
      if (!d || ev.pointerId !== d.id) return;
      d.dy = Math.max(0, ev.clientY - d.y);
      const p = sh.querySelector(".sh-sheet-panel");
      if (p) p.style.setProperty("--drag", d.dy + "px");
    });
    const end = (ev) => {
      if (!d || (ev && ev.pointerId !== d.id)) return;
      const fast = d.dy > 30 && d.dy / Math.max(1, Date.now() - d.t) > 0.5;
      const close = d.dy > 90 || fast;
      d = null;
      sh.classList.remove("dragging");
      const p = sh.querySelector(".sh-sheet-panel");
      if (p) p.style.removeProperty("--drag");
      if (close) closeMore(true);
    };
    sh.addEventListener("pointerup", end);
    sh.addEventListener("pointercancel", end);
  }

  function renderChrome() {
    if (typeof document === "undefined") return;
    injectShellCss();
    const v = Views[S.view] || {};
    const keys = viewKeys();
    const side = $("cad-side");
    if (side) {
      const items = keys
        .map((k) => {
          const sep = k === "data" ? '<div class="nav-sep" role="presentation"></div>' : "";
          return `${sep}<a href="#${k}"${k === S.view ? ' class="on" aria-current="page"' : ""}>${iconOf(k)}<span>${esc(Views[k].label || k)}</span></a>`;
        })
        .join("");
      side.innerHTML =
        `<a class="brand" href="#${defaultView()}" aria-label="Cadence home">${MARK}<span class="brand-name">Cadence</span></a>` +
        `<nav class="nav" aria-label="Sections">${items}</nav>` +
        `<div class="side-foot">${miniHtml()}<div class="side-status sh-status">${statusHtml()}</div></div>`;
    }
    const top = $("cad-top");
    if (top) {
      const ds = days();
      const i = idx(S.sel);
      let center = `<span class="sh-wordmark">Cadence</span>`;
      if (v.dated && ds.length) {
        const first = ds[0].date, last = ds[ds.length - 1].date;
        const st = S.skel ? { rec: null, band: null } : dayState(i);
        const stateTxt = isNum(st.rec) ? `Recovery ${Math.round(st.rec)} %${st.band ? ", " + st.band : ""}` : "No recovery score";
        center =
          `<div class="sh-date" role="group" aria-label="Choose day">` +
          `<button class="sh-date-btn" type="button" data-action="app:prev" aria-label="Previous day"${i <= 0 ? " disabled" : ""}>${icon("prev")}</button>` +
          `<label class="sh-date-pill num" title="${esc(stateTxt)}">` +
          `<span class="sh-dot${st.band ? "" : " none"}" style="--c:${bandColor(st.band)}" aria-hidden="true"></span>` +
          `<span class="sh-date-t">${esc(dateLabel(S.sel))}</span><span class="sh-sr">, ${esc(stateTxt)}</span>` +
          `<input type="date" data-input="app:date" value="${esc(S.sel)}" min="${first}" max="${last}" aria-label="Pick a date. ${esc(dateLabel(S.sel))}, ${esc(stateTxt)}">` +
          `</label>` +
          `<button class="sh-date-btn" type="button" data-action="app:next" aria-label="Next day"${i < 0 || i >= ds.length - 1 ? " disabled" : ""}>${icon("next")}</button>` +
          `</div>`;
      }
      const pill = S.mode === "sample" ? `<a class="pill-sample" href="#data" title="You're looking at sample data. Import your own on the Data page."><span class="short">Sample</span><span class="long">Sample data</span></a>` : "";
      top.innerHTML =
        `<div class="top-in sh-top"><div class="sh-top-l"><a class="sh-top-mark" href="#${defaultView()}" aria-label="Cadence home">${MARK}</a></div>` +
        `<div class="sh-top-c">${center}</div><div class="sh-top-r">${pill}</div></div>`;
    }
    const tabs = $("cad-tabs");
    let rest = [];
    if (tabs) {
      tabs.classList.add("glass");
      const main = TAB_MAIN.filter(isView);
      rest = keys.filter((k) => !main.includes(k));
      const restOn = rest.includes(S.view);
      const ind = '<span class="sh-tab-pill" aria-hidden="true"></span>';
      tabs.innerHTML =
        `<div class="tabs-in" style="grid-template-columns:repeat(${main.length + (rest.length ? 1 : 0)},minmax(0,1fr))">` +
        main.map((k) => `<a class="tab${k === S.view ? " on" : ""}" href="#${k}"${k === S.view ? ' aria-current="page"' : ""}>${k === S.view ? ind : ""}${iconOf(k)}<span>${esc(Views[k].label || k)}</span></a>`).join("") +
        (rest.length
          ? `<button class="tab${restOn ? " on" : ""}" type="button" data-action="app:more" aria-expanded="${S.moreOpen}" aria-haspopup="dialog" aria-controls="cad-more">${restOn ? ind : ""}${icon("more")}<span>More</span></button>`
          : "") +
        `</div>`;
    }
    syncSheet(rest);
  }

  function ctx() {
    const ds = days();
    const dv = derived();
    const i = idx(S.sel);
    return { days: ds, derived: dv, i, day: i >= 0 ? ds[i] : null, d: i >= 0 ? dv[i] : null, entry: getEntry(S.sel), profile: profile(), E, fmt, esc };
  }

  function skeletonHtml() {
    const sk = (cls) => `<div class="skeleton ${cls}" aria-hidden="true"></div>`;
    return (
      `<div class="page sh-skel"><span class="sh-sr" role="status">Loading your data…</span>` +
      sk("sh-sk-title") +
      `<div class="sh-sk-hero">${sk("sh-sk-dial")}</div>` +
      `<div class="sh-sk-tiles">${sk("sh-sk-tile").repeat(4)}</div>` +
      sk("sh-sk-card") +
      sk("sh-sk-card") +
      `</div>`
    );
  }

  /* page enter / day slide: CadenceMotion when loaded, else CSS classes */
  const ANIM_CLS = ["sh-enter", "sh-slide-next", "sh-slide-prev"];
  let animTimer = null;
  function playTransition(el, anim) {
    el.classList.remove(...ANIM_CLS);
    clearTimeout(animTimer);
    if (!anim || reduced()) return;
    const M = root.CadenceMotion;
    try {
      if (M && anim.kind === "slide" && typeof M.slide === "function") return void M.slide(el, anim.dir);
      if (M && anim.kind === "enter" && typeof M.enterPage === "function") return void M.enterPage(el);
    } catch (e) {
      console.warn("Cadence: motion failed", e);
    }
    void el.offsetWidth;
    const cls = anim.kind === "slide" ? (anim.dir > 0 ? "sh-slide-next" : "sh-slide-prev") : "sh-enter";
    el.classList.add(cls);
    animTimer = setTimeout(() => el.classList.remove(cls), 260);
  }
  /* after every render: stagger cards and count up / sweep dials.
     Quiet re-renders (e.g. a saved journal entry) settle at once instead of replaying. */
  function animateRender(el, anim) {
    const pageRoot = el.children.length === 1 ? el.firstElementChild : el;
    if (pageRoot) {
      pageRoot.classList.add("stagger");
      pageRoot.classList.toggle("settled", !anim || reduced());
    }
    el.dataset.anim = anim ? "enter" : "quiet";
    const M = root.CadenceMotion;
    try {
      if (M && (typeof M.countUp === "function" || typeof M.sweepDials === "function" || typeof M.stagger === "function")) {
        if (anim && !reduced()) {
          if (typeof M.stagger === "function") M.stagger(pageRoot || el);
          if (typeof M.countUp === "function") M.countUp(el);
          if (typeof M.sweepDials === "function") M.sweepDials(el);
        }
      } else if (root.Charts && typeof root.Charts.animate === "function") root.Charts.animate(el);
    } catch (e) {
      console.warn("Cadence: animate failed", e);
    }
    playTransition(el, anim);
  }

  function render() {
    if (typeof document === "undefined") return;
    ensureSel();
    injectCss();
    renderChrome();
    const el = $("view");
    if (!el) return;
    if (!isView(S.view) && isView(defaultView())) S.view = defaultView();
    const anim = S.anim;
    S.anim = null;
    if (S.skel) {
      el.innerHTML = skeletonHtml();
      el.setAttribute("aria-busy", "true");
      return;
    }
    el.removeAttribute("aria-busy");
    const v = Views[S.view];
    if (!v || typeof v.render !== "function") {
      el.innerHTML = `<div class="empty"><h2>Loading</h2><p class="muted">This section isn't available.</p></div>`;
      return;
    }
    const c = ctx();
    try {
      el.innerHTML = v.render(c) || "";
    } catch (e) {
      console.error("Cadence view failed", S.view, e);
      el.innerHTML = `<div class="empty"><h2>Something went wrong</h2><p class="muted">This page couldn't be drawn. Try another day or section.</p></div>`;
    }
    try {
      root.Charts && root.Charts.mount(el);
    } catch (e) {
      console.error(e);
    }
    if (typeof v.after === "function") safe(v.after, el, c);
    animateRender(el, anim);
  }
  let rr = 0;
  function rerender() {
    if (!S.booted) return;
    if (rr) return;
    rr = 1;
    const run = () => {
      rr = 0;
      render();
    };
    if (root.queueMicrotask) root.queueMicrotask(run);
    else Promise.resolve().then(run);
  }

  function setSel(date) {
    if (!date || date === S.sel) return;
    S.anim = { kind: "slide", dir: S.sel && date < S.sel ? -1 : 1 };
    S.sel = date;
    rerender();
  }
  function go(view) {
    const k = isView(view) ? view : defaultView();
    if (S.moreOpen) closeMore(false);
    const changed = k !== S.view;
    S.view = k;
    if (changed) S.anim = { kind: "enter" };
    try {
      if (root.location && root.location.hash !== "#" + k) {
        if (root.history && root.history.replaceState && !changed) root.history.replaceState(null, "", "#" + k);
        else root.location.hash = k;
      }
    } catch (e) {}
    render();
    if (changed) try { root.scrollTo(0, 0); } catch (e) {}
  }
  function fromHash() {
    let h = "";
    try {
      h = (root.location.hash || "").replace(/^#\/?/, "").split(/[/?&]/)[0];
    } catch (e) {}
    const OLD = { today: "overview", activity: "strain", fuel: "journal" };
    if (OLD[h] && !isView(h)) h = OLD[h];
    return isView(h) ? h : null;
  }
  /* storage answered (or the wait cap passed): leave the skeleton and draw real data */
  let autoSyncStarted = false;
  function storageSettled() {
    if (!S.booted) return;
    if (S.skel) {
      S.skel = false;
      S.anim = { kind: "enter" };
    }
    render();
  }
  function startAutoSync() {
    if (autoSyncStarted) return;
    autoSyncStarted = true;
    try {
      const A = root.CadenceAutoSync;
      if (A && typeof A.start === "function") {
        const r = A.start();
        if (r && typeof r.catch === "function") r.catch((e) => console.warn("Cadence: auto sync failed", e));
      }
    } catch (e) {
      console.warn("Cadence: auto sync failed", e);
    }
  }

  /* ---------------- toast ---------------- */
  let toastTimer = null;
  function toast(text) {
    if (typeof document === "undefined") return;
    let t = $("cad-toast");
    if (!t) {
      t = document.createElement("div");
      t.id = "cad-toast";
      t.className = "toast";
      t.setAttribute("role", "status");
      t.setAttribute("aria-live", "polite");
      document.body.appendChild(t);
    }
    t.textContent = String(text);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
  }

  /* ---------------- boot ---------------- */
  function boot() {
    if (S.booted) return;
    try {
      S.sample = E.sampleData(todayStr(), 120);
    } catch (e) {
      console.error(e);
      S.sample = { days: [], entries: {}, profile: E.DEFAULT_PROFILE };
    }
    if (loadLocal()) S.persist = "browser";
    else S.persist = lsOk ? "browser" : "none";
    bump();
    S.view = fromHash() || defaultView();
    ensureSel();
    S.booted = true;
    // first paint: skeleton until storage answers (capped so a slow store never blocks the app)
    S.skel = true;
    render();
    setTimeout(() => {
      if (S.skel) storageSettled();
    }, SKEL_MAX_MS);

    root.addEventListener("hashchange", () => {
      const k = fromHash();
      if (k && k !== S.view) go(k);
    });
    let rt = null, lastW = 0;
    const remount = () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        const el = $("view");
        if (el && root.Charts) root.Charts.mount(el);
      }, 120);
    };
    root.addEventListener("resize", remount);
    const el = $("view");
    if (el && root.ResizeObserver) {
      new ResizeObserver((ents) => {
        const w = Math.round(ents[0].contentRect.width);
        if (w !== lastW) { lastW = w; remount(); }
      }).observe(el);
    }
    // inside Claude: list the coach only if the sample capability is there
    if (env() === "claude") {
      setTimeout(() => {
        Promise.resolve()
          .then(() => root.claude.use("sample"))
          .then((fn) => { S.sampleOk = !!fn; })
          .catch(() => { S.sampleOk = false; })
          .then(() => renderChrome());
      }, 0);
    }
    // never block first paint on storage
    setTimeout(() => {
      initStorage()
        .catch((e) => {
          console.warn(e);
          S.storageReady = true;
          storageSettled();
        })
        .then(() => {
          if (S.skel) storageSettled();
          startAutoSync();
        });
    }, 0);
  }

  /* ---------------- bands & targets ---------------- */
  function bandOf(v) {
    if (!isNum(v)) return null;
    return v >= 67 ? "green" : v >= 34 ? "yellow" : "red";
  }
  function bandColor(band) {
    return band === "green" ? "var(--green)" : band === "yellow" ? "var(--yellow)" : band === "red" ? "var(--red)" : "var(--muted)";
  }
  /* derived target for the selected day when the engine provides one, else by recovery band */
  function strainTarget(rec) {
    if (rec == null || isNum(rec)) {
      try {
        const i = idx(S.sel);
        const d = i >= 0 ? derived()[i] : null;
        if (d && Array.isArray(d.strainTarget) && isNum(d.strainTarget[0]) && isNum(d.strainTarget[1]) && (rec == null || d.recovery === rec)) return d.strainTarget.slice(0, 2);
      } catch (e) {}
    } else if (rec && typeof rec === "object" && Array.isArray(rec.strainTarget)) return rec.strainTarget.slice(0, 2);
    const r = isNum(rec) ? rec : rec && typeof rec === "object" ? rec.recovery : null;
    return !isNum(r) ? [10, 14] : r >= 67 ? [14, 18] : r >= 34 ? [10, 14] : [0, 10];
  }

  /* ---------------- coach on the website: the user's own Anthropic API key ----------------
     Same call shape as claude.use("sample"): fn(messages, {onText}) → {text}; errors carry .code */
  const KEY_LS = "cadence.anthropicKey";
  const apiKey = {
    get() {
      try {
        return (lsOk && root.localStorage.getItem(KEY_LS)) || "";
      } catch (e) {
        return "";
      }
    },
    set(k) {
      k = String(k || "").trim();
      try {
        if (!lsOk) return false;
        if (k) root.localStorage.setItem(KEY_LS, k);
        else root.localStorage.removeItem(KEY_LS);
        return true;
      } catch (e) {
        return false;
      }
    },
  };
  const apiErr = (code, message, text) => Object.assign(new Error(message), { code, text });
  async function apiSample(messages, opts) {
    const key = apiKey.get();
    if (!key) throw apiErr("not_granted", "No API key set.");
    const onText = opts && typeof opts.onText === "function" ? opts.onText : null;
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({ model: "claude-sonnet-5-5", max_tokens: 1500, stream: true, messages }),
      });
    } catch (e) {
      throw apiErr("network", "Couldn't reach Anthropic. Check your connection.");
    }
    if (!res.ok) {
      let msg = "";
      try {
        const j = await res.json();
        msg = (j && j.error && j.error.message) || "";
      } catch (e) {}
      const code = res.status === 401 || res.status === 403 ? "bad_key" : res.status === 429 ? "rate_limited" : res.status === 529 ? "overloaded" : "http_" + res.status;
      throw apiErr(code, msg || "Request failed (" + res.status + ").");
    }
    let text = "";
    const reader = res.body && res.body.getReader ? res.body.getReader() : null;
    if (!reader) {
      throw apiErr("stream", "This browser can't read streamed answers.");
    }
    const dec = new TextDecoder();
    let buf = "";
    const handle = (block) => {
      let data = "";
      for (const line of block.split(/\r?\n/)) if (line.startsWith("data:")) data += line.slice(5).trim();
      if (!data) return;
      let ev;
      try {
        ev = JSON.parse(data);
      } catch (e) {
        return;
      }
      if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") {
        text += ev.delta.text || "";
        if (onText) try { onText({ text }); } catch (e) {}
      } else if (ev.type === "error") {
        throw apiErr((ev.error && ev.error.type) || "stream", (ev.error && ev.error.message) || "The answer stopped early.", text);
      }
    };
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let k;
        while ((k = buf.search(/\r?\n\r?\n/)) >= 0) {
          const block = buf.slice(0, k);
          buf = buf.slice(k).replace(/^\r?\n\r?\n/, "");
          handle(block);
        }
      }
      if (buf.trim()) handle(buf);
    } catch (e) {
      if (e && e.code) throw e;
      throw apiErr("network", "The connection dropped.", text);
    }
    return { text };
  }

  /* ---------------- export ---------------- */
  root.App = {
    days,
    derived,
    sel: () => S.sel || (ensureSel(), S.sel),
    setSel,
    idx,
    profile,
    saveProfile,
    mode: () => S.mode,
    getEntry,
    saveEntry,
    go,
    view: () => S.view,
    rerender,
    toast,
    on,
    onInput,
    onSubmit,
    esc,
    fmt,
    bandColor,
    bandOf,
    recColor: (v) => bandColor(bandOf(v)),
    strainTarget,
    sample: {
      use: async () => {
        if (env() === "web") return apiKey.get() ? apiSample : null;
        try {
          return root.claude && root.claude.use ? (await root.claude.use("sample")) || null : null;
        } catch (e) {
          return null;
        }
      },
    },
    apiKey,
    coachOn: () => coachOn(),
    ageOn,
    env,
    importDays,
    clearImported,
    exportJSON,
    persistKind: () => S.persist,
    storageReady: () => S.storageReady,
    loading: () => S.skel,
    reducedMotion: reduced,
    openMore,
    closeMore: () => closeMore(true),
    icon,
    boot,
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* Cadence v4 views: Overview, Sleep, Recovery, Strain.
 * Codes against CONTRACT-v2/v3 + DESIGN-V4 (App.*, Charts.*, CadenceEngine derived fields, CadenceAnalytics,
 * shared classes .hero .hero-dial .tiles .tile .metric .delta .pill .section-title .stagger).
 * Count-up numbers: <span data-count="<number>" data-dp="<decimals>">formatted</span> (read by Charts.animate). */
(function () {
  "use strict";
  const Views = (window.Views = window.Views || {});
  delete Views.today; // overview replaces it

  /* ---------- small helpers ---------- */
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);
  const DASH = "–";
  const esc = (s) => App.esc(s == null ? "" : String(s));
  const mins = (m) => (isNum(m) ? App.fmt.mins(Math.round(m)) : DASH);
  const label = (date) => App.fmt.short(date);
  const fStrain = (v) => (!isNum(v) ? DASH : App.fmt && App.fmt.strain ? App.fmt.strain(v) : (Math.round(v * 10) / 10).toFixed(1));
  const bandOf = (v) => (!isNum(v) ? null : v >= 67 ? "green" : v >= 34 ? "yellow" : "red");
  const bandColor = (b) => (App.bandColor ? App.bandColor(b) : b ? `var(--${b})` : "var(--muted)");
  const perfColor = (v) => (!isNum(v) ? "var(--muted)" : v >= 85 ? "var(--green)" : v >= 70 ? "var(--yellow)" : "var(--red)");
  const pctOf = (v) => (isNum(v) ? (v <= 1 && v > 0 ? v * 100 : v) : null); // accepts 0–1 or 0–100
  const needTotal = (d) => (!d ? null : isNum(d.sleepNeed) ? d.sleepNeed : d.sleepNeed && isNum(d.sleepNeed.total) ? d.sleepNeed.total : null);
  const toDate = (x) => (x instanceof Date ? x : x != null && x !== "" ? new Date(x) : null);
  const clockOf = (x) => {
    const t = toDate(x);
    return t && !isNaN(t) ? App.fmt.clock(t) : DASH;
  };
  const isToday = (date) => {
    const n = new Date();
    const p = (x) => String(x).padStart(2, "0");
    return date === `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
  };
  const clampPct = (v) => (isNum(v) ? Math.max(0, Math.min(100, v)) : 0);

  /** Indices of the window of n days ending at ctx.i (inclusive). */
  function windowIdx(ctx, n) {
    const out = [];
    for (let k = Math.max(0, ctx.i - n + 1); k <= ctx.i; k++) out.push(k);
    return out;
  }

  /** Number that counts up on first paint. Text is already the final formatted value (works without JS). */
  function count(v, dp) {
    if (!isNum(v)) return DASH;
    dp = dp || 0;
    const r = Number(v.toFixed(dp));
    return `<span class="num" data-count="${r}" data-dp="${dp}"${Math.abs(r) >= 1000 ? ' data-format="comma"' : ""}>${App.fmt.num(r, dp)}</span>`;
  }
  /** Signed change chip. goodUp: true if a rise is favourable, false if a fall is, null for neutral. */
  function delta(diff, dp, unit, goodUp, title) {
    if (!isNum(diff)) return "";
    const r = Number(diff.toFixed(dp || 0));
    const dir = r > 0 ? "up" : r < 0 ? "down" : "flat";
    const tone = goodUp == null ? " neutral" : goodUp === false ? " inv" : ""; // .delta.inv = lower is better
    const word = dir === "up" ? "up" : dir === "down" ? "down" : "level";
    return `<span class="delta ${dir}${tone}" aria-label="${word} ${App.fmt.num(Math.abs(r), dp || 0)}${esc(unit || "")}${title ? " " + esc(title) : ""}">${App.fmt.num(Math.abs(r), dp || 0)}${unit || ""}</span>`;
  }
  /** .metric block: label / value+unit / optional delta / optional sub line. val is HTML. */
  function metric(lbl, val, unit, extra, sub) {
    return `<div class="metric"><span class="metric-label">${lbl}</span>` +
      `<span class="metric-value num">${val}${unit && val !== DASH ? `<span class="metric-unit">${unit}</span>` : ""}</span>` +
      (extra || "") + (sub ? `<span class="metric-sub">${sub}</span>` : "") + `</div>`;
  }
  /** .tile; opt.view makes it a navigation button. */
  function tile(lbl, val, sub, opt) {
    opt = opt || {};
    const tag = opt.view ? "button" : "div";
    return `<${tag} class="tile${opt.cls ? " " + opt.cls : ""}"` +
      (opt.view ? ` type="button" data-action="core-go" data-view="${esc(opt.view)}"` : "") +
      (opt.color ? ` style="--c:${esc(opt.color)}"` : "") + (opt.aria ? ` aria-label="${esc(opt.aria)}"` : "") +
      `><span class="metric-label">${lbl}</span><span class="metric-value num">${val}</span>` +
      (sub ? `<span class="metric-sub">${sub}</span>` : "") + `</${tag}>`;
  }
  const head = (title, meta) => `<div class="card-head"><h2 class="section-title">${title}</h2>${meta ? `<div class="card-meta">${meta}</div>` : ""}</div>`;
  const chip = (level, text) => `<span class="chip ${level}">${text}</span>`;
  const strainPill = (v) => `<span class="pill cv-spill num" aria-label="Strain ${fStrain(v)}">${fStrain(v)}</span>`;
  const emptyCard = (title, text, cls) => `<div class="card ${cls || ""}"><div class="empty"><h2>${title}</h2><p class="muted">${text}</p></div></div>`;
  /** v4 dial (Charts.ring variant "dial"), with an aria label like "Recovery 62 %". */
  const dial = (o) => Charts.ring(Object.assign({ variant: "dial", size: 156 }, o));

  function pageHead(title, ctx, sub) {
    const date = ctx.day ? ctx.day.date : App.sel ? App.sel() : "";
    return `<div class="page-head"><h1>${title}</h1><div class="sub">${sub || (date ? esc(App.fmt.day(date)) : "")}</div></div>`;
  }

  function emptyPage(title, ctx, cls) {
    const days = ctx.days || [];
    const last = days.length ? days[days.length - 1].date : null;
    return `<div class="page ${cls}">${pageHead(title, ctx)}<div class="card empty cv-emptypage">` +
      `<h2>Nothing recorded this day</h2><p class="muted">No health data was synced for this date. Pick another day, or import data from the Data page.</p>` +
      (last ? `<button class="btn primary" data-action="core-sel" data-date="${esc(last)}">Go to ${esc(App.fmt.day(last))}</button>` : "") +
      `</div></div>`;
  }

  /** Mean/SD of a raw day field over the 30 days before index i. */
  function pastStats(ctx, i, field) {
    const vals = [];
    for (let k = Math.max(0, i - 30); k < i; k++) {
      const v = ctx.days[k] && ctx.days[k][field];
      if (isNum(v)) vals.push(v);
    }
    if (vals.length < 5) return null;
    const m = avg(vals);
    return { mean: m, sd: Math.sqrt(vals.reduce((s, x) => s + (x - m) ** 2, 0) / (vals.length - 1)) };
  }

  /** {value, baseline, sd} for a vital, from monitor first, then contributors, then raw day. */
  function vital(ctx, key) {
    const d = ctx.d || {};
    const m = (d.monitor && d.monitor[key]) || {};
    const c = (d.contributors && d.contributors[key]) || {};
    const raw = { hrv: "hrv", rhr: "restingHr", resp: "respRate" }[key];
    const value = isNum(m.value) ? m.value : isNum(c.value) ? c.value : ctx.day && isNum(ctx.day[raw]) ? ctx.day[raw] : null;
    const legacy = { hrv: d.hrvBaseline, rhr: d.rhrBaseline, resp: d.respBaseline }[key];
    const baseline = isNum(m.baseline) ? m.baseline : isNum(c.baseline) ? c.baseline : isNum(legacy) ? legacy : null;
    return { value, baseline, sd: isNum(m.sd) ? m.sd : null };
  }
  /** Delta chips for the three vitals vs baseline. */
  const hrvDelta = (v) => (isNum(v.value) && isNum(v.baseline) && v.baseline > 0 ? delta((v.value / v.baseline - 1) * 100, 0, "%", true, "vs baseline") : "");
  const rhrDelta = (v) => (isNum(v.value) && isNum(v.baseline) ? delta(v.value - v.baseline, 0, "", false, "vs baseline") : "");
  const respDelta = (v) => (isNum(v.value) && isNum(v.baseline) ? delta(v.value - v.baseline, 1, "", false, "vs baseline") : "");
  const subWith = (dl, sub) => (dl ? `${dl} <span class="cv-sep">·</span> ${sub}` : sub);
  const baseSub = (v, dp, unit) => (isNum(v.baseline) ? `base <span class="num">${App.fmt.num(v.baseline, dp)}</span>${unit ? " " + unit : ""}` : "baseline forming");

  function workoutsOf(d) {
    return ((d && d.workouts) || []).slice().sort((x, y) => String(x.start || "").localeCompare(String(y.start || "")));
  }

  function workoutRow(w) {
    const t = clockOf(w.start);
    const bits = [mins(w.durationMin)];
    if (isNum(w.avgHr)) bits.push(`avg ${Math.round(w.avgHr)} bpm`);
    if (isNum(w.kcal)) bits.push(`${App.fmt.num(w.kcal)} kcal`);
    const manual = w.source === "Manual";
    return `<div class="row cv-wrow">${strainPill(w.strain)}` +
      `<span class="cv-wmain"><strong>${esc(w.type || "Workout")}</strong>` +
      `${t !== DASH ? ` <span class="muted num">${esc(t)}</span>` : ""}${manual ? ` <span class="chip neutral">Manual</span>` : ""}` +
      `<span class="muted num cv-wmeta">${bits.join(" · ")}</span></span></div>`;
  }

  function activityList(d, emptyText) {
    const ws = workoutsOf(d);
    return `<div class="list">${ws.length ? ws.map(workoutRow).join("") : `<div class="row muted">${emptyText}</div>`}</div>`;
  }

  function targetStatus(d) {
    const t = d && Array.isArray(d.strainTarget) && isNum(d.strainTarget[0]) && isNum(d.strainTarget[1]) ? d.strainTarget : null;
    if (!t || !isNum(d.strain)) return null;
    const where = d.strain < t[0] ? "below" : d.strain <= t[1] ? "in" : "above";
    return { lo: t[0], hi: t[1], where, level: where === "in" ? "good" : where === "below" ? "neutral" : "warn",
      text: where === "in" ? "In target" : where === "below" ? "Below target" : "Above target" };
  }

  /** Horizontal meter rows: [{label, value (html), score 0–100|null, color, right (html)}] */
  function meters(rows) {
    return `<div class="cv-meters">${rows.map((r) =>
      `<div class="cv-meter" style="--c:${esc(r.color || "var(--muted)")}">` +
      `<span class="cv-ml">${r.label}</span><span class="cv-mv num">${r.value}</span>` +
      `<span class="cv-mbar" aria-hidden="true"><span style="width:${clampPct(r.pct).toFixed(1)}%"></span></span>` +
      `<span class="cv-ms num">${r.right != null ? r.right : ""}</span></div>`).join("")}</div>`;
  }

  /* ---------- delegated handlers (registered once) ---------- */
  if (window.App && App.on && !window.__cadenceCoreViews) {
    window.__cadenceCoreViews = true;
    App.on("core-go", (el) => App.go(el.getAttribute("data-view")));
    App.on("core-sel", (el) => App.setSel(el.getAttribute("data-date")));
  }

  const CSS = `

.cv-wrow{display:flex;align-items:center;gap:12px}
.cv-wmain{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;min-width:0}
.cv-wmeta{flex-basis:100%;font-size:13px}
.cv-spill{min-width:3.4em;justify-content:center;text-align:center;font-weight:800;color:var(--strain);border-color:color-mix(in srgb,var(--strain) 45%,transparent);background:color-mix(in srgb,var(--strain) 14%,transparent)}
/* hero (page headers) */

.page .card.cv-hero > * + *,.page .card.ov-hero > * + *{margin-top:0}

.cv-hero .insight{margin:0}

@media (max-width:640px){.cv-hero{grid-template-columns:minmax(0,1fr)}}
@media (min-width:900px){.cv-metrics{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* meters */
.cv-meters{display:flex;flex-direction:column;gap:14px}

/* overview */

@media (min-width:1100px){.ov-top{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}

.metric-sub .delta{font-size:inherit}
.v-overview button.tile{font:inherit;color:inherit;text-align:left;cursor:pointer}
.ov-warn{border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.ov-warn .metric-value{color:var(--c)}
.ov-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ov-wd{background:none;border:1px solid transparent;border-radius:12px;padding:8px 0 6px;color:inherit;font:inherit;cursor:pointer;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.ov-wd:hover{background:var(--surface-2)}
.ov-wd.on{border-color:var(--line);background:var(--surface-2)}
.ov-wl{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ov-bars{display:flex;align-items:flex-end;gap:3px;height:64px}
.ov-bars>span{width:8px;border-radius:4px 4px 2px 2px;min-height:3px}
.ov-br{background:var(--c)}
.ov-bs{background:var(--strain)}
.ov-wr{font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--c);line-height:1}
.ov-ws{font-size:11px;color:var(--strain);line-height:1}
@media (min-width:1100px){.page .grid.cv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* strain page */
.cv-gauge .insight{margin:10px 0 0}
`;

  /* ================= OVERVIEW ================= */

  /* v3 analytics (CadenceAnalytics): early warning + tomorrow's forecast. Guarded and memoised per data version. */
  const anMemo = new WeakMap();
  function anCall(ctx, name, args, key) {
    const A = window.CadenceAnalytics;
    if (!A || typeof A[name] !== "function" || !ctx.derived || typeof ctx.derived !== "object") return null;
    let m = anMemo.get(ctx.derived);
    if (!m) anMemo.set(ctx.derived, (m = new Map()));
    const k = name + "|" + key;
    if (!m.has(k)) {
      let r = null;
      try { r = A[name].apply(null, args); } catch (e) { console.warn("Cadence analytics failed:", name, e); }
      m.set(k, r);
    }
    return m.get(k);
  }
  const shortOf = (r) => !r || typeof r !== "object" || [r.status, r.error, r.reason].some((t) => typeof t === "string" && /not[_ ]?enough|insufficient/i.test(t));

  function warningTile(ctx) {
    try {
      const w = anCall(ctx, "warning", [ctx.days, ctx.derived, ctx.i], "w" + ctx.i);
      const lvl = w && !shortOf(w) ? String(w.level || "none").toLowerCase() : "none";
      if (lvl !== "watch" && lvl !== "alert") return "";
      const n = Array.isArray(w.signals) ? w.signals.length : 0;
      const names = Array.isArray(w.signals) ? w.signals.map((s) => s && s.metric).filter((x) => typeof x === "string").slice(0, 3) : [];
      return tile(lvl === "alert" ? "Early warning" : "Watch", n ? `${count(n)}<span class="metric-unit"> signal${n === 1 ? "" : "s"}</span>` : (lvl === "alert" ? "Alert" : "Watch"),
        names.length ? esc(names.join(" · ")) : "Body signals off baseline",
        { view: "insights", cls: "ov-warn cv-warn", color: lvl === "alert" ? "var(--red)" : "var(--yellow)", aria: `Early warning, ${lvl}: open Insights` });
    } catch (e) { return ""; }
  }

  function forecastTile(ctx) {
    try {
      const f = anCall(ctx, "forecast", [ctx.days, ctx.derived, ctx.i, {}], "fc" + ctx.i);
      const v = f && !shortOf(f) && isNum(f.recovery) ? f.recovery : null;
      if (!isNum(v)) return "";
      const rng = isNum(f.lo) && isNum(f.hi) ? `likely <span class="num">${Math.round(f.lo)}–${Math.round(f.hi)}%</span>` : "estimate";
      return tile("Tomorrow", `<span style="color:${bandColor(bandOf(v))}">~${count(Math.round(v))}<span class="metric-unit">%</span></span>`, rng,
        { view: "performance", cls: "cv-tmr", aria: `Tomorrow's recovery forecast about ${Math.round(v)} %` });
    } catch (e) { return ""; }
  }

  function headline(band) {
    if (band === "green") return ["Primed — today can take real load", "var(--green)"];
    if (band === "yellow") return ["Holding steady — train, keep some in reserve", "var(--yellow)"];
    if (band === "red") return ["Running low — keep today light", "var(--red)"];
    return ["No recovery read today", "var(--muted)"];
  }

  function insights(ctx) {
    const { d } = ctx;
    const out = [];
    const h = vital(ctx, "hrv");
    if (isNum(h.value) && isNum(h.baseline) && h.baseline > 0) {
      const pct = Math.round((h.value / h.baseline - 1) * 100);
      const dir = pct > 2 ? `${pct}% above` : pct < -2 ? `${-pct}% below` : "level with";
      out.push(`HRV <span class="num">${Math.round(h.value)} ms</span>, ${dir} your <span class="num">${Math.round(h.baseline)} ms</span> baseline.`);
    } else if (isNum(h.value)) {
      out.push(`HRV <span class="num">${Math.round(h.value)} ms</span>. A baseline takes about a week of readings.`);
    } else {
      out.push("No HRV reading last night, so recovery can't be scored.");
    }
    const need = needTotal(d);
    if (d.sleep && isNum(d.sleep.asleep) && isNum(need)) {
      const gap = d.sleep.asleep - need;
      out.push(gap >= -10
        ? `Slept <span class="num">${mins(d.sleep.asleep)}</span>, covering a need of <span class="num">${mins(need)}</span>.`
        : `Slept <span class="num">${mins(d.sleep.asleep)}</span> of a <span class="num">${mins(need)}</span> need — <span class="num">${mins(-gap)}</span> short.`);
    } else {
      out.push("No main sleep was recorded last night.");
    }
    const ts = targetStatus(d);
    const today = isToday(d.date);
    if (ts) {
      const rng = `<span class="num">${fStrain(ts.lo)}–${fStrain(ts.hi)}</span>`;
      const s = `<span class="num">${fStrain(d.strain)}</span>`;
      if (today) {
        out.push(ts.where === "below" ? `Strain ${s} so far; today's target is ${rng}.`
          : ts.where === "in" ? `Strain ${s}, inside today's ${rng} target.`
          : `Strain ${s}, past today's ${rng} target. Ease off tomorrow.`);
      } else {
        out.push(`Strain finished at ${s}, ${ts.where === "in" ? "inside" : ts.where} the ${rng} target.`);
      }
    } else if (isNum(d.strain)) {
      out.push(`Strain ${today ? "is" : "finished at"} <span class="num">${fStrain(d.strain)}</span>.`);
    }
    return out;
  }

  function ovDial(view, cls, o) {
    return `<button class="ov-dial ${cls}" type="button" data-action="core-go" data-view="${view}" aria-label="${esc(o.aria)} — open ${esc(o.label)}">${dial(o)}</button>`;
  }

  function tonightTile(ctx) {
    const { d, derived, i } = ctx;
    const bt = toDate(d.bedtimeTonight);
    const next = derived[i + 1];
    const tomorrowNeed = needTotal(next);
    const need = isNum(tomorrowNeed) ? tomorrowNeed : isNum(d.sleepNeedTonight) ? d.sleepNeedTonight : null;
    const hasBt = bt && !isNaN(bt);
    if (!hasBt && !isNum(need)) return tile("Sleep tonight", DASH, "Learning your wake time", { view: "sleep" });
    return tile("Sleep tonight", isNum(need) ? mins(need) : DASH, hasBt ? `in bed by <span class="num">${esc(App.fmt.clock(bt))}</span>` : "need to recover",
      { view: "sleep", aria: `Sleep need tonight ${isNum(need) ? mins(need) : "unknown"}${hasBt ? ", in bed by " + App.fmt.clock(bt) : ""}` });
  }

  function glanceTiles(ctx) {
    const { d, day } = ctx;
    const hv = vital(ctx, "hrv"), rv = vital(ctx, "rhr"), pv = vital(ctx, "resp");
    const k = d.kcal || {};
    const total = isNum(k.total) ? k.total : day.totalKcal;
    const active = isNum(k.active) ? k.active : day.activeKcal;
    return [
      warningTile(ctx),
      tile("HRV", isNum(hv.value) ? `${count(hv.value)}<span class="metric-unit">ms</span>` : DASH, subWith(hrvDelta(hv), baseSub(hv, 0, "ms")), { view: "recovery" }),
      tile("Resting HR", isNum(rv.value) ? `${count(rv.value)}<span class="metric-unit">bpm</span>` : DASH, subWith(rhrDelta(rv), baseSub(rv, 0, "bpm")), { view: "recovery" }),
      tile("Respiratory", isNum(pv.value) ? `${count(pv.value, 1)}<span class="metric-unit">/min</span>` : DASH, subWith(respDelta(pv), baseSub(pv, 1, "")), { view: "health" }),
      tile("Steps", isNum(day.steps) ? count(day.steps) : DASH, isNum(day.distanceM) ? `<span class="num">${App.fmt.num(day.distanceM / 1000, 1)}</span> km` : ""),
      tile("Calories", isNum(total) ? `${count(total)}<span class="metric-unit">kcal</span>` : DASH, isNum(active) ? `<span class="num">${App.fmt.num(active)}</span> active` : "", { view: "strain" }),
      tonightTile(ctx),
      forecastTile(ctx),
    ].join("");
  }

  function weekStrip(ctx) {
    const idx = windowIdx(ctx, 7);
    const cells = idx.map((k) => {
      const dd = ctx.derived[k] || {};
      const date = ctx.days[k].date;
      const rec = dd.recovery;
      const col = isNum(rec) ? bandColor(dd.band || bandOf(rec)) : "var(--muted)";
      const dow = esc(App.fmt.day(date).split(" ")[0]);
      const rh = isNum(rec) ? clampPct(rec) : 0;
      const sh = isNum(dd.strain) ? clampPct((dd.strain / 21) * 100) : 0;
      const aria = `${App.fmt.day(date)}: recovery ${isNum(rec) ? Math.round(rec) + " %" : "none"}, strain ${fStrain(dd.strain)}`;
      return `<button class="ov-wd${k === ctx.i ? " on" : ""}" type="button" data-action="core-sel" data-date="${esc(date)}" style="--c:${col}" aria-label="${esc(aria)}"${k === ctx.i ? ' aria-current="date"' : ""}>` +
        `<span class="ov-wl">${dow}</span><span class="ov-bars" aria-hidden="true"><span class="ov-br" style="height:${rh.toFixed(0)}%"></span><span class="ov-bs" style="height:${sh.toFixed(0)}%"></span></span>` +
        `<span class="ov-wr num">${isNum(rec) ? Math.round(rec) : DASH}</span><span class="ov-ws num">${fStrain(dd.strain)}</span></button>`;
    }).join("");
    return `<div class="card span-2">${head("Last 7 days", `<span class="key" style="--c:var(--green)">recovery %</span> <span class="key" style="--c:var(--strain)">strain</span>`)}<div class="ov-week">${cells}</div></div>`;
  }

  Views.overview = {
    label: "Overview",
    icon: "home",
    dated: true,
    css: CSS,
    render(ctx) {
      if (ctx.i === -1 || !ctx.day || !ctx.d) return emptyPage("Overview", ctx, "v-overview");
      const { d } = ctx;
      const perf = d.sleepPerformance;
      const rec = d.recovery;
      const band = d.band || bandOf(rec);
      const ts = targetStatus(d);
      const hrvV = vital(ctx, "hrv").value;
      const dials =
        ovDial("sleep", "ov-side", { size: 120, value: isNum(perf) ? perf : null, max: 100, color: "var(--sleep)", label: "Sleep",
          display: isNum(perf) ? `${Math.round(perf)}%` : DASH, sub: d.sleep && isNum(d.sleep.asleep) ? App.fmt.mins(Math.round(d.sleep.asleep)) : "No sleep",
          aria: `Sleep ${isNum(perf) ? Math.round(perf) + " %" : "not recorded"}` }) +
        `<div class="hero-dial">` + ovDial("recovery", "ov-main", { size: 220, value: isNum(rec) ? rec : null, max: 100, color: bandColor(band), label: "Recovery",
          display: isNum(rec) ? `${Math.round(rec)}%` : DASH, sub: isNum(hrvV) ? `HRV ${Math.round(hrvV)} ms` : "No HRV",
          aria: `Recovery ${isNum(rec) ? Math.round(rec) + " %" : "not scored"}` }) + `</div>` +
        ovDial("strain", "ov-side", { size: 120, value: isNum(d.strain) ? d.strain : null, max: 21, color: "var(--strain)", label: "Strain",
          target: ts ? d.strainTarget : undefined, display: fStrain(d.strain), sub: ts ? `Target ${fStrain(ts.lo)}–${fStrain(ts.hi)}` : "of 21",
          aria: `Strain ${fStrain(d.strain)} of 21` });
      const [hl, hc] = headline(band);
      const hero = `<section class="card hero ov-hero" aria-label="Today's scores"><div class="ov-dials">${dials}</div>` +
        `<p class="ov-state" style="--c:${hc}"><span class="ov-dot" aria-hidden="true"></span>${hl}</p>` +
        `<ul class="ov-lines insight">${insights(ctx).map((s) => `<li><span>${s}</span></li>`).join("")}</ul></section>`;

      const glance = `<section class="ov-glance">${`<h2 class="section-title">${isToday(d.date) ? "Today at a glance" : "At a glance"}</h2>`}` +
        `<div class="tiles stagger">${glanceTiles(ctx)}</div></section>`;

      const ws = workoutsOf(d);
      const acts = `<div class="card">${head("Activities", ws.length ? `<span class="num">${ws.length}</span> logged` : "")}` +
        activityList(d, "No workouts yet. Strain so far comes from everyday movement.") +
        `<div class="cv-note"><button class="btn ghost small" data-action="core-go" data-view="strain">Strain detail</button></div></div>`;

      return `<div class="page v-overview">${pageHead("Overview", ctx)}<div class="ov-top">${hero}${glance}</div>` +
        `<div class="grid cv-grid stagger">${acts}${weekStrip(ctx)}</div></div>`;
    },
  };

  /* ================= SLEEP ================= */

  const STAGES = [
    ["awake", "Awake", "var(--st-awake)", null],
    ["light", "Light", "var(--st-light)", [45, 55]],
    ["deep", "Deep", "var(--st-deep)", [13, 23]],
    ["rem", "REM", "var(--st-rem)", [20, 25]],
  ];

  Views.sleep = {
    label: "Sleep",
    icon: "sleep",
    dated: true,
    css: CSS,
    render(ctx) {
      if (ctx.i === -1 || !ctx.day || !ctx.d) return emptyPage("Sleep", ctx, "v-sleep");
      const { d, day } = ctx;
      const s = d.sleep;
      const need = needTotal(d);
      const perf = d.sleepPerformance;
      const sn = d.sleepNeed && typeof d.sleepNeed === "object" ? d.sleepNeed : {};

      let top, needCard = "";
      if (s) {
        const effic = isNum(d.sleepEfficiency) ? d.sleepEfficiency : pctOf(s.efficiency);
        const gap = isNum(need) ? s.asleep - need : null;
        top = `<section class="card hero cv-hero">` +
          `<div class="hero-dial">${dial({ size: 188, value: isNum(perf) ? perf : null, max: 100, color: "var(--sleep)", label: "Sleep",
            display: isNum(perf) ? `${Math.round(perf)}%` : DASH, sub: `${App.fmt.mins(Math.round(s.asleep))} of ${isNum(need) ? App.fmt.mins(Math.round(need)) : DASH}`,
            aria: `Sleep performance ${isNum(perf) ? Math.round(perf) + " %" : "not scored"}` })}</div>` +
          `<div class="cv-hero-body"><div class="cv-metrics">` +
          metric("Asleep", mins(s.asleep)) + metric("Needed", mins(need), "", isNum(gap) ? delta(gap / 60, 1, "h", true, "vs need") : "") +
          metric("Efficiency", isNum(effic) ? count(effic) : DASH, "%") +
          metric("Consistency", isNum(d.sleepConsistency) ? count(d.sleepConsistency) : DASH, "%", "", "vs last 4 nights") +
          `</div><p class="insight">${gap === null ? `You slept ${mins(s.asleep)}.`
            : gap >= -10 ? `You slept ${mins(s.asleep)} and met your need of ${mins(need)}.`
            : `You slept ${mins(s.asleep)}, ${mins(-gap)} short of your ${mins(need)} need. The shortfall carries into tomorrow.`}</p></div></section>`;
        const parts = [["Baseline", sn.baseline], ["Recent strain", sn.strain], ["Sleep debt", sn.debt], ["Naps", sn.nap]]
          .filter(([, v]) => isNum(v))
          .map(([l, v]) => ({ label: l, v: Math.abs(v), color: v < 0 ? "var(--muted)" : "var(--sleep)",
            display: `${v < 0 ? "−" : l === "Baseline" ? "" : "+"}${App.fmt.mins(Math.round(Math.abs(v)))}` }));
        if (parts.length) {
          needCard = `<div class="card">${head("How the need adds up", isNum(need) ? `<span class="num">${mins(need)}</span>` : "")}` +
            Charts.slot({ type: "hbars", data: parts, max: Math.max(...parts.map((p) => p.v), 1) }) +
            `<p class="muted cv-note">Need starts from your baseline and grows with strain and recent debt; naps pay some back.</p></div>`;
        }
      } else {
        top = emptyCard("No sleep recorded", `There's no main sleep for the night before ${esc(App.fmt.day(day.date))}. Your recent nights are below.`, "hero");
      }

      let detail = "";
      if (s) {
        const resto = d.restorative && isNum(d.restorative.pct) ? pctOf(d.restorative.pct) : pctOf(s.restorative);
        const restoMin = d.restorative && isNum(d.restorative.min) ? d.restorative.min : (s.deep || 0) + (s.rem || 0);
        const stats = `<div class="card">${head("Last night", `<span class="num">${esc(clockOf(s.start))} – ${esc(clockOf(s.end))}</span>`)}` +
          `<div class="cv-metrics">${metric("Time in bed", mins(s.inBed))}` +
          `${metric("Restorative", isNum(resto) ? count(resto) : DASH, "%", "", `deep + REM · <span class="num">${mins(restoMin)}</span>`)}` +
          `${metric("Awakenings", isNum(s.awakenings) ? count(s.awakenings) : DASH)}` +
          (isNum(s.latency) ? metric("Fell asleep in", mins(s.latency)) : "") +
          `${metric("Bedtime", esc(clockOf(s.start)))}${metric("Woke", esc(clockOf(s.end)))}</div></div>`;

        const hyp = `<div class="card span-2">${head("Through the night")}` +
          (day.sleep ? Charts.slot({ type: "hypno", sleep: day.sleep }) : `<p class="muted">No stage data.</p>`) +
          `<div class="legend">${STAGES.map(([, l, c]) => `<span class="key" style="--c:${c}">${l}</span>`).join("")}</div></div>`;

        const stageRows = STAGES.map(([k, l, c, rng]) => {
          const m = s[k] || 0;
          const base = k === "awake" ? s.inBed : s.asleep;
          const pct = base > 0 ? Math.round((m / base) * 100) : 0;
          return { label: l, color: c, pct: rng ? Math.min(100, (pct / Math.max(rng[1] * 1.6, 1)) * 100) : Math.min(100, pct * 4),
            value: `<strong>${App.fmt.mins(Math.round(m))}</strong> · ${pct}%`, right: rng ? `${rng[0]}–${rng[1]}%` : "" };
        });
        const stagesCard = `<div class="card">${head("Stages", "share of sleep · typical")}` + meters(stageRows) +
          `<p class="muted cv-note">Typical adult ranges on the right. Awake is a share of time in bed.</p></div>`;
        detail = stats + needCard + hyp + stagesCard;
      }

      const w14 = windowIdx(ctx, 14);
      const range14 = w14.map((k) => {
        const ss = ctx.derived[k] && ctx.derived[k].sleep;
        return ss && isNum(ss.bedMin) && isNum(ss.inBed) ? { label: label(ctx.days[k].date), start: ss.bedMin, end: ss.bedMin + ss.inBed } : null;
      }).filter(Boolean);
      const rangeCard = `<div class="card">${head("Bed and wake times", "last 14 nights")}` +
        (range14.length ? Charts.slot({ type: "range", data: range14 }) : `<p class="muted">No nights recorded yet.</p>`) + `</div>`;

      const w30 = windowIdx(ctx, 30);
      const perfBars = w30.map((k) => {
        const v = ctx.derived[k] && ctx.derived[k].sleepPerformance;
        return { label: label(ctx.days[k].date), v: isNum(v) ? Math.round(v) : null, color: perfColor(v) };
      });
      const pv = perfBars.map((b) => b.v).filter(isNum);
      const barsCard = `<div class="card span-2">${head("Sleep performance", pv.length ? `30-night avg <span class="num">${Math.round(avg(pv))}%</span>` : "last 30 nights")}` +
        (pv.length ? Charts.slot({ type: "bars", data: perfBars, max: 100, fmt: (v) => `${Math.round(v)}%`, ref: { v: 85, label: "85%" } }) : `<p class="muted">No nights recorded yet.</p>`) +
        `<div class="legend"><span class="key" style="--c:var(--green)">85% and up</span><span class="key" style="--c:var(--yellow)">70–84%</span><span class="key" style="--c:var(--red)">under 70%</span></div></div>`;

      const naps = Array.isArray(day.naps) ? day.naps.filter((n) => n && n.start) : [];
      const napCard = naps.length
        ? `<div class="card">${head("Naps", `<span class="num">${naps.length}</span>`)}<div class="list">${naps.map((n) =>
          `<div class="row"><span class="num">${esc(clockOf(n.start))} – ${esc(clockOf(n.end))}</span><span class="num muted">${mins(n.asleepMin)} asleep</span></div>`).join("")}</div></div>`
        : "";

      return `<div class="page v-sleep">${pageHead("Sleep", ctx)}${top}<div class="grid cv-grid stagger">${detail}${napCard}${rangeCard}${barsCard}</div></div>`;
    },
  };

  /* ================= RECOVERY ================= */

  function lineSeries(ctx, idx, f) {
    return idx.map((k) => {
      const v = f(k);
      return { label: label(ctx.days[k].date), v: isNum(v) ? v : null };
    });
  }

  function methodText(ctx, re) {
    const M = ctx.E && Array.isArray(ctx.E.METHODS) ? ctx.E.METHODS : [];
    const m = M.find((x) => x && re.test(String(x.title || "")));
    return m && m.body ? String(m.body) : null;
  }

  Views.recovery = {
    label: "Recovery",
    icon: "recovery",
    dated: true,
    css: CSS,
    render(ctx) {
      if (ctx.i === -1 || !ctx.day || !ctx.d) return emptyPage("Recovery", ctx, "v-recovery");
      const { d, day } = ctx;
      const rec = d.recovery;
      const band = d.band || bandOf(rec);
      const idx = windowIdx(ctx, 30);
      const C = d.contributors || {};
      const hv = vital(ctx, "hrv"), rv = vital(ctx, "rhr"), pv = vital(ctx, "resp");

      let top;
      if (isNum(rec)) {
        const ts = targetStatus(d);
        const lead = band === "green" ? "Well recovered. Your body has absorbed recent load and is ready for more."
          : band === "yellow" ? "Partly recovered. Training is fine; keep the hardest efforts measured."
          : "Under-recovered. Easy movement, good food and an early night will help most.";
        const word = band === "green" ? "Green" : band === "yellow" ? "Yellow" : "Red";
        top = `<section class="card hero cv-hero">` +
          `<div class="hero-dial">${dial({ size: 188, value: rec, max: 100, color: bandColor(band), label: "Recovery", display: `${Math.round(rec)}%`,
            sub: ts ? `Strain target ${fStrain(ts.lo)}–${fStrain(ts.hi)}` : "", aria: `Recovery ${Math.round(rec)} %` })}</div>` +
          `<div class="cv-hero-body"><span class="cv-band" style="--c:${bandColor(band)}"><span class="ov-dot" aria-hidden="true"></span>${word} band</span>` +
          `<div class="cv-metrics">` +
          metric("HRV", isNum(hv.value) ? count(hv.value) : DASH, "ms", hrvDelta(hv), baseSub(hv, 0, "ms")) +
          metric("Resting HR", isNum(rv.value) ? count(rv.value) : DASH, "bpm", rhrDelta(rv), baseSub(rv, 0, "bpm")) +
          metric("Respiratory", isNum(pv.value) ? count(pv.value, 1) : DASH, "/min", respDelta(pv), baseSub(pv, 1, "")) +
          metric("Sleep", isNum(d.sleepPerformance) ? count(d.sleepPerformance) : DASH, "%", "", "of need") +
          `</div><p class="insight">${lead}</p></div></section>`;
      } else {
        top = emptyCard("No recovery score", `Recovery needs an HRV reading from last night. None was recorded for ${esc(App.fmt.day(day.date))}.`, "hero");
      }

      // contributors as meters
      const contribRows = [
        ["HRV", "hrv", "ms", 0],
        ["Resting HR", "rhr", "bpm", 0],
        ["Respiratory rate", "resp", "/min", 1],
        ["Sleep", "sleep", "%", 0],
      ].map(([l, k, u, dp]) => {
        const c = C[k] || {};
        const val = k === "sleep" ? (isNum(c.value) ? c.value : d.sleepPerformance) : vital(ctx, k).value;
        const base = k === "sleep" ? null : vital(ctx, k).baseline;
        const score = isNum(c.score) ? c.score : null;
        const valTxt = isNum(val) ? `${App.fmt.num(val, dp)}${u === "%" ? "%" : " " + u}` : DASH;
        return { label: l, pct: isNum(score) ? score : 0, color: isNum(score) ? bandColor(bandOf(score)) : "var(--line)",
          value: `<strong>${valTxt}</strong>${isNum(base) ? ` · base ${App.fmt.num(base, dp)}` : ""}`, right: isNum(score) ? String(Math.round(score)) : DASH };
      });
      const hasContrib = Object.keys(C).length > 0;
      const contribCard = `<div class="card">${head("What drove it", "value · baseline · score")}` +
        (hasContrib ? meters(contribRows) : `<p class="muted">Contributors appear once there's an HRV reading.</p>`) + `</div>`;

      // 30-day recovery bars
      const recBars = idx.map((k) => {
        const dd = ctx.derived[k] || {};
        const v = dd.recovery;
        return { label: label(ctx.days[k].date), v: isNum(v) ? v : null, color: isNum(v) ? bandColor(dd.band || bandOf(v)) : "var(--muted)" };
      });
      const recVals = recBars.map((b) => b.v).filter(isNum);
      const recCard = `<div class="card span-2">${head("Recovery", recVals.length ? `30-day avg <span class="num">${Math.round(avg(recVals))}%</span>` : "last 30 days")}` +
        (recVals.length ? Charts.slot({ type: "bars", data: recBars, max: 100, fmt: (v) => `${Math.round(v)}%` }) : `<p class="muted">No scores yet.</p>`) + `</div>`;

      // HRV line with ±1 SD
      const hrvData = lineSeries(ctx, idx, (k) => ctx.days[k].hrv);
      let band1, ref;
      if (isNum(hv.baseline)) {
        let sd = hv.sd;
        if (!isNum(sd) || sd <= 0) { const ps = pastStats(ctx, ctx.i, "hrv"); sd = ps && isNum(ps.sd) && ps.sd > 0 ? ps.sd : hv.baseline * 0.12; }
        band1 = [Math.round(hv.baseline - sd), Math.round(hv.baseline + sd)];
        ref = { v: Math.round(hv.baseline), label: `baseline ${Math.round(hv.baseline)}` };
      }
      const hasHrv = hrvData.some((x) => x.v !== null);
      const hrvCard = `<div class="card span-2">${head("Heart rate variability", "ms · ribbon = baseline ±1 SD")}` +
        (hasHrv ? Charts.slot({ type: "line", data: hrvData, color: "var(--hrv, var(--accent))", fmt: (v) => `${Math.round(v)} ms`, band: band1, ref }) : `<p class="muted">No HRV readings yet.</p>`) + `</div>`;

      const rhrData = lineSeries(ctx, idx, (k) => ctx.days[k].restingHr);
      const rhrCard = `<div class="card">${head("Resting heart rate", "bpm")}` +
        (rhrData.some((x) => x.v !== null)
          ? Charts.slot({ type: "line", data: rhrData, color: "var(--red)", height: 150, area: false, fmt: (v) => `${Math.round(v)} bpm`,
            ref: isNum(rv.baseline) ? { v: Math.round(rv.baseline * 10) / 10, label: `baseline ${Math.round(rv.baseline)}` } : undefined })
          : `<p class="muted">No readings yet.</p>`) + `</div>`;

      const how = methodText(ctx, /recover/i) ||
        "Recovery compares last night's HRV, resting heart rate and breathing rate with your own 30-day baselines, then adds how well you slept. HRV carries the most weight. Higher HRV and lower resting heart rate than usual mean your body has absorbed recent load. Green is 67–100%, yellow 34–66%, red 0–33%.";
      const howCard = `<div class="card">${head("How recovery works")}<p class="muted">${esc(how)}</p>` +
        (isNum(hv.baseline) ? "" : `<p class="muted cv-note">Baselines are still forming, so early scores are rough.</p>`) + `</div>`;

      return `<div class="page v-recovery">${pageHead("Recovery", ctx)}${top}` +
        `<div class="grid cv-grid stagger">${contribCard}${howCard}${recCard}${hrvCard}${rhrCard}</div></div>`;
    },
  };

  /* ================= STRAIN ================= */

  Views.strain = {
    label: "Strain",
    icon: "strain",
    dated: true,
    css: CSS,
    render(ctx) {
      if (ctx.i === -1 || !ctx.day || !ctx.d) return emptyPage("Strain", ctx, "v-strain");
      const { d, day } = ctx;
      const ts = targetStatus(d);
      const today = isToday(day.date);
      const k = d.kcal || {};
      const active = isNum(k.active) ? k.active : day.activeKcal;
      const total = isNum(k.total) ? k.total : day.totalKcal;
      const z = Array.isArray(d.zones) ? d.zones : [];
      const zMin = [1, 2, 3, 4, 5].map((j) => (isNum(z[j]) ? z[j] : 0));
      const zTotal = zMin.reduce((s, v) => s + v, 0);
      const ws = workoutsOf(d);
      const share = isNum(d.activityStrainShare) ? Math.round(d.activityStrainShare * 100) : null;

      const top = `<section class="card hero cv-hero">` +
        `<div class="hero-dial">${dial({ size: 188, value: isNum(d.strain) ? d.strain : null, max: 21, color: "var(--strain)", label: "Strain",
          target: ts ? [ts.lo, ts.hi] : undefined, display: fStrain(d.strain), sub: "out of 21", aria: `Strain ${fStrain(d.strain)} of 21` })}</div>` +
        `<div class="cv-hero-body">${ts ? `<span>${chip(ts.level, ts.text)}</span>` : ""}<div class="cv-metrics">` +
        metric("Target", ts ? `${fStrain(ts.lo)}–${fStrain(ts.hi)}` : DASH, "", "", ts ? "from recovery" : "needs a recovery score") +
        metric("Active", isNum(active) ? count(active) : DASH, "kcal", "", isNum(total) ? `<span class="num">${App.fmt.num(total)}</span> total` : "") +
        metric("Above Z1", mins(zTotal), "", "", "50%+ of HR reserve") +
        metric("Workouts", count(ws.length), "", "", share !== null ? `<span class="num">${share}%</span> of load` : "") +
        `</div></div></section>`;

      const gaugeCard = `<div class="card cv-gauge">${head(today ? "Today's target" : "Target", ts ? chip(ts.level, ts.text) : "")}` +
        (ts ? Charts.slot({ type: "gauge21", value: d.strain, target: [ts.lo, ts.hi], height: 72, label: `Strain ${fStrain(d.strain)}, target ${fStrain(ts.lo)} to ${fStrain(ts.hi)}` }) +
          `<p class="insight">${ts.where === "below" ? (today ? `Room for <span class="num">${fStrain(Math.max(0, ts.lo - d.strain))}</span> more to reach the low end of today's target.` : "Finished under target — a lighter day than recovery allowed.")
            : ts.where === "in" ? "Load matches how recovered you were. A good place to stop."
            : "Above what recovery suggested. Plan an easier day and an earlier night."}</p>`
          : `<p class="insight">A strain target appears on days with a recovery score.</p>`) + `</div>`;

      const zMax = Math.max(...zMin, 1);
      const zRows = zMin.map((m, j) => ({ label: `Zone ${j + 1}`, color: `var(--z${j + 1})`, pct: (m / zMax) * 100, value: `<strong>${mins(m)}</strong>`,
        right: zTotal ? `${Math.round((m / zTotal) * 100)}%` : "" }));
      const zoneCard = `<div class="card">${head("Heart-rate zones", zTotal ? `<span class="num">${mins(zTotal)}</span> above 50% HRR` : "")}` +
        (zTotal ? meters(zRows) : `<p class="muted">No time above zone 1 on this day.</p>`) +
        `<p class="muted cv-note">Zones are % of heart-rate reserve: Z1 50–60, Z2 60–70, Z3 70–80, Z4 80–90, Z5 90+.</p></div>`;

      const actCard = `<div class="card">${head("Activities", share !== null ? `<span class="num">${share}%</span> of load` : "")}` +
        activityList(d, "No workouts on this day. All strain came from everyday movement.") + `</div>`;

      const hasHr = Array.isArray(day.hr) && day.hr.length > 0;
      const hrCard = `<div class="card span-2">${head("Heart rate", "bpm")}` +
        (hasHr ? Charts.slot({ type: "hrday", hr: day.hr, workouts: ws, sleep: day.sleep || null, date: day.date }) : `<p class="muted">No heart-rate samples for this day.</p>`) + `</div>`;

      const idx = windowIdx(ctx, 30);
      const series = idx.map((j) => {
        const dd = ctx.derived[j] || {};
        return { label: label(ctx.days[j].date), strain: isNum(dd.strain) ? dd.strain : null, recovery: isNum(dd.recovery) ? dd.recovery : null,
          color: isNum(dd.recovery) ? bandColor(dd.band || bandOf(dd.recovery)) : "var(--muted)" };
      });
      const sv = series.map((x) => x.strain).filter(isNum);
      const lineCard = `<div class="card span-2">${head("Strain and recovery", sv.length ? `30-day avg strain <span class="num">${fStrain(avg(sv))}</span>` : "last 30 days")}` +
        (sv.length ? Charts.slot({ type: "strainline", data: series, height: 200 }) : `<p class="muted">No strain history yet.</p>`) +
        `</div>`;

      return `<div class="page v-strain">${pageHead("Strain", ctx)}${top}<div class="grid cv-grid stagger">${gaugeCard}${zoneCard}${actCard}${hrCard}${lineCard}</div></div>`;
    },
  };
})();
</script>
<script>/* Cadence v2 views: Health monitor, Journal, Trends (+ Biological age), Coach.
 * Codes only against the contract APIs: App.*, Charts.*, CadenceEngine and the shared CSS vocabulary.
 * Reads engine v2 derived fields (strain 0–21, recovery + band, sleepPerformance, sleepNeed, monitor …)
 * and degrades gracefully when one is missing. */
(function () {
  "use strict";
  const Views = (window.Views = window.Views || {});
  const E = window.CadenceEngine;
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const avg = (a) => {
    const v = a.filter(isNum);
    return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null;
  };
  const sdOf = (a) => {
    const v = a.filter(isNum);
    if (v.length < 2) return null;
    const m = avg(v);
    return Math.sqrt(v.reduce((s, x) => s + (x - m) ** 2, 0) / (v.length - 1));
  };
  const F = () => App.fmt;
  const esc = (s) => App.esc(s == null ? "" : String(s));
  const n = (v, dp) => (isNum(v) ? F().num(v, dp || 0) : "—");
  const sgn = (v, dp) => (isNum(v) ? F().signed(v, dp || 0) : "—");
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pad = (x) => String(x).padStart(2, "0");
  const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const minsOf = (t) => {
    const m = /^(\d{1,2}):(\d{2})/.exec(t || "");
    return m && +m[1] < 24 && +m[2] < 60 ? +m[1] * 60 + +m[2] : null;
  };
  const clockOf = (t) => {
    const m = minsOf(t);
    return m == null ? "" : F().clock(m);
  };
  const fullProfile = (p) => ({ ...(E.DEFAULT_PROFILE || {}), ...(p || {}) });
  const empty = (title, text) => `<div class="empty"><h2>${title}</h2><p class="muted">${text}</p></div>`;
  const head = (title, sub) => `<div class="page-head"><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
  const cardHead = (title, meta) => `<div class="card-head"><h2>${title}</h2>${meta ? `<div class="card-meta">${meta}</div>` : ""}</div>`;
  const stat = (label, value, unit, sub) =>
    `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value num">${value}${unit ? `<span class="stat-unit">${unit}</span>` : ""}</div>${sub ? `<div class="stat-sub">${sub}</div>` : ""}</div>`;
  const bar = (pct, color) =>
    `<div class="bar-track"><div class="bar-fill" style="width:${Math.max(0, Math.min(100, isNum(pct) ? pct : 0)).toFixed(1)}%;--c:${color}"></div></div>`;


  /* ---------- v4 page blocks (shared by health, journal, trends, coach) ---------- */
  /* count-up number: text is final value; Charts.animate / CadenceMotion read data-count + data-dp */
  const countUp = (v, dp, text) =>
    isNum(v) ? `<span class="pb-count" data-count="${(+v).toFixed(dp || 0)}" data-dp="${dp || 0}">${text != null ? text : n(v, dp)}</span>` : "—";
  /* page hero: big title, one key number, one-line summary. Strings passed in must already be escaped. */
  const hero = (o) =>
    `<section class="hero pb-hero${o.tone ? ` pb-tone-${o.tone}` : ""}"${o.color ? ` style="--hc:${o.color}"` : ""}>
      <div class="pb-hero-text">${o.eyebrow ? `<div class="pb-eyebrow">${o.eyebrow}</div>` : ""}<h1 class="pb-title">${o.title}</h1>${o.sum ? `<p class="pb-sum">${o.sum}</p>` : ""}</div>
      ${o.numText != null || isNum(o.num) ? `<div class="pb-fig"><div class="pb-num num">${o.numText != null ? o.numText : countUp(o.num, o.dp || 0)}${o.unit ? `<span class="pb-num-u">${o.unit}</span>` : ""}</div>${o.label ? `<div class="pb-num-l">${o.label}</div>` : ""}</div>` : ""}
      ${o.extra || ""}
    </section>`;
  const PB_CSS = `
.pb-hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;margin:4px 0 18px}
.pb-hero > *{margin:0}
.pb-hero-text{flex:1 1 260px;min-width:0}
.pb-eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.pb-title{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:44px;line-height:.95;letter-spacing:-.015em;margin:0}
.pb-sum{color:var(--muted);font-size:15px;line-height:1.4;margin-top:8px;max-width:56ch}
.pb-sum strong,.pb-sum .hm-sum-text{color:var(--ink);font-weight:600}
.pb-fig{flex:none;text-align:right}
.pb-num{font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:72px;line-height:.82;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--hc,var(--ink));white-space:nowrap}
.pb-num-u,.pb-num-of{font-size:.36em;font-weight:700;letter-spacing:0;color:var(--muted);margin-left:2px}
.pb-num-l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.pb-tone-good{--hc:var(--green)} .pb-tone-warn{--hc:var(--yellow)} .pb-tone-bad{--hc:var(--red)}
.pb-hero-x{flex:1 1 100%}
.pb-foot{font-size:12px;color:var(--muted);margin-top:14px}
.pb-seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pb-seg button{border-radius:999px;border:0;background:none;padding:6px 14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;min-height:32px}
.pb-seg button.on{background:var(--surface-3);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.pb-meter{position:relative;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.pb-meter > i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--c);width:var(--w)}
.pb-sheet{background:var(--surface);border:1px solid var(--line);border-radius:20px 20px var(--radius) var(--radius);position:relative;padding-top:26px}
.pb-sheet::before{content:"";position:absolute;top:9px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--surface-3)}
@media (max-width:560px){.pb-title{font-size:36px}.pb-num{font-size:56px}.pb-hero{align-items:flex-start}.pb-fig{text-align:left}}`;
  const meter = (pct, color) =>
    `<div class="pb-meter" aria-hidden="true"><i style="--w:${Math.max(0, Math.min(100, isNum(pct) ? pct : 0)).toFixed(1)}%;--c:${color}"></i></div>`;

  /* ---------- v2 helpers (tolerant of v1 engine output) ---------- */
  const BAND_VAR = { green: "var(--green, var(--rec-high))", yellow: "var(--yellow, var(--rec-mid))", red: "var(--red, var(--rec-low))" };
  const BAND_CHIP = { green: "good", yellow: "warn", red: "bad" };
  const bandOf = (r) => (!isNum(r) ? null : r >= 67 ? "green" : r >= 34 ? "yellow" : "red");
  const bandOfD = (d) => (d ? (BAND_VAR[d.band] ? d.band : bandOf(d.recovery)) : null);
  const bandColor = (b) => {
    if (!b) return "var(--muted)";
    const c = App.bandColor ? App.bandColor(b) : null;
    return typeof c === "string" && c ? c : BAND_VAR[b] || "var(--muted)";
  };
  const strainF = (v) => {
    if (!isNum(v)) return "—";
    const f = F().strain;
    return typeof f === "function" ? f(v) : v.toFixed(1);
  };
  const needOf = (d) => (!d ? null : isNum(d.sleepNeed) ? d.sleepNeed : d.sleepNeed && isNum(d.sleepNeed.total) ? d.sleepNeed.total : null);
  const perfOf = (d) => (!d ? null : isNum(d.sleepPerformance) ? d.sleepPerformance : isNum(d.sleepScore) ? d.sleepScore : null);
  const asleepOf = (d) => (d && d.sleep && isNum(d.sleep.asleep) ? d.sleep.asleep : null);

  /* indices of days in the window of `count` records ending at i */
  const windowIdx = (i, count) => {
    const out = [];
    for (let k = Math.max(0, i - count + 1); k <= i; k++) out.push(k);
    return out;
  };

  /* all workouts of one merged day: device + manual, with v2 per-workout strain when the engine gives it */
  const workoutsOf = (day, d) => {
    if (!day) return [];
    const strainById = {};
    for (const w of (d && d.workouts) || []) if (w && w.id != null && isNum(w.strain)) strainById[w.id] = w.strain;
    const dw = (d && d.workouts) || [];
    const dev = (day.workouts || []).map((w, k) => {
      const dv = dw[k] && dw[k].start === w.start && dw[k].type === w.type ? dw[k] : null;
      return { ...w, manual: false, strain: dv && isNum(dv.strain) ? dv.strain : strainById[w.id] };
    });
    const man = ((day.entry && day.entry.workouts) || []).map((w) => ({ ...w, manual: true, strain: strainById[w.id] }));
    return dev.concat(man).sort((a, b) => String(a.start).localeCompare(String(b.start)));
  };
  const startClock = (w) => {
    const d = new Date(w.start);
    return isNaN(d) ? "" : F().clock(d);
  };

  function update(fn) {
    const sel = App.sel();
    const entry = App.getEntry(sel);
    if (fn(entry) === false) return;
    App.saveEntry(sel, entry);
  }
  const on = (kind, name, fn) => {
