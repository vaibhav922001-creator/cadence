.in-grid th{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px;overflow:hidden;text-overflow:ellipsis}
.in-grid th[scope=row]{text-align:left;color:var(--ink);text-transform:none;letter-spacing:0;font-size:11px;white-space:nowrap;text-overflow:clip}
.in-grid thead th:first-child{width:5.6em;text-align:left}
.in-grid td{text-align:center;padding:12px 2px;border-radius:8px;font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:16px;color:var(--ink);background:color-mix(in srgb,var(--c) 22%,var(--surface-2));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 30%,transparent)}
.in-grid td.on{outline:2px solid var(--ink);outline-offset:-2px;background:color-mix(in srgb,var(--c) 40%,var(--surface-2))}
`;

  /* ---------- views ---------- */
  Views.insights = {
    label: "Insights",
    icon: "insights",
    dated: false,
    css: CSS,
    render(ctx) {
      const plain = (sum) => hero({ eyebrow: "Plain statistics · no AI", title: "Insights", sum });
      if (!ctx.days.length) return `<div class="page">${plain("Patterns in your own data appear here once you import some.")}<div class="empty"><h2>No data yet</h2><p>Import health data on the Data page to see insights.</p></div></div>`;
      const li = latestIdx(ctx);
      const sec = (f) => { try { return f(); } catch (e) { console.error("Insights section failed", e); return ""; } };
      let headH = plain("Patterns in your own data, worked out with plain statistics.");
      sec(() => {
        const ws = warnSummary(ctx, li);
        const rec = [];
        for (let k = Math.max(0, li - 6); k <= li; k++) if (ctx.derived[k] && isNum(ctx.derived[k].recovery)) rec.push(ctx.derived[k].recovery);
        const a = rec.length ? rec.reduce((x, y) => x + y, 0) / rec.length : null;
        headH = hero({
          eyebrow: `Week to ${esc(shortLabel(ctx.days[li] && ctx.days[li].date))}`,
          title: "Insights",
          sum: ws.text,
          tone: ws.tone,
          numText: isNum(a) ? countUp(a, 0) : null,
          unit: "%",
          label: "7-day avg recovery",
          color: ws.tone ? "" : isNum(a) ? bandColor(bandOf(a)) : "",
        });
      });
      return `<div class="page v-insights">${headH}` +
        sec(() => warningCard(ctx, li)) +
        `<div class="grid-2">` +
        sec(() => weeklyCard(ctx, li)) +
        sec(() => driversCard(ctx, li)) +
        sec(() => sleepWindowCard(ctx, li)) +
        sec(() => stressCard(ctx, li)) +
        sec(() => cardioCard(ctx, li)) +
        sec(() => methodsCard()) +
        `</div></div>`;
    },
  };

  Views.performance = {
    label: "Training",
    icon: "training",
    dated: true,
    css: CSS,
    render(ctx) {
      const date = ctx.day ? ctx.day.date : App.sel();
      const base = (sum, extra) => hero(Object.assign({ eyebrow: esc(F().day(date)), title: "Training", sum }, extra || {}));
      if (ctx.i === -1 || !ctx.day) return `<div class="page">${base("Load, form and what's next.")}<div class="empty"><h2>Nothing recorded this day</h2><p>Pick another day, or import data from the Data page.</p></div></div>`;
      const sec = (f) => { try { return f(); } catch (e) { console.error("Training section failed", e); return ""; } };
      const { r, list } = loadSeries(ctx);
      let headH = base("Load, form and what's next.");
      sec(() => {
        const cur = loadAt(list, ctx, ctx.i) || {};
        const ctl = numOf(cur, "ctl", "fitness"), tsb = numOf(cur, "tsb", "form");
        const word = !isNum(tsb) ? "Fitness builds from your daily strain load." : tsb > 5 ? "Fresh. A good day to go hard." : tsb >= -10 ? "Balanced. Training is being absorbed." : tsb >= -30 ? "Tired. Productive load, but watch recovery." : "Very tired. Back off for a few days.";
        headH = base(`${word}${isNum(tsb) ? ` Form <strong class="num">${sgn(tsb, 1)}</strong>.` : ""}`, {
          numText: isNum(ctl) ? countUp(ctl, 1) : null,
          label: "fitness · 42-day load",
          color: "var(--strain)",
        });
      });
      const top = list
        ? sec(() => pmcCard(ctx, list))
        : card("Fitness, fatigue and form", "", wait("Load model not ready", r, { min: 21, have: haveDays(ctx, ctx.i), why: "Fitness and fatigue are running averages of daily strain load." }), "span-2");
      return `<div class="page v-performance">${headH}<div class="grid-2">` +
        top +
        sec(() => forecastCard(ctx)) +
        (list ? sec(() => acwrCard(ctx, list)) : "") +
        sec(() => planCard(ctx)) +
        sec(() => scenarioCard(ctx)) +
        `</div></div>`;
    },
  };
})();
</script>
<script>/* Cadence view: Data (source status, import, phone app, profile, backup). */
(function () {
  "use strict";
  const Views = (window.Views = window.Views || {});
  if (!window.App || !App.on) return;
  const esc = App.esc;

  const st = {
    importMsg: null, // {ok, text}
    busy: false,
    confirmClear: false,
    downloads: undefined, // undefined = not checked, null = unavailable
    dlChecking: false,
  };

  const UPLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg>';

  const isWeb = () => !!(App.env && App.env() === "web");
  /* website: save files with a Blob link (same .save() shape as claude downloads) */
  const blobSaver = {
    async save({ filename, data }) {
      const blob = new Blob([data], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.rel = "noopener";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        URL.revokeObjectURL(url);
        a.remove();
      }, 1500);
    },
  };

  function checkDownloads() {
    if (st.downloads === undefined && isWeb()) st.downloads = blobSaver;
    if (st.downloads !== undefined || st.dlChecking) return;
    st.dlChecking = true;
    Promise.resolve()
      .then(() => (window.claude && window.claude.use ? window.claude.use("downloads") : null))
      .catch(() => null)
      .then((d) => {
        st.downloads = d || null;
        st.dlChecking = false;
        if (App.view() === "data") App.rerender();
      });
  }

  async function handleFile(file) {
    if (!file || st.busy) return;
    st.busy = true;
    st.importMsg = { ok: true, text: `Reading ${file.name}…` };
    App.rerender();
    try {
      if (file.size > 60 * 1024 * 1024) throw new Error("This file is too large. Export a shorter range from the app.");
      const text = await file.text();
      const res = window.CadenceEngine.parseImport(text);
      if (res.error) {
        st.importMsg = { ok: false, text: res.error };
      } else {
        const n = await App.importDays(res.days);
        if (res.profile && typeof res.profile === "object") {
          const p = {};
          for (const k of ["dob", "age", "sex", "heightCm", "weightKg", "maxHr"]) if (res.profile[k] != null) p[k] = res.profile[k];
          if (Object.keys(p).length) App.saveProfile(p);
        }
        const ds = res.days.map((d) => d.date).sort();
        st.importMsg = {
          ok: true,
          text: `Imported ${App.fmt.num(n)} day${n === 1 ? "" : "s"} (${App.fmt.short(ds[0])} to ${App.fmt.short(ds[ds.length - 1])}).`,
        };
        App.toast(`Imported ${n} day${n === 1 ? "" : "s"}`);
      }
    } catch (e) {
      st.importMsg = { ok: false, text: (e && e.message) || "Couldn't read that file." };
    }
    st.busy = false;
    App.rerender();
  }

  App.onInput("data:file", (el) => {
    const f = el.files && el.files[0];
    el.value = "";
    handleFile(f);
  });
  App.on("data:pick", () => {
    const inp = document.getElementById("data-file");
    if (inp) inp.click();
  });
  App.onSubmit("data:profile", (form, fd) => {
    const num = (k) => {
      const v = String(fd.get(k) || "").trim();
      return v === "" ? null : Number(v);
    };
    const dob = String(fd.get("dob") || "").trim();
    if (dob && (!/^\d{4}-\d{2}-\d{2}$/.test(dob) || isNaN(new Date(dob + "T00:00:00")))) {
      App.toast("Enter your date of birth as a full date.");
      return;
    }
    const today = new Date();
    const ymdToday = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;
    if (dob && dob > ymdToday) {
      App.toast("Date of birth can't be in the future.");
      return;
    }
    App.saveProfile({ dob: dob || undefined, sex: String(fd.get("sex") || "unspecified"), heightCm: num("heightCm"), weightKg: num("weightKg"), maxHr: num("maxHr") });
    App.toast("Profile saved");
  });
  App.on("data:backup", async (el) => {
    const dl = st.downloads;
    if (!dl) return;
    el.disabled = true;
    try {
      const json = JSON.stringify(App.exportJSON(), null, 1);
      await dl.save({ filename: "cadence-backup.json", data: json });
      App.toast("Backup saved");
    } catch (e) {
      const code = e && e.code;
      if (code === "declined") App.toast("Download cancelled");
      else if (code === "rate_limited") App.toast("A download is already waiting. Try again in a moment.");
      else App.toast("Download isn't available here");
    }
    el.disabled = false;
  });
  App.on("data:clear", () => {
    st.confirmClear = true;
    App.rerender();
  });
  App.on("data:clear-cancel", () => {
    st.confirmClear = false;
    App.rerender();
  });
  App.on("data:clear-yes", async () => {
    st.confirmClear = false;
    st.importMsg = null;
    await App.clearImported();
    App.toast("Imported data removed");
  });

  function where(kind) {
    if (kind === "cloud") return "Saved to your Claude account. Only you can see it.";
    if (kind === "device") return "Saved in this browser on this device only. It won't follow you to other devices, and nothing is sent to a server.";
    if (kind === "browser") return "Saved in this browser only. It won't follow you to other devices.";
    return "Not saved. Storage isn't available here, so changes last until you close the page.";
  }

  function sourceCard(ctx) {
    const mine = App.mode() === "mine";
    const ds = ctx.days.filter((d) => Object.keys(d).some((k) => k !== "date" && k !== "entry"));
    const range = ds.length ? `${App.fmt.short(ds[0].date)} – ${App.fmt.short(ds[ds.length - 1].date)}` : "–";
    const logged = ctx.days.filter((d) => {
      const e = d.entry;
      return e && (e.meals.length || e.waterMl || e.caffeineMg || e.journal.tags.length || e.journal.note || e.workouts.length);
    }).length;
    return `<div class="card">
      <div class="card-head"><h2>Data source</h2>${mine ? `<span class="pill chip good">Your data</span>` : `<span class="pill chip warn">Sample data</span>`}</div>
      <p class="muted">${
        mine
          ? "Cadence is showing the health data you imported."
          : "You're looking at made-up sample data so you can explore. Import your own file below to replace it."
      }</p>
      <div class="stats">
        <div class="stat"><div class="stat-label">Days</div><div class="stat-value num">${App.fmt.num(ds.length)}</div></div>
        <div class="stat"><div class="stat-label">Range</div><div class="stat-value num dt-range">${esc(range)}</div></div>
        <div class="stat"><div class="stat-label">Days logged</div><div class="stat-value num">${App.fmt.num(logged)}</div><div class="stat-sub">meals, journal</div></div>
      </div>
      <p class="note">${esc(where(App.persistKind()))}</p>
    </div>`;
  }

  function importCard() {
    const m = st.importMsg;
    return `<div class="card">
      <div class="card-head"><h2>Import health data</h2><span class="card-meta">.json</span></div>
      <p class="muted">Upload the export file from the Cadence Sync app. Files in the cadence.v1 and cadence.v2 formats both work. New days are added and matching days are updated. Your meals and journal stay as they are.</p>
      <div class="drop" id="data-drop">
        ${UPLOAD}
        <div><strong>Drop the file here</strong></div>
        <div class="small">or</div>
        <button class="btn primary" type="button" data-action="data:pick"${st.busy ? " disabled" : ""}>Choose file</button>
        <input id="data-file" type="file" accept=".json,application/json" data-input="data:file" class="sr-only" tabindex="-1" aria-label="Choose export file">
      </div>
      ${m ? `<div class="msg ${m.ok ? "ok" : "bad"}" role="status">${esc(m.text)}</div>` : ""}
    </div>`;
  }

  function phoneCard() {
    return `<div class="card">
      <div class="card-head"><h2>How your data gets here</h2><span class="card-meta">Android</span></div>
      <div class="flow" aria-label="Data path: Fitbit Air, Google Health app, Health Connect, Cadence Sync, upload here"><span>Fitbit Air</span><i aria-hidden="true">→</i><span>Google Health app</span><i aria-hidden="true">→</i><span>Health Connect</span><i aria-hidden="true">→</i><span>Cadence Sync</span><i aria-hidden="true">→</i><span>Upload here</span></div>
      <ol class="steps">
        <li><div><b>Sync your band</b><span>Wear your Fitbit Air and let the Google Health app sync it.</span></div></li>
        <li><div><b>Turn on Health Connect</b><span>In the Google Health app, allow it to share heart rate, sleep, steps and workouts with Health Connect.</span></div></li>
        <li><div><b>Install Cadence Sync</b><span>Open it and grant read access to the same data types in Health Connect.</span></div></li>
        <li><div><b>Export and upload</b><span>Tap Export in Cadence Sync, save the file, then upload it here.</span></div></li>
      </ol>
      <p class="note">Google Fit is being retired, so Health Connect is the route. Other apps that write to Health Connect, like Samsung Health or Garmin Connect, flow through the same way.</p>
      ${isWeb() ? "" : `<p class="note">Prefer a direct link? The self-hosted Cadence website can connect to Google Health and sync without a file.</p>`}
    </div>`;
  }

  function methodsCard(ctx) {
    const E = ctx.E || window.CadenceEngine || {};
    const list = Array.isArray(E.METHODS) ? E.METHODS.filter((m) => m && (m.title || m.body)) : [];
    if (!list.length) return "";
    const para = (t) =>
      String(t == null ? "" : t)
        .split(/\n\s*\n/)
        .map((p) => p.trim())
        .filter(Boolean)
        .map((p) => `<p>${esc(p)}</p>`)
        .join("");
    return `<div class="card" id="how-scores-work">
      <div class="card-head"><h2>How scores work</h2><span class="card-meta">${list.length} topics</span></div>
      <div class="acc">${list
        .map((m) => `<details><summary>${esc(m.title || "")}</summary><div class="acc-b">${para(m.body)}</div></details>`)
        .join("")}</div>
    </div>`;
  }

  /* exact decimal age (years, 2 dp): engine's ageOn when present, else the same days/365.2425 formula */
  function exactAge(dob) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dob || ""))) return null;
    const d = new Date();
    const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    try {
      const E = window.CadenceEngine;
      if (E && typeof E.ageOn === "function") {
        const v = E.ageOn(dob, today);
        if (typeof v === "number" && isFinite(v)) return v;
      }
      if (App.ageOn) {
        const v = App.ageOn(dob, today);
        if (typeof v === "number" && isFinite(v)) return v;
      }
    } catch (e) {}
    const ms = new Date(today + "T00:00:00") - new Date(dob + "T00:00:00");
    return isFinite(ms) && ms >= 0 ? Math.round((ms / 86400000 / 365.2425) * 100) / 100 : null;
  }

  function profileCard(ctx) {
    const p = ctx.profile;
    const dob = p.dob || "2001-02-09";
    const age = exactAge(dob);
    const v = (x) => (x == null || x === "" ? "" : esc(x));
    const sel = (x) => (p.sex === x ? " selected" : "");
    return `<div class="card">
      <div class="card-head"><h2>Your profile</h2></div>
      <p class="muted">Used for heart rate zones, strain and calorie estimates.</p>
      <form data-submit="data:profile" class="stack" autocomplete="off">
        <div class="form-row">
          <label class="field"><span>Date of birth</span><input name="dob" type="date" min="1910-01-01" value="${v(dob)}" required><span class="hint">Age <span class="num">${age == null ? "–" : esc(age.toFixed(2))}</span> years</span></label>
          <label class="field"><span>Sex</span><select name="sex"><option value="female"${sel("female")}>Female</option><option value="male"${sel("male")}>Male</option><option value="unspecified"${sel("unspecified")}>Unspecified</option></select></label>
        </div>
        <div class="form-row">
          <label class="field"><span>Height (cm)</span><input name="heightCm" type="number" inputmode="decimal" min="80" max="250" step="0.5" value="${v(p.heightCm)}"></label>
          <label class="field"><span>Weight (kg)</span><input name="weightKg" type="number" inputmode="decimal" min="20" max="400" step="0.1" value="${v(p.weightKg)}"></label>
          <label class="field"><span>Max HR (optional)</span><input name="maxHr" type="number" inputmode="numeric" min="120" max="230" placeholder="${esc(String(ctx.E.maxHrOf({ ...p, maxHr: null })))}" value="${v(p.maxHr)}"></label>
        </div>
        <div class="btn-row"><button class="btn primary" type="submit">Save profile</button></div>
      </form>
    </div>`;
  }

  function backupCard() {
    const mine = App.mode() === "mine";
    const dl = st.downloads;
    let clear = "";
    if (mine) {
      clear = st.confirmClear
        ? `<div class="insight bad"><strong>Remove all imported health data?</strong> Your meals, journal and profile stay. This can't be undone.</div>
           <div class="btn-row"><button class="btn danger primary small" type="button" data-action="data:clear-yes">Yes, remove it</button><button class="btn ghost small" type="button" data-action="data:clear-cancel">Cancel</button></div>`
        : `<div class="btn-row"><button class="btn danger" type="button" data-action="data:clear">Remove imported data</button></div>`;
    }
    const dlBtn = dl ? `<div class="btn-row"><button class="btn" type="button" data-action="data:backup">Download backup</button></div>` : "";
    if (!dlBtn && !clear) return "";
    return `<div class="card">
      <div class="card-head"><h2>Backup and removal</h2></div>
      ${dlBtn ? `<p class="muted">Save a copy of your imported data, log and profile as a .json file.</p>${dlBtn}` : ""}
      ${clear}
    </div>`;
  }

  /* ===================================================== Google Health (website only) */
  const G_LS = "cadence.google";
  const gDefaults = () => ({ clientId: "974274557373-akp5c3i2ml53aivk8skbob3eh72b8ojs.apps.googleusercontent.com", proxyUrl: "", lastSync: null, lastCount: 0, sources: [], warnings: [], autoSync: true, firstDays: 90 });
  function gLoad() {
    try {
      const j = JSON.parse(localStorage.getItem(G_LS) || "null");
      return j && typeof j === "object" ? { ...gDefaults(), ...j } : gDefaults();
    } catch (e) {
      return gDefaults();
    }
  }
  function gSave() {
    try {
      localStorage.setItem(G_LS, JSON.stringify(g.cfg));
      return true;
    } catch (e) {
      return false;
    }
  }
  const g = {
    cfg: gLoad(),
    editing: false,
    connected: false,
    busy: null, // "connect" | "sync" | null
    progress: null, // {frac, label}
    msg: null, // {ok, text}
    configured: false,
  };
  const GH = () => (window.GoogleHealth && typeof window.GoogleHealth.connect === "function" ? window.GoogleHealth : null);

  const G_ERRORS = {
    popup_blocked: "Your browser blocked the Google sign-in window. Allow pop-ups for this site, then try again.",
    popup_closed: "The Google sign-in window was closed before you finished.",
    popup_closed_by_user: "The Google sign-in window was closed before you finished.",
    user_cancelled: "Sign-in was cancelled.",
    cancelled: "Sign-in was cancelled.",
    access_denied: "Google access wasn't allowed. Connect again and allow access to continue.",
    no_client_id: "Add your Google Client ID first.",
    not_configured: "Add your Google Client ID first.",
    invalid_client: "Google didn't accept this Client ID. Check it in Google Cloud, and that this site's address is listed as an authorized JavaScript origin.",
    origin_mismatch: "This site's address isn't an authorized JavaScript origin for your Client ID. Add it in Google Cloud.",
    redirect_uri_mismatch: "This site's address isn't allowed for your Client ID. Add it in Google Cloud.",
    not_connected: "You're not connected to Google Health. Tap Connect.",
    token_expired: "Your Google sign-in has expired. Tap Connect to sign in again.",
    unauthorized: "Your Google sign-in has expired. Tap Connect to sign in again.",
    auth: "Your Google sign-in has expired. Tap Connect to sign in again.",
    insufficient_scope: "Cadence wasn't given access to all the data it needs. Connect again and allow every item.",
    permission_denied: "Google refused access to this data. Check the Google Health API is turned on and you allowed every item.",
    api_disabled: "The Google Health API isn't turned on in your Google Cloud project.",
    not_enabled: "The Google Health API isn't turned on in your Google Cloud project.",
    bad_request: "Google Health didn't accept the request. Try a shorter range.",
    network: "Couldn't reach Google Health. Check your connection.",
    cors: "The browser blocked the request to Google Health. If you set a proxy URL, check it's running.",
    proxy: "Your proxy didn't respond. Check the proxy URL, or clear it.",
    rate_limited: "Google is limiting requests right now. Try again in a few minutes.",
    quota: "Google is limiting requests right now. Try again in a few minutes.",
    gis_load_failed: "Couldn't load Google sign-in. Check your connection or any content blocker.",
    script_load_failed: "Couldn't load Google sign-in. Check your connection or any content blocker.",
  };
  const gErr = (e) => {
    // the connector writes plain messages; the code map covers errors that arrive without one
    const code = e && e.code;
    if (e && typeof e.message === "string" && e.message.trim()) return e.message;
    if (code && G_ERRORS[code]) return G_ERRORS[code];
    return "Something went wrong talking to Google Health.";
  };

  function gConfigure() {
    const gh = GH();
    if (!gh || !g.cfg.clientId) return false;
    try {
      gh.configure({ clientId: g.cfg.clientId, proxyUrl: g.cfg.proxyUrl || undefined });
      g.configured = true;
    } catch (e) {
      g.configured = false;
      g.msg = { ok: false, text: gErr(e) };
    }
    return g.configured;
  }
  async function gRefresh() {
    const gh = GH();
    let c = false;
    try {
      c = gh && g.configured ? !!(await gh.isConnected()) : false;
    } catch (e) {
      c = false;
    }
    if (c !== g.connected) {
      g.connected = c;
      if (App.view() === "data") App.rerender();
    }
    return c;
  }

  function normProgress(p) {
    if (typeof p === "number") return { frac: p > 1 ? p / 100 : p, label: "" };
    if (!p || typeof p !== "object") return null;
    let f = [p.fraction, p.progress, p.pct, p.percent].find((x) => typeof x === "number");
    if (f == null && typeof p.done === "number" && typeof p.total === "number" && p.total > 0) f = p.done / p.total;
    if (typeof f === "number" && f > 1) f = f / 100;
    return { frac: typeof f === "number" ? Math.max(0, Math.min(1, f)) : null, label: String(p.message || p.label || p.step || p.stage || "") };
  }
  function paintProgress() {
    const bar = document.getElementById("gh-bar");
    const lab = document.getElementById("gh-plabel");
    if (!g.progress) return;
    if (bar) {
      const f = g.progress.frac;
      bar.style.width = f == null ? "35%" : Math.round(f * 100) + "%";
      bar.parentElement.classList.toggle("indet", f == null);
    }
    if (lab) lab.textContent = g.progress.label || (g.progress.frac != null ? Math.round(g.progress.frac * 100) + "%" : "Working…");
  }

  const ymdOf = (d) => window.CadenceEngine.ymd(d);
  /* resolves {ok, days}; rejects with the error when the sync itself fails */
  async function gSync(auto) {
    const gh = GH();
    if (!gh) return { ok: false, days: 0, skipped: "unavailable" };
    if (g.busy) return { ok: false, days: 0, skipped: "busy" };
    if (!g.configured && !gConfigure()) return { ok: false, days: 0, skipped: "not_configured" };
    // a background sync must never open a sign-in pop-up: only go ahead with a live token
    if (auto) {
      let valid = false;
      try { valid = !!(typeof gh.tokenStatus === "function" && gh.tokenStatus() && gh.tokenStatus().valid); } catch (e) { valid = false; }
      if (!valid) return { ok: false, reason: "no_token" };
    }
    let result = null, failure = null;
    g.busy = "sync";
    g.msg = null;
    g.progress = { frac: null, label: "Starting…" };
    if (!auto || App.view() === "data") App.rerender();
    try {
      let days, since;
      if (g.cfg.lastSync) {
        const last = new Date(g.cfg.lastSync);
        const s = new Date(last.getTime() - 2 * 864e5); // 2-day overlap catches late-arriving data
        since = ymdOf(s);
        days = Math.max(3, Math.min(180, Math.ceil((Date.now() - s.getTime()) / 864e5) + 1));
      } else {
        days = [30, 90, 180].includes(+g.cfg.firstDays) ? +g.cfg.firstDays : 90;
      }
      const res = await gh.sync({
        days,
        since,
        onProgress: (p) => {
          g.progress = normProgress(p) || g.progress;
          paintProgress();
        },
      });
      const E = window.CadenceEngine;
      const raw = (res && Array.isArray(res.days) ? res.days : []);
      const clean = raw.map((d) => (E.cleanDay ? E.cleanDay(d) : d)).filter(Boolean);
      const n = clean.length ? await App.importDays(clean, { merge: true }) : 0;
      g.cfg.lastSync = new Date().toISOString();
      g.cfg.lastCount = n;
      g.cfg.sources = Array.isArray(res && res.sources) ? res.sources.slice(0, 20) : [];
      g.cfg.warnings = Array.isArray(res && res.warnings) ? res.warnings.slice(0, 20) : [];
      gSave();
      g.msg = { ok: true, text: n ? `Synced ${App.fmt.num(n)} day${n === 1 ? "" : "s"} from Google Health.` : "Synced. No new days in that range." };
      if (!auto) App.toast(n ? `Synced ${n} day${n === 1 ? "" : "s"}` : "Up to date");
      result = { ok: true, count: n, days: n };
    } catch (e) {
      failure = e || new Error("sync_failed");
      g.msg = { ok: false, text: gErr(e) };
      if (e && /^(token_expired|unauthorized|auth|not_connected)$/.test(String(e.code || ""))) await gRefresh();
    }
    g.busy = null;
    g.progress = null;
    await gRefresh(); // flips the card to Connected after a tap-to-sign-in sync
    App.rerender();
    if (failure) throw failure;
    return result;
  }
  App.ghSync = (silent) => gSync(!!silent);
  App.ghConfig = () => g.cfg; // live config (autoSync defaults to true)

  App.onSubmit("gh:setup", (form, fd) => {
    const id = String(fd.get("clientId") || "").trim();
    const proxy = String(fd.get("proxyUrl") || "").trim();
    if (!/\.apps\.googleusercontent\.com$/.test(id)) {
      g.msg = { ok: false, text: "That doesn't look like a Google OAuth Client ID. It ends in .apps.googleusercontent.com." };
      App.rerender();
      return;
    }
    if (proxy && !/^https:\/\/[^\s]+$/i.test(proxy)) {
      g.msg = { ok: false, text: "The proxy URL must start with https://. Leave it empty if you don't use one." };
      App.rerender();
      return;
    }
    const changed = id !== g.cfg.clientId;
    g.cfg.clientId = id;
    g.cfg.proxyUrl = proxy;
    if (changed) {
      try { GH() && GH().disconnect(); } catch (e) {}
      g.connected = false;
    }
    const ok = gSave();
    g.editing = false;
    g.msg = ok ? { ok: true, text: "Saved in this browser. Now tap Connect." } : { ok: false, text: "This browser won't let Cadence save settings. It will last until you close the page." };
    gConfigure();
    gRefresh();
    App.rerender();
  });
  App.on("gh:edit", () => {
    g.editing = true;
    g.msg = null;
    App.rerender();
  });
  App.on("gh:edit-cancel", () => {
    g.editing = false;
    App.rerender();
  });
  App.on("gh:connect", async () => {
    const gh = GH();
    if (!gh || g.busy) return;
    if (!gConfigure()) return;
    g.busy = "connect";
    g.msg = null;
    App.rerender();
    try {
      await gh.connect(); // runs from the tap, so the sign-in pop-up is allowed
      g.connected = true;
      g.msg = { ok: true, text: g.cfg.lastSync ? "Connected again." : "Connected. Pick how far back to go, then tap Sync now." };
    } catch (e) {
      g.msg = { ok: false, text: gErr(e) };
    }
    g.busy = null;
    await gRefresh();
    App.rerender();
  });
  App.on("gh:sync", () => gSync(false).catch(() => {}));
  App.on("gh:range", (el) => {
    const n = +el.dataset.n;
    if (![30, 90, 180].includes(n)) return;
    g.cfg.firstDays = n;
    gSave();
    App.rerender();
  });
  App.on("gh:disconnect", async () => {
    const gh = GH();
    try {
      if (gh) await gh.disconnect();
    } catch (e) {}
    g.connected = false;
    gSave();
    g.msg = { ok: true, text: "Disconnected. Data already synced stays in Cadence." };
    App.rerender();
  });
  App.onInput("gh:auto", (el) => {
    g.cfg.autoSync = !!el.checked;
    gSave();
    App.toast(g.cfg.autoSync ? "Cadence will sync when you open it" : "Sync on open turned off");
  });

  const SETUP_STEPS = [
    ["Create a Google Cloud project", "Go to console.cloud.google.com, sign in with the Google account that has your health data, and create a new project (any name)."],
    ["Turn on the Google Health API", "In APIs & Services → Library, search for the Google Health API and enable it."],
    ["Set up the consent screen", "In Google Auth Platform (OAuth consent screen), choose External, fill in the app name and your email, and add the health data scopes listed in GOOGLE-SETUP.md. Add yourself as a test user."],
    ["Create a Client ID", "In Credentials, create an OAuth client ID of type Web application. Under Authorized JavaScript origins add this site's address: " + (typeof location !== "undefined" ? location.origin : "your site address") + "."],
    ["Paste it here", "Copy the Client ID (it ends in .apps.googleusercontent.com) into the field above and save. It stays in this browser."],
  ];

  function googleCard() {
    const gh = GH();
    const c = g.cfg;
    const m = g.msg;
    const msg = m ? `<div class="msg ${m.ok ? "ok" : "bad"}" role="status">${esc(m.text)}</div>` : "";
    if (!gh) {
      return `<div class="card gh">
        <div class="card-head"><h2>Google Health</h2><span class="pill chip neutral">Unavailable</span></div>
        <p class="muted">The Google Health connector isn't included in this copy of Cadence. You can still import files from Cadence Sync below.</p>
      </div>`;
    }
    if (!c.clientId || g.editing) {
      const steps = SETUP_STEPS.map(([t, b], k) => `<li><div><b>${esc(t)}</b><span>${esc(b)}</span></div></li>`).join("");
      return `<div class="card gh gh-hero">
        <div class="card-head"><h2>Connect Google Health</h2><span class="pill chip warn">Set up</span></div>
        <p class="muted">Sync heart rate, sleep, steps and workouts straight from your Google account. You need a free Google Cloud Client ID first. It takes about ten minutes, once.</p>
        <form data-submit="gh:setup" class="stack" autocomplete="off">
          <label class="field"><span>Google Client ID</span><input name="clientId" required spellcheck="false" autocomplete="off" placeholder="1234-abc.apps.googleusercontent.com" value="${esc(c.clientId)}"></label>
          <label class="field"><span>Proxy URL (optional)</span><input name="proxyUrl" type="url" spellcheck="false" autocomplete="off" placeholder="https://… (leave empty if unsure)" value="${esc(c.proxyUrl)}"></label>
          <div class="btn-row"><button class="btn primary" type="submit">Save</button>${g.editing && c.clientId ? `<button class="btn ghost" type="button" data-action="gh:edit-cancel">Cancel</button>` : ""}</div>
        </form>
        ${msg}
        <div class="acc"><details><summary>How to get a Client ID</summary><div class="acc-b"><ol class="steps">${steps}</ol><p class="note">Full steps, with the exact scopes, are in GOOGLE-SETUP.md next to this site's README. The proxy is only needed if your browser blocks direct calls to Google Health.</p></div></details></div>
      </div>`;
    }
    const busy = g.busy;
    const last = c.lastSync ? new Date(c.lastSync) : null;
    const lastTxt = last && !isNaN(last) ? `${App.fmt.day(last)}, ${App.fmt.clock(last)}` : "Never";
    const prog = busy === "sync"
      ? `<div class="gh-prog" role="progressbar" aria-label="Sync progress"><div class="bar-track ${g.progress && g.progress.frac == null ? "indet" : ""}"><div class="bar-fill" id="gh-bar" style="width:${g.progress && g.progress.frac != null ? Math.round(g.progress.frac * 100) : 35}%;--c:var(--accent)"></div></div><div class="small muted" id="gh-plabel">${esc((g.progress && g.progress.label) || "Working…")}</div></div>`
      : "";
    const range = !c.lastSync && g.connected
      ? `<div class="gh-range"><span class="small muted">First sync goes back</span><div class="seg" role="group" aria-label="How far back">${[30, 90, 180].map((n) => `<button type="button" data-action="gh:range" data-n="${n}" class="${+c.firstDays === n ? "on" : ""}" aria-pressed="${+c.firstDays === n}">${n} days</button>`).join("")}</div></div>`
      : "";
    const sources = c.sources && c.sources.length
      ? `<div class="gh-src"><span class="small muted">Sources</span>${c.sources.map((x) => `<span class="chip neutral">${esc(typeof x === "string" ? x : x && (x.name || x.label || x.id) || "")}</span>`).join("")}</div>`
      : "";
    const warns = c.warnings && c.warnings.length
      ? `<details class="gh-warn"><summary>${c.warnings.length} note${c.warnings.length === 1 ? "" : "s"} from the last sync</summary><ul>${c.warnings.map((w) => `<li>${esc(typeof w === "string" ? w : (w && (w.message || w.text)) || "")}</li>`).join("")}</ul></details>`
      : "";
    const buttons = g.connected
      ? `<button class="btn primary gh-big" type="button" data-action="gh:sync"${busy ? " disabled" : ""}>${busy === "sync" ? "Syncing…" : "Sync now"}</button>
         <button class="btn ghost" type="button" data-action="gh:disconnect"${busy ? " disabled" : ""}>Disconnect</button>`
      : `<button class="btn primary gh-big" type="button" data-action="gh:connect"${busy ? " disabled" : ""}>${busy === "connect" ? "Connecting…" : c.lastSync ? "Connect again" : "Connect Google Health"}</button>`;
    const stTxt = busy === "sync" ? "Syncing" : busy === "connect" ? "Connecting" : g.connected ? "Connected" : "Not connected";
    const stCls = busy ? "busy" : g.connected ? "on" : "off";
    return `<div class="card gh gh-hero">
      <div class="gh-top">
        <div class="gh-id"><span class="gh-dot gh-${stCls}" aria-hidden="true"></span><div><div class="stat-label">Google Health</div><div class="gh-state">${stTxt}</div></div></div>
        <div class="gh-last"><div class="stat-label">Last sync</div><div class="gh-last-v num">${esc(lastTxt)}</div>${c.lastSync ? `<div class="small muted num">${App.fmt.num(c.lastCount || 0)} days updated</div>` : ""}</div>
      </div>
      <p class="muted">${g.connected
        ? c.lastSync ? "Sync now fetches everything since your last sync, plus the two days before it to catch late data." : "Connected. Choose how much history to bring in, then sync."
        : "Sign in with Google to let Cadence read your health data. Google shows exactly what's shared."}</p>
      ${range}
      <div class="btn-row gh-actions">${buttons}</div>
      ${prog}
      ${msg}
      ${sources}
      ${warns}
      ${g.connected ? `<label class="gh-auto"><input type="checkbox" data-input="gh:auto"${c.autoSync ? " checked" : ""}> <span>Sync automatically when I open or refresh Cadence<br><span class="small muted">Only while Google still has you signed in. If Google's sign-in has expired, Cadence shows a one-tap Sync bar.</span></span></label>` : ""}
      <p class="note">Your Client ID${c.proxyUrl ? " and proxy URL are" : " is"} saved in this browser. Health data goes from Google to this browser only. <button class="linkish" type="button" data-action="gh:edit">Change settings</button></p>
    </div>`;
  }

  /* website: configure, then optionally sync on open (no pop-ups; only with a live sign-in) */
  function gStartup() {
    if (!isWeb()) return;
    let tries = 0;
    const tick = async () => {
      if (!(App.storageReady && App.storageReady())) {
        if (tries++ < 100) setTimeout(tick, 100);
        return;
      }
      if (!GH() || !g.cfg.clientId) return;
      gConfigure();
      await gRefresh(); // auto-sync on load/refresh/focus is driven by src/autosync.js via App.ghSync
    };
    setTimeout(tick, 0);
  }

  Views.data = {
    label: "Data",
    icon: "data",
    dated: false,
    css: `
.gh .btn-row{flex-wrap:wrap}
.gh-hero{border-radius:20px;padding:20px}
.gh-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px}
.gh-id{display:flex;align-items:center;gap:12px}
.gh-state{font-family:var(--f-display);font-weight:900;font-stretch:72%;font-size:28px;line-height:1.05}
.gh-dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--muted)}
.gh-on{background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 16%,transparent),0 0 14px var(--green-glow,var(--green))}
.gh-busy{background:var(--strain);box-shadow:0 0 14px var(--strain-glow,var(--strain))}
.gh-off{background:var(--faint,var(--muted))}
.gh-last{text-align:right}
.gh-last-v{font-weight:600;font-size:15px}
.gh-actions{align-items:center}
.gh-big{min-height:52px;padding:0 28px;font-size:16px;font-weight:700;border-radius:999px;flex:1 1 200px;max-width:340px}
.dt-range{font-size:18px;line-height:1.6}
@media (max-width:560px){.gh-last{text-align:left}.gh-big{max-width:none}}
.gh-range{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.gh-prog{display:flex;flex-direction:column;gap:6px}
.gh-prog .bar-track.indet .bar-fill{animation:gh-ind 1.2s ease-in-out infinite alternate}
@keyframes gh-ind{from{margin-left:0}to{margin-left:65%}}
@media (prefers-reduced-motion: reduce){.gh-prog .bar-track.indet .bar-fill{animation:none}}
.gh-src{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.gh-warn summary{cursor:pointer;color:var(--muted)}
.gh-warn ul{margin:.4em 0 0;padding-left:1.2em}
.gh-auto{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.4}
.gh-auto input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}`,
    render(ctx) {
      checkDownloads();
      const ds = ctx.days.filter((d) => Object.keys(d).some((k) => k !== "date" && k !== "entry")).length;
      const mine = App.mode() === "mine";
      const dpHero = `<section class="hero pb-hero">
          <div class="pb-hero-text"><div class="pb-eyebrow">${mine ? "Your data" : "Sample data"}</div><h1 class="pb-title">Data</h1><p class="pb-sum">Where your numbers come from and where they're kept.</p></div>
          <div class="pb-fig"><div class="pb-num num"><span class="pb-count" data-count="${ds}" data-dp="0">${App.fmt.num(ds)}</span></div><div class="pb-num-l">days stored</div></div>
        </section>`;
      return `<div class="page">
        ${dpHero}
        <div class="grid-2">
          <div class="stack">${isWeb() ? googleCard() : ""}${sourceCard(ctx)}${importCard()}${backupCard()}</div>
          <div class="stack">${phoneCard()}${profileCard(ctx)}</div>
        </div>
        ${methodsCard(ctx)}
        <p class="note">Scores in Cadence are estimates for personal insight, not medical advice.</p>
      </div>`;
    },
    after(root) {
      const drop = root.querySelector("#data-drop");
      if (!drop) return;
      const stop = (e) => {
        e.preventDefault();
        e.stopPropagation();
      };
      ["dragenter", "dragover"].forEach((t) =>
        drop.addEventListener(t, (e) => {
          stop(e);
          drop.classList.add("over");
        }),
      );
      ["dragleave", "dragend"].forEach((t) => drop.addEventListener(t, () => drop.classList.remove("over")));
      drop.addEventListener("drop", (e) => {
        stop(e);
        drop.classList.remove("over");
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        handleFile(f);
      });
    },
  };
  gStartup();
})();
</script>
<script>/*
 * Cadence — Google Health API connector (browser side).
 *
 * Reads the user's own data from the Google Health API (health.googleapis.com, v4)
 * and turns it into Cadence day records ("cadence.v2", see engine.js).
 *
 *   GoogleHealth.configure({ clientId, proxyUrl })
 *   await GoogleHealth.connect()            // Google Identity Services token popup
 *   const r = await GoogleHealth.sync({ days: 90, onProgress })
 *   // r = { days, sources, warnings }; feed {format:"cadence.v2", days} to CadenceEngine.parseImport
 *
 * Token persistence (v4): the short-lived access token (~1 h), its expiry, the granted scopes and the
 * account email are kept in this browser's localStorage under "cadence.gh.token" so a page refresh
 * within the token's lifetime syncs with no prompt. The record is dropped when it expires, on
 * disconnect()/revoke, on any 401 from Google, and when the Client ID changes. The account email
 * (for GIS login_hint) is kept under "cadence.gh.account" until disconnect().
 *   GoogleHealth.tokenStatus()   → { valid, expiresInSec }
 *   await GoogleHealth.silentRefresh() → { ok:true } | { ok:false, needsTap:true, reason }
 *     (prompt "" + login_hint; browsers block pop-ups not started by a tap, so this usually
 *      needs a tap when the token has expired — reason "popup_failed_to_open" | "popup_closed" | "timeout")
 * Scopes: the three Google Health read-only scopes plus "openid email" (only to learn which account
 * to hint on the next sign-in; no profile data is stored besides the email address).
 *
 * Pure mapping: GoogleHealth.mapResponses(raw, tz) — raw is keyed by data type id
 * (list endpoints → array of dataPoints) plus raw.rollups keyed by data type id
 * (dailyRollUp → array of rollupDataPoints) plus raw.steps5 (rollUp of steps in 300 s windows
 * → array of rollupDataPoints {startTime, endTime, steps:{countSum}}). Exported for tests.
 *
 * Intraday steps (v3 "steps5"): primary source is
 *   POST /v4/users/me/dataTypes/steps/dataPoints:rollUp {range:{startTime,endTime}, windowSize:"300s"}
 * (Google merges overlapping sources; an unset value means the device was not worn).
 * If that call is rejected, we fall back to listing raw "steps" interval points
 * (filter steps.interval.start_time) and spread each interval's count over the 5-min buckets it
 * covers, using one source per day (the one with the most steps) to avoid phone + watch double counts.
 *
 * API reference: https://developers.google.com/health/reference/rest/v4/users.dataTypes.dataPoints
 */
(function (root) {
  "use strict";

  const API_HOST = "https://health.googleapis.com";
  const GIS_SRC = "https://accounts.google.com/gsi/client";
  const SCOPES = [
    "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly",
    "https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly",
    "https://www.googleapis.com/auth/googlehealth.sleep.readonly",
  ];
  // identity scopes: only used to read the account email for login_hint (silent re-sign-in)
  const ID_SCOPES = ["openid", "email"];
  const USERINFO_URL = "https://www.googleapis.com/oauth2/v3/userinfo";
  const TOKEN_KEY = "cadence.gh.token";
  const ACCOUNT_KEY = "cadence.gh.account";
  const SILENT_TIMEOUT_MS = 8000;

  /* ------------------------------------------------------------------
   * What we fetch.
   *   list:   GET  /v4/users/me/dataTypes/{id}/dataPoints?filter=…&pageSize=…&pageToken=…
   *   rollup: POST /v4/users/me/dataTypes/{id}/dataPoints:dailyRollUp  {range, windowSizeDays:1}
   * kind decides the filter field (AIP-160):
   *   sample   → {snake}.sample_time.physical_time   (RFC 3339 UTC)
   *   session  → exercise.interval.civil_start_time   (civil, no zone)
   *   sleep    → sleep.interval.end_time              (RFC 3339 UTC)
   *   daily    → {snake}.date                         ("YYYY-MM-DD")
   * ------------------------------------------------------------------ */
  const LIST_TYPES = [
    { id: "sleep", kind: "sleep", pageSize: 25, chunkDays: 30 },
    { id: "exercise", kind: "session", pageSize: 25, chunkDays: 30 },
    { id: "heart-rate", kind: "sample", pageSize: 10000, chunkDays: 3 },
    { id: "daily-resting-heart-rate", kind: "daily", pageSize: 1000, chunkDays: 90 },
    { id: "daily-heart-rate-variability", kind: "daily", pageSize: 1000, chunkDays: 90 },
    { id: "heart-rate-variability", kind: "sample", pageSize: 10000, chunkDays: 30, optional: true },
    { id: "daily-oxygen-saturation", kind: "daily", pageSize: 1000, chunkDays: 90 },
    { id: "oxygen-saturation", kind: "sample", pageSize: 10000, chunkDays: 14, optional: true },
    { id: "daily-respiratory-rate", kind: "daily", pageSize: 1000, chunkDays: 90 },
    { id: "respiratory-rate-sleep-summary", kind: "sample", pageSize: 1000, chunkDays: 90, optional: true },
    { id: "daily-sleep-temperature-derivations", kind: "daily", pageSize: 1000, chunkDays: 90 },
    { id: "weight", kind: "sample", pageSize: 1000, chunkDays: 90 },
    { id: "body-fat", kind: "sample", pageSize: 1000, chunkDays: 90 },
  ];
  // floors and total-calories have no list method; daily totals are best taken from dailyRollUp
  // (Google de-duplicates overlapping sources there). total-calories max range is 14 days.
  const ROLLUP_TYPES = [
    { id: "steps", chunkDays: 90 },
    { id: "distance", chunkDays: 90 },
    { id: "floors", chunkDays: 90 },
    { id: "active-energy-burned", chunkDays: 90 },
    { id: "total-calories", chunkDays: 14 },
  ];
  // intraday steps: rollUp in 5-minute windows (14 days = 4,032 windows per call; API max range 90 days)

  const pad = (n) => String(n).padStart(2, "0");

  /* ---------- field readers (tolerant of small schema differences) ---------- */

  const payload = (dp, typeId) => (dp && (dp[camel(typeId)] || dp[typeId])) || null;
  // instant (ms) for a sample-type payload, or interval start

  function sourceName(dp) {

  }

  // respiratory-rate-sleep-summary: breaths/min sits in a per-stage statistics object

  function respSummaryBpm(p) {

    const blocks = Object.entries(p).filter(([, v]) => v && typeof v === "object" && num(v.breathsPerMinute) !== undefined);
    const full = blocks.find(([k]) => /full|overall|total|all/i.test(k)) || blocks.find(([k]) => !/deep|light|rem/i.test(k)) || blocks[0];

  const HIST_START = 30, HIST_BIN = 5, HIST_N = 38; // 30–219 bpm, same buckets as the engine
  const GAP_CAP = 5 * MIN;

  const STAGE_MAP = { AWAKE: "awake", RESTLESS: "awake", LIGHT: "light", ASLEEP: "light", DEEP: "deep", REM: "rem" };

  /* ==================================================================
   * mapResponses(raw, tz) → { days, warnings, counts }
   * ================================================================== */
  function mapResponses(raw, tz, opts) {
    tz = tz || defaultTz();
    opts = opts || {};
    raw = raw || {};
    const warnings = [];
    const days = new Map(); // date → day
    const day = (date) => {
      if (!days.has(date)) days.set(date, { date });
      return days.get(date);
    };
    const inWindow = (date) => (!opts.start || date >= opts.start) && (!opts.end || date <= opts.end);
    const list = (id) => (Array.isArray(raw[id]) ? raw[id] : []);

    /* ---- heart rate samples (deduped by instant, sorted) ---- */
    const hrMap = new Map();
    for (const dp of list("heart-rate")) {
      const p = payload(dp, "heart-rate");
      const t = sampleMs(p);
      const bpm = num(p && p.beatsPerMinute);

    }
    const hr = [...hrMap.entries()].sort((a, b) => a[0] - b[0]); // [ms, bpm]
    // weight of each sample = time to next sample, capped at 5 min (last sample: 1 min)
    const hrW = hr.map((s, i) => (i + 1 < hr.length ? Math.min(hr[i + 1][0] - s[0], GAP_CAP) : MIN));

    const histAdd = (counts, bpm, minutes) => {
      const k = Math.max(0, Math.min(HIST_N - 1, Math.floor((bpm - HIST_START) / HIST_BIN)));

    };
    const histOut = (counts) => {
      let n = counts.length;

      const tot = c.reduce((s, x) => s + x, 0);

    };

    {
      const perDay = new Map(); // date → {counts, bins: Map(binStart → [bpm])}
      for (let i = 0; i < hr.length; i++) {
        const [t, bpm] = hr[i];
        const li = localInfo(t, tz);
        if (!inWindow(li.date)) continue;
        let pd = perDay.get(li.date);

        const w = Math.min(hrW[i] / MIN, Math.max(0, 1440 - li.min)); // do not spill past midnight

        else hi = mid;
      }

        const w = Math.min(hrW[i], b - hr[i][0]) / MIN;

    const sleeps = [];

      if (!p || !p.interval) continue;

      if (kcal !== undefined && kcal >= 0) w.kcal = Math.round(kcal);

    nightly(
      "hrv",
      samples("heart-rate-variability", (p) => pick(p, ["rootMeanSquareOfSuccessiveDifferencesMilliseconds"], /^(rootMeanSquare|rmssd).*millis/i)),
      dailyVal("daily-heart-rate-variability", (p) => pick(p, ["averageHeartRateVariabilityMilliseconds"], /^average.*Millis/i)),
      3, 400, r1
    );
    // SpO2 (%)
    nightly(
      "spo2",
      samples("oxygen-saturation", (p) => pick(p, ["percentage"])),
      dailyVal("daily-oxygen-saturation", (p) => pick(p, ["averagePercentage"])),
      70, 100, r1
    );
    // respiratory rate (breaths/min)
    nightly(
      "respRate",
      samples("respiratory-rate-sleep-summary", respSummaryBpm),
      dailyVal("daily-respiratory-rate", (p) => pick(p, ["breathsPerMinute"])),
      4, 40, r1
    );
    // skin temperature deviation from personal baseline (°C)
    nightly(
      "skinTempDev",
      [],
      dailyVal("daily-sleep-temperature-derivations", (p) => {
        // nightlyTemperatureCelsius = mean skin temp during sleep; baselineTemperatureCelsius = 30-day median.
        // (relativeNightlyStddev30dCelsius is a spread, not a deviation — not used.)
        const night = pick(p, ["nightlyTemperatureCelsius"]);
        const base = pick(p, ["baselineTemperatureCelsius"]);

      }),
      -5, 5, r2
    );

    for (const [t, g] of samples("weight", (p) => pick(p, ["weightGrams"]))) {
      const date = localInfo(t, tz).date;
      if (inWindow(date) && g / 1000 >= 20 && g / 1000 <= 400) day(date).weightKg = r1(g / 1000);
    }
    for (const [t, v] of samples("body-fat", (p) => pick(p, ["percentage"]))) {

      if (inWindow(date) && v >= 2 && v <= 70) day(date).bodyFatPct = r1(v);

    const ru = raw.rollups || {};
    const rollRead = {
      steps: ["steps", (v) => num(v.countSum), (x) => Math.round(x), 0, 200000],

      floors: ["floors", (v) => num(v.countSum), (x) => Math.round(x), 0, 2000],
      "active-energy-burned": ["activeKcal", (v) => num(v.kcalSum), (x) => Math.round(x), 0, 15000],
      "total-calories": ["totalKcal", (v) => num(v.kcalSum), (x) => Math.round(x), 0, 20000],
    };
    for (const [id, [field, read, round, lo, hi]] of Object.entries(rollRead)) {
      for (const rp of Array.isArray(ru[id]) ? ru[id] : []) {
        const date = rp && rp.civilStartTime && ymdOfDate(rp.civilStartTime.date);
        const v = rp && rp[camel(id)];
        if (!date || !v || !inWindow(date)) continue;
        const x = read(v);
        if (x === undefined || !isNum(x) || x < lo || x > hi) continue;
        if (x === 0 && field !== "steps") continue;
        if (x === 0 && !days.has(date)) continue; // a zero-step day with nothing else is "no data"
        day(date)[field] = round(x);
      }
    }

    /* ---- intraday steps → steps5 ---- */
    {
      const b5 = new Map(); // date → Map(minute → steps)
      const add = (date, m, v) => {
        if (!inWindow(date)) return;
        if (!b5.has(date)) b5.set(date, new Map());
        const mm = b5.get(date);
        mm.set(m, (mm.get(m) || 0) + v);
      };
      const rolled = Array.isArray(raw.steps5) ? raw.steps5 : [];
      const seenW = new Set();
      for (const rp of rolled) {
        const a = tms(rp && rp.startTime);
        const v = rp && rp.steps ? num(rp.steps.countSum) : undefined;
        if (!isNum(a) || v === undefined || v < 0 || v > 100000 || seenW.has(a)) continue; // unset = not worn
        seenW.add(a);
        const li = localInfo(a, tz);
        add(li.date, Math.floor(li.min / 5) * 5, v);
      }
      const rolledDates = new Set(b5.keys());

          const p = payload(dp, "steps");

          const a = tms(iv && iv.startTime), b = tms(iv && iv.endTime);

          const srcN = sourceName(dp) || "?";
          const key = `${srcN}|${a}|${b}`;

          seenI.add(key);

      .sort((a, b) => (a.date < b.date ? -1 : 1));

    for (const k of Object.keys(raw)) if (Array.isArray(raw[k])) counts[k] = raw[k].length;

  // intraday rollUp: 5-minute windows from local midnight of startYmd, ending at endYmd's midnight or now

  async function pool(tasks, n) {

      }
    };
    await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, run));
  }

  /**
   * sync({ days = 90, since: "YYYY-MM-DD", onProgress(info), tz })
   * → { days, sources: [{type, points, status, message?}], warnings }
   */
  async function sync(opts) {
    opts = opts || {};
    const tz = opts.tz || defaultTz();
    if (!isConnected()) await connect();
    const today = localInfo(Date.now(), tz).date;
    const nDays = Math.max(1, Math.min(365, Math.round(opts.days || 90)));
    let start = typeof opts.since === "string" && /^\d{4}-\d{2}-\d{2}$/.test(opts.since) ? opts.since : addDays(today, -(nDays - 1));
    if (start > today) start = today;
    const endExcl = addDays(today, 1);
    // fetch one extra day back so a night that started the evening before is complete
    const fetchStart = addDays(start, -1);

    const raw = { rollups: {} };
    const sources = [];
    const warnings = [];
    const tasks = [];
    const plan = [];
    for (const t of LIST_TYPES) for (const [a, b] of chunks(fetchStart, endExcl, t.chunkDays)) plan.push({ kind: "list", t, a, b });
    for (const t of ROLLUP_TYPES) for (const [a, b] of chunks(start, endExcl, t.chunkDays)) plan.push({ kind: "rollup", t, a, b });
    for (const [a, b] of chunks(start, endExcl, STEPS5.chunkDays)) plan.push({ kind: "rollup5", t: STEPS5, a, b });
    const status = new Map(); // id → {type, points, status, message}
    const failed = new Set();
    let done = 0;
    const report = (label) => {
      if (typeof opts.onProgress === "function") {
        try {
          opts.onProgress({ done, total: plan.length, fraction: done / plan.length, label });
        } catch (e) {}
      }
    };
    report("Starting");
    let fatal = null;
    let stepsListMode = false; // set when the 5-minute rollUp is rejected; later chunks then use list
    for (const job of plan) {
      tasks.push(async () => {
        if (fatal || failed.has(job.t.key || job.t.id)) {
          done++;
          return;
        }
        const id = job.t.id;
        const sk = job.t.key || id;
        const st = status.get(sk) || { type: sk, points: 0, status: "ok" };
        status.set(sk, st);
        try {
          if (job.kind === "rollup5") {
            let pts = null;
            if (!stepsListMode) {
              try {
                pts = await rollup5Chunk(job.t, job.a, job.b, tz);
                (raw.steps5 || (raw.steps5 = [])).push(...pts);
              } catch (e) {
                if (!["bad_request", "not_found"].includes(e.code)) throw e;
                stepsListMode = true; // rollUp rejected: use raw interval points from here on
              }
            }
            if (pts === null) {
              pts = [];
              for (const [a, b] of chunks(job.a, job.b, STEPS_LIST.chunkDays)) pts.push(...(await listChunk(STEPS_LIST, a, b, tz)));
              (raw.steps || (raw.steps = [])).push(...pts);
            }
            st.points += pts.length;
          } else {
            const pts = job.kind === "list" ? await listChunk(job.t, job.a, job.b, tz) : await rollupChunk(id, job.a, job.b);
            if (job.kind === "list") (raw[id] || (raw[id] = [])).push(...pts);
            else (raw.rollups[id] || (raw.rollups[id] = [])).push(...pts);
            st.points += pts.length;
          }
        } catch (e) {
          if (["auth", "cors", "not_enabled", "network", "rate_limited"].includes(e.code)) {
            fatal = fatal || e;
          } else {
            failed.add(job.kind === "rollup5" ? sk : id);
            st.status = "error";
            st.message = e.message;
            if (!job.t.optional) warnings.push(`${label(id)}: ${e.message}`);
            else if (job.kind === "rollup5") warnings.push(`${label(sk)}: not available (${e.message}). Daytime stress needs 5-minute steps.`);
          }
        }
        done++;
        report(label(id));
      });
    }
    await pool(tasks, 2);
    if (fatal) throw fatal;

    const mapped = mapResponses(raw, tz, { start, end: today });
    for (const st of status.values()) sources.push(st);
    return { days: mapped.days, sources, warnings: warnings.concat(mapped.warnings), range: { start, end: today, tz } };
  }

  const LABELS = {
    "heart-rate": "Heart rate", sleep: "Sleep", exercise: "Workouts", steps: "Steps", distance: "Distance", floors: "Floors",
    "active-energy-burned": "Active calories", "total-calories": "Total calories", "daily-resting-heart-rate": "Resting heart rate",
    "daily-heart-rate-variability": "HRV", "heart-rate-variability": "HRV (detail)", "daily-oxygen-saturation": "Blood oxygen",
    "oxygen-saturation": "Blood oxygen (detail)", "daily-respiratory-rate": "Breathing rate", "respiratory-rate-sleep-summary": "Breathing rate (detail)",
    "daily-sleep-temperature-derivations": "Skin temperature", weight: "Weight", "body-fat": "Body fat", steps5: "Steps (5-min)",
  };
  const label = (id) => LABELS[id] || id;

  // Ready-to-import payload for CadenceEngine.parseImport(JSON.stringify(...))
  const toImport = (result) => ({ format: "cadence.v2", source: "Google Health API", exportedAt: new Date().toISOString(), days: (result && result.days) || [] });

  const api = {
    configure, connect, isConnected, disconnect, sync, mapResponses, toImport,
    silentRefresh, tokenStatus,
    scopes: SCOPES.slice(), identityScopes: ID_SCOPES.slice(), LIST_TYPES, ROLLUP_TYPES,
    _internal: { filterFor, midnightMs, localInfo, localIso, chunks, request, state, restoreToken, clearToken, TOKEN_KEY, ACCOUNT_KEY },
  };
  restoreToken(); // a refresh within the token's lifetime needs no sign-in
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  if (root) root.GoogleHealth = api;
})(typeof window !== "undefined" ? window : globalThis);

/*
 * Cadence — sync Google Health automatically when the site opens or comes back into view.
 *
 *   CadenceAutoSync.start()   // once, after App boot (also starts itself on window "load"; idempotent)
 *
 * Needs from views-data.js: App.ghSync(silent:boolean) → Promise, App.ghConfig() → cfg
 *   (cfg.clientId, cfg.proxyUrl, cfg.lastSync ISO string, cfg.lastCount, cfg.autoSync).
 * Needs from google-health.js: tokenStatus(), silentRefresh(), connect(), configure().
 *
 * Flow on open: not set up / never synced / auto-sync off → nothing.
 *   token still valid (restored from this browser) → sync, no prompt.
 *   expired → silentRefresh(); ok → sync; needs a tap → slim banner whose button signs in + syncs.
 * Re-sync when the tab becomes visible again and the last sync is older than 15 min.
 * Never more than one sync in flight; automatic syncs at most once per 5 min (a tap is never throttled).
 */
(function (root) {
  "use strict";

  const AUTO_GAP_MS = 5 * 60 * 1000;
  const STALE_MS = 15 * 60 * 1000;
  const WAIT_APP_MS = 10 * 1000;
  const POLL_MS = 200;
  const BANNER_ID = "cad-autosync-banner";

  function create(env) {
    env = env || {};
    const win = env.window || root;
    const doc = env.document || (typeof document !== "undefined" ? document : null);
    const now = env.now || (() => Date.now());
    const setT = env.setTimeout || ((f, ms) => setTimeout(f, ms));
    const App = () => env.App || win.App || null;
    const GH = () => env.GoogleHealth || win.GoogleHealth || null;

    const s = {
      started: false,
      ready: false,
      inFlight: null, // Promise of the running sync
      lastAutoAt: -Infinity, // when the last automatic attempt started
      dismissed: false, // banner dismissed for this page view
      tapping: false,
      log: [], // short trail for tests / debugging
    };
    const note = (x) => {
      s.log.push(x);
      if (s.log.length > 50) s.log.shift();
    };

    const toast = (t) => {
      const a = App();
      try {
        if (a && typeof a.toast === "function") a.toast(t);
      } catch (e) {}
    };
    const cfg = () => {
      const a = App();
      try {
        return (a && typeof a.ghConfig === "function" && a.ghConfig()) || null;
      } catch (e) {
        return null;
      }
    };
    const lastSyncMs = (c) => {
      const t = c && c.lastSync ? Date.parse(c.lastSync) : NaN;
      return isFinite(t) ? t : null;
    };
    // configured and synced before (the first sync stays manual so the user picks the range)
    const eligible = (c) => !!(c && c.clientId && c.autoSync !== false && lastSyncMs(c) !== null);

    function configureGH(c) {
      const gh = GH();
      if (!gh || !c) return false;
      try {
        const cur = gh._internal && gh._internal.state;
        if (!cur || cur.clientId !== c.clientId || (typeof c.proxyUrl === "string" && cur.proxyUrl !== c.proxyUrl.trim().replace(/\/+$/, ""))) {
          gh.configure({ clientId: c.clientId, proxyUrl: typeof c.proxyUrl === "string" ? c.proxyUrl : undefined });
        }
        return true;
      } catch (e) {
        return false;
      }
    }
    const tokenValid = () => {
      const gh = GH();
      try {
        return !!(gh && typeof gh.tokenStatus === "function" ? gh.tokenStatus().valid : gh && gh.isConnected && gh.isConnected());
      } catch (e) {
        return false;
      }
    };

    /* ---------- banner (own DOM, inline styles) ---------- */
    function hideBanner() {
      if (!doc) return;
      const b = doc.getElementById(BANNER_ID);
      if (b && b.parentNode) b.parentNode.removeChild(b);
    }
    function showBanner() {
      if (!doc || !doc.body || s.dismissed || doc.getElementById(BANNER_ID)) return;
      const b = doc.createElement("div");
      b.id = BANNER_ID;
      b.setAttribute("role", "status");
      b.style.cssText = [
        "position:fixed", "top:0", "left:0", "right:0", "z-index:9999",
        "display:flex", "align-items:center", "justify-content:center", "gap:8px",
        "padding:calc(6px + env(safe-area-inset-top, 0px)) 12px 6px",
        "background:var(--surface, #ffffff)", "color:var(--ink, #111111)",
        "border-bottom:2px solid var(--strain, #2f6fed)", "box-shadow:0 2px 10px rgba(0,0,0,.12)",
        "font:500 14px/1.3 system-ui, -apple-system, sans-serif",
      ].join(";");
      const go = doc.createElement("button");
      go.type = "button";
      go.setAttribute("data-autosync", "tap");
      go.textContent = "Tap to sync your latest Fitbit data";
      go.style.cssText = "flex:0 1 auto;min-height:36px;padding:6px 14px;border:0;border-radius:999px;cursor:pointer;background:var(--strain, #2f6fed);color:var(--surface, #ffffff);font:inherit;font-weight:600";
      const x = doc.createElement("button");
      x.type = "button";
      x.setAttribute("data-autosync", "dismiss");
      x.setAttribute("aria-label", "Dismiss");
      x.textContent = "×";
      x.style.cssText = "flex:0 0 auto;width:36px;height:36px;border:0;border-radius:999px;cursor:pointer;background:transparent;color:var(--ink, #111111);font:400 22px/1 system-ui, sans-serif";
      go.addEventListener("click", onTap);
      x.addEventListener("click", () => {
        s.dismissed = true;
        hideBanner();
        note("dismissed");
      });
      b.appendChild(go);
      b.appendChild(x);
      doc.body.appendChild(b);
      note("banner");
    }

    /* ---------- sync ---------- */
    function doSync(reason) {
      if (s.inFlight) return s.inFlight;
      const a = App();
      if (!a || typeof a.ghSync !== "function") return Promise.resolve({ ok: false, reason: "no_app" });
      const before = cfg();
      const beforeAt = lastSyncMs(before);
      note("sync:" + reason);
      s.inFlight = (async () => {
        let res;
        try {
          res = await a.ghSync(true);
        } catch (e) {
          res = { error: e };
        }
        const after = cfg();
        const afterAt = lastSyncMs(after);
        const ok = !(res && res.error) && afterAt !== null && afterAt !== beforeAt;
        if (ok) {
          let n = typeof res === "number" ? res : res && typeof res.count === "number" ? res.count : res && typeof res.n === "number" ? res.n : after && after.lastCount;
          n = Math.max(0, Math.round(Number(n) || 0));
          toast(n ? `Synced ${n} new day${n === 1 ? "" : "s"}` : "Fitbit data up to date");
          hideBanner();
          note("synced:" + n);
          return { ok: true, n };
        }
        note("sync-failed");
        // the token died mid-sync (401) → ask for a tap instead of failing silently
        if (!tokenValid() && reason !== "tap") showBanner();
        return { ok: false, reason: "sync_failed" };
      })();
      const p = s.inFlight;
      p.then(() => {
        if (s.inFlight === p) s.inFlight = null;
      });
      return p;
    }

    async function run(reason) {
      if (s.inFlight) {
        note("skip:in-flight");
        return { ok: false, reason: "in_flight" };
      }
      const c = cfg();
      if (!eligible(c)) {
        note("skip:not-eligible");
        return { ok: false, reason: "not_eligible" };
      }
      if (now() - s.lastAutoAt < AUTO_GAP_MS) {
        note("skip:throttled");
        return { ok: false, reason: "throttled" };
      }
      if (!GH() || !configureGH(c)) return { ok: false, reason: "no_connector" };
      s.lastAutoAt = now();
      if (tokenValid()) return doSync(reason);
      // expired: try without a click; browsers usually block it outside a tap
      let r;
      try {
        r = await GH().silentRefresh();
      } catch (e) {
        r = { ok: false, needsTap: true, reason: "error" };
      }
      if (r && r.ok) return doSync(reason + "+silent");
      note("silent-failed:" + (r && r.reason));
      if (r && r.needsTap) showBanner();
      return { ok: false, reason: "needs_tap" };
    }

    // banner button: runs inside the user's tap, so the Google pop-up is allowed
    async function onTap() {
      if (s.tapping) return;
      s.tapping = true;
      hideBanner();
      note("tap");
      const c = cfg();
      const gh = GH();
      try {
        if (!gh || !configureGH(c)) throw new Error("Google Health isn't set up yet.");
        if (!tokenValid()) await gh.connect(); // call starts synchronously in the gesture
        await doSync("tap");
      } catch (e) {
        note("tap-failed");
        toast((e && e.message) || "Couldn't sign in to Google. Try again from Data.");
      } finally {
        s.tapping = false;
      }
    }

    function onVisible() {
      if (!doc || doc.visibilityState !== "visible") return;
      const last = lastSyncMs(cfg());
      if (last !== null && now() - last <= STALE_MS) return;
      run("visible");
    }

    function start() {
      if (s.started) return;
      s.started = true;
      const t0 = now();
      const tick = () => {
        const a = App();
        let storeOk = true;
        try {
          storeOk = !a || typeof a.storageReady !== "function" || !!a.storageReady();
        } catch (e) {}
        if (a && typeof a.ghSync === "function" && typeof a.ghConfig === "function" && GH() && storeOk) {
          s.ready = true;
          if (doc && doc.addEventListener) doc.addEventListener("visibilitychange", onVisible);
          run("open");
          return;
        }
        if (now() - t0 < WAIT_APP_MS) setT(tick, POLL_MS);
        else note("gave-up");
      };
      tick();
    }

    return { start, run, onVisible, onTap, showBanner, hideBanner, _state: s };
  }

  const api = create();
  api.create = create;
  api.AUTO_GAP_MS = AUTO_GAP_MS;
  api.STALE_MS = STALE_MS;
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  if (root) root.CadenceAutoSync = api;
  // website: start by itself once the page has loaded (start() is idempotent, so App may call it too)
  if (typeof document !== "undefined" && root && root.addEventListener && !root.CADENCE_NO_AUTOSYNC) {
    const go = () => setTimeout(() => api.start(), 0);
    if (document.readyState === "complete") go();
    else root.addEventListener("load", go, { once: true });
  }
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>App.boot();</script>
<script>
(function () {
  try {
    var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    if (!("serviceWorker" in navigator) || !(location.protocol === "https:" || local)) return;
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function (e) { console.warn("Cadence: offline cache unavailable", e); });
    });
  } catch (e) {}
})();
</script>
