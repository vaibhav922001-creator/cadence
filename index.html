      <div class="card-head"><h2>Backup and removal</h2></div>
      ${dlBtn ? `<p class="muted">Save a copy of your imported data, log and profile as a .json file.</p>${dlBtn}` : ""}
      ${clear}
    </div>`;
  }

  /* ===================================================== Google Health (website only) */
  const G_LS = "cadence.google";
  const gDefaults = () => ({ clientId: "974274557373-akp5c3i2ml53aivk8skbob3eh72b8ojs.apps.googleusercontent.com", proxyUrl: "", lastSync: null, lastCount: 0, sources: [], warnings: [], autoSync: false, firstDays: 90 });
  function gLoad() {
    try {
      const j = JSON.parse(localStorage.getItem(G_LS) || "null");
      return j && typeof j === "object" ? { ...gDefaults(), ...j } : gDefaults();
    } catch (e) {
      return gDefaults();
    }
  }
  function gSave() {
    try {
      localStorage.setItem(G_LS, JSON.stringify(g.cfg));
      return true;
    } catch (e) {
      return false;
    }
  }
  const g = {
    cfg: gLoad(),
    editing: false,
    connected: false,
    busy: null, // "connect" | "sync" | null
    progress: null, // {frac, label}
    msg: null, // {ok, text}
    configured: false,
  };
  const GH = () => (window.GoogleHealth && typeof window.GoogleHealth.connect === "function" ? window.GoogleHealth : null);

  const G_ERRORS = {
    popup_blocked: "Your browser blocked the Google sign-in window. Allow pop-ups for this site, then try again.",
    popup_closed: "The Google sign-in window was closed before you finished.",
    popup_closed_by_user: "The Google sign-in window was closed before you finished.",
    user_cancelled: "Sign-in was cancelled.",
    cancelled: "Sign-in was cancelled.",
    access_denied: "Google access wasn't allowed. Connect again and allow access to continue.",
    no_client_id: "Add your Google Client ID first.",
    not_configured: "Add your Google Client ID first.",
    invalid_client: "Google didn't accept this Client ID. Check it in Google Cloud, and that this site's address is listed as an authorized JavaScript origin.",
    origin_mismatch: "This site's address isn't an authorized JavaScript origin for your Client ID. Add it in Google Cloud.",
    redirect_uri_mismatch: "This site's address isn't allowed for your Client ID. Add it in Google Cloud.",
    not_connected: "You're not connected to Google Health. Tap Connect.",
    token_expired: "Your Google sign-in has expired. Tap Connect to sign in again.",
    unauthorized: "Your Google sign-in has expired. Tap Connect to sign in again.",
    auth: "Your Google sign-in has expired. Tap Connect to sign in again.",
    insufficient_scope: "Cadence wasn't given access to all the data it needs. Connect again and allow every item.",
    permission_denied: "Google refused access to this data. Check the Google Health API is turned on and you allowed every item.",
    api_disabled: "The Google Health API isn't turned on in your Google Cloud project.",
    not_enabled: "The Google Health API isn't turned on in your Google Cloud project.",
    bad_request: "Google Health didn't accept the request. Try a shorter range.",
    network: "Couldn't reach Google Health. Check your connection.",
    cors: "The browser blocked the request to Google Health. If you set a proxy URL, check it's running.",
    proxy: "Your proxy didn't respond. Check the proxy URL, or clear it.",
    rate_limited: "Google is limiting requests right now. Try again in a few minutes.",
    quota: "Google is limiting requests right now. Try again in a few minutes.",
    gis_load_failed: "Couldn't load Google sign-in. Check your connection or any content blocker.",
    script_load_failed: "Couldn't load Google sign-in. Check your connection or any content blocker.",
  };
  const gErr = (e) => {
    // the connector writes plain messages; the code map covers errors that arrive without one
    const code = e && e.code;
    if (e && typeof e.message === "string" && e.message.trim()) return e.message;
    if (code && G_ERRORS[code]) return G_ERRORS[code];
    return "Something went wrong talking to Google Health.";
  };

  function gConfigure() {
    const gh = GH();
    if (!gh || !g.cfg.clientId) return false;
    try {
      gh.configure({ clientId: g.cfg.clientId, proxyUrl: g.cfg.proxyUrl || undefined });
      g.configured = true;
    } catch (e) {
      g.configured = false;
      g.msg = { ok: false, text: gErr(e) };
    }
    return g.configured;
  }
  async function gRefresh() {
    const gh = GH();
    let c = false;
    try {
      c = gh && g.configured ? !!(await gh.isConnected()) : false;
    } catch (e) {
      c = false;
    }
    if (c !== g.connected) {
      g.connected = c;
      if (App.view() === "data") App.rerender();
    }
    return c;
  }

  function normProgress(p) {
    if (typeof p === "number") return { frac: p > 1 ? p / 100 : p, label: "" };
    if (!p || typeof p !== "object") return null;
    let f = [p.fraction, p.progress, p.pct, p.percent].find((x) => typeof x === "number");
    if (f == null && typeof p.done === "number" && typeof p.total === "number" && p.total > 0) f = p.done / p.total;
    if (typeof f === "number" && f > 1) f = f / 100;
    return { frac: typeof f === "number" ? Math.max(0, Math.min(1, f)) : null, label: String(p.message || p.label || p.step || p.stage || "") };
  }
  function paintProgress() {
    const bar = document.getElementById("gh-bar");
    const lab = document.getElementById("gh-plabel");
    if (!g.progress) return;
    if (bar) {
      const f = g.progress.frac;
      bar.style.width = f == null ? "35%" : Math.round(f * 100) + "%";
      bar.parentElement.classList.toggle("indet", f == null);
    }
    if (lab) lab.textContent = g.progress.label || (g.progress.frac != null ? Math.round(g.progress.frac * 100) + "%" : "Working…");
  }

  const ymdOf = (d) => window.CadenceEngine.ymd(d);
  async function gSync(auto) {
    const gh = GH();
    if (!gh || g.busy) return;
    if (!g.configured && !gConfigure()) return;
    g.busy = "sync";
    g.msg = null;
    g.progress = { frac: null, label: "Starting…" };
    if (!auto || App.view() === "data") App.rerender();
    try {
      let days, since;
      if (g.cfg.lastSync) {
        const last = new Date(g.cfg.lastSync);
        const s = new Date(last.getTime() - 2 * 864e5); // 2-day overlap catches late-arriving data
        since = ymdOf(s);
        days = Math.max(3, Math.min(180, Math.ceil((Date.now() - s.getTime()) / 864e5) + 1));
      } else {
        days = [30, 90, 180].includes(+g.cfg.firstDays) ? +g.cfg.firstDays : 90;
      }
      const res = await gh.sync({
        days,
        since,
        onProgress: (p) => {
          g.progress = normProgress(p) || g.progress;
          paintProgress();
        },
      });
      const E = window.CadenceEngine;
      const raw = (res && Array.isArray(res.days) ? res.days : []);
      const clean = raw.map((d) => (E.cleanDay ? E.cleanDay(d) : d)).filter(Boolean);
      const n = clean.length ? await App.importDays(clean, { merge: true }) : 0;
      g.cfg.lastSync = new Date().toISOString();
      g.cfg.lastCount = n;
      g.cfg.sources = Array.isArray(res && res.sources) ? res.sources.slice(0, 20) : [];
      g.cfg.warnings = Array.isArray(res && res.warnings) ? res.warnings.slice(0, 20) : [];
      gSave();
      g.msg = { ok: true, text: n ? `Synced ${App.fmt.num(n)} day${n === 1 ? "" : "s"} from Google Health.` : "Synced. No new days in that range." };
      if (!auto) App.toast(n ? `Synced ${n} day${n === 1 ? "" : "s"}` : "Up to date");
    } catch (e) {
      g.msg = { ok: false, text: gErr(e) };
      if (e && /^(token_expired|unauthorized|auth|not_connected)$/.test(String(e.code || ""))) await gRefresh();
    }
    g.busy = null;
    g.progress = null;
    App.rerender();
  }

  App.onSubmit("gh:setup", (form, fd) => {
    const id = String(fd.get("clientId") || "").trim();
    const proxy = String(fd.get("proxyUrl") || "").trim();
    if (!/\.apps\.googleusercontent\.com$/.test(id)) {
      g.msg = { ok: false, text: "That doesn't look like a Google OAuth Client ID. It ends in .apps.googleusercontent.com." };
      App.rerender();
      return;
    }
    if (proxy && !/^https:\/\/[^\s]+$/i.test(proxy)) {
      g.msg = { ok: false, text: "The proxy URL must start with https://. Leave it empty if you don't use one." };
      App.rerender();
      return;
    }
    const changed = id !== g.cfg.clientId;
    g.cfg.clientId = id;
    g.cfg.proxyUrl = proxy;
    if (changed) {
      try { GH() && GH().disconnect(); } catch (e) {}
      g.connected = false;
    }
    const ok = gSave();
    g.editing = false;
    g.msg = ok ? { ok: true, text: "Saved in this browser. Now tap Connect." } : { ok: false, text: "This browser won't let Cadence save settings. It will last until you close the page." };
    gConfigure();
    gRefresh();
    App.rerender();
  });
  App.on("gh:edit", () => {
    g.editing = true;
    g.msg = null;
    App.rerender();
  });
  App.on("gh:edit-cancel", () => {
    g.editing = false;
    App.rerender();
  });
  App.on("gh:connect", async () => {
    const gh = GH();
    if (!gh || g.busy) return;
    if (!gConfigure()) return;
    g.busy = "connect";
    g.msg = null;
    App.rerender();
    try {
      await gh.connect(); // runs from the tap, so the sign-in pop-up is allowed
      g.connected = true;
      g.msg = { ok: true, text: g.cfg.lastSync ? "Connected again." : "Connected. Pick how far back to go, then tap Sync now." };
    } catch (e) {
      g.msg = { ok: false, text: gErr(e) };
    }
    g.busy = null;
    await gRefresh();
    App.rerender();
  });
  App.on("gh:sync", () => gSync(false));
  App.on("gh:range", (el) => {
    const n = +el.dataset.n;
    if (![30, 90, 180].includes(n)) return;
    g.cfg.firstDays = n;
    gSave();
    App.rerender();
  });
  App.on("gh:disconnect", async () => {
    const gh = GH();
    try {
      if (gh) await gh.disconnect();
    } catch (e) {}
    g.connected = false;
    g.cfg.autoSync = false;
    gSave();
    g.msg = { ok: true, text: "Disconnected. Data already synced stays in Cadence." };
    App.rerender();
  });
  App.onInput("gh:auto", (el) => {
    g.cfg.autoSync = !!el.checked;
    gSave();
    App.toast(g.cfg.autoSync ? "Cadence will sync when you open it" : "Sync on open turned off");
  });

  const SETUP_STEPS = [
    ["Create a Google Cloud project", "Go to console.cloud.google.com, sign in with the Google account that has your health data, and create a new project (any name)."],
    ["Turn on the Google Health API", "In APIs & Services → Library, search for the Google Health API and enable it."],
    ["Set up the consent screen", "In Google Auth Platform (OAuth consent screen), choose External, fill in the app name and your email, and add the health data scopes listed in GOOGLE-SETUP.md. Add yourself as a test user."],
    ["Create a Client ID", "In Credentials, create an OAuth client ID of type Web application. Under Authorized JavaScript origins add this site's address: " + (typeof location !== "undefined" ? location.origin : "your site address") + "."],
    ["Paste it here", "Copy the Client ID (it ends in .apps.googleusercontent.com) into the field above and save. It stays in this browser."],
  ];

  function googleCard() {
    const gh = GH();
    const c = g.cfg;
    const m = g.msg;
    const msg = m ? `<div class="msg ${m.ok ? "ok" : "bad"}" role="status">${esc(m.text)}</div>` : "";
    if (!gh) {
      return `<div class="card hero gh">
        <div class="card-head"><h2>Google Health</h2><span class="chip neutral">Unavailable</span></div>
        <p class="muted">The Google Health connector isn't included in this copy of Cadence. You can still import files from Cadence Sync below.</p>
      </div>`;
    }
    if (!c.clientId || g.editing) {
      const steps = SETUP_STEPS.map(([t, b], k) => `<li><div><b>${esc(t)}</b><span>${esc(b)}</span></div></li>`).join("");
      return `<div class="card hero gh">
        <div class="card-head"><h2>Connect Google Health</h2><span class="chip warn">Set up</span></div>
        <p class="muted">Sync heart rate, sleep, steps and workouts straight from your Google account. You need a free Google Cloud Client ID first. It takes about ten minutes, once.</p>
        <form data-submit="gh:setup" class="stack" autocomplete="off">
          <label class="field"><span>Google Client ID</span><input name="clientId" required spellcheck="false" autocomplete="off" placeholder="1234-abc.apps.googleusercontent.com" value="${esc(c.clientId)}"></label>
          <label class="field"><span>Proxy URL (optional)</span><input name="proxyUrl" type="url" spellcheck="false" autocomplete="off" placeholder="https://… (leave empty if unsure)" value="${esc(c.proxyUrl)}"></label>
          <div class="btn-row"><button class="btn primary" type="submit">Save</button>${g.editing && c.clientId ? `<button class="btn ghost" type="button" data-action="gh:edit-cancel">Cancel</button>` : ""}</div>
        </form>
        ${msg}
        <div class="acc"><details><summary>How to get a Client ID</summary><div class="acc-b"><ol class="steps">${steps}</ol><p class="note">Full steps, with the exact scopes, are in GOOGLE-SETUP.md next to this site's README. The proxy is only needed if your browser blocks direct calls to Google Health.</p></div></details></div>
      </div>`;
    }
    const busy = g.busy;
    const last = c.lastSync ? new Date(c.lastSync) : null;
    const lastTxt = last && !isNaN(last) ? `${App.fmt.day(last)}, ${App.fmt.clock(last)}` : "Never";
    const prog = busy === "sync"
      ? `<div class="gh-prog" role="progressbar" aria-label="Sync progress"><div class="bar-track ${g.progress && g.progress.frac == null ? "indet" : ""}"><div class="bar-fill" id="gh-bar" style="width:${g.progress && g.progress.frac != null ? Math.round(g.progress.frac * 100) : 35}%;--c:var(--accent)"></div></div><div class="small muted" id="gh-plabel">${esc((g.progress && g.progress.label) || "Working…")}</div></div>`
      : "";
    const range = !c.lastSync && g.connected
      ? `<div class="gh-range"><span class="small muted">First sync goes back</span><div class="seg" role="group" aria-label="How far back">${[30, 90, 180].map((n) => `<button type="button" data-action="gh:range" data-n="${n}" class="${+c.firstDays === n ? "on" : ""}" aria-pressed="${+c.firstDays === n}">${n} days</button>`).join("")}</div></div>`
      : "";
    const sources = c.sources && c.sources.length
      ? `<div class="gh-src"><span class="small muted">Sources</span>${c.sources.map((x) => `<span class="chip neutral">${esc(typeof x === "string" ? x : x && (x.name || x.label || x.id) || "")}</span>`).join("")}</div>`
      : "";
    const warns = c.warnings && c.warnings.length
      ? `<details class="gh-warn"><summary>${c.warnings.length} note${c.warnings.length === 1 ? "" : "s"} from the last sync</summary><ul>${c.warnings.map((w) => `<li>${esc(typeof w === "string" ? w : (w && (w.message || w.text)) || "")}</li>`).join("")}</ul></details>`
      : "";
    const buttons = g.connected
      ? `<button class="btn primary" type="button" data-action="gh:sync"${busy ? " disabled" : ""}>${busy === "sync" ? "Syncing…" : "Sync now"}</button>
         <button class="btn ghost" type="button" data-action="gh:disconnect"${busy ? " disabled" : ""}>Disconnect</button>`
      : `<button class="btn primary" type="button" data-action="gh:connect"${busy ? " disabled" : ""}>${busy === "connect" ? "Connecting…" : c.lastSync ? "Connect again" : "Connect Google Health"}</button>`;
    return `<div class="card hero gh">
      <div class="card-head"><h2>Google Health</h2>${g.connected ? `<span class="chip good">Connected</span>` : `<span class="chip neutral">Not connected</span>`}</div>
      <p class="muted">${g.connected
        ? c.lastSync ? "Sync now fetches everything since your last sync, plus the two days before it to catch late data." : "Connected. Choose how much history to bring in, then sync."
        : "Sign in with Google to let Cadence read your health data. Google shows exactly what's shared."}</p>
      ${range}
      <div class="btn-row">${buttons}</div>
      ${prog}
      ${msg}
      <div class="stats">
        <div class="stat"><div class="stat-label">Last synced</div><div class="stat-value num" style="font-size:16px;line-height:1.6">${esc(lastTxt)}</div>${c.lastSync ? `<div class="stat-sub">${App.fmt.num(c.lastCount || 0)} days updated</div>` : ""}</div>
      </div>
      ${sources}
      ${warns}
      ${g.connected ? `<label class="gh-auto"><input type="checkbox" data-input="gh:auto"${c.autoSync ? " checked" : ""}> <span>Sync when I open Cadence<br><span class="small muted">Only while Google still has you signed in. Cadence never opens a sign-in window by itself.</span></span></label>` : ""}
      <p class="note">Your Client ID${c.proxyUrl ? " and proxy URL are" : " is"} saved in this browser. Health data goes from Google to this browser only. <button class="linkish" type="button" data-action="gh:edit">Change settings</button></p>
    </div>`;
  }

  /* website: configure, then optionally sync on open (no pop-ups; only with a live sign-in) */
  function gStartup() {
    if (!isWeb()) return;
    let tries = 0;
    const tick = async () => {
      if (!(App.storageReady && App.storageReady())) {
        if (tries++ < 100) setTimeout(tick, 100);
        return;
      }
      if (!GH() || !g.cfg.clientId) return;
      gConfigure();
      const ok = await gRefresh();
      if (ok && g.cfg.autoSync && g.cfg.lastSync) gSync(true);
    };
    setTimeout(tick, 0);
  }

  Views.data = {
    label: "Data",
    icon: "data",
    dated: false,
    css: `

.gh-range{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.gh-prog{display:flex;flex-direction:column;gap:6px}

@media (prefers-reduced-motion: reduce){.gh-prog .bar-track.indet .bar-fill{animation:none}}
.gh-src{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.gh-warn summary{cursor:pointer;color:var(--muted)}
.gh-warn ul{margin:.4em 0 0;padding-left:1.2em}
.gh-auto{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.4}
.gh-auto input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}`,
    render(ctx) {
      checkDownloads();
      return `<div class="page">
        <div class="page-head"><h1>Your data</h1><p class="sub">Where your numbers come from and where they're kept.</p></div>
        <div class="grid-2">
          <div class="stack">${isWeb() ? googleCard() : ""}${sourceCard(ctx)}${importCard()}${backupCard()}</div>
          <div class="stack">${phoneCard()}${profileCard(ctx)}</div>
        </div>
        ${methodsCard(ctx)}
        <p class="note">Scores in Cadence are estimates for personal insight, not medical advice.</p>
      </div>`;
    },
    after(root) {
      const drop = root.querySelector("#data-drop");
      if (!drop) return;
      const stop = (e) => {
        e.preventDefault();
        e.stopPropagation();
      };
      ["dragenter", "dragover"].forEach((t) =>
        drop.addEventListener(t, (e) => {
          stop(e);
          drop.classList.add("over");
        }),
      );
      ["dragleave", "dragend"].forEach((t) => drop.addEventListener(t, () => drop.classList.remove("over")));
      drop.addEventListener("drop", (e) => {
        stop(e);
        drop.classList.remove("over");
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        handleFile(f);
      });
    },
  };
  gStartup();
})();
</script>
<script>/*
 * Cadence — Google Health API connector (browser side).
 *
 * Reads the user's own data from the Google Health API (health.googleapis.com, v4)
 * and turns it into Cadence day records ("cadence.v2", see engine.js).
 *
 *   GoogleHealth.configure({ clientId, proxyUrl })
 *   await GoogleHealth.connect()            // Google Identity Services token popup
 *   const r = await GoogleHealth.sync({ days: 90, onProgress })
 *   // r = { days, sources, warnings }; feed {format:"cadence.v2", days} to CadenceEngine.parseImport
 *
 * The access token lives in memory only (never stored). Tokens last ~1 hour; after that
 * sync() asks Google for a fresh one (a click on "Sync" is enough).
 *
 * Pure mapping: GoogleHealth.mapResponses(raw, tz) — raw is keyed by data type id
 * (list endpoints → array of dataPoints) plus raw.rollups keyed by data type id
 * (dailyRollUp → array of rollupDataPoints). Exported for tests.
 *
 * API reference: https://developers.google.com/health/reference/rest/v4/users.dataTypes.dataPoints
 */
(function (root) {
  "use strict";

  const API_HOST = "https://health.googleapis.com";
  const GIS_SRC = "https://accounts.google.com/gsi/client";
  const SCOPES = [
    "https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly",
    "https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly",
    "https://www.googleapis.com/auth/googlehealth.sleep.readonly",
  ];

  /* ------------------------------------------------------------------
   * What we fetch.
   *   list:   GET  /v4/users/me/dataTypes/{id}/dataPoints?filter=…&pageSize=…&pageToken=…
   *   rollup: POST /v4/users/me/dataTypes/{id}/dataPoints:dailyRollUp  {range, windowSizeDays:1}
   * kind decides the filter field (AIP-160):
   *   sample   → {snake}.sample_time.physical_time   (RFC 3339 UTC)
   *   session  → exercise.interval.civil_start_time   (civil, no zone)
   *   sleep    → sleep.interval.end_time              (RFC 3339 UTC)
   *   daily    → {snake}.date                         ("YYYY-MM-DD")
   * ------------------------------------------------------------------ */
  const LIST_TYPES = [
    { id: "sleep", kind: "sleep", pageSize: 25, chunkDays: 30 },
    { id: "exercise", kind: "session", pageSize: 25, chunkDays: 30 },
    { id: "heart-rate", kind: "sample", pageSize: 10000, chunkDays: 3 },
    { id: "daily-resting-heart-rate", kind: "daily", pageSize: 1000, chunkDays: 90 },
    { id: "daily-heart-rate-variability", kind: "daily", pageSize: 1000, chunkDays: 90 },
    { id: "heart-rate-variability", kind: "sample", pageSize: 10000, chunkDays: 30, optional: true },
    { id: "daily-oxygen-saturation", kind: "daily", pageSize: 1000, chunkDays: 90 },
    { id: "oxygen-saturation", kind: "sample", pageSize: 10000, chunkDays: 14, optional: true },
    { id: "daily-respiratory-rate", kind: "daily", pageSize: 1000, chunkDays: 90 },
    { id: "respiratory-rate-sleep-summary", kind: "sample", pageSize: 1000, chunkDays: 90, optional: true },
    { id: "daily-sleep-temperature-derivations", kind: "daily", pageSize: 1000, chunkDays: 90 },
    { id: "weight", kind: "sample", pageSize: 1000, chunkDays: 90 },
    { id: "body-fat", kind: "sample", pageSize: 1000, chunkDays: 90 },
  ];
  // floors and total-calories have no list method; daily totals are best taken from dailyRollUp
  // (Google de-duplicates overlapping sources there). total-calories max range is 14 days.
  const ROLLUP_TYPES = [
    { id: "steps", chunkDays: 90 },
    { id: "distance", chunkDays: 90 },
    { id: "floors", chunkDays: 90 },
    { id: "active-energy-burned", chunkDays: 90 },
    { id: "total-calories", chunkDays: 14 },
  ];

  /* ---------- small utils ---------- */
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const num = (v) => {
    if (v === null || v === undefined || v === "") return undefined;
    const n = typeof v === "number" ? v : Number(v);
    return isFinite(n) ? n : undefined;
  };
  const median = (a) => {
    if (!a.length) return undefined;
    const s = [...a].sort((x, y) => x - y);
    const h = s.length >> 1;
    return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2;
  };
  const r1 = (v) => Math.round(v * 10) / 10;
  const r2 = (v) => Math.round(v * 100) / 100;
  const pad = (n) => String(n).padStart(2, "0");
  const camel = (kebab) => kebab.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
  const snake = (kebab) => kebab.replace(/-/g, "_");
  const MIN = 60000;

  // RFC 3339 → ms. Trims nanosecond fractions that some JS engines reject.
  function tms(s) {
    if (typeof s !== "string") return NaN;
    const t = s.replace(/(\.\d{3})\d+/, "$1");
    return Date.parse(t);
  }
  const ymdOfDate = (d) => (d && isNum(num(d.year)) ? `${d.year}-${pad(d.month || 1)}-${pad(d.day || 1)}` : null);

  /* ---------- time zone helpers (IANA zone via Intl) ---------- */
  const fmtCache = new Map();
  function fmt(tz) {
    if (!fmtCache.has(tz)) {
      fmtCache.set(
        tz,
        new Intl.DateTimeFormat("en-US", {
          timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", second: "2-digit",
        })
      );
    }
    return fmtCache.get(tz);
  }
  function parts(ms, tz) {
    const o = {};
    for (const p of fmt(tz).formatToParts(new Date(ms))) if (p.type !== "literal") o[p.type] = Number(p.value);
    if (o.hour === 24) o.hour = 0;
    return o;
  }
  function offsetMin(ms, tz) {
    const p = parts(ms, tz);
    const asUtc = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
    return Math.round((asUtc - Math.floor(ms / 1000) * 1000) / MIN);
  }
  // fast path: UTC offset cached per 15-minute slot (zones change offset only on quarter hours)
  const offCache = new Map();
  function offsetFast(ms, tz) {
    const k = tz + "|" + Math.floor(ms / 900000);
    let o = offCache.get(k);
    if (o === undefined) {
      if (offCache.size > 50000) offCache.clear();
      o = offsetMin(Math.floor(ms / 900000) * 900000, tz);
      offCache.set(k, o);
    }
    return o;
  }
  function localInfo(ms, tz) {
    const d = new Date(ms + offsetFast(ms, tz) * MIN);
    return {
      date: `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`,
      min: d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60 + d.getUTCMilliseconds() / 60000,
    };
  }
  function localIso(ms, tz) {
    const p = parts(ms, tz);
    const off = offsetMin(ms, tz);
    const sg = off >= 0 ? "+" : "-";
    const a = Math.abs(off);
    return `${p.year}-${pad(p.month)}-${pad(p.day)}T${pad(p.hour)}:${pad(p.minute)}:${pad(p.second)}${sg}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
  }
  // ms of local midnight that starts `ymd` in tz
  function midnightMs(ymd, tz) {
    const [y, m, d] = ymd.split("-").map(Number);
    const guess = Date.UTC(y, m - 1, d);
    let t = guess - offsetMin(guess, tz) * MIN;
    t = guess - offsetMin(t, tz) * MIN;
    return t;
  }
  function addDays(ymd, n) {
    const [y, m, d] = ymd.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d + n));
    return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;
  }
  const dateObj = (ymd) => {
    const [year, month, day] = ymd.split("-").map(Number);
    return { year, month, day };
  };
  function defaultTz() {
    try {
      return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    } catch (e) {
      return "UTC";
    }
  }

  /* ---------- field readers (tolerant of small schema differences) ---------- */
  // pick first numeric value among candidate keys; else first numeric key matching re
  function pick(obj, keys, re) {
    if (!obj || typeof obj !== "object") return undefined;
    for (const k of keys) {
      const v = num(obj[k]);
      if (v !== undefined) return v;
    }
    if (re) {
      for (const [k, v0] of Object.entries(obj)) {
        const v = num(v0);
        if (v !== undefined && re.test(k)) return v;
      }
    }
    return undefined;
  }
  const payload = (dp, typeId) => (dp && (dp[camel(typeId)] || dp[typeId])) || null;
  // instant (ms) for a sample-type payload, or interval start
  function sampleMs(p) {
    if (!p) return NaN;
    if (p.sampleTime) return tms(p.sampleTime.physicalTime);
    if (p.interval) return tms(p.interval.startTime);
    if (p.time) return tms(p.time);
    return NaN;
  }
  function sourceName(dp) {
    const s = dp && dp.dataSource;
    if (!s) return "";
    const dev = s.device || {};
    return String(dev.displayName || [dev.manufacturer, dev.model].filter(Boolean).join(" ") || s.platform || s.recordingMethod || "").slice(0, 60);
  }

  // respiratory-rate-sleep-summary: breaths/min sits in a per-stage statistics object
  // (RespiratoryRateSleepSummaryStatistics.breathsPerMinute). Prefer the whole-night block.
  function respSummaryBpm(p) {
    if (!p || typeof p !== "object") return undefined;
    const top = num(p.breathsPerMinute);
    if (top !== undefined) return top;
    const blocks = Object.entries(p).filter(([, v]) => v && typeof v === "object" && num(v.breathsPerMinute) !== undefined);
    const full = blocks.find(([k]) => /full|overall|total|all/i.test(k)) || blocks.find(([k]) => !/deep|light|rem/i.test(k)) || blocks[0];
    return full ? num(full[1].breathsPerMinute) : undefined;
  }

  const HIST_START = 30, HIST_BIN = 5, HIST_N = 38; // 30–219 bpm, same buckets as the engine
  const GAP_CAP = 5 * MIN;

  const STAGE_MAP = { AWAKE: "awake", RESTLESS: "awake", LIGHT: "light", ASLEEP: "light", DEEP: "deep", REM: "rem" };

  /* ==================================================================
   * mapResponses(raw, tz) → { days, warnings, counts }
   * ================================================================== */
  function mapResponses(raw, tz, opts) {
    tz = tz || defaultTz();
    opts = opts || {};
    raw = raw || {};
    const warnings = [];
    const days = new Map(); // date → day
    const day = (date) => {
      if (!days.has(date)) days.set(date, { date });
      return days.get(date);
    };
    const inWindow = (date) => (!opts.start || date >= opts.start) && (!opts.end || date <= opts.end);
    const list = (id) => (Array.isArray(raw[id]) ? raw[id] : []);

    /* ---- heart rate samples (deduped by instant, sorted) ---- */
    const hrMap = new Map();
    for (const dp of list("heart-rate")) {
      const p = payload(dp, "heart-rate");
      const t = sampleMs(p);
      const bpm = num(p && p.beatsPerMinute);
      if (!isNum(t) || bpm === undefined || bpm < 25 || bpm > 240) continue;
      hrMap.set(t, bpm);
    }
    const hr = [...hrMap.entries()].sort((a, b) => a[0] - b[0]); // [ms, bpm]
    // weight of each sample = time to next sample, capped at 5 min (last sample: 1 min)
    const hrW = hr.map((s, i) => (i + 1 < hr.length ? Math.min(hr[i + 1][0] - s[0], GAP_CAP) : MIN));

    const histAdd = (counts, bpm, minutes) => {
      const k = Math.max(0, Math.min(HIST_N - 1, Math.floor((bpm - HIST_START) / HIST_BIN)));
      counts[k] += minutes;
    };
    const histOut = (counts) => {
      let n = counts.length;
      while (n > 1 && counts[n - 1] <= 0.05) n--;
      const c = counts.slice(0, n).map((x) => Math.round(x * 10) / 10);
      const tot = c.reduce((s, x) => s + x, 0);
      return tot > 0 && tot <= 1440 ? { start: HIST_START, bin: HIST_BIN, counts: c } : undefined;
    };

    {
      const perDay = new Map(); // date → {counts, bins: Map(binStart → [bpm])}
      for (let i = 0; i < hr.length; i++) {
        const [t, bpm] = hr[i];
        const li = localInfo(t, tz);
        if (!inWindow(li.date)) continue;
        let pd = perDay.get(li.date);
        if (!pd) perDay.set(li.date, (pd = { counts: new Array(HIST_N).fill(0), bins: new Map() }));
        const w = Math.min(hrW[i] / MIN, Math.max(0, 1440 - li.min)); // do not spill past midnight
        histAdd(pd.counts, bpm, w);
        const b = Math.floor(li.min / 5) * 5;
        if (!pd.bins.has(b)) pd.bins.set(b, []);
        pd.bins.get(b).push(bpm);
      }
      for (const [date, pd] of perDay) {
        const d = day(date);
        d.hr = [...pd.bins.entries()].sort((a, b) => a[0] - b[0]).map(([m, v]) => [m, Math.round(median(v))]);
        const h = histOut(pd.counts);
        if (h) d.hrHist = h;
      }
    }
    // stats for a time range [a, b)
    function hrRange(a, b) {
      const counts = new Array(HIST_N).fill(0);
      let wSum = 0, bSum = 0, max = 0;
      // binary search first sample ≥ a
      let lo = 0, hi = hr.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (hr[mid][0] < a) lo = mid + 1;
        else hi = mid;
      }
      for (let i = lo; i < hr.length && hr[i][0] < b; i++) {
        const w = Math.min(hrW[i], b - hr[i][0]) / MIN;
        histAdd(counts, hr[i][1], w);
        wSum += w;
        bSum += w * hr[i][1];
        if (hr[i][1] > max) max = hr[i][1];
      }
      return wSum > 0 ? { hist: histOut(counts), avg: bSum / wSum, max, minutes: wSum } : null;
    }

    /* ---- sleep ---- */
    const sleeps = [];
    for (const dp of list("sleep")) {
      const p = payload(dp, "sleep");
      if (!p || !p.interval) continue;
      const a = tms(p.interval.startTime), b = tms(p.interval.endTime);
      if (!isNum(a) || !isNum(b) || b <= a) continue;
      sleeps.push({ a, b, p, endDate: localInfo(b - 1, tz).date });
    }
    // drop exact duplicates (same interval from two sources)
    const seenSleep = new Set();
    const sleepU = sleeps.filter((s) => {
      const k = `${s.a}-${s.b}`;
      if (seenSleep.has(k)) return false;
      seenSleep.add(k);
      return true;
    });
    const mainSleepWin = new Map(); // date → [a, b]
    const byEnd = new Map();
    for (const s of sleepU) {
      if (!byEnd.has(s.endDate)) byEnd.set(s.endDate, []);
      byEnd.get(s.endDate).push(s);
    }
    function stagesOf(s) {
      const a = s.a;
      const spanMin = Math.min(1440, (s.b - a) / MIN);
      const out = [];
      const st = Array.isArray(s.p.stages) ? s.p.stages : [];
      for (const g of st) {
        const stage = STAGE_MAP[g && g.type];
        if (!stage) continue;
        let x = (tms(g.startTime) - a) / MIN, y = (tms(g.endTime) - a) / MIN;
        if (!isNum(x) || !isNum(y)) continue;
        x = Math.max(0, x);
        y = Math.min(spanMin, y);
        if (y - x < 0.5) continue;
        out.push([stage, x, y]);
      }
      out.sort((u, v) => u[1] - v[1]);
      // round and merge, keep non-overlapping
      const res = [];
      for (const [stage, x0, y0] of out) {
        let x = Math.round(x0), y = Math.round(y0);
        const prev = res[res.length - 1];
        if (prev && x < prev[2]) x = prev[2];
        if (y <= x) continue;
        if (prev && prev[0] === stage && prev[2] === x) prev[2] = y;
        else res.push([stage, x, y]);
      }
      if (!res.length) {
        // no stage detail: treat the session as light sleep, minus summary awake minutes at the end
        const total = Math.round(spanMin);
        const awake = Math.min(total - 1, Math.max(0, Math.round(num(s.p.summary && s.p.summary.minutesAwake) || 0)));
        if (total <= 0) return [];
        res.push(["light", 0, total - awake]);
        if (awake > 0) res.push(["awake", total - awake, total]);
      }
      return res;
    }
    const asleepMinOf = (s, stages) => {
      const sm = num(s.p.summary && s.p.summary.minutesAsleep);
      if (sm !== undefined && sm > 0) return sm;
      return stages.filter((x) => x[0] !== "awake").reduce((t, x) => t + x[2] - x[1], 0);
    };
    for (const [date, list2] of byEnd) {
      if (!inWindow(date)) continue;
      list2.sort((u, v) => v.b - v.a - (u.b - u.a));
      const main = list2[0];
      const d = day(date);
      const mainStages = stagesOf(main);
      if (mainStages.length) {
        d.sleep = { start: localIso(main.a, tz), end: localIso(main.b, tz), stages: mainStages };
        mainSleepWin.set(date, [main.a, main.b]);
      }
      const naps = [];
      for (const s of list2.slice(1)) {
        const dur = (s.b - s.a) / MIN;
        if (dur >= 180) {
          warnings.push(`Two long sleeps ended on ${date}; kept the longer one.`);
          continue;
        }
        naps.push({ start: localIso(s.a, tz), end: localIso(s.b, tz), asleepMin: Math.round(Math.min(dur, asleepMinOf(s, stagesOf(s)))) });
      }
      // a lone short session that is the only sleep of the day is a nap, not a night
      if (d.sleep && (main.b - main.a) / MIN < 180 && (main.p.metadata && main.p.metadata.nap)) {
        naps.push({ start: d.sleep.start, end: d.sleep.end, asleepMin: Math.round(asleepMinOf(main, mainStages)) });
        delete d.sleep;
        mainSleepWin.delete(date);
      }
      if (naps.length) d.naps = naps.sort((u, v) => (u.start < v.start ? -1 : 1));
    }

    /* ---- exercise ---- */
    const seenEx = new Set();
    for (const dp of list("exercise")) {
      const p = payload(dp, "exercise");
      if (!p || !p.interval) continue;
      const a = tms(p.interval.startTime), b = tms(p.interval.endTime);
      if (!isNum(a) || !isNum(b) || b <= a) continue;
      const k = `${a}-${b}`;
      if (seenEx.has(k)) continue;
      seenEx.add(k);
      const date = localInfo(a, tz).date;
      if (!inWindow(date)) continue;
      const active = num(String(p.activeDuration || "").replace(/s$/, ""));
      const durationMin = Math.round(active && active > 0 ? active / 60 : (b - a) / MIN);
      if (!(durationMin > 0 && durationMin < 1440)) continue;
      const ms = p.metricsSummary || {};
      const w = {
        type: String(p.displayName || prettyType(p.exerciseType) || "Workout").slice(0, 40),
        start: localIso(a, tz),
        durationMin,
        source: "Google Health",
      };
      const id = dp.name ? String(dp.name).split("/").pop() : "";
      if (id) w.id = `gh-${id}`.slice(0, 80);
      const stats = hrRange(a, b);
      const avg = num(ms.averageHeartRateBeatsPerMinute);
      if (avg !== undefined && avg >= 40 && avg <= 230) w.avgHr = Math.round(avg);
      else if (stats) w.avgHr = Math.round(stats.avg);
      if (stats && stats.max >= 40) w.maxHr = stats.max;
      const kcal = num(ms.caloriesKcal);
      if (kcal !== undefined && kcal >= 0) w.kcal = Math.round(kcal);
      const mm = num(ms.distanceMillimeters);
      if (mm !== undefined && mm > 0) w.distanceM = Math.round(mm / 1000);
      if (stats && stats.hist) w.hrHist = stats.hist;
      const d = day(date);
      (d.workouts || (d.workouts = [])).push(w);
    }
    for (const d of days.values()) if (d.workouts) d.workouts.sort((u, v) => (u.start < v.start ? -1 : 1));

    /* ---- daily summaries ---- */
    function dailyVal(id, reader) {
      const out = new Map();
      for (const dp of list(id)) {
        const p = payload(dp, id);
        const date = p && ymdOfDate(p.date);
        if (!date) continue;
        const v = reader(p);
        if (v !== undefined && isNum(v)) out.set(date, v);
      }
      return out;
    }
    // samples → [ms, value]
    function samples(id, reader) {
      const out = [];
      for (const dp of list(id)) {
        const p = payload(dp, id);
        const t = sampleMs(p);
        const v = reader(p);
        if (isNum(t) && v !== undefined && isNum(v)) out.push([t, v]);
      }
      return out.sort((x, y) => x[0] - y[0]);
    }
    // nightly value: median of samples inside the main sleep window, else that day's daily summary,
    // else median of that day's samples
    function nightly(field, sampleList, daily, lo, hi, round) {
      const byDay = new Map();
      for (const [t, v] of sampleList) {
        const dd = localInfo(t, tz).date;
        if (!byDay.has(dd)) byDay.set(dd, []);
        byDay.get(dd).push([t, v]);
      }
      const dates = new Set([...daily.keys(), ...byDay.keys(), ...mainSleepWin.keys()]);
      for (const date of dates) {
        if (!inWindow(date)) continue;
        let v;
        const win = mainSleepWin.get(date);
        if (win && sampleList.length) {
          const inSleep = sampleList.filter(([t]) => t >= win[0] && t <= win[1]).map((x) => x[1]);
          if (inSleep.length) v = median(inSleep);
        }
        if (v === undefined && daily.has(date)) v = daily.get(date);
        if (v === undefined && byDay.has(date)) v = median(byDay.get(date).map((x) => x[1]));
        if (v !== undefined && isNum(v) && v >= lo && v <= hi) day(date)[field] = round(v);
      }
    }

    // resting HR (bpm)
    for (const [date, v] of dailyVal("daily-resting-heart-rate", (p) => num(p.beatsPerMinute))) {
      if (inWindow(date) && v >= 25 && v <= 140) day(date).restingHr = Math.round(v);
    }
    // HRV (RMSSD, ms)
    nightly(
      "hrv",
      samples("heart-rate-variability", (p) => pick(p, ["rootMeanSquareOfSuccessiveDifferencesMilliseconds"], /^(rootMeanSquare|rmssd).*millis/i)),
      dailyVal("daily-heart-rate-variability", (p) => pick(p, ["averageHeartRateVariabilityMilliseconds"], /^average.*Millis/i)),
      3, 400, r1
    );
    // SpO2 (%)
    nightly(
      "spo2",
      samples("oxygen-saturation", (p) => pick(p, ["percentage"])),
      dailyVal("daily-oxygen-saturation", (p) => pick(p, ["averagePercentage"])),
      70, 100, r1
    );
    // respiratory rate (breaths/min)
    nightly(
      "respRate",
      samples("respiratory-rate-sleep-summary", respSummaryBpm),
      dailyVal("daily-respiratory-rate", (p) => pick(p, ["breathsPerMinute"])),
      4, 40, r1
    );
    // skin temperature deviation from personal baseline (°C)
    nightly(
      "skinTempDev",
      [],
      dailyVal("daily-sleep-temperature-derivations", (p) => {
        // nightlyTemperatureCelsius = mean skin temp during sleep; baselineTemperatureCelsius = 30-day median.
        // (relativeNightlyStddev30dCelsius is a spread, not a deviation — not used.)
        const night = pick(p, ["nightlyTemperatureCelsius"]);
        const base = pick(p, ["baselineTemperatureCelsius"]);
        return night !== undefined && base !== undefined ? night - base : undefined;
      }),
      -5, 5, r2
    );
    // weight (kg) & body fat (%): last reading of the day
    for (const [t, g] of samples("weight", (p) => pick(p, ["weightGrams"]))) {
      const date = localInfo(t, tz).date;
      if (inWindow(date) && g / 1000 >= 20 && g / 1000 <= 400) day(date).weightKg = r1(g / 1000);
    }
    for (const [t, v] of samples("body-fat", (p) => pick(p, ["percentage"]))) {
      const date = localInfo(t, tz).date;
      if (inWindow(date) && v >= 2 && v <= 70) day(date).bodyFatPct = r1(v);
    }

    /* ---- daily totals from dailyRollUp ---- */
    const ru = raw.rollups || {};
    const rollRead = {
      steps: ["steps", (v) => num(v.countSum), (x) => Math.round(x), 0, 200000],
      distance: ["distanceM", (v) => (num(v.millimetersSum) !== undefined ? num(v.millimetersSum) / 1000 : undefined), (x) => Math.round(x), 0, 500000],
      floors: ["floors", (v) => num(v.countSum), (x) => Math.round(x), 0, 2000],
      "active-energy-burned": ["activeKcal", (v) => num(v.kcalSum), (x) => Math.round(x), 0, 15000],
      "total-calories": ["totalKcal", (v) => num(v.kcalSum), (x) => Math.round(x), 0, 20000],
    };
    for (const [id, [field, read, round, lo, hi]] of Object.entries(rollRead)) {
      for (const rp of Array.isArray(ru[id]) ? ru[id] : []) {
        const date = rp && rp.civilStartTime && ymdOfDate(rp.civilStartTime.date);
        const v = rp && rp[camel(id)];
        if (!date || !v || !inWindow(date)) continue;
        const x = read(v);
        if (x === undefined || !isNum(x) || x < lo || x > hi) continue;
        if (x === 0 && field !== "steps") continue;
        if (x === 0 && !days.has(date)) continue; // a zero-step day with nothing else is "no data"
        day(date)[field] = round(x);
      }
    }

    const out = [...days.values()]
      .filter((d) => Object.keys(d).length > 1)
      .sort((a, b) => (a.date < b.date ? -1 : 1));
    const counts = {};
    for (const k of Object.keys(raw)) if (Array.isArray(raw[k])) counts[k] = raw[k].length;
    for (const k of Object.keys(ru)) if (Array.isArray(ru[k])) counts[`${k} (daily totals)`] = ru[k].length;
    return { days: out, warnings: [...new Set(warnings)], counts };
  }

  function prettyType(t) {
    if (!t || typeof t !== "string" || t === "EXERCISE_TYPE_UNSPECIFIED") return "";
    return t.toLowerCase().split("_").map((w) => w[0].toUpperCase() + w.slice(1)).join(" ");
  }

  /* ==================================================================
   * Network layer
   * ================================================================== */
  const state = { clientId: "", proxyUrl: "", token: null, expiresAt: 0, granted: [], tokenClient: null, gisPromise: null };

  function GHError(code, message, detail) {
    const e = new Error(message);
    e.code = code;
    if (detail) e.detail = detail;
    return e;
  }
  const MSG = {
    auth: "Your Google sign-in has expired or was cancelled. Click Connect (or Sync) and sign in again.",
    forbidden: "Google did not allow Cadence to read this data. Connect again and tick every Google Health permission.",
    not_enabled: "The Google Health API is not turned on for your Google Cloud project. Open the Cloud console, enable \"Google Health API\", then try again.",
    not_linked: "This Google account has no Google Health data linked. Sign in with the account your Fitbit uses.",
    rate_limited: "Google is limiting requests right now. Wait a few minutes and sync again.",
    network: "Could not reach Google. Check your internet connection and try again.",
    cors: "Your browser blocked the request to Google Health. Add a proxy URL in Cadence settings (see the Google setup guide) and try again.",
    no_client: "Add your Google OAuth Client ID first (see the Google setup guide).",
  };

  function configure(cfg) {
    cfg = cfg || {};
    if (typeof cfg.clientId === "string") state.clientId = cfg.clientId.trim();
    if (typeof cfg.proxyUrl === "string") state.proxyUrl = cfg.proxyUrl.trim().replace(/\/+$/, "");
    if (state.clientId && typeof document !== "undefined") loadGis().catch(() => {}); // preload so connect() stays inside the click
    return { clientId: state.clientId, proxyUrl: state.proxyUrl };
  }

  function loadGis() {
    if (root.google && root.google.accounts && root.google.accounts.oauth2) return Promise.resolve();
    if (state.gisPromise) return state.gisPromise;
    state.gisPromise = new Promise((resolve, reject) => {
      if (typeof document === "undefined") return reject(GHError("network", "Google sign-in needs a browser."));
      const s = document.createElement("script");
      s.src = GIS_SRC;
      s.async = true;
      s.defer = true;
      s.onload = () => resolve();
      s.onerror = () => {
        state.gisPromise = null;
        reject(GHError("network", "Could not load Google sign-in. Check your connection or ad blocker and try again."));
      };
      document.head.appendChild(s);
    });
    return state.gisPromise;
  }

  async function connect(opts) {
    opts = opts || {};
    if (!state.clientId) throw GHError("auth", MSG.no_client);
    await loadGis();
    const oauth2 = root.google.accounts.oauth2;
    return new Promise((resolve, reject) => {
      const client = oauth2.initTokenClient({
        client_id: state.clientId,
        scope: SCOPES.join(" "),
        include_granted_scopes: true,
        callback: (resp) => {
          if (!resp || resp.error || !resp.access_token) {
            reject(GHError(resp && resp.error === "access_denied" ? "forbidden" : "auth", resp && resp.error === "access_denied" ? MSG.forbidden : MSG.auth, resp && resp.error));
            return;
          }
          state.token = resp.access_token;
          state.expiresAt = Date.now() + (Number(resp.expires_in) || 3599) * 1000;
          state.granted = SCOPES.filter((s) => {
            try {
              return oauth2.hasGrantedAllScopes(resp, s);
            } catch (e) {
              return true;
            }
          });
          const missing = SCOPES.filter((s) => !state.granted.includes(s));
          resolve({ ok: true, expiresAt: state.expiresAt, missingScopes: missing });
        },
        error_callback: (err) => {
          const t = err && err.type;
          reject(GHError("auth", t === "popup_failed_to_open" ? "The Google sign-in window was blocked. Allow pop-ups for this site and try again." : MSG.auth, t));
        },
      });
      state.tokenClient = client;
      client.requestAccessToken({ prompt: opts.prompt !== undefined ? opts.prompt : state.token ? "" : "consent" });
    });
  }

  const isConnected = () => !!state.token && Date.now() < state.expiresAt - 60000;

  function disconnect() {
    const tok = state.token;
    state.token = null;
    state.expiresAt = 0;
    state.granted = [];
    return new Promise((resolve) => {
      try {
        if (tok && root.google && root.google.accounts && root.google.accounts.oauth2) root.google.accounts.oauth2.revoke(tok, () => resolve(true));
        else resolve(true);
      } catch (e) {
        resolve(true);
      }
    });
  }

  const sleepMs = (ms) => new Promise((r) => setTimeout(r, ms));
  // Unverified (testing-mode) apps get ~2.5 requests/s per user; stay under it.
  // https://developers.google.com/health/rate-limits
  const MIN_GAP_MS = 450;
  let nextSlot = 0;
  async function throttle() {
    const now = Date.now();
    const at = Math.max(now, nextSlot);
    nextSlot = at + (state.minGapMs !== undefined ? state.minGapMs : MIN_GAP_MS);
    if (at > now) await sleepMs(at - now);
  }

  async function request(method, path, query, body) {
    const base = state.proxyUrl || API_HOST;
    const qs = query ? Object.entries(query).filter(([, v]) => v !== undefined && v !== "").map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`).join("&") : "";
    const url = `${base}${path}${qs ? "?" + qs : ""}`;
    const headers = { Authorization: `Bearer ${state.token}`, Accept: "application/json" };
    if (body) headers["Content-Type"] = "application/json";
    let attempt = 0;
    for (;;) {
      await throttle();
      let res;
      try {
        res = await (root.fetch || fetch)(url, { method, headers, body: body ? JSON.stringify(body) : undefined });
      } catch (e) {
        const offline = typeof navigator !== "undefined" && navigator.onLine === false;
        if (!offline && attempt < 1) {
          attempt++;
          await sleepMs(800);
          continue;
        }
        throw GHError(offline || state.proxyUrl ? "network" : "cors", offline || state.proxyUrl ? MSG.network : MSG.cors, String(e && e.message));
      }
      if (res.ok) return res.json();
      let err = {};
      try {
        err = ((await res.json()) || {}).error || {};
      } catch (e) {}
      const status = String(err.status || "");
      const msg = String(err.message || "");
      const reasons = JSON.stringify(err.details || []);
      if ((res.status === 429 || res.status >= 500) && attempt < 5) {
        const ra = Number(res.headers && res.headers.get && res.headers.get("Retry-After"));
        await sleepMs(isNum(ra) && ra > 0 ? Math.min(ra, 60) * 1000 : 1000 * 2 ** attempt + Math.random() * 500);
        attempt++;
        continue;
      }
      if (res.status === 401) {
        state.token = null;
        throw GHError("auth", MSG.auth, msg);
      }
      if (res.status === 429) throw GHError("rate_limited", MSG.rate_limited, msg);
      if (/SERVICE_DISABLED|has not been used|is disabled|accessNotConfigured/i.test(msg + reasons)) throw GHError("not_enabled", MSG.not_enabled, msg);
      if (/ACCOUNT_NOT_LINKED/i.test(msg + reasons)) throw GHError("not_enabled", MSG.not_linked, msg);
      if (res.status === 403) throw GHError("forbidden", MSG.forbidden, msg);
      if (res.status >= 500) throw GHError("network", "Google Health had a server problem. Try again in a few minutes.", msg);
      throw GHError(res.status === 400 && status === "INVALID_ARGUMENT" ? "bad_request" : "network", `Google Health rejected the request (${res.status}). ${msg}`.trim(), msg);
    }
  }

  const DT = (id) => `/v4/users/me/dataTypes/${id}/dataPoints`;
  const q = (s) => `"${s}"`;

  function filterFor(t, startMs, endMs, startYmd, endYmd) {
    const sn = snake(t.id);
    const iso = (ms) => new Date(ms).toISOString().replace(/\.\d{3}Z$/, "Z");
    switch (t.kind) {
      case "sample":
        return `${sn}.sample_time.physical_time >= ${q(iso(startMs))} AND ${sn}.sample_time.physical_time < ${q(iso(endMs))}`;
      case "sleep":
        return `sleep.interval.end_time >= ${q(iso(startMs))} AND sleep.interval.end_time < ${q(iso(endMs))}`;
      case "session":
        return `${sn}.interval.civil_start_time >= ${q(startYmd + "T00:00:00")} AND ${sn}.interval.civil_start_time < ${q(endYmd + "T00:00:00")}`;
      case "daily":
        return `${sn}.date >= ${q(startYmd)} AND ${sn}.date < ${q(endYmd)}`;
      default:
        return "";
    }
  }

  // GET list with pagination for [startYmd, endYmd) chunk
  async function listChunk(t, startYmd, endYmd, tz) {
    const startMs = midnightMs(startYmd, tz), endMs = midnightMs(endYmd, tz);
    const pts = [];
    let filter = filterFor(t, startMs, endMs, startYmd, endYmd);
    let token = "";
    let unfiltered = false;
    for (let page = 0; page < 2000; page++) {
      let j;
      try {
        j = await request("GET", DT(t.id), { pageSize: t.pageSize, pageToken: token, filter: unfiltered ? "" : filter });
      } catch (e) {
        // If Google rejects our filter syntax, fall back to unfiltered paging (newest first) and stop
        // once we are past the window.
        if (e.code === "bad_request" && !unfiltered && page === 0) {
          unfiltered = true;
          page = -1;
          continue;
        }
        throw e;
      }
      const dps = Array.isArray(j.dataPoints) ? j.dataPoints : [];
      pts.push(...dps);
      token = j.nextPageToken || "";
      if (!token) break;
      if (unfiltered && dps.length) {
        const oldest = Math.min(...dps.map((dp) => pointMs(dp, t.id)).filter(isNum));
        if (isNum(oldest) && oldest < startMs - 86400000) break;
      }
    }
    return unfiltered ? pts.filter((dp) => {
      const m = pointMs(dp, t.id);
      return !isNum(m) || (m >= startMs - 86400000 && m < endMs + 86400000);
    }) : pts;
  }
  function pointMs(dp, id) {
    const p = payload(dp, id);
    if (!p) return NaN;
    if (p.date) return Date.UTC(num(p.date.year), (num(p.date.month) || 1) - 1, num(p.date.day) || 1);
    if (p.interval) return tms(p.interval.endTime);
    return sampleMs(p);
  }

  async function rollupChunk(id, startYmd, endYmd) {
    const pts = [];
    let token = "";
    for (let page = 0; page < 100; page++) {
      const body = {
        range: { start: { date: dateObj(startYmd), time: { hours: 0 } }, end: { date: dateObj(endYmd), time: { hours: 0 } } },
        windowSizeDays: 1,
        pageSize: 1000,
      };
      if (token) body.pageToken = token;
      const j = await request("POST", `${DT(id)}:dailyRollUp`, null, body);
      if (Array.isArray(j.rollupDataPoints)) pts.push(...j.rollupDataPoints);
      token = j.nextPageToken || "";
      if (!token) break;
    }
    return pts;
  }

  function chunks(startYmd, endExclYmd, size) {
    const out = [];
    for (let a = startYmd; a < endExclYmd; ) {
      let b = addDays(a, size);
      if (b > endExclYmd) b = endExclYmd;
      out.push([a, b]);
      a = b;
    }
    return out;
  }

  async function pool(tasks, n) {
    let i = 0;
    const run = async () => {
      while (i < tasks.length) {
        const k = i++;
        await tasks[k]();
      }
    };
    await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, run));
  }

  /**
   * sync({ days = 90, since: "YYYY-MM-DD", onProgress(info), tz })
   * → { days, sources: [{type, points, status, message?}], warnings }
   */
  async function sync(opts) {
    opts = opts || {};
    const tz = opts.tz || defaultTz();
    if (!isConnected()) await connect();
    const today = localInfo(Date.now(), tz).date;
    const nDays = Math.max(1, Math.min(365, Math.round(opts.days || 90)));
    let start = typeof opts.since === "string" && /^\d{4}-\d{2}-\d{2}$/.test(opts.since) ? opts.since : addDays(today, -(nDays - 1));
    if (start > today) start = today;
    const endExcl = addDays(today, 1);
    // fetch one extra day back so a night that started the evening before is complete
    const fetchStart = addDays(start, -1);

    const raw = { rollups: {} };
    const sources = [];
    const warnings = [];
    const tasks = [];
    const plan = [];
    for (const t of LIST_TYPES) for (const [a, b] of chunks(fetchStart, endExcl, t.chunkDays)) plan.push({ kind: "list", t, a, b });
    for (const t of ROLLUP_TYPES) for (const [a, b] of chunks(start, endExcl, t.chunkDays)) plan.push({ kind: "rollup", t, a, b });
    const status = new Map(); // id → {type, points, status, message}
    const failed = new Set();
    let done = 0;
    const report = (label) => {
      if (typeof opts.onProgress === "function") {
        try {
          opts.onProgress({ done, total: plan.length, fraction: done / plan.length, label });
        } catch (e) {}
      }
    };
    report("Starting");
    let fatal = null;
    for (const job of plan) {
      tasks.push(async () => {
        if (fatal || failed.has(job.t.id)) {
          done++;
          return;
        }
        const id = job.t.id;
        const st = status.get(id) || { type: id, points: 0, status: "ok" };
        status.set(id, st);
        try {
          const pts = job.kind === "list" ? await listChunk(job.t, job.a, job.b, tz) : await rollupChunk(id, job.a, job.b);
          if (job.kind === "list") (raw[id] || (raw[id] = [])).push(...pts);
          else (raw.rollups[id] || (raw.rollups[id] = [])).push(...pts);
          st.points += pts.length;
        } catch (e) {
          if (["auth", "cors", "not_enabled", "network", "rate_limited"].includes(e.code)) {
            fatal = fatal || e;
          } else {
            failed.add(id);
            st.status = "error";
            st.message = e.message;
            if (!job.t.optional) warnings.push(`${label(id)}: ${e.message}`);
          }
        }
        done++;
        report(label(id));
      });
    }
    await pool(tasks, 2);
    if (fatal) throw fatal;

    const mapped = mapResponses(raw, tz, { start, end: today });
    for (const st of status.values()) sources.push(st);
    return { days: mapped.days, sources, warnings: warnings.concat(mapped.warnings), range: { start, end: today, tz } };
  }

  const LABELS = {
    "heart-rate": "Heart rate", sleep: "Sleep", exercise: "Workouts", steps: "Steps", distance: "Distance", floors: "Floors",
    "active-energy-burned": "Active calories", "total-calories": "Total calories", "daily-resting-heart-rate": "Resting heart rate",
    "daily-heart-rate-variability": "HRV", "heart-rate-variability": "HRV (detail)", "daily-oxygen-saturation": "Blood oxygen",
    "oxygen-saturation": "Blood oxygen (detail)", "daily-respiratory-rate": "Breathing rate", "respiratory-rate-sleep-summary": "Breathing rate (detail)",
    "daily-sleep-temperature-derivations": "Skin temperature", weight: "Weight", "body-fat": "Body fat",
  };
  const label = (id) => LABELS[id] || id;

  // Ready-to-import payload for CadenceEngine.parseImport(JSON.stringify(...))
  const toImport = (result) => ({ format: "cadence.v2", source: "Google Health API", exportedAt: new Date().toISOString(), days: (result && result.days) || [] });

  const api = {
    configure, connect, isConnected, disconnect, sync, mapResponses, toImport,
    scopes: SCOPES.slice(), LIST_TYPES, ROLLUP_TYPES,
    _internal: { filterFor, midnightMs, localInfo, localIso, chunks, request, state },
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  if (root) root.GoogleHealth = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>App.boot();</script>
<script>
(function () {
  try {
    var local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    if (!("serviceWorker" in navigator) || !(location.protocol === "https:" || local)) return;
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(function (e) { console.warn("Cadence: offline cache unavailable", e); });
    });
  } catch (e) {}
})();
</script>
</body>
