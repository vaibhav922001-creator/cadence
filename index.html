      date: day.date || null,
      minutes,
      score: enough ? Math.round(100 * (1 - Math.exp(-STRESS.k * share))) : null,
      windows,
      baselineRhr: r1(base),
      threshold: r0(thr),
      eligibleMinutes,
      share: r3(share),
      message: enough ? null : "Not enough calm, awake time with heart rate and steps today to score stress.",
    };
  }

  /* ============================================================
   * Plain-language methods (for the "How scores work" page)
   * ============================================================ */
  const METHODS_ANALYTICS2 = [
    { title: "Early warning",
      body: "Each morning we compare five body signals with your own normal. Your normal is the middle value of 28 days that end two days ago, so the last two days can't hide a change that is just starting. The typical spread is the median distance from that middle value, scaled to act like a standard deviation, with a small minimum. A signal counts when resting heart rate is 1.5 spreads above normal, HRV 1.5 spreads below (on a log scale), breathing rate 1.5 spreads above, skin temperature 0.4 °C or more above, or blood oxygen 2 points below normal or under 94 %. Two signals in one day, or one signal on two days in a row, is a watch. Three signals, or two signals on two days in a row, is an alert. Each metric needs 14 readings in its window. Research with wearables has seen resting heart rate, HRV and skin temperature change a day or more before cold or flu symptoms (Mishra et al. 2020, Nature Biomedical Engineering; Quer et al. 2021, Nature Medicine). Those studies are the background for this check; they do not make it a diagnostic test. Alcohol, a hard session, travel, heat or a poor night can cause the same pattern, and many illnesses won't show at all." },
    { title: "Heart-rate recovery",
      body: "Heart-rate recovery is how far your heart rate falls in the first one and two minutes after a workout ends. We take the highest reading in the last 30 seconds of the session and subtract the reading 60 and 120 seconds later, drawing a straight line between samples when needed. A one-minute drop of 12 beats or less was linked with higher risk in a large study of exercise tests (Cole et al. 1999, New England Journal of Medicine). That study used a walking cool-down; stopping completely gives a bigger drop, and an easy session gives a smaller one. So we only judge sessions that ended at 50 % or more of your heart-rate reserve. Look at your typical value over weeks, not single sessions." },
    { title: "Running efficiency and heart-rate drift",
      body: "Efficiency is your average speed in metres per minute divided by how many beats your heart rate sat above resting. A higher number means more speed for the same effort. Compare it between similar runs; heat, hills, wind and fatigue all lower it. Drift compares your average heart rate in the second half of a steady session with the first half, after skipping the first 5 minutes (or 10 %). Over 5 % is notable and often means the pace was above your current aerobic base, or it was hot or you were under-fuelled. Your watch doesn't give us pace for each half, so drift assumes you held an even pace." },
    { title: "VO₂max estimate",
      body: "VO₂max is the most oxygen your body can use. Each steady run of 10 minutes or more gives an estimate. The ACSM running equation turns your average speed into oxygen use (0.2 ml per metre per minute plus 3.5 at rest, on flat ground). Your percent of heart-rate reserve is close to your percent of oxygen reserve (Swain & Leutholtz 1997), so VO₂max ≈ 3.5 + running oxygen use ÷ percent of reserve. Runs at under 50 % or over 95 % of reserve, or with unsteady heart rate, are skipped. We blend these run estimates with a resting estimate, 15.3 × max HR ÷ resting HR (Uth et al. 2004). Runs get more weight as you log more of them (one sixth per run, up to 85 %). The trend is the 28-day rolling median. Ratings use treadmill test norms from the FRIEND registry (Kaminsky et al. 2015) for your age and sex. Treat it as an estimate within about ±10–15 %. Hills, trail, wind, heat and a wrong max heart rate all move it." },
    { title: "Drivers",
      body: "Drivers compare your next mornings after days with and without each journal tag: recovery, sleep performance and HRV. Only days you logged a journal count, so a missing tag means you logged the day without it. For tags we use Welch's t-test, which allows the two groups to vary by different amounts. It gives the average difference, a 95 % range for it and a size in standard units (Hedges' g). For numbers like caffeine, steps, water, strain, workout end time and bedtime we use Spearman's rank correlation, which handles ties and outliers and doesn't assume a straight line. With many tests, some look strong by chance, so p-values are adjusted with the Benjamini–Hochberg method. Likely means an adjusted value under 0.1 and a meaningful size (g of 0.3 or more, or ρ of 0.2 or more). Possible means an unadjusted p under 0.1. Each tag needs 5 days with it and 5 without; each habit needs 10 days. These are associations in your own data, not proof of cause: alcohol often comes with late nights, for example." },
    { title: "Daytime stress",
      body: "We look at each 5-minute stretch while you are awake and sitting still: fewer than 60 steps, not in a workout or the 10 minutes after one, and not napping. A stretch counts as stress when your heart rate is at least 15 beats, or a quarter of your heart-rate reserve if that is more, above your resting baseline. Stress minutes are those stretches added up. The 0–100 score grows with the share of calm-looking time that was stressed: 100 × (1 − e^(−3 × share)), so 10 % scores about 26 and 25 % about 53. A raised heart rate at rest can come from caffeine, heat, illness, digestion or standing as well as from mental stress. It needs 5-minute step counts from your device; stretches with no step data are left out." },
  ];

  Object.assign(A, {
    // contract items
    warning, cardio, drivers, stress,
    // helpers for UI / tests
    warningSignalsAt, driversStatus, vo2Norm, analyseWorkout,
    // statistics
    stats: { lgamma, betainc, tTwoSided, tCdf, tInv, gammaincP, normCdf, normInv, rank, pearson, spearman, welch, bhAdjust, robust, median, mean, hrAt },
    // constants
    WARN, CARDIO, VO2_NORMS, DRIVERS, STRESS,
    METHODS_ANALYTICS2,
  });
  if (typeof module !== "undefined" && module.exports) module.exports = A;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* Cadence charts: SVG drawn at the container's real pixel width. window.Charts */
(function (root) {
  "use strict";

  const reg = new Map();
  let seq = 0;
  let gid = 0;

  const isNum = (v) => typeof v === "number" && isFinite(v);
  const esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const f1 = (v) => Math.round(v * 10) / 10;
  const defFmt = (v) => {
    if (!isNum(v)) return "–";
    const a = Math.abs(v);
    if (a >= 1000) return Math.round(v).toLocaleString("en-US");
    if (a >= 10) return String(Math.round(v));
    return String(Math.round(v * 10) / 10);
  };
  const fmtOf = (s) => {
    const f = typeof s.fmt === "function" ? s.fmt : defFmt;
    return (v) => {
      try {
        const r = f(v);
        return r == null ? "" : String(r);
      } catch (e) {
        return defFmt(v);
      }
    };
  };
  const textW = (s, px) => String(s).length * (px || 11) * 0.6 + 2;

  /* minutes (any range, relative to midnight) → "10 pm" / "10:48 pm" */
  function clk(min) {
    const m0 = ((Math.round(min) % 1440) + 1440) % 1440;
    const h = Math.floor(m0 / 60);
    const m = m0 % 60;
    const hh = h % 12 || 12;
    const ap = h < 12 ? "am" : "pm";
    return m ? `${hh}:${String(m).padStart(2, "0")} ${ap}` : `${hh} ${ap}`;
  }
  const dur = (m) => {
    m = Math.round(m);
    const h = Math.floor(m / 60);
    return h ? `${h}h ${m % 60}m` : `${m}m`;
  };

  function niceStep(span, n) {
    const raw = span / Math.max(1, n);
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  }
  function niceTicks(lo, hi, n) {
    if (!(hi > lo)) hi = lo + 1;
    const st = niceStep(hi - lo, n);
    const a = Math.floor(lo / st + 1e-9) * st;
    const b = Math.ceil(hi / st - 1e-9) * st;
    const t = [];
    for (let k = 0; a + k * st <= b + st * 1e-6; k++) t.push(+(a + k * st).toFixed(10));
    return { lo: a, hi: b, ticks: t };
  }

  /* pick label indices from the end backwards so the latest is always labelled */
  function labelIdx(n, pw, maxW) {
    if (n <= 0) return [];
    const cap = Math.max(1, Math.floor(pw / (maxW + 14)));
    const stride = Math.max(1, Math.ceil(n / cap));
    const out = [];
    for (let i = n - 1; i >= 0; i -= stride) out.push(i);
    return out;
  }

  function xLabels(data, idxs, xAt, W, padT, ph) {
    let s = "";
    for (const i of idxs) {
      const t = String(data[i].label == null ? "" : data[i].label);
      const w = textW(t);
      const x = clamp(xAt(i), w / 2, W - w / 2);
      s += `<text class="ch-t" x="${f1(x)}" y="${f1(padT + ph + 16)}" text-anchor="middle">${esc(t)}</text>`;
    }
    return s;
  }

  function yAxis(ticks, yAt, padL, W, fmt) {
    let s = "";
    for (const t of ticks) {
      const y = f1(yAt(t));
      s += `<line class="ch-grid" x1="${padL}" x2="${W}" y1="${y}" y2="${y}"/>`;
      s += `<text class="ch-t" x="${padL - 7}" y="${f1(y + 3.5)}" text-anchor="end">${esc(fmt(t))}</text>`;
    }
    return s;
  }

  const hoverBits = (padT, ph) =>
    `<line class="ch-cursor" x1="-10" x2="-10" y1="${padT}" y2="${padT + ph}"/>` +
    `<circle class="ch-hover" r="4" cx="-10" cy="-10" style="opacity:0;stroke:var(--surface);stroke-width:2"/>`;

  const svgOpen = (W, H) =>
    `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">`;

  function emptyOut(msg) {
    return { html: `<div class="ch-empty">${esc(msg)}</div>`, hit: null };
  }

  /* ---------------- line ---------------- */
  function drawLine(s, W, H) {
    const data = (s.data || []).map((d) => ({ label: d && d.label, v: d && isNum(d.v) ? d.v : null }));
    const fmt = fmtOf(s);
    const color = s.color || "var(--accent)";
    const vals = data.map((d) => d.v).filter(isNum);
    if (!vals.length) return emptyOut("No data for this range");
    const band = Array.isArray(s.band) && isNum(s.band[0]) && isNum(s.band[1]) ? [Math.min(s.band[0], s.band[1]), Math.max(s.band[0], s.band[1])] : null;
    const ref = s.ref && isNum(s.ref.v) ? s.ref : null;
    let lo = Math.min(...vals);
    let hi = Math.max(...vals);
    if (band) { lo = Math.min(lo, band[0]); hi = Math.max(hi, band[1]); }
    if (ref) { lo = Math.min(lo, ref.v); hi = Math.max(hi, ref.v); }
    const allPos = lo >= 0;
    if (hi === lo) { const p = Math.abs(hi) * 0.1 || 1; lo -= p; hi += p; }
    else { const p = (hi - lo) * 0.08; lo -= p; hi += p; }
    if (allPos && lo < 0) lo = 0;
    const nT = H < 150 ? 3 : 4;
    let T;
    if (isNum(s.yMin) || isNum(s.yMax)) {
      const a = isNum(s.yMin) ? s.yMin : lo;
      const b = isNum(s.yMax) ? s.yMax : hi;
      const nt = niceTicks(a, b, nT);
      T = { lo: a, hi: b > a ? b : a + 1, ticks: nt.ticks.filter((t) => t >= a - 1e-9 && t <= b + 1e-9) };
    } else T = niceTicks(lo, hi, nT);

    const padT = 10, padB = 24, padR = 10;
    const padL = Math.ceil(Math.max(...T.ticks.map((t) => textW(fmt(t))), 16)) + 10;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(10, H - padT - padB);
    const n = data.length;
    const step = n > 1 ? pw / (n - 1) : 0;
    const xAt = (i) => (n > 1 ? padL + i * step : padL + pw / 2);
    const yAt = (v) => padT + ph - ((v - T.lo) / (T.hi - T.lo)) * ph;
    const base = padT + ph;

    let s1 = svgOpen(W, H);
    const id = "cg" + ++gid;
    s1 += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${esc(color)};stop-opacity:.22"/><stop offset="1" style="stop-color:${esc(color)};stop-opacity:0"/></linearGradient></defs>`;
    s1 += yAxis(T.ticks, yAt, padL, W - padR, fmt);
    if (band) {
      const y1 = yAt(clamp(band[1], T.lo, T.hi)), y2 = yAt(clamp(band[0], T.lo, T.hi));
      s1 += `<rect x="${padL}" y="${f1(y1)}" width="${f1(pw)}" height="${f1(Math.max(0, y2 - y1))}" style="fill:${esc(color)};fill-opacity:.09"/>`;
    }
    // segments
    const segs = [];
    let cur = null;
    data.forEach((d, i) => {
      if (isNum(d.v)) { if (!cur) segs.push((cur = [])); cur.push(i); }
      else cur = null;
    });
    for (const sg of segs) {
      const pts = sg.map((i) => `${f1(xAt(i))},${f1(yAt(data[i].v))}`);
      if (sg.length === 1) {
        s1 += `<circle cx="${f1(xAt(sg[0]))}" cy="${f1(yAt(data[sg[0]].v))}" r="2.5" style="fill:${esc(color)}"/>`;
        continue;
      }
      if (s.area !== false) {
        s1 += `<path d="M${pts.join("L")}L${f1(xAt(sg[sg.length - 1]))},${base}L${f1(xAt(sg[0]))},${base}Z" style="fill:url(#${id})"/>`;
      }
      s1 += `<path d="M${pts.join("L")}" fill="none" style="stroke:${esc(color)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    if (ref) {
      const y = f1(yAt(clamp(ref.v, T.lo, T.hi)));
      s1 += `<line class="ch-ref" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
      if (ref.label) s1 += `<text class="ch-t" x="${W - padR}" y="${f1(y - 5)}" text-anchor="end">${esc(ref.label)}</text>`;
    }
    s1 += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"/>`;
    // emphasized last point
    let last = -1;
    for (let i = n - 1; i >= 0; i--) if (isNum(data[i].v)) { last = i; break; }
    if (last >= 0) s1 += `<circle class="ch-dot-last" cx="${f1(xAt(last))}" cy="${f1(yAt(data[last].v))}" r="4.5" style="fill:${esc(color)}"/>`;
    const maxLW = Math.max(...data.map((d) => textW(d.label == null ? "" : d.label)), 10);
    s1 += xLabels(data, labelIdx(n, pw, maxLW), xAt, W, padT, ph);
    s1 += hoverBits(padT, ph) + "</svg>";

    const hit = (x) => {
      if (x < padL - 12 || x > W) return null;
      const i = n > 1 ? clamp(Math.round((x - padL) / step), 0, n - 1) : 0;
      const d = data[i];
      const lab = d.label == null ? "" : esc(d.label);
      if (!isNum(d.v)) return { x: xAt(i), y: padT + ph / 2, html: `${lab} · <span>No data</span>` };
      return { x: xAt(i), y: yAt(d.v), dot: color, html: `<b>${esc(fmt(d.v))}</b>${lab ? " · " + lab : ""}` };
    };
    return { html: s1, hit };
  }

  /* ---------------- bars ---------------- */
  function drawBars(s, W, H) {
    const data = (s.data || []).map((d) => ({ label: d && d.label, v: d && isNum(d.v) ? d.v : null, color: d && d.color }));
    const fmt = fmtOf(s);
    const color = s.color || "var(--accent)";
    const vals = data.map((d) => d.v).filter(isNum);
    if (!data.length) return emptyOut("No data for this range");
    const ref = s.ref && isNum(s.ref.v) ? s.ref : null;
    const nT = H < 150 ? 3 : 4;
    let T;
    if (isNum(s.max) && s.max > 0) {
      const nt = niceTicks(0, s.max, nT);
      T = { lo: 0, hi: s.max, ticks: nt.ticks.filter((t) => t <= s.max + 1e-9) };
    } else {
      let hi = Math.max(0, ...vals, ref ? ref.v : 0);
      if (hi <= 0) hi = 1;
      T = niceTicks(0, hi * 1.04, nT);
    }
    const padT = 10, padB = 24, padR = 6;
    const padL = Math.ceil(Math.max(...T.ticks.map((t) => textW(fmt(t))), 16)) + 10;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(10, H - padT - padB);
    const n = data.length;
    const step = pw / n;
    const bw = Math.max(1, Math.min(step * 0.68, 30));
    const xAt = (i) => padL + step * (i + 0.5);
    const yAt = (v) => padT + ph - (clamp(v, T.lo, T.hi) / (T.hi - T.lo)) * ph;
    const base = padT + ph;

    let s1 = svgOpen(W, H);
    s1 += yAxis(T.ticks, yAt, padL, W - padR, fmt);
    data.forEach((d, i) => {
      if (!isNum(d.v) || d.v <= 0) return;
      const y = yAt(d.v);
      const h = Math.max(1, base - y);
      const x = xAt(i) - bw / 2;
      const r = Math.min(3, bw / 2, h);
      const c = d.color || color;
      s1 += `<path d="M${f1(x)},${f1(base)}V${f1(base - h + r)}Q${f1(x)},${f1(base - h)} ${f1(x + r)},${f1(base - h)}H${f1(x + bw - r)}Q${f1(x + bw)},${f1(base - h)} ${f1(x + bw)},${f1(base - h + r)}V${f1(base)}Z" style="fill:${esc(c)}"/>`;
    });
    if (ref) {
      const y = f1(yAt(ref.v));
      s1 += `<line class="ch-ref" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
      if (ref.label) s1 += `<text class="ch-t" x="${W - padR}" y="${f1(y - 5)}" text-anchor="end">${esc(ref.label)}</text>`;
    }
    s1 += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"/>`;
    const maxLW = Math.max(...data.map((d) => textW(d.label == null ? "" : d.label)), 10);
    s1 += xLabels(data, labelIdx(n, pw, maxLW), xAt, W, padT, ph);
    s1 += hoverBits(padT, ph) + "</svg>";

    const hit = (x) => {
      if (x < padL || x > W) return null;
      const i = clamp(Math.floor((x - padL) / step), 0, n - 1);
      const d = data[i];
      const lab = d.label == null ? "" : esc(d.label);
      if (!isNum(d.v)) return { x: xAt(i), y: base - 10, html: `${lab} · No data` };
      return { x: xAt(i), y: yAt(d.v), html: `<b>${esc(fmt(d.v))}</b>${lab ? " · " + lab : ""}` };
    };
    return { html: s1, hit };
  }

  /* ---------------- hypnogram ---------------- */
  const ROWS = [
    ["awake", "Awake"],
    ["rem", "REM"],
    ["light", "Light"],
    ["deep", "Deep"],
  ];
  function drawHypno(s, W, H) {
    const sl = s.sleep;
    if (!sl || !Array.isArray(sl.stages) || !sl.stages.length) return emptyOut("No sleep recorded");
    const stages = sl.stages.filter((x) => Array.isArray(x) && isNum(x[1]) && isNum(x[2]) && x[2] > x[1]).slice().sort((a, b) => a[1] - b[1]);
    if (!stages.length) return emptyOut("No sleep recorded");
    const total = Math.max(...stages.map((x) => x[2]));
    const st = new Date(sl.start);
    const startMin = isNaN(st) ? 0 : st.getHours() * 60 + st.getMinutes() + st.getSeconds() / 60;
    const padT = 6, padB = 24, padR = 8, padL = 50;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(40, H - padT - padB);
    const rh = ph / ROWS.length;
    const rowOf = {};
    ROWS.forEach(([k], i) => (rowOf[k] = i));
    const xAt = (m) => padL + (m / total) * pw;
    const yMid = (k) => padT + rh * (rowOf[k] + 0.5);

    let s1 = svgOpen(W, H);
    ROWS.forEach(([k, lab], i) => {
      const y = padT + rh * i;
      s1 += `<rect x="${padL}" y="${f1(y + 1)}" width="${f1(pw)}" height="${f1(rh - 2)}" rx="3" style="fill:var(--surface-2)"/>`;
      s1 += `<text class="ch-t" x="0" y="${f1(y + rh / 2 + 4)}">${lab}</text>`;
    });
    // connectors (step outline)
    let path = "";
    for (let i = 0; i < stages.length - 1; i++) {
      const a = stages[i], b = stages[i + 1];
      if (rowOf[a[0]] === undefined || rowOf[b[0]] === undefined) continue;
      if (Math.abs(b[1] - a[2]) > 1) continue;
      const x = f1(xAt(a[2]));
      path += `M${x},${f1(yMid(a[0]))}V${f1(yMid(b[0]))}`;
    }
    if (path) s1 += `<path d="${path}" fill="none" style="stroke:var(--muted)" stroke-opacity=".35" stroke-width="1"/>`;
    for (const [k, a, b] of stages) {
      if (rowOf[k] === undefined) continue;
      const y = padT + rh * rowOf[k] + rh * 0.16;
      const w = Math.max(1, xAt(b) - xAt(a));
      s1 += `<rect x="${f1(xAt(a))}" y="${f1(y)}" width="${f1(w)}" height="${f1(rh * 0.68)}" rx="${Math.min(2, w / 2)}" style="fill:var(--st-${k})"/>`;
    }
    // hour ticks
    const hourW = (pw / total) * 60;
    const every = [1, 2, 3, 4].find((h) => hourW * h >= 54) || 4;
    const first = (60 - (startMin % 60)) % 60;
    const base = padT + ph;
    for (let m = first; m <= total; m += 60) {
      const hourAbs = Math.round((startMin + m) / 60);
      if (hourAbs % every) continue;
      const x = xAt(m);
      s1 += `<line class="ch-axis" x1="${f1(x)}" x2="${f1(x)}" y1="${base}" y2="${base + 4}"/>`;
      const t = clk(startMin + m);
      const w = textW(t);
      s1 += `<text class="ch-t" x="${f1(clamp(x, padL + w / 2, W - w / 2))}" y="${base + 16}" text-anchor="middle">${t}</text>`;
    }
    s1 += `<line class="ch-cursor" x1="-10" x2="-10" y1="${padT}" y2="${base}"/>` + `</svg>`;

    const label = Object.fromEntries(ROWS);
    const hit = (x) => {
      if (x < padL || x > padL + pw) return null;
      const m = ((x - padL) / pw) * total;
      const sg = stages.find((g) => m >= g[1] && m < g[2]) || stages[stages.length - 1];
      return {
        x,
        y: yMid(sg[0]) - rh * 0.3,
        html: `<b>${esc(label[sg[0]] || sg[0])}</b> · ${clk(startMin + sg[1])}–${clk(startMin + sg[2])} (${dur(sg[2] - sg[1])})`,
      };
    };
    return { html: s1, hit };
  }

  /* ---------------- intraday heart rate ---------------- */
  function midnightOf(date) {
    if (typeof date === "string" && /^\d{4}-\d{2}-\d{2}/.test(date)) {
      const [y, m, d] = date.slice(0, 10).split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    const d = date instanceof Date ? new Date(date) : new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function drawHrday(s, W, H) {
    const hr = (s.hr || []).filter((p) => Array.isArray(p) && isNum(p[0]) && isNum(p[1])).slice().sort((a, b) => a[0] - b[0]);
    if (!hr.length) return emptyOut("No heart rate data for this day");
    const mid = midnightOf(s.date);
    const color = s.color || "var(--red)";
    const bpms = hr.map((p) => p[1]);
    const T = niceTicks(Math.min(...bpms) - 4, Math.max(...bpms) + 4, H < 160 ? 3 : 4);
    const padT = 18, padB = 24, padR = 8;
    const padL = Math.ceil(Math.max(...T.ticks.map((t) => textW(String(t))))) + 10;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(20, H - padT - padB);
    const xAt = (m) => padL + (clamp(m, 0, 1440) / 1440) * pw;
    const yAt = (v) => padT + ph - ((v - T.lo) / (T.hi - T.lo)) * ph;
    const base = padT + ph;
    const minsOf = (iso) => {
      const t = new Date(iso);
      return isNaN(t) ? null : (t - mid) / 60000;
    };

    let s1 = svgOpen(W, H);
    s1 += yAxis(T.ticks, yAt, padL, W - padR, String);
    const spans = [];
    const shade = (a, b, fill, op, lab) => {
      if (!isNum(a) || !isNum(b)) return;
      const x0 = xAt(Math.max(0, a)), x1 = xAt(Math.min(1440, b));
      if (x1 - x0 < 0.5) return;
      s1 += `<rect x="${f1(x0)}" y="${padT}" width="${f1(x1 - x0)}" height="${f1(ph)}" style="fill:${fill};fill-opacity:${op}"/>`;
      if (lab && x1 - x0 >= textW(lab) + 4) s1 += `<text class="ch-t" x="${f1(x0 + 2)}" y="${padT - 5}" style="fill:${fill}">${esc(lab)}</text>`;
    };
    if (s.sleep && s.sleep.start && s.sleep.end) {
      const a = minsOf(s.sleep.start), b = minsOf(s.sleep.end);
      shade(a, b, "var(--sleep)", 0.12, "Sleep");
      if (isNum(a) && isNum(b)) spans.push([a, b, "Sleep"]);
    }
    for (const w of s.workouts || []) {
      if (!w) continue;
      const a = minsOf(w.start);
      if (!isNum(a)) continue;
      const b = a + (w.durationMin || 0);
      shade(a, b, "var(--strain)", 0.16, w.type || "Workout");
      spans.push([a, b, w.type || "Workout"]);
    }
    let d = "";
    for (let i = 0; i < hr.length; i++) {
      const gap = i === 0 || hr[i][0] - hr[i - 1][0] > 40;
      d += `${gap ? "M" : "L"}${f1(xAt(hr[i][0]))},${f1(yAt(hr[i][1]))}`;
    }
    s1 += `<path d="${d}" fill="none" style="stroke:${esc(color)}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>`;
    s1 += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"/>`;
    const every = pw >= 440 ? 180 : 360;
    for (let m = 0; m <= 1440; m += every) {
      const x = xAt(m);
      const t = m === 720 ? "noon" : clk(m);
      const w = textW(t);
      s1 += `<line class="ch-axis" x1="${f1(x)}" x2="${f1(x)}" y1="${base}" y2="${base + 4}"/>`;
      s1 += `<text class="ch-t" x="${f1(clamp(x, padL + w / 2 - 4, W - w / 2))}" y="${base + 16}" text-anchor="middle">${t}</text>`;
    }
    s1 += hoverBits(padT, ph) + "</svg>";

    const hit = (x) => {
      if (x < padL || x > padL + pw) return null;
      const m = ((x - padL) / pw) * 1440;
      let lo = 0, hi = hr.length - 1;
      while (hi - lo > 1) {
        const c = (lo + hi) >> 1;
        if (hr[c][0] < m) lo = c; else hi = c;
      }
      const p = Math.abs(hr[lo][0] - m) <= Math.abs(hr[hi][0] - m) ? hr[lo] : hr[hi];
      const sp = spans.find((z) => p[0] >= z[0] && p[0] < z[1]);
      return {
        x: xAt(p[0]),
        y: yAt(p[1]),
        dot: color,
        html: `<b>${p[1]} bpm</b> · ${clk(p[0])}${sp ? " · " + esc(sp[2]) : ""}`,
      };
    };
    return { html: s1, hit };
  }

  /* ---------------- bedtime → wake range ---------------- */
  function drawRange(s, W, H) {
    const data = (s.data || []).map((d) => ({
      label: d && d.label,
      start: d && isNum(d.start) ? d.start : null,
      end: d && isNum(d.end) ? d.end : null,
    }));
    const ok = data.filter((d) => isNum(d.start) && isNum(d.end));
    if (!ok.length) return emptyOut("No sleep recorded in this range");
    const color = s.color || "var(--sleep)";
    const lo0 = Math.min(...ok.map((d) => d.start)) - 20;
    const hi0 = Math.max(...ok.map((d) => d.end)) + 20;
    const lo = Math.floor(lo0 / 60) * 60;
    const hi = Math.ceil(hi0 / 60) * 60;
    const padT = 8, padB = 24, padR = 6;
    const padL = Math.ceil(textW("10:00 pm")) - 6;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(20, H - padT - padB);
    const yAt = (m) => padT + ((m - lo) / (hi - lo)) * ph;
    const n = data.length;
    const step = pw / n;
    const bw = Math.max(2, Math.min(step * 0.56, 20));
    const xAt = (i) => padL + step * (i + 0.5);
    const hourPx = (ph / (hi - lo)) * 60;
    const every = ([1, 2, 3, 4].find((h) => hourPx * h >= 24) || 4) * 60;

    let s1 = svgOpen(W, H);
    for (let m = lo; m <= hi; m += 60) {
      if (((m % every) + every) % every) continue;
      const y = f1(yAt(m));
      s1 += `<line class="ch-grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
      s1 += `<text class="ch-t" x="${padL - 7}" y="${f1(+y + 3.5)}" text-anchor="end">${clk(m)}</text>`;
    }
    data.forEach((d, i) => {
      if (!isNum(d.start) || !isNum(d.end) || d.end <= d.start) return;
      const y0 = yAt(d.start), y1 = yAt(d.end);
      s1 += `<rect x="${f1(xAt(i) - bw / 2)}" y="${f1(y0)}" width="${f1(bw)}" height="${f1(Math.max(1, y1 - y0))}" rx="${f1(Math.min(bw / 2, 4))}" style="fill:${esc(color)}"/>`;
    });
    const maxLW = Math.max(...data.map((d) => textW(d.label == null ? "" : d.label)), 10);
    s1 += xLabels(data, labelIdx(n, pw, maxLW), xAt, W, padT, ph);
    s1 += hoverBits(padT, ph) + "</svg>";

    const hit = (x) => {
      if (x < padL || x > W) return null;
      const i = clamp(Math.floor((x - padL) / step), 0, n - 1);
      const d = data[i];
      const lab = d.label == null ? "" : esc(d.label);
      if (!isNum(d.start) || !isNum(d.end)) return { x: xAt(i), y: padT + ph / 2, html: `${lab} · No sleep` };
      return { x: xAt(i), y: yAt(d.start), html: `<b>${lab}</b> · ${clk(d.start)} → ${clk(d.end)} (${dur(d.end - d.start)})` };
    };
    return { html: s1, hit };
  }

  /* ---------------- strain line over recovery bars ---------------- */
  function drawStrainline(s, W, H) {
    const data = (s.data || []).map((d) => ({
      label: d && d.label,
      strain: d && isNum(d.strain) ? d.strain : d && isNum(d.v) ? d.v : null,
      recovery: d && isNum(d.recovery) ? d.recovery : null,
      band: d && typeof d.band === "string" ? d.band : null,
      color: d && typeof d.color === "string" && d.color ? d.color : null,
    }));
    if (!data.some((d) => isNum(d.strain) || isNum(d.recovery))) return emptyOut("No data for this range");
    const BAND = { green: "var(--green)", yellow: "var(--yellow)", red: "var(--red)" };
    const recCol = (v) => (v >= 67 ? "var(--green)" : v >= 34 ? "var(--yellow)" : "var(--red)");
    const barCol = (d) => d.color || BAND[d.band] || recCol(d.recovery);
    const legH = 22;
    const padT = 8 + legH, padB = 24;
    const padL = Math.ceil(textW("21")) + 10;
    const padR = Math.ceil(textW("100%")) + 8;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(20, H - padT - padB);
    const n = data.length;
    const step = pw / n;
    const bw = Math.max(1.5, Math.min(step * 0.6, 22));
    const xAt = (i) => padL + step * (i + 0.5);
    const yS = (v) => padT + ph - (clamp(v, 0, 21) / 21) * ph;
    const yR = (v) => padT + ph - (clamp(v, 0, 100) / 100) * ph;
    const base = padT + ph;

    let s1 = svgOpen(W, H);
    // legend
    s1 += `<g class="ch-leg">` +
      `<line x1="0" x2="16" y1="9" y2="9" style="stroke:var(--strain)" stroke-width="2.5" stroke-linecap="round"/>` +
      `<text class="ch-t strong" x="22" y="12.5">Strain 0–21</text>` +
      `<rect x="${f1(22 + textW("Strain 0–21") + 12)}" y="3" width="10" height="12" rx="2" style="fill:var(--muted);fill-opacity:.55"/>` +
      `<text class="ch-t strong" x="${f1(22 + textW("Strain 0–21") + 28)}" y="12.5">Recovery %</text></g>`;
    for (const t of [0, 7, 14, 21]) {
      const y = f1(yS(t));
      s1 += `<line class="ch-grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>`;
      s1 += `<text class="ch-t" x="${padL - 7}" y="${f1(+y + 3.5)}" text-anchor="end" style="fill:var(--strain)">${t}</text>`;
      const rv = Math.round((t / 21) * 100);
      s1 += `<text class="ch-t" x="${W - padR + 7}" y="${f1(+y + 3.5)}">${rv}%</text>`;
    }
    data.forEach((d, i) => {
      if (!isNum(d.recovery) || d.recovery <= 0) return;
      const y = yR(d.recovery);
      const h = Math.max(1, base - y);
      const r = Math.min(3, bw / 2, h);
      const x = xAt(i) - bw / 2;
      s1 += `<path d="M${f1(x)},${f1(base)}V${f1(base - h + r)}Q${f1(x)},${f1(base - h)} ${f1(x + r)},${f1(base - h)}H${f1(x + bw - r)}Q${f1(x + bw)},${f1(base - h)} ${f1(x + bw)},${f1(base - h + r)}V${f1(base)}Z" style="fill:${esc(barCol(d))};fill-opacity:.32"/>`;
    });
    let path = "";
    let prev = false;
    data.forEach((d, i) => {
      if (!isNum(d.strain)) { prev = false; return; }
      path += `${prev ? "L" : "M"}${f1(xAt(i))},${f1(yS(d.strain))}`;
      prev = true;
    });
    if (path) s1 += `<path d="${path}" fill="none" style="stroke:var(--strain)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (n <= 31) data.forEach((d, i) => {
      if (isNum(d.strain)) s1 += `<circle cx="${f1(xAt(i))}" cy="${f1(yS(d.strain))}" r="${n <= 14 ? 3.5 : 2.2}" style="fill:var(--strain);stroke:var(--surface);stroke-width:1.5"/>`;
    });
    s1 += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${base}" y2="${base}"/>`;
    const maxLW = Math.max(...data.map((d) => textW(d.label == null ? "" : d.label)), 10);
    s1 += xLabels(data, labelIdx(n, pw, maxLW), xAt, W, padT, ph);
    s1 += hoverBits(padT, ph) + "</svg>";

    const hit = (x) => {
      if (x < padL || x > W - padR + 4) return null;
      const i = clamp(Math.floor((x - padL) / step), 0, n - 1);
      const d = data[i];
      const lab = d.label == null ? "" : esc(d.label);
      const sv = isNum(d.strain) ? (Math.round(d.strain * 10) / 10).toFixed(1) : "–";
      const rv = isNum(d.recovery) ? Math.round(d.recovery) + "%" : "–";
      return {
        x: xAt(i),
        y: isNum(d.strain) ? yS(d.strain) : padT + ph / 2,
        dot: isNum(d.strain) ? "var(--strain)" : null,
        html: `${lab ? lab + " · " : ""}Strain <b>${sv}</b> · Recovery <b>${rv}</b>`,
      };
    };
    return { html: s1, hit };
  }

  /* ---------------- 0–21 horizontal gauge with target zone ---------------- */
  function drawGauge21(s, W, H) {
    const v = isNum(s.value) ? clamp(s.value, 0, 21) : null;
    const tg = Array.isArray(s.target) && isNum(s.target[0]) && isNum(s.target[1]) ? [clamp(Math.min(s.target[0], s.target[1]), 0, 21), clamp(Math.max(s.target[0], s.target[1]), 0, 21)] : null;
    const color = s.color || "var(--strain)";
    const padL = 8, padR = 8;
    const pw = Math.max(10, W - padL - padR);
    const xAt = (x) => padL + (x / 21) * pw;
    const barH = 10;
    const barY = Math.max(22, Math.round(H / 2 - barH / 2) - 2);
    let s1 = svgOpen(W, H);
    s1 += `<rect x="${padL}" y="${barY}" width="${f1(pw)}" height="${barH}" rx="${barH / 2}" style="fill:var(--surface-2);stroke:var(--line)" stroke-width="1"/>`;
    if (tg && tg[1] > tg[0]) {
      const x0 = xAt(tg[0]), x1 = xAt(tg[1]);
      s1 += `<rect x="${f1(x0)}" y="${barY - 3}" width="${f1(x1 - x0)}" height="${barH + 6}" rx="3" style="fill:${esc(color)};fill-opacity:.2;stroke:${esc(color)};stroke-opacity:.6" stroke-width="1" stroke-dasharray="3 2"/>`;
      const lab = `Target ${f1(tg[0])}–${f1(tg[1])}`;
      const w = textW(lab);
      s1 += `<text class="ch-t strong" x="${f1(clamp((x0 + x1) / 2, w / 2, W - w / 2))}" y="${barY - 9}" text-anchor="middle">${esc(lab)}</text>`;
    }
    if (v != null && v > 0) s1 += `<rect x="${padL}" y="${barY}" width="${f1(Math.max(barH, xAt(v) - padL))}" height="${barH}" rx="${barH / 2}" style="fill:${esc(color)}"/>`;
    if (v != null) {
      const x = xAt(v);
      s1 += `<line x1="${f1(x)}" x2="${f1(x)}" y1="${barY - 6}" y2="${barY + barH + 6}" style="stroke:var(--ink)" stroke-width="2.5" stroke-linecap="round"/>`;
    }
    for (const t of [0, 7, 14, 21]) {
      const x = xAt(t);
      const a = t === 0 ? "start" : t === 21 ? "end" : "middle";
      s1 += `<text class="ch-t" x="${f1(x)}" y="${barY + barH + 18}" text-anchor="${a}">${t}</text>`;
    }
    s1 += "</svg>";
    return { html: s1, hit: null };
  }

  /* ---------------- horizontal bars (HTML, no measuring needed) ---------------- */
  function hbars(s) {
    const data = (s.data || []).filter(Boolean);
    const max = isNum(s.max) && s.max > 0 ? s.max : Math.max(1e-9, ...data.map((d) => (isNum(d.v) ? d.v : 0)));
    if (!data.length) return `<div class="chart chart-hb"><div class="ch-empty" style="height:64px">No data</div></div>`;
    const rows = data
      .map((d) => {
        const p = isNum(d.v) && max > 0 ? clamp((d.v / max) * 100, 0, 100) : 0;
        const c = d.color || s.color || "var(--accent)";
        const disp = d.display != null ? d.display : defFmt(d.v);
        return `<div class="hb-row"><span class="hb-l">${esc(d.label)}</span><span class="hb-t"><span class="hb-f" style="width:${p.toFixed(1)}%;--c:${esc(c)}"></span></span><span class="hb-v">${esc(disp)}</span></div>`;
      })
      .join("");
    return `<div class="chart chart-hb"><div class="hb">${rows}</div></div>`;
  }

  /* ---------------- ring gauge ---------------- */
  /* thick ~270° dial: rounded caps, track, big condensed value + small label */
  function dial(o) {
    const max = isNum(o.max) && o.max > 0 ? o.max : 100;
    const size = isNum(o.size) && o.size > 40 ? o.size : 156;
    const color = o.color || "var(--accent)";
    const has = isNum(o.value);
    const frac = has ? clamp(o.value / max, 0, 1) : 0;
    const sw = Math.max(7, Math.round(size * 0.085));
    const r = (size - sw) / 2 - 1;
    const cx = size / 2;
    const SWEEP = 270;
    const a0 = 135; // degrees from +x axis, clockwise (SVG); gap centred at bottom
    const pt = (deg) => {
      const t = (deg * Math.PI) / 180;
      return [cx + r * Math.cos(t), cx + r * Math.sin(t)];
    };
    const arcPath = (from, to) => {
      const [x0, y0] = pt(from), [x1, y1] = pt(to);
      const large = to - from > 180 ? 1 : 0;
      return `M${f1(x0)},${f1(y0)}A${f1(r)},${f1(r)} 0 ${large} 1 ${f1(x1)},${f1(y1)}`;
    };
    const txt = o.display != null && o.display !== "" ? String(o.display) : has ? String(Math.round(o.value)) : "–";
    const unit = o.unit ? String(o.unit) : "";
    const len = txt.length + (unit ? unit.length * 0.5 : 0);
    const ratio = len > 5 ? 0.2 : len > 4 ? 0.24 : 0.28;
    const fs = Math.round(size * ratio);
    let arc = "";
    if (has && frac > 0) arc = `<path class="ring-arc dial-arc" d="${arcPath(a0, a0 + Math.max(0.5, SWEEP * frac))}" fill="none" stroke-width="${sw}" stroke-linecap="round" style="stroke:${esc(color)}"/>`;
    // optional target zone ticks on the track (e.g. strain target)
    let zone = "";
    if (Array.isArray(o.target) && isNum(o.target[0]) && isNum(o.target[1])) {
      const z0 = a0 + SWEEP * clamp(o.target[0] / max, 0, 1), z1 = a0 + SWEEP * clamp(o.target[1] / max, 0, 1);
      if (z1 > z0) zone = `<path class="dial-zone" d="${arcPath(z0, z1)}" fill="none" stroke-width="${Math.max(2, Math.round(sw * 0.28))}" stroke-linecap="butt" transform="translate(0 0)"/>`;
    }
    const aria = o.aria || `${o.label ? o.label + ": " : ""}${txt}${unit}${has && max === 100 && o.display == null && !unit ? " of 100" : ""}`;
    return (
      `<div class="ring-wrap dial-wrap"><div class="ring dial" style="width:${size}px;height:${size}px;--c:${esc(color)}">` +
      `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(aria)}">` +
      `<path class="ring-track dial-track" d="${arcPath(a0, a0 + SWEEP)}" fill="none" stroke-width="${sw}" stroke-linecap="round"/>${arc}${zone}</svg>` +
      `<div class="ring-c"><div class="ring-v dial-v" style="font-size:${fs}px;font-size:min(${fs}px, ${(ratio * 100).toFixed(1)}cqi)">${esc(txt)}${unit ? `<span class="dial-u">${esc(unit)}</span>` : ""}</div>` +
      `${o.label ? `<div class="ring-l dial-l">${esc(o.label)}</div>` : ""}</div></div>` +
      `${o.sub ? `<div class="ring-sub">${esc(o.sub)}</div>` : ""}</div>`
    );
  }

  function ring(o) {
    o = o || {};
    if (o.variant === "dial") return dial(o);
    const max = isNum(o.max) && o.max > 0 ? o.max : 100;
    const size = isNum(o.size) && o.size > 20 ? o.size : 148;
    const color = o.color || "var(--accent)";
    const has = isNum(o.value);
    const frac = has ? clamp(o.value / max, 0, 1) : 0;
    const sw = Math.max(5, Math.round(size * 0.075));
    const r = (size - sw) / 2 - 1;
    const c = 2 * Math.PI * r;
    const cx = size / 2;
    const txt = o.display != null && o.display !== "" ? String(o.display) : has ? String(Math.round(o.value)) : "–";
    const fs = Math.round(size * (txt.length > 5 ? 0.17 : txt.length > 3 ? 0.21 : 0.28));
    const showL = o.label && size >= 92;
    const arc = has && frac > 0
      ? `<circle class="ring-arc" cx="${cx}" cy="${cx}" r="${f1(r)}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${f1(c)}" stroke-dashoffset="${f1(c * (1 - frac))}" transform="rotate(-90 ${cx} ${cx})" style="stroke:${esc(color)}"/>`
      : "";
    const aria = `${o.label ? o.label + ": " : ""}${txt}${has && max === 100 && o.display == null ? " of 100" : ""}`;
    return (
      `<div class="ring-wrap"><div class="ring" style="width:${size}px;height:${size}px">` +
      `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(aria)}">` +
      `<circle class="ring-track" cx="${cx}" cy="${cx}" r="${f1(r)}" fill="none" stroke-width="${sw}"/>${arc}</svg>` +
      `<div class="ring-c"><div class="ring-v" style="font-size:${fs}px">${esc(txt)}</div>${showL ? `<div class="ring-l">${esc(o.label)}</div>` : ""}</div></div>` +
      `${o.sub ? `<div class="ring-sub">${esc(o.sub)}</div>` : ""}</div>`
    );
  }

  /* ---------------- fitness / fatigue / form (performance management) ----------------
     spec: {type:"pmc", data:[{label, ctl, atl, tsb}], height?}
     CTL & ATL as lines on a shared load axis, TSB as bars around zero; last day emphasised. */
  function drawPmc(s, W, H) {
    const num = (x) => (isNum(x) ? x : null);
    const data = (s.data || []).map((d) => ({ label: d && d.label, ctl: num(d && d.ctl), atl: num(d && d.atl), tsb: num(d && d.tsb) }));
    const all = [];
    for (const d of data) for (const k of ["ctl", "atl", "tsb"]) if (isNum(d[k])) all.push(d[k]);
    if (!all.length) return emptyOut("No training load yet");
    const C_CTL = "var(--strain)", C_ATL = "var(--z4)";
    const tsbCol = (v) => (v >= 0 ? "var(--green)" : v >= -10 ? "var(--yellow)" : "var(--red)");
    const legH = 22;
    let lo = Math.min(0, ...all), hi = Math.max(1, ...all);
    const pad = (hi - lo) * 0.06;
    const T = niceTicks(lo - (lo < 0 ? pad : 0), hi + pad, H < 190 ? 3 : 4);
    const fmt = (v) => String(Math.round(v));
    const padT = 8 + legH, padB = 24, padR = 10;
    const padL = Math.ceil(Math.max(...T.ticks.map((t) => textW(fmt(t))), 16)) + 10;
    const pw = Math.max(10, W - padL - padR);
    const ph = Math.max(20, H - padT - padB);
    const n = data.length;
    const step = pw / Math.max(1, n);
    const xAt = (i) => padL + step * (i + 0.5);
    const yAt = (v) => padT + ph - ((v - T.lo) / (T.hi - T.lo)) * ph;
    const y0 = yAt(clamp(0, T.lo, T.hi));
    const bw = Math.max(1, Math.min(step * 0.62, 14));

    let s1 = svgOpen(W, H);
    // legend
    const items = [["Fitness (CTL)", C_CTL, "line"], ["Fatigue (ATL)", C_ATL, "line"], ["Form (TSB)", "var(--green)", "bar"]];
    let lx = 0;
    s1 += `<g class="ch-leg">`;
    for (const [t, c, kind] of items) {
      const w = textW(t) + 26;
      if (lx + w > W) break;
      s1 += kind === "line"
        ? `<line x1="${f1(lx)}" x2="${f1(lx + 14)}" y1="9" y2="9" style="stroke:${c}" stroke-width="2.5" stroke-linecap="round"/>`
        : `<rect x="${f1(lx + 2)}" y="3" width="10" height="12" rx="2" style="fill:${c};fill-opacity:.5"/>`;
      s1 += `<text class="ch-t strong" x="${f1(lx + 20)}" y="12.5">${esc(t)}</text>`;
      lx += w + 6;
    }
    s1 += `</g>`;
    s1 += yAxis(T.ticks, yAt, padL, W - padR, fmt);
    // TSB bars around zero
    data.forEach((d, i) => {
      if (!isNum(d.tsb) || d.tsb === 0) return;
      const y = yAt(clamp(d.tsb, T.lo, T.hi));
      const top = Math.min(y, y0), h = Math.max(1, Math.abs(y - y0));
      const last = i === n - 1;
      s1 += `<rect x="${f1(xAt(i) - bw / 2)}" y="${f1(top)}" width="${f1(bw)}" height="${f1(h)}" rx="${f1(Math.min(2, bw / 2))}" style="fill:${tsbCol(d.tsb)};fill-opacity:${last ? 0.9 : 0.38}"/>`;
    });
    s1 += `<line class="ch-axis" x1="${padL}" x2="${W - padR}" y1="${f1(y0)}" y2="${f1(y0)}"/>`;
    const line = (k, c, wdt) => {
      let d = "", prev = false;
      data.forEach((p, i) => {
        if (!isNum(p[k])) { prev = false; return; }
        d += `${prev ? "L" : "M"}${f1(xAt(i))},${f1(yAt(p[k]))}`;
        prev = true;
      });
      return d ? `<path d="${d}" fill="none" style="stroke:${c}" stroke-width="${wdt}" stroke-linejoin="round" stroke-linecap="round"/>` : "";
    };
    s1 += line("atl", C_ATL, 1.8) + line("ctl", C_CTL, 2.6);
    // last point emphasised
    const L = n - 1;
    if (L >= 0) {
      for (const [k, c] of [["atl", C_ATL], ["ctl", C_CTL]]) {
        if (isNum(data[L][k])) s1 += `<circle class="ch-dot-last" cx="${f1(xAt(L))}" cy="${f1(yAt(data[L][k]))}" r="4.5" style="fill:${c}"/>`;
      }
    }
    if (T.lo < 0) s1 += `<text class="ch-t" x="${W - padR}" y="${f1(Math.min(padT + ph - 4, y0 + 13))}" text-anchor="end">fresh ↑ · tired ↓</text>`;
    const maxLW = Math.max(...data.map((d) => textW(d.label == null ? "" : d.label)), 10);
    s1 += xLabels(data, labelIdx(n, pw, maxLW), xAt, W, padT, ph);
    s1 += hoverBits(padT, ph) + "</svg>";

    const r1 = (v) => (isNum(v) ? (Math.round(v * 10) / 10).toFixed(1) : "–");
    const hit = (x) => {
      if (x < padL - 8 || x > W) return null;
      const i = clamp(Math.floor((x - padL) / step), 0, n - 1);
      const d = data[i];
      const lab = d.label == null ? "" : esc(d.label) + " · ";
      return {
        x: xAt(i),
        y: isNum(d.ctl) ? yAt(d.ctl) : padT + ph / 2,
        dot: isNum(d.ctl) ? C_CTL : null,
        html: `${lab}Fitness <b>${r1(d.ctl)}</b> · Fatigue <b>${r1(d.atl)}</b> · Form <b>${isNum(d.tsb) ? (d.tsb > 0 ? "+" : d.tsb < 0 ? "−" : "") + r1(Math.abs(d.tsb)) : "–"}</b>`,
      };
    };
    return { html: s1, hit };
  }

  /* ---------------- acute:chronic workload ratio gauge ----------------
     spec: {type:"acwr", value, height?}; zones <0.8, 0.8–1.3, 1.3–1.5, >1.5 on a 0–2 scale */
  const ACWR_Z = [
    [0, 0.8, "var(--z1)", "Detraining", "Load is below what you're used to."],
    [0.8, 1.3, "var(--green)", "Sweet spot", "Load matches your base."],
    [1.3, 1.5, "var(--yellow)", "Caution", "Load is rising faster than your base."],
    [1.5, 2, "var(--red)", "High risk", "Load spike well above your base."],
  ];
  function drawAcwr(s, W, H) {
    const MAX = 2;
    const raw = isNum(s.value) ? s.value : null;
    const v = raw == null ? null : clamp(raw, 0, MAX);
    const padL = 8, padR = 8;
    const pw = Math.max(10, W - padL - padR);
    const xAt = (x) => padL + (x / MAX) * pw;
    const barH = 12;
    const barY = Math.max(24, Math.round(H / 2 - barH / 2) - 4);
    let s1 = svgOpen(W, H);

    ensureSel();
    S.booted = true;
    render();

    root.addEventListener("hashchange", () => {
      const k = fromHash();
      if (k && k !== S.view) go(k);
    });
    let rt = null, lastW = 0;
    const remount = () => {
      clearTimeout(rt);
      rt = setTimeout(() => {
        const el = $("view");
        if (el && root.Charts) root.Charts.mount(el);
      }, 120);
    };
    root.addEventListener("resize", remount);
    const el = $("view");
    if (el && root.ResizeObserver) {
      new ResizeObserver((ents) => {
        const w = Math.round(ents[0].contentRect.width);
        if (w !== lastW) { lastW = w; remount(); }
      }).observe(el);
    }
    // inside Claude: list the coach only if the sample capability is there
    if (env() === "claude") {
      setTimeout(() => {
        Promise.resolve()
          .then(() => root.claude.use("sample"))
          .then((fn) => { S.sampleOk = !!fn; })
          .catch(() => { S.sampleOk = false; })
          .then(() => renderChrome());
      }, 0);
    }
    // never block first paint on storage
    setTimeout(() => {
      initStorage().catch((e) => {
        console.warn(e);
        S.storageReady = true;
      });
    }, 0);
  }

  /* ---------------- bands & targets ---------------- */
  function bandOf(v) {
    if (!isNum(v)) return null;
    return v >= 67 ? "green" : v >= 34 ? "yellow" : "red";
  }
  function bandColor(band) {
    return band === "green" ? "var(--green)" : band === "yellow" ? "var(--yellow)" : band === "red" ? "var(--red)" : "var(--muted)";
  }
  /* derived target for the selected day when the engine provides one, else by recovery band */
  function strainTarget(rec) {
    if (rec == null || isNum(rec)) {
      try {
        const i = idx(S.sel);
        const d = i >= 0 ? derived()[i] : null;
        if (d && Array.isArray(d.strainTarget) && isNum(d.strainTarget[0]) && isNum(d.strainTarget[1]) && (rec == null || d.recovery === rec)) return d.strainTarget.slice(0, 2);
      } catch (e) {}
    } else if (rec && typeof rec === "object" && Array.isArray(rec.strainTarget)) return rec.strainTarget.slice(0, 2);
    const r = isNum(rec) ? rec : rec && typeof rec === "object" ? rec.recovery : null;
    return !isNum(r) ? [10, 14] : r >= 67 ? [14, 18] : r >= 34 ? [10, 14] : [0, 10];
  }

  /* ---------------- coach on the website: the user's own Anthropic API key ----------------
     Same call shape as claude.use("sample"): fn(messages, {onText}) → {text}; errors carry .code */
  const KEY_LS = "cadence.anthropicKey";
  const apiKey = {
    get() {
      try {
        return (lsOk && root.localStorage.getItem(KEY_LS)) || "";
      } catch (e) {
        return "";
      }
    },
    set(k) {
      k = String(k || "").trim();
      try {
        if (!lsOk) return false;
        if (k) root.localStorage.setItem(KEY_LS, k);
        else root.localStorage.removeItem(KEY_LS);
        return true;
      } catch (e) {
        return false;
      }
    },
  };
  const apiErr = (code, message, text) => Object.assign(new Error(message), { code, text });
  async function apiSample(messages, opts) {
    const key = apiKey.get();
    if (!key) throw apiErr("not_granted", "No API key set.");
    const onText = opts && typeof opts.onText === "function" ? opts.onText : null;
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({ model: "claude-sonnet-5-5", max_tokens: 1500, stream: true, messages }),
      });
    } catch (e) {
      throw apiErr("network", "Couldn't reach Anthropic. Check your connection.");
    }
    if (!res.ok) {
      let msg = "";
      try {
        const j = await res.json();
        msg = (j && j.error && j.error.message) || "";
      } catch (e) {}
      const code = res.status === 401 || res.status === 403 ? "bad_key" : res.status === 429 ? "rate_limited" : res.status === 529 ? "overloaded" : "http_" + res.status;
      throw apiErr(code, msg || "Request failed (" + res.status + ").");
    }
    let text = "";
    const reader = res.body && res.body.getReader ? res.body.getReader() : null;
    if (!reader) {
      throw apiErr("stream", "This browser can't read streamed answers.");
    }
    const dec = new TextDecoder();
    let buf = "";
    const handle = (block) => {
      let data = "";
      for (const line of block.split(/\r?\n/)) if (line.startsWith("data:")) data += line.slice(5).trim();
      if (!data) return;
      let ev;
      try {
        ev = JSON.parse(data);
      } catch (e) {
        return;
      }
      if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") {
        text += ev.delta.text || "";
        if (onText) try { onText({ text }); } catch (e) {}
      } else if (ev.type === "error") {
        throw apiErr((ev.error && ev.error.type) || "stream", (ev.error && ev.error.message) || "The answer stopped early.", text);
      }
    };
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let k;
        while ((k = buf.search(/\r?\n\r?\n/)) >= 0) {
          const block = buf.slice(0, k);
          buf = buf.slice(k).replace(/^\r?\n\r?\n/, "");
          handle(block);
        }
      }
      if (buf.trim()) handle(buf);
    } catch (e) {
      if (e && e.code) throw e;
      throw apiErr("network", "The connection dropped.", text);
    }
    return { text };
  }

  /* ---------------- export ---------------- */
  root.App = {
    days,
    derived,
    sel: () => S.sel || (ensureSel(), S.sel),
    setSel,
    idx,
    profile,
    saveProfile,
    mode: () => S.mode,
    getEntry,
    saveEntry,
    go,
    view: () => S.view,
    rerender,
    toast,
    on,
    onInput,
    onSubmit,
    esc,
    fmt,
    bandColor,
    bandOf,
    recColor: (v) => bandColor(bandOf(v)),
    strainTarget,
    sample: {
      use: async () => {
        if (env() === "web") return apiKey.get() ? apiSample : null;
        try {
          return root.claude && root.claude.use ? (await root.claude.use("sample")) || null : null;
        } catch (e) {
          return null;
        }
      },
    },
    apiKey,
    coachOn: () => coachOn(),
    ageOn,
    env,
    importDays,
    clearImported,
    exportJSON,
    persistKind: () => S.persist,
    storageReady: () => S.storageReady,
    icon,
    boot,
  };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* Cadence v2 views: Overview, Sleep, Recovery, Strain.
 * Codes only against CONTRACT-v2.md / CONTRACT.md (App.*, Charts.*, CadenceEngine derived fields, CSS vocabulary). */
(function () {
  "use strict";
  const Views = (window.Views = window.Views || {});
  delete Views.today; // overview replaces it

  /* ---------- small helpers ---------- */
  const isNum = (v) => typeof v === "number" && isFinite(v);
  const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null);
  const DASH = "–";
  const esc = (s) => App.esc(s == null ? "" : String(s));
  const show = (v, dp) => (isNum(v) ? App.fmt.num(v, dp || 0) : DASH);
  const mins = (m) => (isNum(m) ? App.fmt.mins(Math.round(m)) : DASH);
  const label = (date) => App.fmt.short(date);
  const fStrain = (v) => (!isNum(v) ? DASH : App.fmt && App.fmt.strain ? App.fmt.strain(v) : (Math.round(v * 10) / 10).toFixed(1));
  const bandOf = (v) => (!isNum(v) ? null : v >= 67 ? "green" : v >= 34 ? "yellow" : "red");
  const bandColor = (b) => (App.bandColor ? App.bandColor(b) : b ? `var(--${b})` : "var(--muted)");
  const perfColor = (v) => (!isNum(v) ? "var(--muted)" : v >= 85 ? "var(--green)" : v >= 70 ? "var(--yellow)" : "var(--red)");
  const pctOf = (v) => (isNum(v) ? (v <= 1 && v > 0 ? v * 100 : v) : null); // accepts 0–1 or 0–100
  const needTotal = (d) => (!d ? null : isNum(d.sleepNeed) ? d.sleepNeed : d.sleepNeed && isNum(d.sleepNeed.total) ? d.sleepNeed.total : null);
  const toDate = (x) => (x instanceof Date ? x : x != null && x !== "" ? new Date(x) : null);
  const clockOf = (x) => {
    const t = toDate(x);
    return t && !isNaN(t) ? App.fmt.clock(t) : DASH;
  };
  const isToday = (date) => {
    const n = new Date();
    const p = (x) => String(x).padStart(2, "0");
    return date === `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())}`;
  };

  /** Indices of the window of n days ending at ctx.i (inclusive). */
  function windowIdx(ctx, n) {
    const out = [];
    for (let k = Math.max(0, ctx.i - n + 1); k <= ctx.i; k++) out.push(k);
    return out;
  }

  function stat(lbl, value, unit, sub) {
    return `<div class="stat"><div class="stat-label">${lbl}</div>` +
      `<div class="stat-value num">${value}${unit && value !== DASH ? `<span class="stat-unit">${unit}</span>` : ""}</div>` +
      (sub ? `<div class="stat-sub">${sub}</div>` : "") + `</div>`;
  }
  const head = (title, meta) => `<div class="card-head"><h2>${title}</h2>${meta ? `<div class="card-meta">${meta}</div>` : ""}</div>`;
  const chip = (level, text) => `<span class="chip ${level}">${text}</span>`;
  const strainChip = (v) => `<span class="chip cv-schip num">${fStrain(v)}</span>`;
  const emptyCard = (title, text, cls) => `<div class="card ${cls || ""}"><div class="empty"><h2>${title}</h2><p class="muted">${text}</p></div></div>`;

  function pageHead(title, ctx, sub) {
    const date = ctx.day ? ctx.day.date : App.sel ? App.sel() : "";
    return `<div class="page-head"><h1>${title}</h1><div class="sub">${sub || (date ? esc(App.fmt.day(date)) : "")}</div></div>`;
  }

  function emptyPage(title, ctx, cls) {
    const days = ctx.days || [];
    const last = days.length ? days[days.length - 1].date : null;
    return `<div class="page ${cls}">${pageHead(title, ctx)}<div class="empty cv-emptypage">` +
      `<h2>Nothing recorded this day</h2><p class="muted">No health data was synced for this date. Pick another day, or import data from the Data page.</p>` +
      (last ? `<button class="btn primary" data-action="core-sel" data-date="${esc(last)}">Go to ${esc(App.fmt.day(last))}</button>` : "") +
      `</div></div>`;
  }

  /** Mean/SD of a raw day field over the 30 days before index i. */
  function pastStats(ctx, i, field) {
    const vals = [];
    for (let k = Math.max(0, i - 30); k < i; k++) {
      const v = ctx.days[k] && ctx.days[k][field];
      if (isNum(v)) vals.push(v);
    }
    if (vals.length < 5) return null;
    const m = avg(vals);
    return { mean: m, sd: Math.sqrt(vals.reduce((s, x) => s + (x - m) ** 2, 0) / (vals.length - 1)) };
  }

  /** {value, baseline, sd} for a vital, from monitor first, then contributors, then raw day. */
  function vital(ctx, key) {
    const d = ctx.d || {};
    const m = (d.monitor && d.monitor[key]) || {};
    const c = (d.contributors && d.contributors[key]) || {};
    const raw = { hrv: "hrv", rhr: "restingHr", resp: "respRate" }[key];
    const value = isNum(m.value) ? m.value : isNum(c.value) ? c.value : ctx.day && isNum(ctx.day[raw]) ? ctx.day[raw] : null;
    const legacy = { hrv: d.hrvBaseline, rhr: d.rhrBaseline, resp: d.respBaseline }[key];
    const baseline = isNum(m.baseline) ? m.baseline : isNum(c.baseline) ? c.baseline : isNum(legacy) ? legacy : null;
    return { value, baseline, sd: isNum(m.sd) ? m.sd : null };
  }

  function workoutsOf(d) {
    return ((d && d.workouts) || []).slice().sort((x, y) => String(x.start || "").localeCompare(String(y.start || "")));
  }

  function workoutRow(w) {
    const t = clockOf(w.start);
    const bits = [mins(w.durationMin)];
    if (isNum(w.avgHr)) bits.push(`avg ${Math.round(w.avgHr)} bpm`);
    if (isNum(w.kcal)) bits.push(`${App.fmt.num(w.kcal)} kcal`);
    const manual = w.source === "Manual";
    return `<div class="row cv-wrow">${strainChip(w.strain)}` +
      `<span class="cv-wmain"><strong>${esc(w.type || "Workout")}</strong>` +
      `${t !== DASH ? ` <span class="muted num">${esc(t)}</span>` : ""}${manual ? ` <span class="chip neutral">Manual</span>` : ""}` +
      `<span class="muted num cv-wmeta">${bits.join(" · ")}</span></span></div>`;
  }

  function activityList(d, emptyText) {
    const ws = workoutsOf(d);
    return `<div class="list">${ws.length ? ws.map(workoutRow).join("") : `<div class="row muted">${emptyText}</div>`}</div>`;
  }

  function targetStatus(d) {
    const t = d && Array.isArray(d.strainTarget) && isNum(d.strainTarget[0]) && isNum(d.strainTarget[1]) ? d.strainTarget : null;
    if (!t || !isNum(d.strain)) return null;
    const where = d.strain < t[0] ? "below" : d.strain <= t[1] ? "in" : "above";
    return { lo: t[0], hi: t[1], where, level: where === "in" ? "good" : where === "below" ? "neutral" : "warn",
      text: where === "in" ? "In target" : where === "below" ? "Below target" : "Above target" };
  }

  /* ---------- delegated handlers (registered once) ---------- */
  if (window.App && App.on && !window.__cadenceCoreViews) {
    window.__cadenceCoreViews = true;
    App.on("core-go", (el) => App.go(el.getAttribute("data-view")));
    App.on("core-sel", (el) => App.setSel(el.getAttribute("data-date")));
  }

  const CSS = `
.cv-dials{display:flex;flex-wrap:wrap;justify-content:space-around;gap:12px}
.cv-dial{background:none;border:0;padding:4px;color:inherit;font:inherit;cursor:pointer;border-radius:16px;display:flex;flex-direction:column;align-items:center}
.cv-dial:hover,.cv-dial:focus-visible{background:var(--surface-2)}
.cv-state{font-family:var(--f-display);font-size:1.5rem;font-weight:700;margin:16px 0 4px;display:flex;align-items:center;gap:10px}
.cv-dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.cv-insights{margin:0;padding-left:1.1em}
.cv-insights li{margin:4px 0}
.cv-wrow{display:flex;align-items:center;gap:12px}
.cv-wmain{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;min-width:0}
.cv-wmeta{flex-basis:100%;font-size:.85em}
.cv-schip{background:var(--strain);color:var(--bg);font-weight:700;min-width:3.2em;justify-content:center;text-align:center}
.list .row.cv-vrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 12px;align-items:center}
.list .row.cv-vrow > span:first-child{min-width:0}
.list .row.cv-vrow .cv-base{grid-column:1/-1;font-size:.85em}
.cv-big{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.1}
.cv-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cv-wd{background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:8px 2px;text-align:center;color:inherit;font:inherit;cursor:pointer;min-width:0}
.cv-wd.on{border-color:var(--ink)}
.cv-wd .cv-wl{font-size:.72rem;color:var(--muted);display:block}
.cv-wd .cv-wr{font-family:var(--f-display);font-weight:700;font-size:1.1rem;color:var(--c);display:block}
.cv-wd .cv-ws{font-size:.75rem;color:var(--strain);display:block}
.cv-top{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.cv-top > :last-child{flex:1 1 240px;min-width:0}
.cv-note{font-size:.85em;margin-top:8px}
.cv-emptypage{margin-top:24px}
.cv-ahead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:6px}
.cv-warn{cursor:pointer;height:26px}
.cv-tmr{font-size:14px}
`;

  /* ================= OVERVIEW ================= */

  /* v3 analytics (CadenceAnalytics): early-warning chip + tomorrow's forecast. Guarded and memoised per data version. */
  const anMemo = new WeakMap();
  function anCall(ctx, name, args, key) {
    const A = window.CadenceAnalytics;
    if (!A || typeof A[name] !== "function") return null;
    let m = anMemo.get(ctx.derived);
    if (!m) anMemo.set(ctx.derived, (m = new Map()));
    const k = name + "|" + key;
    if (!m.has(k)) {
      let r = null;
      try { r = A[name].apply(null, args); } catch (e) { console.warn("Cadence analytics failed:", name, e); }
      m.set(k, r);
    }
    return m.get(k);
  }
  const shortOf = (r) => !r || typeof r !== "object" || [r.status, r.error, r.reason].some((t) => typeof t === "string" && /not[_ ]?enough|insufficient/i.test(t));
  function aheadRow(ctx) {
    const bits = [];
    try {
      const w = anCall(ctx, "warning", [ctx.days, ctx.derived, ctx.i], "w" + ctx.i);
      const lvl = w && !shortOf(w) ? String(w.level || "none").toLowerCase() : "none";
      if (lvl === "watch" || lvl === "alert") {
        const n = Array.isArray(w.signals) ? w.signals.length : 0;
        bits.push(`<button class="chip ${lvl === "alert" ? "bad" : "warn"} cv-warn" data-action="core-go" data-view="insights" aria-label="Early warning: open Insights">` +
          `${lvl === "alert" ? "Early warning" : "Watch"}${n ? ` · <span class="num">${n}</span> signal${n === 1 ? "" : "s"}` : ""}</button>`);
      }
    } catch (e) {}
    try {
      const f = anCall(ctx, "forecast", [ctx.days, ctx.derived, ctx.i, {}], "fc" + ctx.i);
      const v = f && !shortOf(f) ? (isNum(f.recovery) ? f.recovery : null) : null;
      if (isNum(v)) {
        const rng = isNum(f.lo) && isNum(f.hi) ? ` <span class="muted num">(${Math.round(f.lo)}–${Math.round(f.hi)}%)</span>` : "";
        bits.push(`<span class="cv-tmr"><span class="muted">Tomorrow</span> <strong class="num" style="color:${bandColor(bandOf(v))}">~${Math.round(v)}%</strong>${rng}</span>`);
      }
    } catch (e) {}
    return bits.length ? `<div class="cv-ahead">${bits.join("")}</div>` : "";
  }

  function headline(band) {
    if (band === "green") return ["Built for a big day", "var(--green)"];
    if (band === "yellow") return ["Steady day — train with some in reserve", "var(--yellow)"];
    if (band === "red") return ["Back off and rebuild", "var(--red)"];
    return ["No recovery read today", "var(--muted)"];
  }

  function insights(ctx) {
    const { d } = ctx;
    const out = [];
    const h = vital(ctx, "hrv");
    if (isNum(h.value) && isNum(h.baseline) && h.baseline > 0) {
      const pct = Math.round((h.value / h.baseline - 1) * 100);
      const dir = pct > 2 ? `${pct}% above` : pct < -2 ? `${-pct}% below` : "level with";
      out.push(`HRV is <span class="num">${Math.round(h.value)} ms</span>, ${dir} your baseline of <span class="num">${Math.round(h.baseline)} ms</span>.`);
    } else if (isNum(h.value)) {
      out.push(`HRV is <span class="num">${Math.round(h.value)} ms</span>. Your baseline needs about a week of readings.`);
    } else {
      out.push("No HRV reading last night, so recovery can't be scored.");
    }
    const need = needTotal(d);
    if (d.sleep && isNum(d.sleep.asleep) && isNum(need)) {
      const gap = d.sleep.asleep - need;
      out.push(gap >= -10
        ? `You slept <span class="num">${mins(d.sleep.asleep)}</span> and covered your need of <span class="num">${mins(need)}</span>.`
        : `You slept <span class="num">${mins(d.sleep.asleep)}</span> against a need of <span class="num">${mins(need)}</span> — <span class="num">${mins(-gap)}</span> short.`);
    } else {
      out.push("No main sleep was recorded last night.");
    }
    const ts = targetStatus(d);
    const today = isToday(d.date);
    if (ts) {
      const rng = `<span class="num">${fStrain(ts.lo)}–${fStrain(ts.hi)}</span>`;
      const s = `<span class="num">${fStrain(d.strain)}</span>`;
      if (today) {
        out.push(ts.where === "below" ? `Strain is ${s} so far. Today's target is ${rng}.`
          : ts.where === "in" ? `Strain is ${s}, inside today's target of ${rng}.`
          : `Strain is ${s}, past today's target of ${rng}. Ease off tomorrow.`);
      } else {
        out.push(`Strain finished at ${s}, ${ts.where === "in" ? "inside" : ts.where} the target of ${rng}.`);
      }
    } else if (isNum(d.strain)) {
      out.push(`Strain ${today ? "is" : "finished at"} <span class="num">${fStrain(d.strain)}</span>.`);
    }
    return out;
  }

  function dialBtn(view, ringOpts) {
    return `<button class="cv-dial" data-action="core-go" data-view="${view}" aria-label="Open ${esc(ringOpts.label)}">` +
      Charts.ring(Object.assign({ variant: "dial", size: 156 }, ringOpts)) + `</button>`;
  }

  /** level(diff, baseline) → "good" | "warn" | "bad" */
  function vitalRow(name, v, unit, dp, level) {
    let c = "";
    if (isNum(v.value) && isNum(v.baseline)) {
      const diff = v.value - v.baseline;
      c = chip(level(diff, v.baseline), `${App.fmt.signed(diff, dp)} ${unit}`);
    }
    return `<div class="row cv-vrow"><span>${name}</span><span class="num">${isNum(v.value) ? `${App.fmt.num(v.value, dp)} ${unit}` : DASH}</span><span>${c}</span>` +
      `<span class="muted cv-base">${isNum(v.baseline) ? `baseline <span class="num">${App.fmt.num(v.baseline, dp)} ${unit}</span>` : "baseline still forming"}</span></div>`;
  }

  function tonightCard(ctx) {
    const { d, derived, i } = ctx;
    const bt = toDate(d.bedtimeTonight);
    const next = derived[i + 1];
    const tomorrowNeed = needTotal(next);
    const need = isNum(tomorrowNeed) ? tomorrowNeed : isNum(d.sleepNeedTonight) ? d.sleepNeedTonight : null;
    const hasBt = bt && !isNaN(bt);
    if (!hasBt && !isNum(need)) {
      return `<div class="card">${head("Tonight")}<p class="muted">A bedtime suggestion appears once Cadence has a few nights of sleep to learn your usual wake time.</p></div>`;
    }
    return `<div class="card">${head("Tonight", "to recover for tomorrow")}` +
      `<div class="stats">${stat("Lights out by", hasBt ? esc(App.fmt.clock(bt)) : DASH)}${stat("Sleep need", isNum(need) ? mins(need) : DASH)}</div>` +
      `<p class="muted cv-note">Based on your usual wake time, today's strain and any sleep you still owe.</p></div>`;
  }

  function weekStrip(ctx) {
    const idx = windowIdx(ctx, 7);
    const cells = idx.map((k) => {
      const dd = ctx.derived[k] || {};
      const date = ctx.days[k].date;
      const rec = dd.recovery;
      const col = isNum(rec) ? bandColor(dd.band || bandOf(rec)) : "var(--muted)";
      const dow = esc(App.fmt.day(date).split(" ")[0]);
      return `<button class="cv-wd${k === ctx.i ? " on" : ""}" data-action="core-sel" data-date="${esc(date)}" style="--c:${col}" aria-label="${esc(App.fmt.day(date))}">` +
        `<span class="cv-wl">${dow}</span><span class="cv-wr num">${isNum(rec) ? `${Math.round(rec)}%` : DASH}</span>` +
        `<span class="cv-ws num">${fStrain(dd.strain)}</span></button>`;
    }).join("");
    return `<div class="card span-2">${head("Last 7 days", "recovery · strain")}<div class="cv-week">${cells}</div></div>`;
  }

  Views.overview = {
    label: "Overview",
    icon: "home",
    dated: true,
    css: CSS,
    render(ctx) {
      if (ctx.i === -1 || !ctx.day || !ctx.d) return emptyPage("Overview", ctx, "v-overview");
      const { d } = ctx;
      const perf = d.sleepPerformance;
      const rec = d.recovery;
      const band = d.band || bandOf(rec);
      const dials = [
        dialBtn("sleep", { value: isNum(perf) ? perf : null, max: 100, color: "var(--sleep)", label: "Sleep",
          display: isNum(perf) ? `${Math.round(perf)}%` : DASH, sub: d.sleep ? App.fmt.mins(Math.round(d.sleep.asleep)) : "No sleep" }),
        dialBtn("recovery", { value: isNum(rec) ? rec : null, max: 100, color: bandColor(band), label: "Recovery",
          display: isNum(rec) ? `${Math.round(rec)}%` : DASH, sub: isNum(vital(ctx, "hrv").value) ? `HRV ${Math.round(vital(ctx, "hrv").value)} ms` : "No HRV" }),
        dialBtn("strain", { value: isNum(d.strain) ? d.strain : null, max: 21, color: "var(--strain)", label: "Strain",
          target: targetStatus(d) ? d.strainTarget : undefined,
          display: fStrain(d.strain), sub: targetStatus(d) ? `Target ${fStrain(d.strainTarget[0])}–${fStrain(d.strainTarget[1])}` : "of 21" }),
      ].join("");
      const [hl, hc] = headline(band);
      const hero = `<div class="card hero"><div class="cv-dials">${dials}</div>` +
        `<div class="cv-state" style="--c:${hc}"><span class="cv-dot"></span>${hl}</div>` + aheadRow(ctx) +
        `<ul class="insight cv-insights">${insights(ctx).map((s) => `<li>${s}</li>`).join("")}</ul></div>`;

      const ws = workoutsOf(d);
      const acts = `<div class="card">${head("Today's activities", ws.length ? `${ws.length} logged` : "")}` +
        activityList(d, "No workouts yet. Strain so far comes from everyday movement.") +
        `<div class="cv-note"><button class="btn ghost small" data-action="core-go" data-view="strain">Strain detail</button></div></div>`;

      const vitals = `<div class="card">${head("Key vitals", "vs your baseline")}<div class="list">` +
        vitalRow("Heart rate variability", vital(ctx, "hrv"), "ms", 0, (x, b) => (x / b >= -0.05 ? "good" : x / b >= -0.15 ? "warn" : "bad")) +
        vitalRow("Resting heart rate", vital(ctx, "rhr"), "bpm", 0, (x) => (x <= 1 ? "good" : x <= 4 ? "warn" : "bad")) +
        vitalRow("Respiratory rate", vital(ctx, "resp"), "/min", 1, (x) => (x <= 0.5 ? "good" : x <= 1 ? "warn" : "bad")) +
        `</div></div>`;

      return `<div class="page v-overview">${pageHead("Overview", ctx)}${hero}` +
        `<div class="grid">${acts}${vitals}${tonightCard(ctx)}${weekStrip(ctx)}</div></div>`;
    },
  };

  /* ================= SLEEP ================= */

  const STAGES = [
    ["awake", "Awake", "var(--st-awake)", null],
    ["light", "Light", "var(--st-light)", [45, 55]],
    ["deep", "Deep", "var(--st-deep)", [13, 23]],
    ["rem", "REM", "var(--st-rem)", [20, 25]],
  ];

  Views.sleep = {
    label: "Sleep",
    icon: "sleep",
    dated: true,
    css: CSS,
    render(ctx) {
      if (ctx.i === -1 || !ctx.day || !ctx.d) return emptyPage("Sleep", ctx, "v-sleep");
      const { d, day } = ctx;
      const s = d.sleep;
      const need = needTotal(d);
      const perf = d.sleepPerformance;
      const sn = d.sleepNeed && typeof d.sleepNeed === "object" ? d.sleepNeed : {};

      let top;
      if (s) {
        const parts = [["Baseline", sn.baseline], ["Recent strain", sn.strain], ["Sleep debt", sn.debt], ["Naps", sn.nap]]
          .filter(([, v]) => isNum(v))
          .map(([l, v]) => ({ label: l, v: Math.abs(v), color: v < 0 ? "var(--muted)" : "var(--sleep)",
            display: `${v < 0 ? "−" : l === "Baseline" ? "" : "+"}${App.fmt.mins(Math.round(Math.abs(v)))}` }));
        const gap = isNum(need) ? s.asleep - need : null;
        top = `<div class="card hero"><div class="cv-top">` +
          Charts.ring({ variant: "dial", value: isNum(perf) ? perf : null, max: 100, color: "var(--sleep)", label: "Performance",
            display: isNum(perf) ? `${Math.round(perf)}%` : DASH, sub: `${App.fmt.mins(Math.round(s.asleep))} of ${isNum(need) ? App.fmt.mins(Math.round(need)) : DASH}` }) +
          `<div><div class="stats">${stat("Hours of sleep", mins(s.asleep))}${stat("Sleep needed", mins(need))}</div>` +
          (parts.length ? Charts.slot({ type: "hbars", data: parts, max: Math.max(...parts.map((p) => p.v), 1) }) : "") + `</div></div>` +
          `<p class="insight">${gap === null ? `You slept ${mins(s.asleep)}.`
            : gap >= -10 ? `You slept ${mins(s.asleep)} and met your need of ${mins(need)}.`
            : `You slept ${mins(s.asleep)}, ${mins(-gap)} short of your need of ${mins(need)}. The shortfall carries into tomorrow's need.`}` +
          ` Need starts from your baseline and grows with strain and recent debt; naps pay some back.</p></div>`;
      } else {
        top = emptyCard("No sleep recorded", `There's no main sleep for the night before ${esc(App.fmt.day(day.date))}. Your recent nights are below.`, "hero");
      }

      let detail = "";
      if (s) {
        const effic = isNum(d.sleepEfficiency) ? d.sleepEfficiency : pctOf(s.efficiency);
        const resto = d.restorative && isNum(d.restorative.pct) ? pctOf(d.restorative.pct) : pctOf(s.restorative);
        const restoMin = d.restorative && isNum(d.restorative.min) ? d.restorative.min : (s.deep || 0) + (s.rem || 0);
        const stats = `<div class="card">${head("Last night", `${esc(clockOf(s.start))} – ${esc(clockOf(s.end))}`)}` +
          `<div class="stats">${stat("Time in bed", mins(s.inBed))}${stat("Efficiency", isNum(effic) ? `${Math.round(effic)}%` : DASH)}` +
          `${stat("Consistency", isNum(d.sleepConsistency) ? `${Math.round(d.sleepConsistency)}%` : DASH, "", "vs last 4 nights")}` +
          `${stat("Restorative", isNum(resto) ? `${Math.round(resto)}%` : DASH, "", `deep + REM · ${mins(restoMin)}`)}` +
          `${stat("Awakenings", isNum(s.awakenings) ? String(s.awakenings) : DASH)}` +
          (isNum(s.latency) ? stat("Fell asleep in", mins(s.latency)) : "") +
          `${stat("Bedtime", esc(clockOf(s.start)))}${stat("Woke", esc(clockOf(s.end)))}</div></div>`;

        const hyp = `<div class="card span-2">${head("Through the night")}` +
          (day.sleep ? Charts.slot({ type: "hypno", sleep: day.sleep }) : `<p class="muted">No stage data.</p>`) +
          `<div class="legend">${STAGES.map(([, l, c]) => `<span class="key" style="--c:${c}">${l}</span>`).join("")}</div></div>`;

        const maxMin = Math.max(...STAGES.map(([k]) => s[k] || 0), 1);
        const stageBars = STAGES.map(([k, l, c, rng]) => {
          const m = s[k] || 0;
          const base = k === "awake" ? s.inBed : s.asleep;
          const pct = base > 0 ? Math.round((m / base) * 100) : 0;
          return { label: l, v: m, color: c, display: `${App.fmt.mins(Math.round(m))} · ${pct}%${rng ? ` (typ. ${rng[0]}–${rng[1]}%)` : ""}` };
        });
        const stagesCard = `<div class="card">${head("Stages", "share of sleep")}` +
          Charts.slot({ type: "hbars", data: stageBars, max: maxMin }) +
          `<p class="muted cv-note">Typical ranges for adults. Awake is shown as a share of time in bed.</p></div>`;
        detail = stats + hyp + stagesCard;
      }

      const w14 = windowIdx(ctx, 14);
      const range14 = w14.map((k) => {
        const ss = ctx.derived[k] && ctx.derived[k].sleep;
        return ss && isNum(ss.bedMin) && isNum(ss.inBed) ? { label: label(ctx.days[k].date), start: ss.bedMin, end: ss.bedMin + ss.inBed } : null;
      }).filter(Boolean);
      const rangeCard = `<div class="card">${head("Bed and wake times", "last 14 nights")}` +
        (range14.length ? Charts.slot({ type: "range", data: range14 }) : `<p class="muted">No nights recorded yet.</p>`) + `</div>`;

      const w30 = windowIdx(ctx, 30);
      const perfBars = w30.map((k) => {
        const v = ctx.derived[k] && ctx.derived[k].sleepPerformance;
        return { label: label(ctx.days[k].date), v: isNum(v) ? Math.round(v) : null, color: perfColor(v) };
      });
      const pv = perfBars.map((b) => b.v).filter(isNum);
      const barsCard = `<div class="card span-2">${head("Sleep performance", pv.length ? `30-night avg <span class="num">${Math.round(avg(pv))}%</span>` : "last 30 nights")}` +
        (pv.length ? Charts.slot({ type: "bars", data: perfBars, max: 100, fmt: (v) => `${Math.round(v)}%`, ref: { v: 85, label: "85%" } }) : `<p class="muted">No nights recorded yet.</p>`) +
        `<div class="legend"><span class="key" style="--c:var(--green)">85% and up</span><span class="key" style="--c:var(--yellow)">70–84%</span><span class="key" style="--c:var(--red)">under 70%</span></div></div>`;

      const naps = Array.isArray(day.naps) ? day.naps.filter((n) => n && n.start) : [];
      const napCard = naps.length
        ? `<div class="card">${head("Naps", `${naps.length}`)}<div class="list">${naps.map((n) =>
          `<div class="row"><span class="num">${esc(clockOf(n.start))} – ${esc(clockOf(n.end))}</span><span class="num muted">${mins(n.asleepMin)} asleep</span></div>`).join("")}</div></div>`
        : "";

      return `<div class="page v-sleep">${pageHead("Sleep", ctx)}${top}<div class="grid">${detail}${napCard}${rangeCard}${barsCard}</div></div>`;
    },
  };

  /* ================= RECOVERY ================= */

  function lineSeries(ctx, idx, f) {
    return idx.map((k) => {
      const v = f(k);
      return { label: label(ctx.days[k].date), v: isNum(v) ? v : null };
    });
  }

  function methodText(ctx, re) {
    const M = ctx.E && Array.isArray(ctx.E.METHODS) ? ctx.E.METHODS : [];
    const m = M.find((x) => x && re.test(String(x.title || "")));
    return m && m.body ? String(m.body) : null;
  }

  Views.recovery = {
    label: "Recovery",
    icon: "recovery",
    dated: true,
    css: CSS,
    render(ctx) {
      if (ctx.i === -1 || !ctx.day || !ctx.d) return emptyPage("Recovery", ctx, "v-recovery");
      const { d, day } = ctx;
      const rec = d.recovery;
      const band = d.band || bandOf(rec);
      const idx = windowIdx(ctx, 30);
      const C = d.contributors || {};

      let top;
      if (isNum(rec)) {
        const ts = targetStatus(d);
        const lead = band === "green" ? "Well recovered. Your body is ready for load."
          : band === "yellow" ? "Partly recovered. Training is fine, but keep the hardest work measured."
          : "Under-recovered. Easy movement, fuel and an early night will help most.";
        top = `<div class="card hero"><div class="cv-top">` +
          Charts.ring({ variant: "dial", value: rec, max: 100, color: bandColor(band), label: "Recovery", display: `${Math.round(rec)}%`,
            sub: ts ? `Strain target ${fStrain(ts.lo)}–${fStrain(ts.hi)}` : "" }) +
          `<div><p class="cv-big" style="color:${bandColor(band)}">${band === "green" ? "Green" : band === "yellow" ? "Yellow" : "Red"}</p><p class="insight">${lead}</p></div></div></div>`;
      } else {
        top = emptyCard("No recovery score", `Recovery needs an HRV reading from last night. None was recorded for ${esc(App.fmt.day(day.date))}.`, "hero");
      }

      // contributors
      const contribRows = [
        ["HRV", "hrv", "ms", 0],
        ["Resting HR", "rhr", "bpm", 0],
        ["Respiratory rate", "resp", "/min", 1],
        ["Sleep", "sleep", "%", 0],
      ].map(([l, k, u, dp]) => {
        const c = C[k] || {};
        const val = k === "sleep" ? (isNum(c.value) ? c.value : d.sleepPerformance) : vital(ctx, k).value;
        const base = k === "sleep" ? null : vital(ctx, k).baseline;
        const score = isNum(c.score) ? c.score : null;
        const valTxt = isNum(val) ? `${App.fmt.num(val, dp)}${u === "%" ? "%" : " " + u}` : DASH;
        return { label: l, v: isNum(score) ? Math.round(score) : 0, color: isNum(score) ? bandColor(bandOf(score)) : "var(--line)",
          display: `${valTxt}${isNum(base) ? ` · base ${App.fmt.num(base, dp)}` : ""}${isNum(score) ? ` · ${Math.round(score)}` : ""}` };
      });
      const hasContrib = Object.keys(C).length > 0;
